<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio - Team Breakdown</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:14px 14px 20px;background:#191919;color:#fff;overflow-y:auto;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.12);--gb:rgba(170,255,0,.18);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:999px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-bottom:2px;}
.h-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.03em;}
.h-right{display:flex;align-items:center;gap:6px;}
.ts{font-size:10px;color:rgba(255,255,255,.15);}
.icon-btn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:rgba(170,255,0,.08);border-color:rgba(170,255,0,.2);color:var(--g);}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 14px;border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap;gap:10px;}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);}
.card-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.period-lbl{font-size:11px;font-weight:600;color:rgba(255,255,255,.25);}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.06);border-radius:8px;padding:3px;}
.tab{font-family:'Satoshi',sans-serif;font-size:11px;font-weight:700;padding:5px 12px;border-radius:6px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.3);cursor:pointer;transition:all .18s;}
.tab.active{background:var(--gm);color:var(--g);border-color:var(--gb);}
.wk-nav{display:flex;align-items:center;gap:6px;}
.wk-arrow{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.wk-arrow:hover{background:rgba(170,255,0,.08);border-color:rgba(170,255,0,.2);color:var(--g);}
.wk-arrow:disabled{opacity:.25;cursor:default;pointer-events:none;}
.wk-arrow svg{width:12px;height:12px;}
.wk-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);white-space:nowrap;min-width:128px;text-align:center;}
.wk-label.is-current{color:var(--g);}
.col-hdr{display:grid;grid-template-columns:180px repeat(4,1fr) 64px 72px;align-items:center;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.05);gap:8px;}
.ch{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.25);text-align:center;}
.ch:first-child{text-align:left;}
.staff-row{display:grid;grid-template-columns:180px repeat(4,1fr) 64px 72px;align-items:center;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.04);gap:8px;transition:background .15s;}
.staff-row:last-child{border-bottom:none;}
.staff-row:hover{background:rgba(255,255,255,.02);}
.week-sep{display:grid;grid-template-columns:180px repeat(4,1fr) 64px 72px;align-items:center;padding:9px 20px;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);gap:8px;}
.week-sep-lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);}
.week-sep-tot{font-size:10px;font-weight:700;color:rgba(170,255,0,.5);text-align:center;}
.week-sep-empty{color:rgba(255,255,255,.1);font-size:10px;font-weight:600;text-align:center;}
.s-name{display:flex;align-items:center;gap:8px;min-width:0;}
.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.s-dot-on{background:#AAFF00;box-shadow:0 0 5px rgba(170,255,0,.5);}
.s-dot-off{background:#FF6B35;}
.s-dot-lv{background:#FBBF24;}
.s-label{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-role{font-size:11px;font-weight:600;color:rgba(255,255,255,.28);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-cell{text-align:center;}
.stat-num{font-size:20px;font-weight:900;letter-spacing:-.5px;line-height:1;}
.num-zero{color:rgba(255,255,255,.1);}
.num-plan{color:#60A5FA;}
.num-shoot{color:#F59E0B;}
.num-edit{color:#C084FC;}
.num-post{color:var(--g);}
.num-total{color:rgba(255,255,255,.7);}
.time-cell{text-align:center;}
.time-val{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1;}
.time-has{color:rgba(255,255,255,.6);}
.empty-row{padding:36px 20px;text-align:center;font-size:13px;color:rgba(255,255,255,.2);font-weight:600;}
.loading{display:flex;align-items:center;justify-content:center;min-height:160px;flex-direction:column;gap:8px;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:11px;color:rgba(255,255,255,.2);font-weight:600;}
@media(max-width:860px){.col-hdr,.staff-row,.week-sep{grid-template-columns:120px repeat(4,1fr) 48px 56px;padding-left:14px;padding-right:14px;}}
.wgt-footer{text-align:center;padding:20px 0 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.12);}
</style>
</head>
<body>
<div class="header">
  <div>
    <p class="eyebrow" id="_eyebrow" data-os="Custom OS">CUSTOM OS</p>
    <h1 class="h-title">Team Breakdown</h1>
  </div>
  <div class="h-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" onclick="doRefresh()" id="rb" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    <button class="icon-btn" onclick="toggleMode()" id="mb" title="Toggle light/dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  </div>
</div>
<div id="dash"><div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div></div></div>
<script>
var _tok=new URLSearchParams(location.search).get('token')||'';
var _tab='week',_data=null,_weekOffset=0;
var XROLES=['part time','live host','part-time','freelance'];
var XNAMES=['danil husaini'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtHrs(h){if(!h)return'-';if(h<1)return Math.round(h*60)+'m';var w=Math.floor(h),f=Math.round((h-w)*60);return f>0?w+'h '+f+'m':w+'h';}
function sdot(s){return s==='Active'?'s-dot-on':s==='Inactive'?'s-dot-off':'s-dot-lv';}
function getMonday(off){var t=new Date();t.setHours(0,0,0,0);var dow=t.getDay(),diff=dow===0?-6:1-dow,m=new Date(t);m.setDate(t.getDate()+diff+off*7);return m;}
function toStr(d){return d.toISOString().slice(0,10);}
function wkLbl(mon){var sun=new Date(mon);sun.setDate(mon.getDate()+6);return mon.getMonth()===sun.getMonth()?mon.getDate()+' - '+sun.getDate()+' '+MON[mon.getMonth()]:mon.getDate()+' '+MON[mon.getMonth()]+' - '+sun.getDate()+' '+MON[sun.getMonth()];}

function sliceWeek(tasks,off){
  var m=getMonday(off),sun=new Date(m);sun.setDate(m.getDate()+6);
  var s=toStr(m),e=toStr(sun),out={planning:0,shooting:0,editing:0,posting:0,mins:0};
  (tasks||[]).forEach(function(t){if(t.isDone&&t.doneDate&&t.doneDate>=s&&t.doneDate<=e){out[t.stage]++;out.mins+=t.mins;}});
  out.hrs=Math.round((out.mins/60)*10)/10;return out;
}

function getWeeksInMonth(){
  var t=new Date();t.setHours(0,0,0,0);
  var yr=t.getFullYear(),mo=t.getMonth();
  var first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);
  var dow=first.getDay(),diff=dow===0?-6:1-dow,mon=new Date(first);
  mon.setDate(first.getDate()+diff);
  var curMon=getMonday(0),weeks=[];
  while(mon<=last){
    var off=Math.round((mon-curMon)/604800000);
    weeks.push({mon:new Date(mon),off:off});
    mon.setDate(mon.getDate()+7);
  }
  return weeks.reverse(); // newest first
}

var PREV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
var NEXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';

function toggleMode(){document.body.classList.toggle('light');document.getElementById('mb').innerHTML=document.body.classList.contains('light')?MOON:SUN;}
function doRefresh(){var b=document.getElementById('rb');if(b)b.classList.add('spinning');loadData().finally(function(){var b2=document.getElementById('rb');if(b2)b2.classList.remove('spinning');});}

function memberRow(e,s){
  var pl=s.planning||0,sh=s.shooting||0,ed=s.editing||0,po=s.posting||0,tot=pl+sh+ed+po;
  var hrs=s.hrs||0;
  return '<div class="staff-row">'
    +'<div class="s-name"><div class="s-dot '+sdot(e.status)+'"></div>'
    +'<div style="min-width:0"><div class="s-label">'+esc(e.name)+'</div>'
    +(e.role?'<div class="s-role">'+esc(e.role)+'</div>':'')+'</div></div>'
    +'<div class="stat-cell"><div class="stat-num '+(pl?'num-plan':'num-zero')+'">'+(pl||'-')+'</div></div>'
    +'<div class="stat-cell"><div class="stat-num '+(sh?'num-shoot':'num-zero')+'">'+(sh||'-')+'</div></div>'
    +'<div class="stat-cell"><div class="stat-num '+(ed?'num-edit':'num-zero')+'">'+(ed||'-')+'</div></div>'
    +'<div class="stat-cell"><div class="stat-num '+(po?'num-post':'num-zero')+'">'+(po||'-')+'</div></div>'
    +'<div class="stat-cell"><div class="stat-num '+(tot?'num-total':'num-zero')+'">'+(tot||'-')+'</div></div>'
    +'<div class="time-cell"><div class="time-val '+(hrs?'time-has':'num-zero')+'">'+fmtHrs(hrs)+'</div></div>'
    +'</div>';
}

function render(data){
  if(!data||!data.employees)return;
  var emps=data.employees.filter(function(e){
    var r=(e.role||'').toLowerCase(),n=(e.name||'').toLowerCase();
    return !XROLES.some(function(x){return r.includes(x);})&&!XNAMES.some(function(x){return n.includes(x);});
  });

  var isCur=_weekOffset===0;
  function mkTab(t,l){return '<button class="tab'+(_tab===t?' active':'')+'" onclick="switchTab(\''+t+'\')">'+l+'</button>';}

  var ctrl='';
  if(_tab==='week'){
    ctrl='<div class="wk-nav">'
      +'<button class="wk-arrow" onclick="shiftWeek(-1)">'+PREV+'</button>'
      +'<span class="wk-label'+(isCur?' is-current':'')+'" >'+esc(wkLbl(getMonday(_weekOffset)))+'</span>'
      +'<button class="wk-arrow" onclick="shiftWeek(1)"'+(isCur?' disabled':'')+'>'+NEXT+'</button>'
      +'</div>';
  } else if(_tab==='month'){
    ctrl='<span class="period-lbl">'+esc(data.monthLabel||'')+'</span>';
  } else {
    ctrl='<span class="period-lbl">All Time</span>';
  }

  var colHdr='<div class="col-hdr"><div class="ch">Team</div><div class="ch">Planning</div>'
    +'<div class="ch">Shooting</div><div class="ch">Editing</div><div class="ch">Posting</div>'
    +'<div class="ch">Total</div><div class="ch">Time</div></div>';

  var h='<div class="card">'
    +'<div class="card-hdr"><span class="card-title">Content Output by Team Member</span>'
    +'<div class="card-right">'+ctrl
    +'<div class="tabs">'+mkTab('week','Week')+mkTab('month','Month')+mkTab('all','All Time')+'</div>'
    +'</div></div>'+colHdr;

  if(!emps.length){
    h+='<div class="empty-row">No team data found</div>';
  } else if(_tab==='month'){
    // Month view: grouped by week sections
    var weeks=getWeeksInMonth();
    weeks.forEach(function(wk){
      var empStats=emps.map(function(e){
        var s=sliceWeek(e.tasks||[],wk.off);
        return{emp:e,s:s,tot:(s.planning||0)+(s.shooting||0)+(s.editing||0)+(s.posting||0)};
      });
      var wkTotal=empStats.reduce(function(a,b){return a+b.tot;},0);
      // Week separator row — shows week label + per-stage totals
      var sp={planning:0,shooting:0,editing:0,posting:0};
      empStats.forEach(function(x){sp.planning+=x.s.planning||0;sp.shooting+=x.s.shooting||0;sp.editing+=x.s.editing||0;sp.posting+=x.s.posting||0;});
      h+='<div class="week-sep">'
        +'<div class="week-sep-lbl">'+esc(wkLbl(wk.mon))+'</div>'
        +'<div class="week-sep-tot">'+(sp.planning||'-')+'</div>'
        +'<div class="week-sep-tot">'+(sp.shooting||'-')+'</div>'
        +'<div class="week-sep-tot">'+(sp.editing||'-')+'</div>'
        +'<div class="week-sep-tot">'+(sp.posting||'-')+'</div>'
        +'<div class="week-sep-tot">'+(wkTotal||'-')+'</div>'
        +'<div></div>'
        +'</div>';
      // Member rows sorted by total desc, only show those with any output
      empStats.sort(function(a,b){return b.tot-a.tot;});
      empStats.forEach(function(item){
        if(item.tot>0) h+=memberRow(item.emp,item.s);
      });
    });
  } else {
    // Week or All Time view
    var empStats=emps.map(function(e){
      var s=_tab==='week'?sliceWeek(e.tasks||[],_weekOffset):e.allStats||{};
      return{emp:e,s:s,tot:(s.planning||0)+(s.shooting||0)+(s.editing||0)+(s.posting||0)};
    });
    empStats.sort(function(a,b){return b.tot-a.tot;});
    empStats.forEach(function(item){h+=memberRow(item.emp,item.s);});
  }

  h+='</div>';
  document.getElementById('dash').innerHTML=h;
  document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

window.switchTab=function(t){_tab=t;if(_data)render(_data);};
window.shiftWeek=function(d){if(d===1&&_weekOffset===0)return;_weekOffset+=d;if(_data)render(_data);};

function loadData(){
  return fetch('/api/creaitors/employee-stats?token='+_tok)
    .then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();})
    .then(function(d){_data=d;render(d);})
    .catch(function(e){
      document.getElementById('dash').innerHTML='<div class="loading"><div style="font-size:11px;color:#FF6B35;font-weight:700;">Failed to load</div>'
        +'<div style="font-size:9px;color:rgba(255,255,255,.2);margin-top:4px;">'+esc(e.message)+'</div></div>';
    });
}

loadData();
setInterval(loadData,300000);
</script>
<div class="wgt-footer">Widgets by Opxio.io</div>
<script>
(function(){
  var el=document.getElementById('_eyebrow');if(!el)return;
  el.textContent=el.dataset.os.toUpperCase();
  var tok=new URLSearchParams(location.search).get('token');if(!tok)return;
  fetch('/api/client/info?token='+tok)
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){if(d&&d.client)el.textContent=d.client.toUpperCase()+' - '+el.dataset.os.toUpperCase();})
    .catch(function(){});
})();
</script>
</body>
</html>
