<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>cupTerra — CRM Dashboard</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 28px;background:#191919;color:#fff;overflow-y:auto;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.12);--gb:rgba(170,255,0,.18);--lost:#FF6B35;--amber:#FBBF24;--blue:#60A5FA;}
.card{background:#222222;border:1px solid rgba(255,255,255,.06);border-radius:16px;transition:border-color .2s;}
.card:hover{border-color:rgba(170,255,0,.08);}
/* Top bar */
.top-bar{display:flex;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
.top-right{display:flex;align-items:center;gap:6px;margin-left:auto;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:2px;}
.h-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.03em;}
.ts{font-size:9px;font-weight:500;color:rgba(255,255,255,.18);}
.icon-btn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Stat rows */
.stat-row{display:grid;gap:10px;margin-bottom:12px;}
.stat-row-4{grid-template-columns:repeat(4,1fr);}
.stat-row-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:700px){.stat-row-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:400px){.stat-row-4,.stat-row-2{grid-template-columns:1fr;}}
.stat{padding:18px 18px 16px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent,var(--g)),transparent);opacity:0;transition:opacity .25s;}
.stat:hover::before{opacity:1;}
.s-dot{position:absolute;top:14px;right:14px;width:6px;height:6px;border-radius:50%;opacity:.55;}
.s-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.85);margin-bottom:10px;line-height:1.4;display:block;}
.s-val{font-size:28px;font-weight:900;letter-spacing:-1.5px;line-height:1;}
.s-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,.22);margin-top:7px;}
/* Alert pulse */
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.55;}50%{opacity:.2;}}
/* Divider */
.divider{height:1px;background:rgba(255,255,255,.05);margin:12px 0;}
/* Panel */
.panel{padding:18px 20px;display:flex;flex-direction:column;}
.panel-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.85);margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.panel-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--gm);color:var(--g);border:1px solid var(--gb);}
/* Funnel / bar rows */
.f-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.f-row:last-child{margin-bottom:0;}
.f-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.5);width:120px;flex-shrink:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-bg{flex:1;height:22px;border-radius:5px;background:rgba(255,255,255,.04);overflow:hidden;}
.f-fill{height:100%;border-radius:5px;transition:width .55s cubic-bezier(.4,0,.2,1);}
.f-n{font-size:11px;font-weight:900;color:rgba(255,255,255,.6);width:22px;text-align:right;flex-shrink:0;}
/* Rate bar */
.rate-wrap{margin-top:12px;}
.rate-track{height:4px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;margin:6px 0 4px;}
.rate-fill{height:100%;border-radius:999px;background:var(--g);transition:width .6s ease;}
.rate-fill.bad{background:var(--lost);}
.rate-meta{display:flex;justify-content:space-between;font-size:9px;font-weight:700;color:rgba(255,255,255,.28);}
/* 2-col bottom */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:600px){.grid-2{grid-template-columns:1fr;}}
/* Source pills */
.src-row{display:flex;flex-wrap:wrap;gap:5px;}
.src-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.45);}
.src-pill b{font-weight:900;}
/* Loading / error */
.loading{display:flex;align-items:center;justify-content:center;min-height:220px;flex-direction:column;gap:10px;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:11px;color:rgba(255,255,255,.2);font-weight:500;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:999px;}
.wgt-footer{text-align:center;padding:20px 0 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <p class="eyebrow">Shin Supplies · CRM</p>
    <h1 class="h-title">Sales Dashboard</h1>
  </div>
  <div class="top-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" id="rb" onclick="doRefresh()" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
</div>

<div id="main">
  <div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div></div>
</div>

<div class="wgt-footer">Widgets by Opxio.io</div>

<script>
const _tok = new URLSearchParams(location.search).get('token') || '';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const PROD_COLORS = {
  'Paper Cup':'rgba(96,165,250,.55)',
  'Plastic Cup':'rgba(192,132,252,.55)',
  'Greaseproof Paper':'rgba(251,191,36,.55)',
  'PET Can':'rgba(170,255,0,.55)',
};
const SRC_COLORS = {
  'Iklan Facebook':'#60A5FA','TikTok':'#E879F9',
  'Threads':'#F97316','Rujukan / Kenalan':'#AAFF00',
  'Walk-in':'#34D399','Lain-lain':'#9CA3AF',
};

function render(d) {
  const t1=d.tile1, t2=d.tile2, t3=d.tile3, t4=d.tile4;
  const rate=t1.responseRate2h;
  const rateOk = rate!==null && rate>=70;

  // ── Row 1: 4 stat tiles ──────────────────────────────────────────────────
  const row1 = `
  <div class="stat-row stat-row-4">
    <div class="card stat" style="--accent:var(--g);">
      <div class="s-dot" style="background:var(--g);"></div>
      <span class="s-lbl">New Leads (24h)</span>
      <div class="s-val" style="color:var(--g);">${t1.newLeads24h}</div>
      <div class="s-sub">${t1.newLeadsWeek} this week</div>
    </div>
    <div class="card stat" style="--accent:${t1.overdueResponse>0?'var(--lost)':'var(--g)'};">
      <div class="s-dot ${t1.overdueResponse>0?'pulse':''}" style="background:${t1.overdueResponse>0?'var(--lost)':'var(--g)'};"></div>
      <span class="s-lbl">Overdue Response</span>
      <div class="s-val" style="color:${t1.overdueResponse>0?'var(--lost)':'rgba(255,255,255,.2)'};">${t1.overdueResponse}</div>
      <div class="s-sub">no quote &gt;2h old</div>
    </div>
    <div class="card stat" style="--accent:var(--amber);">
      <div class="s-dot ${t2.overdueQuotations>0?'pulse':''}" style="background:${t2.overdueQuotations>0?'var(--lost)':'var(--amber)'};"></div>
      <span class="s-lbl">Pending Quotations</span>
      <div class="s-val" style="color:var(--amber);">${t2.pendingQuotations}</div>
      <div class="s-sub">${t2.overdueQuotations} overdue &gt;24h</div>
    </div>
    <div class="card stat" style="--accent:var(--blue);">
      <div class="s-dot" style="background:var(--blue);"></div>
      <span class="s-lbl">Follow-ups Due</span>
      <div class="s-val" style="color:${t3.followupsToday>0?'var(--blue)':'rgba(255,255,255,.2)'};">${t3.followupsToday}</div>
      <div class="s-sub">${t3.followupsNext3Days} next 3 days</div>
    </div>
  </div>`;

  // ── Row 2: Response rate + Closed Won ────────────────────────────────────
  const row2 = `
  <div class="stat-row stat-row-2" style="margin-bottom:12px;">
    <div class="card panel">
      <div class="panel-title">
        Response Speed
        <span class="panel-badge" style="${rateOk?'':'background:rgba(255,107,53,.1);color:var(--lost);border-color:rgba(255,107,53,.2);'}">${rate!==null?rate+'%':'—'} within 2h</span>
      </div>
      <div style="display:flex;gap:28px;align-items:flex-end;">
        <div>
          <div style="font-size:36px;font-weight:900;letter-spacing:-2px;color:${rateOk?'var(--g)':'var(--lost)'};">${rate!==null?rate+'%':'—'}</div>
          <div style="font-size:10px;font-weight:500;color:rgba(255,255,255,.22);margin-top:4px;">${t1.responded2h} of ${t1.eligibleResponse} leads (48h window)</div>
        </div>
      </div>
      <div class="rate-wrap">
        <div class="rate-track"><div class="rate-fill${rateOk?'':' bad'}" style="width:${rate||0}%;"></div></div>
        <div class="rate-meta">
          <span>Target: 70%+</span>
          <span style="color:${t1.overdueResponse>0?'var(--lost)':'rgba(170,255,0,.5)'};">${t1.overdueResponse>0?t1.overdueResponse+' overdue now':'All clear'}</span>
        </div>
      </div>
    </div>
    <div class="card panel">
      <div class="panel-title">
        Pipeline
        <span class="panel-badge">${d.total} total</span>
      </div>
      <div style="display:flex;gap:24px;">
        <div>
          <div style="font-size:36px;font-weight:900;letter-spacing:-2px;color:var(--g);">${t4.closedWonMTD}</div>
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.28);margin-top:4px;">Closed Won (MTD)</div>
        </div>
        <div style="flex:1;">
          <div class="divider" style="margin:8px 0;"></div>
          <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);">
            <span>Negotiation</span>
            <span style="color:${t4.stuckNegotiation>0?'var(--amber)':'rgba(255,255,255,.2)'};">${t4.stuckNegotiation}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);padding:4px 0;">
            <span>Sales Order</span>
            <span style="color:${t4.stuckSalesOrder>0?'var(--amber)':'rgba(255,255,255,.2)'};">${t4.stuckSalesOrder}</span>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  // ── Row 3: Product breakdown + Source breakdown ──────────────────────────
  const prod = d.productBreakdown||{};
  const prodTotal = Object.values(prod).reduce((s,n)=>s+n,0)||1;
  const prodOrder = ['Paper Cup','Plastic Cup','Greaseproof Paper','PET Can'];
  const prodRows = prodOrder.filter(k=>prod[k]).map(k=>{
    const pct = Math.max(Math.round((prod[k]/prodTotal)*100),4);
    return `<div class="f-row">
      <span class="f-lbl">${esc(k)}</span>
      <div class="f-bg"><div class="f-fill" style="width:${pct}%;background:${PROD_COLORS[k]||'rgba(170,255,0,.45)'};"></div></div>
      <span class="f-n">${prod[k]}</span>
    </div>`;
  }).join('');

  const src = d.sourceBreakdown||{};
  const srcTotal = Object.values(src).reduce((s,n)=>s+n,0)||1;
  const srcRows = Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const pct = Math.max(Math.round((v/srcTotal)*100),3);
    const col = SRC_COLORS[k]||'rgba(170,255,0,.45)';
    return `<div class="f-row">
      <span class="f-lbl">${esc(k)}</span>
      <div class="f-bg"><div class="f-fill" style="width:${pct}%;background:${col.includes('rgba')?col:col+'99'};"></div></div>
      <span class="f-n">${v}</span>
    </div>`;
  }).join('');

  const row3 = `
  <div class="grid-2">
    <div class="card panel">
      <div class="panel-title">Product Breakdown<span class="panel-badge">${prodTotal} enquiries</span></div>
      ${prodRows||'<div style="font-size:11px;color:rgba(255,255,255,.18);">No data</div>'}
    </div>
    <div class="card panel">
      <div class="panel-title">Lead Sources<span class="panel-badge">${srcTotal} total</span></div>
      ${srcRows||'<div style="font-size:11px;color:rgba(255,255,255,.18);">No data</div>'}
    </div>
  </div>`;

  document.getElementById('main').innerHTML = row1 + row2 + row3;
  document.getElementById('ts').textContent = 'Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

async function load(){
  try{
    const r = await fetch('/api/cupterra/enquiry-stats'+(_tok?'?token='+_tok:''));
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  } catch(e){
    document.getElementById('main').innerHTML=`<div class="loading"><div style="color:#FF6B35;font-size:12px;font-weight:700;">Failed — ${esc(e.message)}</div></div>`;
  }
}
function doRefresh(){const b=document.getElementById('rb');if(b)b.classList.add('spinning');load().finally(()=>{const b2=document.getElementById('rb');if(b2)b2.classList.remove('spinning');});}

load();
setInterval(load,3*60*1000);
</script>
</body>
</html>
