<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Workspace Gate</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 28px;background:#191919;color:#fff;overflow-y:auto;overflow-x:hidden;height:100%;display:flex;align-items:center;justify-content:center;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.12);--gb:rgba(170,255,0,.18);--muted:rgba(255,255,255,.4);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;}

.gate{width:100%;max-width:420px;}

.card{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:28px;transition:border-color .2s;}
.card:hover{border-color:rgba(170,255,0,.08);}

.card-hdr{text-align:center;margin-bottom:20px;}
.card-hdr .icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;transition:all .15s;}
.card-hdr .icon svg{width:18px;height:18px;stroke:var(--g);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:4px;}
.h-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.03em;}
.h-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,.2);margin-top:4px;}

.field{margin-bottom:14px;}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;display:block;}

.field select,
.field input{
  width:100%;padding:12px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  color:#fff;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:500;
  outline:none;
  transition:all .15s;
  -webkit-appearance:none;appearance:none;
}
.field select{
  cursor:pointer;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 14px center;
  padding-right:34px;
}
.field select option{background:#1E1E1E;color:#fff;}
.field select optgroup{color:rgba(255,255,255,.3);font-weight:700;font-size:11px;}
.field input::placeholder{color:rgba(255,255,255,.2);}
.field select:focus,.field input:focus{border-color:rgba(170,255,0,.2);background:rgba(170,255,0,.08);}

.btn{
  width:100%;padding:12px 14px;
  background:var(--gm);
  border:1px solid var(--gb);
  border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:700;
  color:var(--g);
  cursor:pointer;
  transition:all .15s;
  margin-top:6px;
  letter-spacing:-.01em;
}
.btn:hover{background:rgba(170,255,0,.18);}
.btn:active{background:rgba(170,255,0,.25);}
.btn:disabled{opacity:.2;cursor:not-allowed;}
.btn.loading{pointer-events:none;opacity:.5;}

.btn-secondary{
  width:100%;padding:10px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:12px;font-weight:600;
  color:rgba(255,255,255,.3);
  cursor:pointer;
  transition:all .15s;
  margin-top:8px;
}
.btn-secondary:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);}

.btn-forgot{
  width:100%;padding:8px;margin-top:10px;
  background:none;border:none;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,.2);
  cursor:pointer;transition:color .15s;
  text-align:center;
}
.btn-forgot:hover{color:rgba(255,255,255,.4);}

.msg{font-size:11px;font-weight:600;margin-top:12px;text-align:center;opacity:0;transition:opacity .2s;}
.msg.error{color:#FF6B6B;opacity:1;}
.msg.success{color:var(--g);opacity:1;}

/* Backup code display */
.backup-box{
  background:rgba(0,0,0,.3);
  border:1px dashed rgba(170,255,0,.25);
  border-radius:10px;
  padding:16px;margin:16px 0;
  text-align:center;
}
.backup-box .code{
  font-size:28px;font-weight:900;
  letter-spacing:.15em;
  color:var(--g);
  margin:8px 0 4px;
  font-family:'Satoshi',monospace;
}
.backup-box .hint{
  font-size:10px;font-weight:600;
  color:rgba(255,255,255,.25);
  text-transform:uppercase;
  letter-spacing:.1em;
}
.backup-warning{
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,.35);
  line-height:1.5;
  margin-bottom:16px;
  text-align:center;
}

/* Success state */
.success-state{text-align:center;}
.success-state .check{width:48px;height:48px;border-radius:12px;background:var(--gm);border:1px solid var(--gb);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
.success-state .check svg{width:24px;height:24px;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.success-state .welcome{font-size:22px;font-weight:900;letter-spacing:-.03em;color:#fff;margin-bottom:2px;}
.success-state .verified{font-size:11px;font-weight:600;color:rgba(170,255,0,.5);margin-bottom:18px;}

.open-link{
  display:block;width:100%;padding:14px;
  background:var(--g);
  border:none;border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:800;
  color:#191919;
  text-decoration:none;text-align:center;
  transition:opacity .15s;
  letter-spacing:-.01em;
}
.open-link:hover{opacity:.85;}

/* Loading skeleton */
.skeleton{background:rgba(255,255,255,.04);border-radius:8px;height:44px;margin-bottom:14px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:.8;}}

.wgt-footer{text-align:center;padding:20px 0 4px;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
.wgt-footer a{color:rgba(255,255,255,.1);text-decoration:none;}

.hidden{display:none;}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="card" id="card">

    <!-- LOGIN VIEW -->
    <div id="loginView">
      <div class="card-hdr">
        <div class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            <circle cx="12" cy="16.5" r="1.5"/>
          </svg>
        </div>
        <div class="eyebrow">Creaitors</div>
        <div class="h-title">Team Workspace</div>
      </div>
      <div id="loginForm">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton" style="margin-bottom:0;"></div>
      </div>
      <p class="msg" id="loginMsg"></p>
    </div>

    <!-- CHANGE PASSWORD VIEW (first login) -->
    <div id="changeView" class="hidden">
      <div class="card-hdr">
        <div class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <div class="eyebrow">First Login</div>
        <div class="h-title" id="changeName"></div>
        <div class="h-sub">Set a password only you know</div>
      </div>
      <form id="changeForm">
        <div class="field">
          <span class="field-label">New Password</span>
          <input type="password" id="newPw" placeholder="Min 6 characters" autocomplete="new-password"/>
        </div>
        <div class="field">
          <span class="field-label">Confirm Password</span>
          <input type="password" id="confirmPw" placeholder="Type it again" autocomplete="new-password"/>
        </div>
        <button type="submit" class="btn" id="changeBtn" disabled>Set Password</button>
      </form>
      <p class="msg" id="changeMsg"></p>
    </div>

    <!-- BACKUP CODE VIEW (shown after first password set) -->
    <div id="backupView" class="hidden">
      <div class="card-hdr">
        <div class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12l2 2 4-4"/>
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
          </svg>
        </div>
        <div class="eyebrow">Save This</div>
        <div class="h-title">Backup Code</div>
      </div>
      <div class="backup-box">
        <div class="hint">Your recovery code</div>
        <div class="code" id="backupCode"></div>
        <div class="hint">Screenshot or write this down</div>
      </div>
      <p class="backup-warning">This is the only time you'll see this code. If you forget your password, you'll need it to reset.</p>
      <button class="btn" id="backupContinueBtn">I've Saved It — Continue</button>
    </div>

    <!-- FORGOT PASSWORD VIEW -->
    <div id="forgotView" class="hidden"></div>

    <!-- SUCCESS VIEW -->
    <div id="successView" class="hidden"></div>

  </div>
  <div class="wgt-footer">Widgets by <a href="https://opxio.io" target="_blank" rel="noopener">Opxio.io</a></div>
</div>

<script>
// ── CONFIG ──
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';
const API = window.location.origin + '/api/creaitors';

// ── STATE ──
let staffList = [];
let currentStaff = null;
let currentPassword = '';

// ── HELPERS ──
async function post(endpoint, body) {
  const r = await fetch(`${API}/${endpoint}?token=${TOKEN}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return { status: r.status, data: await r.json() };
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function flash(el, cls, text, ms) {
  el.className = 'msg ' + cls;
  el.textContent = text;
  if (ms) setTimeout(() => { el.className = 'msg'; }, ms);
}

function buildSelect(containerId) {
  const depts = {};
  staffList.forEach(s => {
    if (!depts[s.dept]) depts[s.dept] = [];
    depts[s.dept].push(s);
  });
  let html = '<option value="" disabled selected>Choose your name</option>';
  Object.entries(depts).forEach(([dept, members]) => {
    html += `<optgroup label="${esc(dept)}">`;
    members.forEach(m => { html += `<option value="${m.id}">${esc(m.name)}</option>`; });
    html += '</optgroup>';
  });
  return html;
}

function show(id) {
  ['loginView','changeView','backupView','forgotView','successView'].forEach(v => {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}

// ── INIT ──
async function init() {
  try {
    const r = await fetch(`${API}/workspace-staff?token=${TOKEN}`);
    const data = await r.json();
    if (!data.staff) throw new Error();
    staffList = data.staff;
    renderLogin();
  } catch(e) {
    document.getElementById('loginForm').innerHTML = '<p class="msg error" style="opacity:1;">Failed to load. Check widget token.</p>';
  }
}

function renderLogin() {
  document.getElementById('loginForm').innerHTML = `
    <form id="authForm">
      <div class="field">
        <span class="field-label">Name</span>
        <select id="staffSelect">${buildSelect()}</select>
      </div>
      <div class="field">
        <span class="field-label">Password</span>
        <input type="password" id="passInput" placeholder="Enter your password" autocomplete="off"/>
      </div>
      <button type="submit" class="btn" id="enterBtn" disabled>Enter Workspace</button>
    </form>
    <button type="button" class="btn-forgot" id="forgotBtn">Forgot password?</button>
  `;

  const sel = document.getElementById('staffSelect');
  const pw = document.getElementById('passInput');
  const btn = document.getElementById('enterBtn');
  function check() { btn.disabled = !(sel.value && pw.value); }
  sel.addEventListener('change', check);
  pw.addEventListener('input', check);
  document.getElementById('authForm').addEventListener('submit', handleLogin);
  document.getElementById('forgotBtn').addEventListener('click', showForgot);
}

// ── LOGIN ──
async function handleLogin(e) {
  e.preventDefault();
  const staffId = document.getElementById('staffSelect').value;
  const password = document.getElementById('passInput').value;
  const msgEl = document.getElementById('loginMsg');
  const btn = document.getElementById('enterBtn');

  btn.classList.add('loading'); btn.textContent = 'Verifying...';
  msgEl.className = 'msg';

  const { status, data } = await post('workspace-auth', { staff_id: staffId, password });

  btn.classList.remove('loading'); btn.textContent = 'Enter Workspace';

  if (status === 200 && data.ok) {
    currentStaff = { id: staffId, name: data.name, page: data.page, must_change: data.must_change };
    currentPassword = password;
    if (data.must_change) {
      showChange();
    } else {
      showSuccess();
    }
  } else {
    flash(msgEl, 'error', 'Wrong password. Try again.', 2500);
    document.getElementById('passInput').value = '';
    document.getElementById('passInput').focus();
    btn.disabled = true;
  }
}

// ── CHANGE PASSWORD (first login) ──
function showChange() {
  show('changeView');
  document.getElementById('changeName').textContent = currentStaff.name;

  const np = document.getElementById('newPw');
  const cp = document.getElementById('confirmPw');
  const btn = document.getElementById('changeBtn');

  function check() { btn.disabled = !(np.value.length >= 6 && cp.value.length >= 6); }
  np.addEventListener('input', check);
  cp.addEventListener('input', check);
  document.getElementById('changeForm').addEventListener('submit', handleChange);
}

async function handleChange(e) {
  e.preventDefault();
  const np = document.getElementById('newPw').value;
  const cp = document.getElementById('confirmPw').value;
  const msg = document.getElementById('changeMsg');
  const btn = document.getElementById('changeBtn');

  if (np !== cp) { flash(msg, 'error', "Passwords don't match.", 2500); return; }
  if (np.length < 6) { flash(msg, 'error', 'Minimum 6 characters.', 2500); return; }

  btn.classList.add('loading'); btn.textContent = 'Saving...';

  const { status, data } = await post('workspace-password', {
    staff_id: currentStaff.id,
    old_password: currentPassword,
    new_password: np
  });

  btn.classList.remove('loading'); btn.textContent = 'Set Password';

  if (status === 200 && data.ok) {
    if (data.backup_code) {
      showBackupCode(data.backup_code);
    } else {
      showSuccess();
    }
  } else {
    flash(msg, 'error', 'Something went wrong. Try again.', 2500);
  }
}

// ── BACKUP CODE VIEW ──
function showBackupCode(code) {
  show('backupView');
  document.getElementById('backupCode').textContent = code;
  document.getElementById('backupContinueBtn').addEventListener('click', () => showSuccess());
}

// ── FORGOT PASSWORD ──
function showForgot() {
  show('forgotView');
  const fv = document.getElementById('forgotView');

  fv.innerHTML = `
    <div class="card-hdr">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <div class="eyebrow">Reset Password</div>
      <div class="h-title">Backup Code</div>
      <div class="h-sub">Enter your backup code to reset</div>
    </div>
    <form id="resetForm">
      <div class="field">
        <span class="field-label">Your Name</span>
        <select id="resetSelect">${buildSelect()}</select>
      </div>
      <div class="field">
        <span class="field-label">Backup Code</span>
        <input type="text" id="resetCode" placeholder="XXXX-XXXX" autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700;"/>
      </div>
      <div class="field">
        <span class="field-label">New Password</span>
        <input type="password" id="resetNewPw" placeholder="Min 6 characters" autocomplete="new-password"/>
      </div>
      <div class="field">
        <span class="field-label">Confirm Password</span>
        <input type="password" id="resetConfirmPw" placeholder="Type it again" autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn" id="resetBtn" disabled>Reset Password</button>
    </form>
    <p class="msg" id="resetMsg"></p>
    <button type="button" class="btn-secondary" id="backBtn">Back to login</button>
  `;

  const sel = document.getElementById('resetSelect');
  const code = document.getElementById('resetCode');
  const npw = document.getElementById('resetNewPw');
  const cpw = document.getElementById('resetConfirmPw');
  const btn = document.getElementById('resetBtn');

  function check() {
    btn.disabled = !(sel.value && code.value.length >= 4 && npw.value.length >= 6 && cpw.value.length >= 6);
  }
  sel.addEventListener('change', check);
  code.addEventListener('input', check);
  npw.addEventListener('input', check);
  cpw.addEventListener('input', check);

  document.getElementById('resetForm').addEventListener('submit', handleReset);
  document.getElementById('backBtn').addEventListener('click', () => { show('loginView'); });
}

async function handleReset(e) {
  e.preventDefault();
  const staffId = document.getElementById('resetSelect').value;
  const code = document.getElementById('resetCode').value;
  const npw = document.getElementById('resetNewPw').value;
  const cpw = document.getElementById('resetConfirmPw').value;
  const msg = document.getElementById('resetMsg');
  const btn = document.getElementById('resetBtn');

  if (npw !== cpw) { flash(msg, 'error', "Passwords don't match.", 2500); return; }

  btn.classList.add('loading'); btn.textContent = 'Resetting...';

  const { status, data } = await post('workspace-self-reset', {
    staff_id: staffId,
    backup_code: code,
    new_password: npw
  });

  btn.classList.remove('loading'); btn.textContent = 'Reset Password';

  if (status === 200 && data.ok) {
    // Show new backup code
    const staff = staffList.find(s => s.id === staffId);
    const fv = document.getElementById('forgotView');
    fv.innerHTML = `
      <div class="card-hdr">
        <div class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12l2 2 4-4"/>
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
          </svg>
        </div>
        <div class="eyebrow">Password Reset</div>
        <div class="h-title">${esc(staff ? staff.name : 'Done')}</div>
      </div>
      <div class="backup-box">
        <div class="hint">Your new recovery code</div>
        <div class="code">${esc(data.new_backup_code)}</div>
        <div class="hint">Screenshot or write this down</div>
      </div>
      <p class="backup-warning">Your password has been reset. Save this new backup code — the old one no longer works.</p>
      <button type="button" class="btn" id="resetDoneBtn">Back to Login</button>
    `;
    document.getElementById('resetDoneBtn').addEventListener('click', () => {
      show('loginView');
    });
  } else if (data.error === 'wrong_code') {
    flash(msg, 'error', 'Wrong backup code. Check and try again.', 2500);
  } else if (data.error === 'no_backup_code') {
    flash(msg, 'error', "No backup code set yet. Complete your first login to get one.", 3000);
  } else {
    flash(msg, 'error', 'Something went wrong. Try again.', 2500);
  }
}

// ── SUCCESS ──
function showSuccess() {
  show('successView');
  document.getElementById('successView').innerHTML = `
    <div class="success-state">
      <div class="check">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="welcome">${esc(currentStaff.name)}</div>
      <div class="verified">Access verified</div>
      <a href="${currentStaff.page}" target="_blank" rel="noopener" class="open-link">Open Workspace</a>
    </div>
  `;
}

// ── BOOT ──
init();
</script>
</body>
</html>
