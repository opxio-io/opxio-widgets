<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio - Team Breakdown</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;background:#191919;color:#fff;padding:14px 14px 20px;overflow-y:auto;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.12);--gb:rgba(170,255,0,.2);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:999px;}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.hdr-left .eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-bottom:2px;}
.hdr-left .title{font-size:20px;font-weight:900;letter-spacing:-.03em;}
.hdr-right{display:flex;align-items:center;gap:6px;}
.ts{font-size:10px;color:rgba(255,255,255,.15);}
.icon-btn{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn.active{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn svg{width:13px;height:13px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ctrl-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.ctrl-left{display:flex;align-items:center;gap:8px;}
.period-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.04em;}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.06);border-radius:8px;padding:3px;}
.tab{font-family:'Satoshi',sans-serif;font-size:11px;font-weight:700;padding:4px 12px;border-radius:6px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.3);cursor:pointer;transition:all .18s;}
.tab.active{background:var(--gm);color:var(--g);border-color:var(--gb);}
.wk-nav{display:flex;align-items:center;gap:6px;}
.wk-arrow{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.wk-arrow:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.wk-arrow:disabled{opacity:.2;cursor:default;pointer-events:none;}
.wk-arrow svg{width:11px;height:11px;}
.wk-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);white-space:nowrap;min-width:128px;text-align:center;}
.wk-lbl.cur{color:var(--g);}
/* Compact table */
.compact-card{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl thead th{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.2);padding:9px 14px 7px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);}
.tbl thead th:first-child{text-align:left;}
.tbl thead th.mth{color:rgba(170,255,0,.5);}
.tbl tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s;}
.tbl tbody tr:last-child{border-bottom:none;}
.tbl tbody tr:hover{background:rgba(255,255,255,.02);}
.tbl td{padding:8px 14px;text-align:center;vertical-align:top;}
.tbl td:first-child{text-align:left;vertical-align:middle;}
.tbl tfoot tr{border-top:1px solid rgba(255,255,255,.06);}
.tbl tfoot td{padding:8px 14px;text-align:center;font-size:15px;font-weight:900;color:rgba(255,255,255,.5);}
.tbl tfoot td:first-child{text-align:left;}
.tbl tfoot td.mth{color:var(--g);}
.c-emp{display:flex;align-items:center;gap:8px;}
.c-av-wrap{position:relative;flex-shrink:0;}
.c-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;overflow:hidden;letter-spacing:-.3px;}
.c-av img{width:100%;height:100%;object-fit:cover;}
.c-av-ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;}
.c-av-ring.kpi-good{border-color:#AAFF00;}.c-av-ring.kpi-low{border-color:#F59E0B;}.c-av-ring.kpi-none{border-color:#FF6B35;}
.c-name{font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}
.c-role{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}
.kpi-tag{display:inline-flex;align-items:center;font-size:9px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:4px;margin-top:2px;}
.kpi-tag.kpi-good{background:rgba(170,255,0,.1);color:rgba(170,255,0,.8);}
.kpi-tag.kpi-low{background:rgba(245,158,11,.1);color:rgba(245,158,11,.9);}
.kpi-tag.kpi-none{background:rgba(255,80,80,.1);color:rgba(255,107,53,.9);}
.cn{font-size:15px;font-weight:900;letter-spacing:-.5px;}
.cn-zero{color:rgba(255,255,255,.1);}
.cn-tot{color:rgba(255,255,255,.65);}
.cn-mth{font-size:16px;}
.badge{display:inline-flex;align-items:center;font-size:8px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:999px;vertical-align:middle;margin-left:4px;}
.bdg-up{background:rgba(170,255,0,.12);color:#AAFF00;}
.bdg-dn{background:rgba(255,80,80,.12);color:#FF6B35;}
.bdg-na{background:rgba(255,80,80,.1);color:rgba(255,107,53,.8);}
.bdg-fl{background:rgba(255,255,255,.06);color:rgba(255,255,255,.3);}
/* Monthly compact stage breakdown */
.stg-break{margin-top:3px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;line-height:1.4;}
.stg-pip{font-size:8px;font-weight:800;letter-spacing:.02em;}
.sp-pln{color:rgba(96,165,250,.7);}
.sp-sht{color:rgba(245,158,11,.7);}
.sp-edt{color:rgba(192,132,252,.7);}
.sp-pst{color:rgba(170,255,0,.7);}
.sp-sep{color:rgba(255,255,255,.15);}
/* Card grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
/* Card base */
.mc{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.mc.team-card{border-color:rgba(170,255,0,.18);background:rgba(170,255,0,.025);}
.mc-hdr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);}
.mc.team-card .mc-hdr{border-bottom-color:rgba(170,255,0,.08);}
.mc-av-wrap{position:relative;flex-shrink:0;}
.mc-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;overflow:hidden;letter-spacing:-.5px;}
.mc-av img{width:100%;height:100%;object-fit:cover;}
.mc-av-ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;}
.mc-av-ring.kpi-good{border-color:#AAFF00;}.mc-av-ring.kpi-low{border-color:#F59E0B;}.mc-av-ring.kpi-none{border-color:#FF6B35;}
.mc-info{min-width:0;}
.mc-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mc-role{font-size:11px;font-weight:600;color:rgba(255,255,255,.28);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mc.team-card .mc-name{color:var(--g);}
.mc.team-card .mc-role{color:rgba(170,255,0,.45);}
/* Month card table */
.ct{width:100%;border-collapse:collapse;}
.ct th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.2);padding:7px 10px 4px;text-align:center;}
.ct th:first-child{text-align:left;padding-left:14px;}
.ct th.mth{color:rgba(170,255,0,.5);}
.ct td{padding:3px 10px;text-align:center;line-height:1;}
.ct td:first-child{text-align:left;padding-left:14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.ct-foot{border-top:1px solid rgba(255,255,255,.05);}
.mc.team-card .ct-foot{border-top-color:rgba(170,255,0,.1);}
.tot-lbl{font-size:10px!important;font-weight:700!important;text-transform:uppercase!important;letter-spacing:.1em!important;color:rgba(255,255,255,.2)!important;}
.tot-val{font-size:18px;font-weight:900;color:rgba(255,255,255,.6);}
.mc.team-card .tot-val{color:var(--g);}
.tot-row td{padding-top:7px!important;padding-bottom:9px!important;}
.lbl-pln{color:rgba(96,165,250,.6);}.lbl-sht{color:rgba(245,158,11,.6);}.lbl-edt{color:rgba(192,132,252,.6);}.lbl-pst{color:rgba(170,255,0,.6);}
.n{font-size:17px;font-weight:900;letter-spacing:-.5px;}
.n-zero{color:rgba(255,255,255,.1);}
.n-pln{color:#60A5FA;}.n-sht{color:#F59E0B;}.n-edt{color:#C084FC;}.n-pst{color:#AAFF00;}
.n-mth{font-size:18px;}
/* Week card footer */
.mc-wk-foot{display:flex;align-items:center;gap:5px;padding:10px 14px;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap;}
.mc.team-card .mc-wk-foot{border-top-color:rgba(170,255,0,.1);}
.wkf-lbl{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2);}
.wkf-tot{font-size:22px;font-weight:900;letter-spacing:-.8px;color:rgba(255,255,255,.8);margin-left:5px;line-height:1;}
.mc.team-card .wkf-tot{color:var(--g);}
.wkf-tasks{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);margin-right:2px;}
.wkf-time{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);margin-left:auto;}
/* Week 2x2 grid */
.team-wk-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.04);flex:1;}
.twg-item{padding:12px 14px;background:#1E1E1E;}
.mc.team-card .twg-item{background:rgba(12,12,12,.5);}
.twg-num{font-size:26px;font-weight:900;letter-spacing:-.8px;line-height:1;}
.twg-item.pln .twg-num{color:#60A5FA;}.twg-item.sht .twg-num{color:#F59E0B;}.twg-item.edt .twg-num{color:#C084FC;}.twg-item.pst .twg-num{color:#AAFF00;}
.twg-sub{font-size:9px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.25);margin-top:3px;}
/* Yearly card */
.yr-body{padding:12px 14px 8px;}
.yr-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.yr-row:last-child{margin-bottom:0;}
.yr-lbl{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;width:52px;flex-shrink:0;}
.yr-lbl.pln{color:rgba(96,165,250,.8);}.yr-lbl.sht{color:rgba(245,158,11,.8);}.yr-lbl.edt{color:rgba(192,132,252,.8);}.yr-lbl.pst{color:rgba(170,255,0,.8);}
.yr-track{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;}
.yr-fill{height:100%;border-radius:999px;transition:width .5s ease;}
.yr-fill.pln{background:#60A5FA;}.yr-fill.sht{background:#F59E0B;}.yr-fill.edt{background:#C084FC;}.yr-fill.pst{background:#AAFF00;}
.yr-val{font-size:14px;font-weight:900;letter-spacing:-.5px;width:24px;text-align:right;flex-shrink:0;}
.yv-pln{color:#60A5FA;}.yv-sht{color:#F59E0B;}.yv-edt{color:#C084FC;}.yv-pst{color:#AAFF00;}.yv-zero{color:rgba(255,255,255,.1);font-size:12px;}
.yr-foot{display:flex;align-items:center;gap:5px;padding:8px 14px;border-top:1px solid rgba(255,255,255,.05);}
/* Live host card */
.lh-body{padding:14px;}
.lh-big{font-size:42px;font-weight:900;letter-spacing:-2px;color:#AAFF00;line-height:1;}
.lh-unit{font-size:13px;font-weight:700;color:rgba(170,255,0,.5);margin-left:4px;}
.lh-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);margin-top:4px;}
.lh-wks{display:flex;gap:6px;padding:10px 14px;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap;}
.lh-wk{flex:1;min-width:0;background:rgba(255,255,255,.04);border-radius:8px;padding:7px 10px;text-align:center;}
.lh-wk-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.lh-wk-hrs{font-size:16px;font-weight:900;color:#AAFF00;letter-spacing:-.5px;}
.lh-wk-hrs.zero{color:rgba(255,255,255,.1);font-size:13px;}
.lh-wk-ses{font-size:9px;font-weight:600;color:rgba(255,255,255,.2);margin-top:2px;}
.lh-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(170,255,0,.1);border:1px solid rgba(170,255,0,.2);border-radius:6px;padding:2px 7px;font-size:9px;font-weight:800;color:#AAFF00;letter-spacing:.04em;margin-top:6px;}
.lh-stats{display:flex;align-items:center;gap:16px;margin-bottom:4px;}
.lh-stat{display:flex;flex-direction:column;}
.lh-divider{width:1px;height:36px;background:rgba(255,255,255,.08);}
.lh-dim{color:rgba(170,255,0,.45)!important;}
.mc.team-card .yr-foot{border-top-color:rgba(170,255,0,.1);}
.yr-year{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2);}
.yr-tot{font-size:20px;font-weight:900;letter-spacing:-.8px;color:rgba(255,255,255,.8);margin-left:4px;line-height:1;}
.mc.team-card .yr-tot{color:var(--g);}
.yr-tasks{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);}
.yr-hrs{font-size:10px;font-weight:700;color:rgba(255,255,255,.25);margin-left:auto;}
/* Issues log */
.issue-log{border-top:1px solid rgba(255,255,255,.07);margin-top:10px;padding:10px 14px 4px;}
.issue-log-hdr{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.25);margin-bottom:7px;}
.issue-cnt{border-radius:8px;padding:1px 6px;font-size:9px;font-weight:800;}
.issue-cnt-open{background:rgba(255,80,80,.2);color:#ff7070;}
.issue-cnt-ok{background:rgba(170,255,0,.12);color:#aaff00;}
.issue-item{background:rgba(255,60,60,.05);border:1px solid rgba(255,60,60,.1);border-radius:6px;padding:7px 9px;margin-bottom:5px;}
.issue-item.resolved{background:rgba(170,255,0,.04);border-color:rgba(170,255,0,.1);}
.issue-row1{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.issue-stg{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.07);border-radius:4px;padding:1px 5px;color:rgba(255,255,255,.4);flex-shrink:0;}
.issue-sum{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.issue-stat{font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;flex-shrink:0;}
.issue-stat.Open{background:rgba(255,80,80,.18);color:#ff7070;}
.issue-stat.Resolved{background:rgba(170,255,0,.14);color:#aaff00;}
.issue-stat.Escalated{background:rgba(255,165,0,.15);color:#ffaa44;}
.issue-desc{font-size:11px;color:rgba(255,255,255,.35);margin-top:3px;line-height:1.4;}
.issue-act{font-size:11px;color:rgba(170,255,0,.45);margin-top:2px;line-height:1.4;}
/* Loading */
.loading{display:flex;align-items:center;justify-content:center;min-height:160px;flex-direction:column;gap:8px;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:11px;color:rgba(255,255,255,.2);font-weight:600;}
.err-text{font-size:11px;color:#FF6B35;font-weight:700;}
.wgt-footer{text-align:center;padding:16px 0 2px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
.ct th.mth{border-left:2px solid rgba(170,255,0,.2);background:rgba(170,255,0,.05);color:rgba(170,255,0,.8);font-size:10px;}
.ct td.mth{border-left:2px solid rgba(170,255,0,.1);background:rgba(170,255,0,.025);}
.ct td.mth .n{font-size:18px;}
.ct td.mth .n-zero{font-size:14px;}
.st-time{font-size:10px;font-weight:700;color:rgba(255,255,255,.22);margin-top:2px;line-height:1;}
.mom-stk{font-size:9px;font-weight:800;letter-spacing:.04em;margin-top:2px;}
.mom-up{color:#AAFF00;}.mom-dn{color:#FF6B35;}.mom-fl{color:rgba(255,255,255,.3);}
.no-act-sm{font-size:9px;font-weight:600;color:rgba(255,255,255,.18);font-style:italic;}
.mom-stk{font-size:9px;font-weight:800;letter-spacing:.04em;margin-top:2px;}
.mom-up{color:#AAFF00;}.mom-dn{color:#FF6B35;}.mom-fl{color:rgba(255,255,255,.3);}
.no-act-sm{font-size:9px;font-weight:600;color:rgba(255,255,255,.18);font-style:italic;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <p class="eyebrow" id="_eyebrow" data-os="Custom OS">CUSTOM OS</p>
    <h1 class="title">Team Breakdown</h1>
  </div>
  <div class="hdr-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" onclick="doRefresh()" id="rb" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button class="icon-btn" id="vb" onclick="toggleView()" title="Toggle compact/card view">
      <svg id="view-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
  </div>
</div>
<div id="dash"><div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div></div></div>
<script>
var _tok=new URLSearchParams(location.search).get('token')||'';
var _tab='week',_data=null,_wkOff=0,_mthOff=0,_yrOff=0,_view='card';
var XROLES=['part time','part-time','freelance'];
var XNAMES=['danil husaini'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var AV_COLORS=['#4F46E5','#7C3AED','#DB2777','#D97706','#059669','#2563EB','#DC2626','#0891B2','#65A30D','#9333EA'];

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function avColor(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))&0xFFFFFF;return AV_COLORS[h%AV_COLORS.length];}
function initials(n){var p=(n||'').trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():(n||'??').slice(0,2).toUpperCase();}
function fmtH(h){if(!h)return '';if(h<1)return Math.round(h*60)+'m';var w=Math.floor(h),f=Math.round((h%1)*60);return w+'h'+(f?' '+f+'m':'');}
function sliceMonthStats(tasks, mb){
  var o={planning:0,shooting:0,editing:0,posting:0,mins:0};
  (tasks||[]).forEach(function(t){
    if(!t.isDone||!t.doneDate||t.doneDate<mb.s||t.doneDate>mb.e)return;
    if(o.hasOwnProperty(t.stage)){o[t.stage]++;o.mins+=t.mins;}
  });
  o.hrs=Math.round((o.mins/60)*10)/10;
  return o;
}
function prevMonthTotal(tasks, mb){

function getMonthWeeks(){
  var mb2=getMonthBoundsOff(_mthOff);var yr=mb2.yr,mo=mb2.mo;
  var t=new Date();t.setHours(0,0,0,0);

  var cls='mc'+(isTeam?' team-card':'');
  var issueHtml='';
  if(!isTeam&&(e.issues||[]).length){
    var iStart,iEnd,iLabel;
    if(_tab==='week'){var im=getMonday(_wkOff),is2=new Date(im);is2.setDate(im.getDate()+6);iStart=toStr(im);iEnd=toStr(is2);iLabel='Issues This Week';}
    else if(_tab==='month'){iStart=mb.s;iEnd=mb.e;iLabel='Issues This Month';}
    else{var iy=new Date().getFullYear();iStart=iy+'-01-01';iEnd=iy+'-12-31';iLabel='Issues This Year';}
    issueHtml=mkIssueLog(sliceIssues(e.issues,iStart,iEnd),iLabel);
  }
  return '<div class="'+cls+'">'
    +'<div class="mc-hdr">'+avHtml(e,kc,36)
    +'<div class="mc-info"><div class="mc-name">'+esc(e.name||'')+'</div>'
    +(e.role?'<div class="mc-role">'+esc(e.role)+'</div>':'')
    +(kc&&!isTeam?'<div class="kpi-tag '+kc+'" style="margin-top:3px">'+kpiLabel(mthTot,teamAvg||0)+'</div>':'')
    +'</div></div>'
    +'<table class="ct"><thead>'+thead+'</thead><tbody>'+stRows+'</tbody><tfoot>'+tfoot+'</tfoot></table>'
    +issueHtml
    +'</div>';
}

/* COMPACT VIEW */
function renderCompact(emps,data){
  var weeks=_tab==='month'?getMonthWeeks():null;
  var wkLabels=weeks?weeks.map(function(_,i){return 'W'+(i+1);}):null;
  var hasMth=_tab==='month';
  var teamTot=0,ac=0;
  emps.forEach(function(e){
    var t=0;
    if(hasMth){var ms=e.monthStats||{};t=(ms.planning||0)+(ms.shooting||0)+(ms.editing||0)+(ms.posting||0);}
    else if(_tab==='week'){var s=sliceWeek(e.tasks||[],_wkOff);t=(s.planning||0)+(s.shooting||0)+(s.editing||0)+(s.posting||0);}
    else if(_tab==='year'){var ys=sliceYear(e.tasks||[]);t=(ys.planning||0)+(ys.shooting||0)+(ys.editing||0)+(ys.posting||0);}
    teamTot+=t;if(t>0)ac++;
  });
  var teamAvg=ac>0?teamTot/ac:0;
  var colLabel=_tab==='week'?'This Week':_tab==='year'?'This Year':'';
  var h='<div class="compact-card"><table class="tbl"><thead><tr><th>Team</th>';
  if(hasMth){wkLabels.forEach(function(l){h+='<th>'+l+'</th>';});h+='<th class="mth">MTH</th>';}
  else{h+='<th>'+colLabel+'</th><th>Time</th>';}
  h+='</tr></thead><tbody>';
  var sorted=emps.slice().sort(function(a,b){
    function g(e){
      if(hasMth){var ms=e.monthStats||{};return(ms.planning||0)+(ms.shooting||0)+(ms.editing||0)+(ms.posting||0);}
      if(_tab==='week'){var s=sliceWeek(e.tasks||[],_wkOff);return(s.planning||0)+(s.shooting||0)+(s.editing||0)+(s.posting||0);}
      if(_tab==='year'){var ys=sliceYear(e.tasks||[]);return(ys.planning||0)+(ys.shooting||0)+(ys.editing||0)+(ys.posting||0);}
      return 0;
    }
    return g(b)-g(a);
  });
  sorted.forEach(function(e){
    var mb_c=getMonthBoundsOff(_mthOff);
    var ms=_mthOff===0?(e.monthStats||{}):sliceMonthStats(e.tasks||[],mb_c);
    var mthTot=(ms.planning||0)+(ms.shooting||0)+(ms.editing||0)+(ms.posting||0);
    var wkS=_tab==='week'?sliceWeek(e.tasks||[],_wkOff):null;
    var wkTot=wkS?(wkS.planning||0)+(wkS.shooting||0)+(wkS.editing||0)+(wkS.posting||0):0;
    var ys=_tab==='year'?sliceYear(e.tasks||[]):null;
    var yrTot=ys?(ys.planning||0)+(ys.shooting||0)+(ys.editing||0)+(ys.posting||0):0;
    var dispTot=hasMth?mthTot:_tab==='week'?wkTot:yrTot;
    var kc=kpiClass(dispTot,teamAvg);
    if(_tab==='week'){
      var mon=getMonday(_wkOff),sun=new Date(mon);sun.setDate(mon.getDate()+6);
      if(!isActiveInRange(e.tasks||[],toStr(mon),toStr(sun)))return;
    }
    h+='<tr><td><div class="c-emp">'+avHtml(e,kc,28)
      +'<div style="min-width:0"><div class="c-name">'+esc(e.name||'')+'</div>'
      +(e.role?'<div class="c-role">'+esc(e.role)+'</div>':'')
      +'<div class="kpi-tag '+kc+'">'+kpiLabel(dispTot,teamAvg)+'</div>'
      +'</div></div></td>';
    if(hasMth){
      var SMAP=[{k:'planning',c:'pln',a:'Planning'},{k:'shooting',c:'sht',a:'Shooting'},{k:'editing',c:'edt',a:'Editing'},{k:'posting',c:'pst',a:'Posting'}];
      weeks.forEach(function(wk){
        var s=sliceWeek(e.tasks||[],wk.off);
        var wt=(s.planning||0)+(s.shooting||0)+(s.editing||0)+(s.posting||0);
        var brk='';
        if(wt>0){
          var parts=SMAP.filter(function(x){return(s[x.k]||0)>0;});
          brk='<div class="stg-break">'+parts.map(function(x,i){return(i>0?'<span class="stg-pip sp-sep"> &middot; </span>':'')+'<span class="stg-pip sp-'+x.c+'">'+s[x.k]+' '+x.a+'</span>';}).join('')+'</div>';
        }
        h+='<td>'+(wt?'<span class="cn cn-tot">'+wt+'</span>':'<span class="no-act-sm">No activity</span>')+brk+'</td>';
      });
      var mHrs=ms.hrs||0;
      h+='<td class="mth">'+(mthTot?'<span class="cn cn-mth cn-tot">'+mthTot+'</span>'+(mHrs?'<div class="st-time">'+fmtH(mHrs)+'</div>':'')+moBadge(mthTot,_mthOff===0?(e.prevMonthTotal||0):prevMonthTotal(e.tasks||[],mb_c)):'<span class="no-act-sm">No activity</span>')+'</td>';
    } else {
      var v=_tab==='week'?wkTot:yrTot;
      var tHrs=_tab==='week'?(wkS?wkS.hrs:0):(ys?ys.hrs:0);
      h+='<td><span class="cn '+(v?'cn-tot':'cn-zero')+'">'+(v||'&mdash;')+'</span></td>';
      h+='<td><span style="font-size:12px;font-weight:800;color:'+(tHrs?'rgba(255,255,255,.5)':'rgba(255,255,255,.12)')+'">'+fmtH(tHrs)+'</span></td>';
    }
    h+='</tr>';
  });
  if(hasMth){
    h+='</tbody><tfoot><tr><td style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.2);">Team Total</td>';
    weeks.forEach(function(wk){var wt=emps.reduce(function(acc,e){var s=sliceWeek(e.tasks||[],wk.off);return acc+(s.planning||0)+(s.shooting||0)+(s.editing||0)+(s.posting||0);},0);h+='<td>'+(wt||'&mdash;')+'</td>';});
    var gTot=emps.reduce(function(acc,e){var ms=e.monthStats||{};return acc+(ms.planning||0)+(ms.shooting||0)+(ms.editing||0)+(ms.posting||0);},0);
    var gHrs=emps.reduce(function(acc,e){return acc+((e.monthStats&&e.monthStats.hrs)||0);},0);
    h+='<td class="mth">'+(gTot||'&mdash;')+(gHrs?'<div class="st-time">'+fmtH(gHrs)+'</div>':'')+'</td></tr></tfoot>';
  }
  h+='</table></div>';
  return h;
}

/* CARD VIEW */
function renderCards(emps,data){
  var h='<div class="grid">';
  if(_tab==='week'){
    var mon=getMonday(_wkOff),sun=new Date(mon);sun.setDate(mon.getDate()+6);
    var ws=toStr(mon),we=toStr(sun);
    var active=emps.filter(function(e){return isActiveInRange(e.tasks||[],ws,we);});
    var tots=active.map(function(e){var s=sliceWeek(e.tasks||[],_wkOff);return(s.planning||0)+(s.shooting||0)+(s.editing||0)+(s.posting||0);});
    var ac=tots.filter(function(v){return v>0;}).length;
    var teamAvg=ac>0?tots.reduce(function(a,b){return a+b;},0)/ac:0;
    var teamWkS={planning:0,shooting:0,editing:0,posting:0};
    var teamLastS={planning:0,shooting:0,editing:0,posting:0};
    emps.forEach(function(e){
      var s=sliceWeek(e.tasks||[],_wkOff);var ls=sliceWeek(e.tasks||[],_wkOff-1);
      teamWkS.planning+=s.planning||0;teamWkS.shooting+=s.shooting||0;teamWkS.editing+=s.editing||0;teamWkS.posting+=s.posting||0;
      teamLastS.planning+=ls.planning||0;teamLastS.shooting+=ls.shooting||0;teamLastS.editing+=ls.editing||0;teamLastS.posting+=ls.posting||0;
    });
    var activeRegular=active.filter(function(e){return !isLiveHost(e);});
    var activeLive=active.filter(function(e){return isLiveHost(e);});
    activeRegular.sort(function(a,b){
      var sa=sliceWeek(a.tasks||[],_wkOff),sb=sliceWeek(b.tasks||[],_wkOff);
      return((sb.planning||0)+(sb.shooting||0)+(sb.editing||0)+(sb.posting||0))-((sa.planning||0)+(sa.shooting||0)+(sa.editing||0)+(sa.posting||0));
    });
    activeLive.sort(function(a,b){
      var ai=(a.name||'').toLowerCase().includes('intan')?0:1;
      var bi=(b.name||'').toLowerCase().includes('intan')?0:1;
      return ai-bi;
    });
    var sorted=activeRegular.concat(activeLive);
    sorted.forEach(function(e){
      var wkS=sliceWeek(e.tasks||[],_wkOff);
      var lastS=sliceWeek(e.tasks||[],_wkOff-1);
      var thisTot=(wkS.planning||0)+(wkS.shooting||0)+(wkS.editing||0)+(wkS.posting||0);
      var kc=kpiClass(thisTot,teamAvg);
      h+=isLiveHost(e)?mkLiveHostCard(e,'week',_wkOff):mkWeekCard(e,wkS,lastS,teamAvg,kc);
    });
    var teamWkHrs=Math.round(emps.reduce(function(acc,e){return acc+(sliceWeek(e.tasks||[],_wkOff).hrs||0);},0)*10)/10;
    h+=mkTeamWeekCard(teamWkS,teamLastS,wkLblFull(mon),ac,teamWkHrs);
  } else if(_tab==='month'){
    var weeks=getMonthWeeks();
    var wkLabels=weeks.map(function(_,i){return 'W'+(i+1);});
    var mb_m=getMonthBoundsOff(_mthOff);
    var tots2=emps.map(function(e){var ms2=_mthOff===0?(e.monthStats||{}):sliceMonthStats(e.tasks||[],mb_m);return(ms2.planning||0)+(ms2.shooting||0)+(ms2.editing||0)+(ms2.posting||0);});
    var ac2=tots2.filter(function(v){return v>0;}).length;
    var teamAvg2=ac2>0?tots2.reduce(function(a,b){return a+b;},0)/ac2:0;
    var regular2=emps.filter(function(e){return !isLiveHost(e);});
    var live2=emps.filter(function(e){return isLiveHost(e);});
    regular2.sort(function(a,b){return tots2[emps.indexOf(b)]-tots2[emps.indexOf(a)];});
    live2.sort(function(a,b){
      var ai=(a.name||'').toLowerCase().includes('intan')?0:1;
      var bi=(b.name||'').toLowerCase().includes('intan')?0:1;
      return ai-bi;
    });
    var sorted2=regular2.concat(live2);
    sorted2.forEach(function(e){
      var wksData=weeks.map(function(wk){return sliceWeek(e.tasks||[],wk.off);});
      h+=isLiveHost(e)?mkLiveHostCard(e,'month',0):mkStdCard(e,wksData,wkLabels,false,teamAvg2);
    });
    var teamMs={planning:0,shooting:0,editing:0,posting:0,hrs:0};
    emps.forEach(function(e){var ms_t=_mthOff===0?(e.monthStats||{}):sliceMonthStats(e.tasks||[],mb_m);teamMs.planning+=ms_t.planning||0;teamMs.shooting+=ms_t.shooting||0;teamMs.editing+=ms_t.editing||0;teamMs.posting+=ms_t.posting||0;teamMs.hrs+=(ms_t.hrs||0);});
    var tEmp={name:'Team Total',role:data.monthLabel||'',avatarUrl:null,_sigma:true,monthStats:teamMs,allStats:teamMs,prevMonthTotal:0};
    var teamWksData=weeks.map(function(wk){var o={planning:0,shooting:0,editing:0,posting:0};emps.forEach(function(e){var s=sliceWeek(e.tasks||[],wk.off);o.planning+=s.planning||0;o.shooting+=s.shooting||0;o.editing+=s.editing||0;o.posting+=s.posting||0;});return o;});
    h+=mkStdCard(tEmp,teamWksData,wkLabels,true,0);
  } else {
    var tots3=emps.map(function(e){var ys=sliceYear(e.tasks||[]);return(ys.planning||0)+(ys.shooting||0)+(ys.editing||0)+(ys.posting||0);});
    var ac3=tots3.filter(function(v){return v>0;}).length;
    var teamAvg3=ac3>0?tots3.reduce(function(a,b){return a+b;},0)/ac3:0;
    var regular3=emps.filter(function(e){return !isLiveHost(e);});
    var live3=emps.filter(function(e){return isLiveHost(e);});
    regular3.sort(function(a,b){return tots3[emps.indexOf(b)]-tots3[emps.indexOf(a)];});
    live3.sort(function(a,b){
      var ai=(a.name||'').toLowerCase().includes('intan')?0:1;
      var bi=(b.name||'').toLowerCase().includes('intan')?0:1;
      return ai-bi;
    });
    var sorted3=regular3.concat(live3);
    sorted3.forEach(function(e){
      var ys=sliceYear(e.tasks||[]);
      h+=isLiveHost(e)?mkLiveHostCard(e,'year',0):mkYearCard(e,ys,teamAvg3,false);
    });
    var teamYs={planning:0,shooting:0,editing:0,posting:0,mins:0};
    emps.forEach(function(e){var ys=sliceYear(e.tasks||[]);teamYs.planning+=ys.planning||0;teamYs.shooting+=ys.shooting||0;teamYs.editing+=ys.editing||0;teamYs.posting+=ys.posting||0;teamYs.mins+=ys.mins||0;});
    teamYs.hrs=Math.round((teamYs.mins/60)*10)/10;
    var tEmpY={name:'Team Total',role:new Date().getFullYear()+'',avatarUrl:null,_sigma:true,monthStats:{},allStats:teamYs,prevMonthTotal:0};
    h+=mkYearCard(tEmpY,teamYs,0,true);
  }
  h+='</div>';
  return h;
}

function render(data){
  if(!data||!data.employees)return;
  var emps=data.employees.filter(function(e){
    var r=(e.role||'').toLowerCase(),n=(e.name||'').toLowerCase();
    var isLive=r.includes('live');
    var excluded=XROLES.some(function(x){return r.includes(x);})||XNAMES.some(function(x){return n.includes(x);});
    return !excluded||isLive;
  });
  function mkTab(t,l){return '<button class="tab'+(_tab===t?' active':'')+'" onclick="switchTab(\''+t+'\')">'+l+'</button>';}
  var tabBar='<div class="tabs">'+mkTab('week','Week')+mkTab('month','Month')+mkTab('year','Yearly')+'</div>';
  var isCur=_wkOff===0;
  var mb=getMonthBoundsOff(_mthOff);
  var isMthCur=_mthOff===0;
  var yrNum=new Date().getFullYear()+_yrOff;
  var isYrCur=_yrOff===0;
  var ctrlLeft=_tab==='week'
    ?('<div class="wk-nav"><button class="wk-arrow" onclick="shiftWeek(-1)">'+PREV+'</button><span class="wk-lbl'+(isCur?' cur':'')+'" >'+esc(wkLbl(getMonday(_wkOff)))+'</span><button class="wk-arrow" onclick="shiftWeek(1)"'+(isCur?' disabled':'')+'>'+NEXT+'</button></div>')
    :_tab==='month'
    ?('<div class="wk-nav"><button class="wk-arrow" onclick="shiftMonth(-1)">'+PREV+'</button><span class="wk-lbl'+(isMthCur?' cur':'')+'">'+esc(mb.lbl)+'</span><button class="wk-arrow" onclick="shiftMonth(1)"'+(isMthCur?' disabled':'')+'>'+NEXT+'</button></div>')
    :('<div class="wk-nav"><button class="wk-arrow" onclick="shiftYear(-1)">'+PREV+'</button><span class="wk-lbl'+(isYrCur?' cur':'')+'">'+yrNum+'</span><button class="wk-arrow" onclick="shiftYear(1)"'+(isYrCur?' disabled':'')+'>'+NEXT+'</button></div>');
  var h='<div class="ctrl-bar"><div class="ctrl-left">'+ctrlLeft+'</div>'+tabBar+'</div>';
  h+=_view==='compact'?renderCompact(emps,data):renderCards(emps,data);
  document.getElementById('dash').innerHTML=h;
  document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function doRefresh(){var b=document.getElementById('rb');if(b)b.classList.add('spinning');loadData().finally(function(){var b2=document.getElementById('rb');if(b2)b2.classList.remove('spinning');});}
function loadData(){
  return fetch('/api/creaitors/employee-stats?token='+_tok)
    .then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();})
    .then(function(d){_data=d;render(d);})
    .catch(function(e){document.getElementById('dash').innerHTML='<div class="loading"><div class="err-text">Failed to load</div><div style="font-size:9px;color:rgba(255,255,255,.2);margin-top:4px;">'+esc(e.message)+'</div></div>';});
}
loadData();
setInterval(loadData,300000);
