<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Client Accounts</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 28px;background:#191919;color:#fff;overflow-y:auto;overflow-x:hidden;height:100%;transition:background .3s,color .3s;}
body.light{background:#FFFFFF;color:#111;}
:root{
  --g:#AAFF00;--gm:rgba(170,255,0,.1);--gb:rgba(170,255,0,.18);
  --healthy:#22C55E;--healthym:rgba(34,197,94,.1);--healthyb:rgba(34,197,94,.18);
  --risk:#FBBF24;--riskm:rgba(251,191,36,.1);
  --critical:#FF6B6B;--criticalm:rgba(255,107,107,.1);
  --muted:rgba(255,255,255,.35);
}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:999px;}

.card{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:16px;transition:border-color .2s;}
.card:hover{border-color:rgba(170,255,0,.07);}

/* ── Header ── */
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:8px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:2px;}
.h-title{font-size:22px;font-weight:900;letter-spacing:-.03em;}
.h-right{display:flex;align-items:center;gap:8px;}
.ts{font-size:11px;font-weight:500;color:rgba(255,255,255,.2);}
.icon-btn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Stat cards ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:600px){.g4{grid-template-columns:repeat(2,1fr);}}
.stat{padding:18px 20px;position:relative;overflow:hidden;}
.s-dot{position:absolute;top:14px;right:14px;width:6px;height:6px;border-radius:50%;opacity:.55;}
.s-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;display:block;}
.s-val{font-size:30px;font-weight:900;letter-spacing:-1.5px;line-height:1;}
.s-sub{font-size:11px;font-weight:600;color:rgba(255,255,255,.2);margin-top:6px;}

/* ── Section label ── */
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.25);margin:18px 0 10px;}

/* ── Mid row ── */
.mid-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:680px){.mid-row{grid-template-columns:1fr;}}
.panel{padding:20px 22px;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.3);}
.panel-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gm);color:var(--g);border:1px solid var(--gb);}

/* ── Health ring ── */
.ring-outer{display:flex;align-items:center;gap:22px;}
@media(max-width:460px){.ring-outer{flex-direction:column;gap:14px;}}
.ring-pos{position:relative;flex-shrink:0;width:110px;height:110px;}
.ring-svg{width:110px;height:110px;overflow:visible;}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.ring-val{font-size:30px;font-weight:900;letter-spacing:-1.5px;line-height:1;}
.ring-sub{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.25);margin-top:3px;}
.ring-track{fill:none;stroke:rgba(255,255,255,.05);}
/* Legend */
.h-legend{display:flex;flex-direction:column;gap:12px;flex:1;}
.hl-row{display:flex;align-items:center;gap:10px;}
.hl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.hl-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);flex:1;}
.hl-bar-track{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;max-width:80px;}
.hl-bar-fill{height:5px;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.hl-count{font-size:13px;font-weight:900;min-width:20px;text-align:right;flex-shrink:0;}

/* ── OS distribution bars ── */
.os-bars{display:flex;flex-direction:column;gap:11px;}
.os-row{display:flex;align-items:center;gap:10px;}
.os-label{font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;width:72px;}
.os-track{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;}
.os-fill{height:5px;border-radius:999px;background:var(--g);opacity:.7;transition:width .8s cubic-bezier(.4,0,.2,1);}
.os-count{font-size:13px;font-weight:900;color:#fff;min-width:20px;text-align:right;flex-shrink:0;}

/* ── Client list ── */
.full-panel{padding:0;}
.client-scroll{max-height:360px;overflow-y:auto;padding:4px 0;}

/* Each row */
.ci{display:flex;align-items:center;gap:0;padding:0 20px;border-radius:10px;transition:background .15s;cursor:pointer;position:relative;overflow:hidden;}
.ci:hover{background:rgba(255,255,255,.025);}
.ci-inner{display:flex;align-items:center;gap:12px;flex:1;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.ci:last-child .ci-inner{border-bottom:none;}

/* Health accent bar on left */
.ci-bar{width:3px;border-radius:999px;height:32px;flex-shrink:0;margin-right:12px;}

/* Info */
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-meta{font-size:11px;font-weight:600;color:rgba(255,255,255,.25);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Right side */
.ci-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* OS tags — neutral only */
.os-tags{display:flex;gap:4px;flex-wrap:wrap;}
.os-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.35);white-space:nowrap;letter-spacing:.02em;}

/* Status pill */
.sp{font-size:9px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.sp-active{background:var(--gm);color:var(--g);border:1px solid var(--gb);}
.sp-onboarding{background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.08);}
.sp-past{background:rgba(255,255,255,.03);color:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.06);}

/* Health badge (text) */
.hb{font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;white-space:nowrap;}
.hb-green{background:var(--healthym);color:var(--healthy);border:1px solid var(--healthyb);}
.hb-amber{background:var(--riskm);color:var(--risk);border:1px solid rgba(251,191,36,.18);}
.hb-red{background:var(--criticalm);color:var(--critical);border:1px solid rgba(255,107,107,.18);}
.hb-none{background:rgba(255,255,255,.03);color:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.06);}

/* Expand flag */
.exp-flag{font-size:9px;font-weight:700;color:var(--g);white-space:nowrap;}

/* Touchpoint */
.touch{font-size:11px;font-weight:600;color:rgba(255,255,255,.25);white-space:nowrap;}

.empty{padding:40px;text-align:center;font-size:12px;color:rgba(255,255,255,.18);}
.wgt-footer{text-align:center;padding:20px 0 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
</style></head><body>

<!-- Header -->
<div class="header">
  <div>
    <div class="eyebrow">Revenue OS · Opxio</div>
    <h1 class="h-title">Client Accounts</h1>
  </div>
  <div class="h-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" onclick="doRefresh()" id="rb" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
    <button class="icon-btn" onclick="toggleMode()" id="mb" title="Toggle light/dark">
      <svg id="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
</div>

<!-- Stat cards -->
<div class="g4">
  <div class="card stat">
    <div class="s-dot" style="background:var(--g);"></div>
    <span class="s-lbl">Active</span>
    <div class="s-val" id="s-active" style="color:var(--g);">—</div>
    <div class="s-sub">Live accounts</div>
  </div>
  <div class="card stat">
    <div class="s-dot" style="background:var(--g);"></div>
    <span class="s-lbl">Onboarding</span>
    <div class="s-val" id="s-onboarding" style="color:var(--g);">—</div>
    <div class="s-sub">Setting up</div>
  </div>
  <div class="card stat">
    <div class="s-dot" style="background:var(--healthy);"></div>
    <span class="s-lbl">Healthy</span>
    <div class="s-val" id="s-healthy" style="color:var(--healthy);">—</div>
    <div class="s-sub">🟢 Green status</div>
  </div>
  <div class="card stat">
    <div class="s-dot" style="background:var(--g);opacity:.3;"></div>
    <span class="s-lbl">Expansion Ready</span>
    <div class="s-val" id="s-expansion" style="color:var(--g);">—</div>
    <div class="s-sub">Flagged for growth</div>
  </div>
</div>

<!-- Health & OS -->
<div class="sec-lbl">Health & Coverage</div>
<div class="mid-row">

  <!-- Health ring -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">Client Health</span>
      <span class="panel-badge" id="health-badge">—</span>
    </div>
    <div class="ring-outer">
      <div class="ring-pos">
        <svg class="ring-svg" viewBox="0 0 110 110" id="h-ring">
          <circle class="ring-track" cx="55" cy="55" r="46" stroke-width="7"/>
        </svg>
        <div class="ring-center">
          <div class="ring-val" id="h-ring-val" style="color:var(--healthy);">—</div>
          <div class="ring-sub">Healthy</div>
        </div>
      </div>
      <div class="h-legend" id="h-legend"></div>
    </div>
  </div>

  <!-- OS coverage -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">OS Coverage</span>
      <span class="panel-badge" id="os-badge">—</span>
    </div>
    <div class="os-bars" id="os-bars"></div>
  </div>

</div>

<!-- Client list -->
<div class="sec-lbl" id="list-label">Clients</div>
<div class="card full-panel">
  <div class="client-scroll" id="client-list"></div>
</div>

<script>
const _tok = new URLSearchParams(location.search).get('token') || '';
function apiUrl(p){ return _tok ? p+'?token='+encodeURIComponent(_tok) : p; }

let light = false;
const SUN  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function toggleMode(){ light=!light; document.body.classList.toggle('light',light); document.getElementById('mb').innerHTML=light?MOON:SUN; }
function setTs(){ document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

function fmtDate(iso){
  if(!iso)return null;
  try{ return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}); }
  catch{return null;}
}
function daysSince(iso){
  if(!iso)return null;
  const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(d===0)return'Today';if(d===1)return'Yesterday';
  if(d<7)return d+'d ago';if(d<30)return Math.floor(d/7)+'w ago';
  if(d<365)return Math.floor(d/30)+'mo ago';return Math.floor(d/365)+'y ago';
}

// Health config — only these three use semantic color
const H = {
  '🟢 Green': { color:'#22C55E', label:'Healthy',  barCls:'hb-green', barColor:'#22C55E' },
  '🟡 Amber': { color:'#FBBF24', label:'At Risk',  barCls:'hb-amber', barColor:'#FBBF24' },
  '🔴 Red':   { color:'#FF6B6B', label:'Critical', barCls:'hb-red',   barColor:'#FF6B6B' },
  'Unset':    { color:'rgba(255,255,255,.12)', label:'No Status', barCls:'hb-none', barColor:'rgba(255,255,255,.12)' },
};

// Health accent bar per row
function healthBar(h){
  const cfg = H[h] || H['Unset'];
  return `<div class="ci-bar" style="background:${cfg.color};opacity:.7;"></div>`;
}

// Health badge text
function healthBadge(h){
  if(!h) return `<span class="hb hb-none">—</span>`;
  const cfg = H[h] || H['Unset'];
  return `<span class="hb ${cfg.barCls}">${cfg.label}</span>`;
}

// Status pill
function statusPill(s){
  if(s==='Active')     return `<span class="sp sp-active">Active</span>`;
  if(s==='Onboarding') return `<span class="sp sp-onboarding">Setting Up</span>`;
  if(s==='Past Client')return `<span class="sp sp-past">Past</span>`;
  return s?`<span class="sp sp-past">${esc(s)}</span>`:'';
}

// OS short names — neutral chips only
const OSS = { 'Revenue OS':'Rev','Operations OS':'Ops','Marketing OS':'Mkt','Finance OS':'Fin','Team OS':'Team','Retention OS':'Ret','Sales OS':'Sales' };
function osTags(arr){
  return (arr||[]).filter(o=>o!=='Base OS').map(o=>`<span class="os-tag">${esc(OSS[o]||o)}</span>`).join('');
}

// ── Health ring ──
const CIRC = 2*Math.PI*46;
function renderHealthRing(hc, total){
  document.getElementById('health-badge').textContent = total+' account'+(total!==1?'s':'');
  const green = hc['🟢 Green']||0;
  document.getElementById('h-ring-val').textContent = green;

  const svg = document.getElementById('h-ring');
  svg.querySelectorAll('.harc').forEach(e=>e.remove());

  const items = [
    { key:'🟢 Green', val: green },
    { key:'🟡 Amber', val: hc['🟡 Amber']||0 },
    { key:'🔴 Red',   val: hc['🔴 Red']||0 },
    { key:'Unset',    val: hc['Unset']||0 },
  ].filter(x=>x.val>0);

  let offset=0;
  items.forEach(it=>{
    const frac = total>0 ? it.val/total : 0;
    const len  = frac*CIRC;
    const arc  = document.createElementNS('http://www.w3.org/2000/svg','circle');
    arc.setAttribute('class','harc');
    arc.setAttribute('cx','55');arc.setAttribute('cy','55');arc.setAttribute('r','46');
    arc.setAttribute('fill','none');
    arc.setAttribute('stroke', H[it.key].color);
    arc.setAttribute('stroke-width','7');
    arc.setAttribute('stroke-linecap','round');
    arc.setAttribute('stroke-dasharray',`${Math.max(len-2,1)} ${CIRC}`);
    arc.setAttribute('transform',`rotate(${-90+offset*360} 55 55)`);
    arc.style.transition='all .8s cubic-bezier(.4,0,.2,1)';
    svg.appendChild(arc);
    offset+=frac;
  });

  const max = Math.max(...[green,hc['🟡 Amber']||0,hc['🔴 Red']||0,hc['Unset']||0],1);
  document.getElementById('h-legend').innerHTML = Object.keys(H).map(key=>{
    const val = key==='Unset'?(hc['Unset']||0):(hc[key]||0);
    const cfg = H[key];
    const barW = Math.round((val/max)*100);
    return `<div class="hl-row">
      <div class="hl-dot" style="background:${cfg.color}"></div>
      <span class="hl-label">${cfg.label}</span>
      <div class="hl-bar-track"><div class="hl-bar-fill" style="width:${barW}%;background:${cfg.color}"></div></div>
      <span class="hl-count" style="color:${cfg.color}">${val}</span>
    </div>`;
  }).join('');
}

// ── OS bars — lime green only ──
function renderOSBars(clients){
  const counts = {};
  for(const c of clients) for(const os of (c.osInstalled||[])) if(os!=='Base OS') counts[os]=(counts[os]||0)+1;
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const totalInstalls = sorted.reduce((s,[,v])=>s+v,0);
  document.getElementById('os-badge').textContent = totalInstalls+' install'+(totalInstalls!==1?'s':'');

  if(!sorted.length){ document.getElementById('os-bars').innerHTML='<div style="font-size:11px;color:rgba(255,255,255,.2);">No data</div>'; return; }

  const max = sorted[0][1];
  document.getElementById('os-bars').innerHTML = sorted.map(([os,count])=>{
    const barW = Math.round((count/max)*100);
    return `<div class="os-row">
      <span class="os-label">${esc(OSS[os]||os)}</span>
      <div class="os-track"><div class="os-fill" style="width:${barW}%"></div></div>
      <span class="os-count">${count}</span>
    </div>`;
  }).join('');
}

// ── Client list ──
function renderClients(clients){
  document.getElementById('list-label').textContent = `Clients · ${clients.length}`;
  if(!clients.length){
    document.getElementById('client-list').innerHTML='<div class="empty">No client accounts yet</div>';
    return;
  }

  // Sort: Active → Onboarding → Past, then by health severity (Red first within each group)
  const hOrder = {'🔴 Red':0,'🟡 Amber':1,'🟢 Green':2,'Unset':3,'':3};
  const sOrder = {'Active':0,'Onboarding':1,'Past Client':2};
  const sorted = [...clients].sort((a,b)=>{
    const sd=(sOrder[a.status]??3)-(sOrder[b.status]??3);
    if(sd!==0)return sd;
    return (hOrder[a.health]??3)-(hOrder[b.health]??3);
  });

  document.getElementById('client-list').innerHTML = sorted.map(c=>{
    const installDate = fmtDate(c.installDate);
    const touch = daysSince(c.lastTouchpoint);
    const osNonBase = (c.osInstalled||[]).filter(o=>o!=='Base OS');
    const metaParts = [
      c.origin ? c.origin.replace('Existing Pre-Pipeline','Pre-pipeline') : null,
      installDate ? 'Installed '+installDate : null,
    ].filter(Boolean).join(' · ');

    return `<div class="ci" onclick="window.open('${esc(c.url)}','_blank')">
      ${healthBar(c.health)}
      <div class="ci-inner">
        <div class="ci-info">
          <div class="ci-name">${esc(c.name)}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;">
            ${metaParts?`<span class="ci-meta">${esc(metaParts)}</span>`:''}
            ${osNonBase.length?`<div class="os-tags">${osTags(osNonBase)}</div>`:''}
          </div>
        </div>
        <div class="ci-right">
          ${touch?`<span class="touch">${esc(touch)}</span>`:''}
          ${c.isExpansion?`<span class="exp-flag">↑ Expand</span>`:''}
          ${healthBadge(c.health)}
          ${statusPill(c.status)}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function loadData(){
  try{
    const r = await fetch(apiUrl('/api/data/accounts'));
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();

    document.getElementById('s-active').textContent     = j.statusCounts?.['Active']      ?? 0;
    document.getElementById('s-onboarding').textContent = j.statusCounts?.['Onboarding']  ?? 0;
    document.getElementById('s-healthy').textContent    = j.healthCounts?.['🟢 Green']    ?? 0;
    document.getElementById('s-expansion').textContent  = j.expansionCandidates           ?? 0;

    renderHealthRing(j.healthCounts||{}, j.total||0);
    renderOSBars(j.clients||[]);
    renderClients(j.clients||[]);
    setTs();
  }catch(e){
    console.error('accounts:',e);
    document.getElementById('client-list').innerHTML='<div class="empty" style="color:rgba(255,107,107,.5);">Failed to load — check token</div>';
  }
}

function doRefresh(){
  const b=document.getElementById('rb');
  if(b)b.classList.add('spinning');
  loadData().finally(()=>{ const b2=document.getElementById('rb'); if(b2)b2.classList.remove('spinning'); });
}

loadData();
setInterval(loadData,5*60*1000);
</script>
