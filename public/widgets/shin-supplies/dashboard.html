<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shin Supplies — Sales Dashboard</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 36px;background:#191919;color:#fff;overflow-y:auto;overflow-x:hidden;}
:root{
  --g:#C8FF00;--gd:#AAFF00;--gm:rgba(200,255,0,.09);--gb:rgba(200,255,0,.2);
  --red:#FF6B6B;--amber:#FBBF24;--blue:#60A5FA;--purple:#C084FC;--teal:#34D399;
}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px;}

.card{background:#222222;border:1px solid rgba(255,255,255,.07);border-radius:16px;}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.18);margin-bottom:4px;}
.h-title{font-size:22px;font-weight:900;letter-spacing:-.04em;}
.h-right{display:flex;align-items:center;gap:8px;}
.ts{font-size:10px;font-weight:500;color:rgba(255,255,255,.15);}
.icon-btn{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn svg{width:13px;height:13px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Grids ── */
.row{margin-bottom:10px;}
.g-hero{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:10px;}
.g2-eq{display:grid;grid-template-columns:2fr 3fr;gap:10px;}
@media(max-width:800px){.g-hero{grid-template-columns:1fr 1fr;}.g2,.g2-eq{grid-template-columns:1fr;}}
@media(max-width:480px){.g-hero{grid-template-columns:1fr;}}

/* ── Hero stat ── */
.hero{padding:28px 28px 24px;}
.hero-eyebrow{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);margin-bottom:10px;display:block;}
.hero-val{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1;color:var(--g);filter:drop-shadow(0 0 24px rgba(200,255,0,.25));}
.hero-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.55);margin-top:10px;}
.hero-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,.2);margin-top:5px;}

/* ── Small KPI ── */
.kpi{padding:22px 22px 20px;}
.kpi-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:rgba(255,255,255,.3);margin-bottom:14px;display:block;line-height:1.5;}
.kpi-val{font-size:36px;font-weight:900;letter-spacing:-1.5px;line-height:1;}
.kpi-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,.2);margin-top:8px;}

/* ── Panel ── */
.panel{padding:24px 26px 22px;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:6px;}
.panel-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.55);}
.badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--gm);color:var(--g);border:1px solid var(--gb);}
.badge.red{background:rgba(255,107,107,.1);color:var(--red);border-color:rgba(255,107,107,.2);}
.badge.amber{background:rgba(251,191,36,.1);color:var(--amber);border-color:rgba(251,191,36,.2);}
.badge.blue{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.2);}

/* ── Pipeline funnel ── */
.f-item{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.f-item:last-child{margin-bottom:0;}
.f-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.3);width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-track{flex:1;height:24px;border-radius:6px;background:rgba(255,255,255,.04);overflow:hidden;position:relative;}
.f-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.f-n{font-size:13px;font-weight:900;color:rgba(255,255,255,.5);width:28px;text-align:right;flex-shrink:0;}

/* ── Response speed ── */
.speed-row{display:flex;align-items:flex-end;gap:18px;margin-bottom:16px;}
.speed-big{font-size:48px;font-weight:900;letter-spacing:-2.5px;line-height:1;}
.speed-unit{font-size:14px;font-weight:700;color:rgba(255,255,255,.3);margin-bottom:8px;}
.speed-meta{flex:1;}
.speed-tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;margin-bottom:8px;}
.speed-desc{font-size:10px;font-weight:500;color:rgba(255,255,255,.2);line-height:1.5;}
.rate-track{height:5px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-top:16px;}
.rate-fill{height:100%;border-radius:999px;transition:width .6s ease;}
.rate-meta{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.2);margin-top:7px;}

/* ── Rep leaderboard ── */
.rep-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.rep-item:last-child{border-bottom:none;padding-bottom:0;}
.rep-rank{font-size:11px;font-weight:900;color:rgba(255,255,255,.1);width:18px;text-align:center;flex-shrink:0;}
.rep-av{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;}
.rep-info{flex:1;min-width:0;}
.rep-name{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-hint{font-size:9.5px;font-weight:500;color:rgba(255,255,255,.2);margin-top:2px;}
.rep-nums{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.rep-pill{text-align:center;padding:6px 14px;border-radius:8px;}
.rep-pill-val{font-size:20px;font-weight:900;letter-spacing:-.5px;line-height:1;}
.rep-pill-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.2);margin-top:3px;}

/* ── Donut ── */
.donut-wrap{display:flex;align-items:center;gap:22px;}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:10px;}
.leg-row{display:flex;align-items:center;gap:9px;}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.leg-name{font-size:10px;font-weight:600;color:rgba(255,255,255,.38);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.leg-val{font-size:14px;font-weight:900;color:rgba(255,255,255,.75);}
.leg-pct{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);margin-left:2px;}

/* ── Sources ── */
.src-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.src-item:last-child{border-bottom:none;padding-bottom:0;}
.src-rank{font-size:10px;font-weight:900;color:rgba(255,255,255,.1);width:16px;text-align:center;flex-shrink:0;}
.src-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.8;}.src-icon svg{width:16px;height:16px;}
.src-info{flex:1;min-width:0;}
.src-name{font-size:11px;font-weight:700;color:rgba(255,255,255,.6);}
.src-bar{height:3px;background:rgba(255,255,255,.05);border-radius:999px;margin-top:5px;overflow:hidden;}
.src-bar-fill{height:100%;border-radius:999px;transition:width .55s ease;}
.src-right{text-align:right;flex-shrink:0;}
.src-count{font-size:18px;font-weight:900;letter-spacing:-.5px;line-height:1;}
.src-pct{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);margin-top:2px;}

/* ── Empty / Loading ── */
.loading{display:flex;align-items:center;justify-content:center;min-height:300px;flex-direction:column;gap:10px;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:11px;color:rgba(255,255,255,.18);font-weight:600;}
.empty{font-size:11px;color:rgba(255,255,255,.16);font-weight:500;padding:16px 0;}

.footer{text-align:center;padding:26px 0 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.07);}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <p class="eyebrow">Shin Supplies · CRM</p>
    <h1 class="h-title">Sales Dashboard</h1>
  </div>
  <div class="h-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" id="rb" onclick="doRefresh()" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
  </div>
</div>

<div id="main">
  <div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div></div>
</div>

<div class="footer">Powered by Opxio</div>

<script>
const _tok = new URLSearchParams(location.search).get('token') || '';
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const PROD_COLORS  = ['#C8FF00','#60A5FA','#C084FC','#FBBF24','#34D399','#F97316'];
const PROD_NAMES   = {'Paper Cup':'Paper Cup','Plastic Cup':'Plastic Cup','Greaseproof Paper':'Grease Paper','PET Can':'PET Can'};
const SRC_MAP = {
  'Iklan Facebook':    { color:'#60A5FA', icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>' },
  'TikTok':           { color:'#E879F9', icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V9.05a8.16 8.16 0 004.77 1.52V7.12a4.85 4.85 0 01-1-.43z"/></svg>' },
  'Threads':          { color:'#F97316', icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.04.569c-1.104-3.96-3.898-5.984-8.304-6.015-2.91.022-5.11.936-6.54 2.717C4.307 6.504 3.616 8.914 3.589 12c.027 3.086.718 5.496 2.057 7.164 1.43 1.783 3.631 2.698 6.54 2.717 2.623-.02 4.358-.631 5.8-2.045 1.647-1.613 1.618-3.593 1.09-4.798-.31-.71-.873-1.3-1.634-1.75-.192 1.352-.622 2.446-1.284 3.272-.886 1.102-2.14 1.704-3.73 1.79-1.202.065-2.361-.218-3.259-.801-1.063-.689-1.685-1.74-1.752-2.964-.065-1.19.408-2.285 1.33-3.082.88-.76 2.119-1.207 3.583-1.291a13.853 13.853 0 012.581.188v-.413c0-1.367-.351-2.47-1.044-3.278-.71-.828-1.808-1.27-3.265-1.317h-.034c-.77 0-2.138.198-3.089 1.675l-1.699-1.07C6.484 2.96 8.33 2.19 10.53 2.103h.05c2.068.047 3.808.724 5.04 2.006.795.834 1.376 1.946 1.668 3.245a7.49 7.49 0 011.734-.202c.7 0 1.378.088 2.022.26C20.61 4.48 18.956 2.59 16.29 1.476 14.67.724 12.782.285 10.529.285h-.014C7.404.307 4.66 1.39 2.772 3.458.87 5.54.005 8.474 0 12c.005 3.527.87 6.461 2.772 8.542 1.888 2.068 4.632 3.151 7.743 3.173h.007c2.252 0 4.14-.44 5.76-1.19 2.666-1.115 4.32-3.005 4.738-5.54a8.4 8.4 0 00.12-1.47c-.001-.527-.05-1.04-.145-1.528a13.72 13.72 0 01-2.022-.26 6.7 6.7 0 01.026.545c0 .362-.024.717-.07 1.063-.296 1.965-1.476 3.375-3.518 4.202-1.32.538-2.896.811-4.705.822zm.24-9.386c-.083 0-.166.002-.25.006-1.064.059-1.908.363-2.448.85-.481.432-.716.99-.681 1.614.034.626.332 1.157.84 1.49.556.36 1.29.527 2.139.481 1.056-.057 1.875-.424 2.433-1.09.514-.614.814-1.51.89-2.663a10.73 10.73 0 00-2.923-.688z"/></svg>' },
  'Rujukan / Kenalan':{ color:'#C8FF00', icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>' },
  'Walk-in':          { color:'#34D399', icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/></svg>' },
  'Lain-lain':        { color:'#9CA3AF', icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>' },
};
function srcColor(name){ return (SRC_MAP[name]||{color:'#9CA3AF'}).color; }
function srcIcon(name){ return (SRC_MAP[name]||SRC_MAP['Lain-lain']).icon; }
const STAGE_COLORS = ['rgba(255,255,255,.12)','rgba(96,165,250,.45)','rgba(251,191,36,.45)','rgba(249,115,22,.45)','rgba(200,255,0,.55)'];
const REP_COLORS   = ['#C8FF00','#60A5FA','#C084FC','#FBBF24','#34D399'];

function initials(n){ return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

function buildDonut(obj, colors, size) {
  const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0)||1;
  const cx=size/2,cy=size/2,ro=size/2-5,ri=ro*0.56;
  let angle=-Math.PI/2;
  return {slices:entries.map(([name,count],i)=>{
    const sweep=(count/total)*Math.PI*2,ea=angle+sweep,large=sweep>Math.PI?1:0;
    const x1=cx+ro*Math.cos(angle),y1=cy+ro*Math.sin(angle);
    const x2=cx+ro*Math.cos(ea),y2=cy+ro*Math.sin(ea);
    const x3=cx+ri*Math.cos(ea),y3=cy+ri*Math.sin(ea);
    const x4=cx+ri*Math.cos(angle),y4=cy+ri*Math.sin(angle);
    const d=`M${x1},${y1} A${ro},${ro} 0 ${large},1 ${x2},${y2} L${x3},${y3} A${ri},${ri} 0 ${large},0 ${x4},${y4}Z`;
    angle=ea; return {name,count,color:colors[i%colors.length],d};
  }),total,cx,cy};
}

function renderDonut(obj,colors,size){
  if(!obj||!Object.keys(obj).length) return '<div class="empty">No data yet</div>';
  const {slices,total,cx,cy}=buildDonut(obj,colors,size);
  const glowId='glow'+Math.random().toString(36).slice(2);
  const svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">
    <defs>
      <filter id="${glowId}"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${slices.map((s,i)=>`<path d="${s.d}" fill="${s.color}" stroke="#222222" stroke-width="2" ${i===0?`filter="url(#${glowId})"`:''}/>`).join('')}
    <text x="${cx}" y="${cy-5}" text-anchor="middle" font-family="Satoshi,sans-serif" font-size="18" font-weight="900" fill="rgba(255,255,255,.88)">${total}</text>
    <text x="${cx}" y="${cy+10}" text-anchor="middle" font-family="Satoshi,sans-serif" font-size="7" font-weight="700" fill="rgba(255,255,255,.2)" letter-spacing="1.5">TOTAL</text>
  </svg>`;
  const legend=slices.map(s=>{
    const pct=Math.round((s.count/total)*100);
    return `<div class="leg-row"><div class="leg-dot" style="background:${s.color};box-shadow:0 0 6px ${s.color}55;"></div><span class="leg-name">${esc(PROD_NAMES[s.name]||s.name)}</span><span class="leg-val">${s.count}</span><span class="leg-pct">${pct}%</span></div>`;
  }).join('');
  return `<div class="donut-wrap">${svg}<div class="donut-legend">${legend}</div></div>`;
}

function renderSources(obj){
  if(!obj||!Object.keys(obj).length) return '<div class="empty">No source data yet</div>';
  const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0)||1;
  const maxVal=entries[0][1]||1;
  return entries.map(([name,count],i)=>{
    const pct=Math.round((count/total)*100),barW=Math.round((count/maxVal)*100);
    const col=srcColor(name), icon=srcIcon(name);
    return `<div class="src-item">
      <span class="src-rank">${i+1}</span>
      <div class="src-icon" style="color:${col};">${icon}</div>
      <div class="src-info">
        <div class="src-name">${esc(name)}</div>
        <div class="src-bar"><div class="src-bar-fill" style="width:${barW}%;background:${col};opacity:.5;"></div></div>
      </div>
      <div class="src-right">
        <div class="src-count" style="color:${col};">${count}</div>
        <div class="src-pct">${pct}%</div>
      </div>
    </div>`;
  }).join('');
}

function renderReps(reps){
  const active=reps.filter(r=>r.name!=='Unassigned');
  if(!active.length) return '<div class="empty">No rep data yet</div>';
  return active.map((r,i)=>{
    const col=REP_COLORS[i%REP_COLORS.length];
    const fuLabel=r.followupsToday===0?'No follow-ups due':r.followupsToday===1?'1 follow-up due today':`${r.followupsToday} follow-ups due today`;
    return `<div class="rep-item">
      <span class="rep-rank">${i+1}</span>
      <div class="rep-av" style="border-color:${col}30;color:${col};">${initials(r.name)}</div>
      <div class="rep-info">
        <div class="rep-name">${esc(r.name)}</div>
        <div class="rep-hint">${fuLabel}</div>
      </div>
      <div class="rep-nums">
        <div class="rep-pill" style="background:${col}12;">
          <div class="rep-pill-val" style="color:${col};">${r.closedWonMTD}</div>
          <div class="rep-pill-lbl">Won MTD</div>
        </div>
        <div class="rep-pill" style="background:rgba(255,255,255,.04);">
          <div class="rep-pill-val" style="color:rgba(255,255,255,.5);">${r.activePipeline}</div>
          <div class="rep-pill-lbl">Active</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function render(d){
  const t1=d.tile1,t2=d.tile2,t3=d.tile3,t4=d.tile4;
  const rate=t1.responseRate2h, rateOk=rate!==null&&rate>=70;
  const rateCol=rateOk?'var(--g)':'var(--red)';
  const avg=t1.avgResponseHours;

  // ── Row 1: Hero + 3 KPI tiles ──

  const row1=`<div class="g-hero row">
    <div class="card hero">
      <span class="hero-eyebrow">New Leads — Last 24 Hours</span>
      <div class="hero-val">${t1.newLeads24h}</div>
      <div class="hero-label">Leads today</div>
      <div class="hero-sub">${t1.newLeadsWeek} received this week · ${d.total} all time</div>
    </div>
    <div class="card kpi">
      <span class="kpi-lbl">Overdue<br>Response</span>
      <div class="kpi-val" style="color:${t1.overdueResponse>0?'var(--red)':'rgba(255,255,255,.18)'};">${t1.overdueResponse}</div>
      <div class="kpi-sub">no quote &gt;2h</div>
    </div>
    <div class="card kpi">
      <span class="kpi-lbl">Pending<br>Quotations</span>
      <div class="kpi-val" style="color:${t2.pendingQuotations>0?'var(--amber)':'rgba(255,255,255,.18)'};">${t2.pendingQuotations}</div>
      <div class="kpi-sub">${t2.overdueQuotations} overdue &gt;24h</div>
    </div>
    <div class="card kpi">
      <span class="kpi-lbl">Follow-ups<br>Due Today</span>
      <div class="kpi-val" style="color:${t3.followupsToday>0?'var(--blue)':'rgba(255,255,255,.18)'};">${t3.followupsToday}</div>
      <div class="kpi-sub">${t3.followupsNext3Days} next 3 days</div>
    </div>
  </div>`;

  // ── Row 2: Pipeline (bigger) + Response Speed ──
  const funnel=t4.stageFunnel||[], fMax=Math.max(...funnel.map(s=>s.count),1);
  const fRows=funnel.filter(s=>s.count>0||true).map((s,i)=>{
    const w=Math.max(Math.round((s.count/fMax)*100),s.count>0?3:0);
    return `<div class="f-item">
      <span class="f-lbl">${esc(s.stage)}</span>
      <div class="f-track"><div class="f-fill" style="width:${w}%;background:${STAGE_COLORS[i]||'rgba(200,255,0,.4)'};"></div></div>
      <span class="f-n">${s.count}</span>
    </div>`;
  }).join('');

  let speedDisplay='';
  if(avg!==null){
    const h=Math.floor(avg), m=Math.round((avg-h)*60);
    const timeStr=h>0?`${h}h ${m}m`:`${m}m`;
    const speedCol=avg<=2?'var(--g)':'var(--red)';
    speedDisplay=`
      <div class="speed-row">
        <div class="speed-big" style="color:${speedCol};">${timeStr}</div>
        <div class="speed-meta">
          <div class="speed-tag" style="background:${speedCol}15;color:${speedCol};border:1px solid ${speedCol}30;">${rateOk?'On target':'Needs attention'}</div>
          <div class="speed-desc">${t1.responded2h} of ${t1.eligibleResponse} leads<br>quoted within 2 hours</div>
        </div>
      </div>
      <div class="rate-track"><div class="rate-fill" style="width:${rate||0}%;background:${speedCol};"></div></div>
      <div class="rate-meta"><span>Target: under 2h · 70%+</span><span style="color:${t1.overdueResponse>0?'var(--red)':'rgba(200,255,0,.4)'};">${t1.overdueResponse>0?t1.overdueResponse+' overdue now':'All clear'}</span></div>`;
  } else if(rate!==null){
    speedDisplay=`
      <div class="speed-row">
        <div class="speed-big" style="color:${rateCol};">${rate}%</div>
        <div class="speed-meta">
          <div class="speed-tag" style="background:${rateCol}15;color:${rateCol};border:1px solid ${rateCol}30;">${rateOk?'On target':'Needs attention'}</div>
          <div class="speed-desc">${t1.responded2h} of ${t1.eligibleResponse} leads<br>quoted within 2 hours</div>
        </div>
      </div>
      <div class="rate-track"><div class="rate-fill" style="width:${rate||0}%;background:${rateCol};"></div></div>
      <div class="rate-meta"><span>Target: 70%+</span><span style="color:${t1.overdueResponse>0?'var(--red)':'rgba(200,255,0,.4)'};">${t1.overdueResponse>0?t1.overdueResponse+' overdue now':'All clear'}</span></div>`;
  } else {
    speedDisplay='<div class="empty">No response data yet — will populate as leads come in</div>';
  }

  const row2=`<div class="g2 row">
    <div class="card panel">
      <div class="panel-hdr">
        <span class="panel-title">Pipeline Stages</span>
        <span class="badge">${t4.closedWonMTD} closed won MTD</span>
      </div>
      ${fRows||'<div class="empty">No pipeline data yet</div>'}
    </div>
    <div class="card panel">
      <div class="panel-hdr">
        <span class="panel-title">Response Speed</span>
        ${rate!==null?`<span class="badge ${rateOk?'':'red'}">${rate}% within 2h</span>`:''}
      </div>
      ${speedDisplay}
    </div>
  </div>`;

  // ── Row 3: Rep leaderboard ──
  const reps=(d.repBreakdown||[]).filter(r=>r.name!=='Unassigned');
  const row3=reps.length?`<div class="row">
    <div class="card panel">
      <div class="panel-hdr">
        <span class="panel-title">Sales Rep Performance</span>
        <span class="badge blue">${reps.length} rep${reps.length!==1?'s':''}</span>
      </div>
      ${renderReps(d.repBreakdown||[])}
    </div>
  </div>`:'';

  // ── Row 4: Product + Sources ──
  const prodTotal=Object.values(d.productBreakdown||{}).reduce((s,n)=>s+n,0)||0;
  const srcTotal=Object.values(d.sourceBreakdown||{}).reduce((s,n)=>s+n,0)||0;

  const hasProd=prodTotal>0, hasSrc=srcTotal>0;
  let row4='';
  if(hasProd||hasSrc){
    row4=`<div class="${hasProd&&hasSrc?'g2-eq':'g2'} row">
      ${hasProd?`<div class="card panel">
        <div class="panel-hdr"><span class="panel-title">Product Breakdown</span><span class="badge">${prodTotal} enquiries</span></div>
        ${renderDonut(d.productBreakdown,PROD_COLORS,124)}
      </div>`:''}
      ${hasSrc?`<div class="card panel">
        <div class="panel-hdr"><span class="panel-title">Lead Sources</span><span class="badge">${srcTotal} total</span></div>
        ${renderSources(d.sourceBreakdown)}
      </div>`:''}
    </div>`;
  }

  document.getElementById('main').innerHTML=row1+row2+row3+row4;
  document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

async function load(){
  try{
    const r=await fetch('/api/clients/shin-supplies/enquiry-stats'+(_tok?'?token='+_tok:''));
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="loading"><div style="color:var(--red);font-size:12px;font-weight:700;">Failed — ${esc(e.message)}</div></div>`;
  }
}
function doRefresh(){const b=document.getElementById('rb');if(b)b.classList.add('spinning');load().finally(()=>{const b2=document.getElementById('rb');if(b2)b2.classList.remove('spinning');});}
load();
setInterval(load,3*60*1000);
</script>
</body>
</html>
