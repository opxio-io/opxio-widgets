<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Sales Pipeline</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;background:#191919;color:#fff;padding:16px 16px 32px;overflow-y:auto;overflow-x:hidden;}
:root{--g:#C8FF00;--gd:#AAFF00;--gm:rgba(200,255,0,.1);--gb:rgba(200,255,0,.22);--red:#FF6B6B;--amber:#FBBF24;--blue:#60A5FA;--purple:#C084FC;--teal:#34D399;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px;}

/* ── Top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.brand{font-size:13px;font-weight:900;letter-spacing:-.02em;color:rgba(255,255,255,.9);}
.mon-pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 10px;gap:0;}
.mon-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:14px;cursor:pointer;padding:0 5px;line-height:1;transition:color .15s;}
.mon-btn:hover:not(:disabled){color:var(--g);}
.mon-btn:disabled{opacity:.25;cursor:default;}
.mon-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);min-width:68px;text-align:center;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn svg{width:13px;height:13px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ts{font-size:10px;font-weight:500;color:rgba(255,255,255,.18);}

/* ── Grid layouts ── */
.row{margin-bottom:10px;}
.g4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;}
.g2-main{display:grid;grid-template-columns:3fr 2fr;gap:10px;}
.g3{display:grid;grid-template-columns:2fr 1.5fr 1.5fr;gap:10px;}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr;}.g2-main{grid-template-columns:1fr;}.g3{grid-template-columns:1fr;}}

/* ── Cards ── */
.card{background:#222;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:20px 22px 18px;}
.card-hero{background:var(--g);border:none;border-radius:14px;padding:20px 22px 18px;position:relative;overflow:hidden;}
.card-hero::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(0,0,0,.08);top:-60px;right:-40px;}
.card-hero::after{content:'';position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(0,0,0,.05);bottom:-30px;right:60px;}

/* ── Hero stat ── */
.hero-eyebrow{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.5);margin-bottom:12px;display:block;position:relative;z-index:1;}
.hero-val{font-size:52px;font-weight:900;letter-spacing:-3px;line-height:1;color:#000;position:relative;z-index:1;}
.hero-sub{font-size:11px;font-weight:600;color:rgba(0,0,0,.5);margin-top:10px;position:relative;z-index:1;}

/* ── Small KPI ── */
.kpi-lbl{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:16px;display:block;}
.kpi-val{font-size:42px;font-weight:900;letter-spacing:-2px;line-height:1;}
.kpi-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,.35);margin-top:8px;}

/* ── Panel header ── */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.ph-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:-.01em;}
.ph-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.09);}
.ph-badge.green{background:var(--gm);color:var(--g);border-color:var(--gb);}

/* ── Pipeline funnel ── */
.f-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.f-row:last-child{margin-bottom:0;}
.f-name{font-size:11px;font-weight:600;color:rgba(255,255,255,.45);width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-track{flex:1;height:20px;background:rgba(255,255,255,.04);border-radius:5px;overflow:hidden;}
.f-fill{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.f-count{font-size:12px;font-weight:800;color:rgba(255,255,255,.55);width:22px;text-align:right;flex-shrink:0;}
.f-divider{height:1px;background:rgba(255,255,255,.05);margin:12px 0;}
.f-dropped{display:flex;align-items:center;gap:16px;padding-top:4px;}
.f-drop-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);}
.f-drop-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(255,107,107,.1);color:var(--red);}

/* ── Action items ── */
.action-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.action-row:last-child{border-bottom:none;}
.action-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.action-info{flex:1;min-width:0;}
.action-name{font-size:12px;font-weight:700;color:rgba(255,255,255,.82);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.action-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,.3);margin-top:2px;}
.action-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;flex-shrink:0;}
.action-empty{font-size:11px;color:rgba(255,255,255,.2);font-weight:500;padding:8px 0;}

/* ── Line chart ── */
.chart-wrap{position:relative;width:100%;margin-top:4px;}
.chart-wrap svg{width:100%;display:block;}
.chart-xaxis{display:flex;justify-content:space-between;margin-top:8px;padding:0 2px;}
.chart-xaxis span{font-size:9px;font-weight:600;color:rgba(255,255,255,.22);flex:1;text-align:center;}
.chart-xaxis span.cur{color:var(--g);font-weight:800;}

/* ── Lead sources ── */
.src-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.src-row:last-child{border-bottom:none;}
.src-icon-wrap{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.src-icon-wrap img{width:16px;height:16px;object-fit:contain;}
.src-icon-fallback{font-size:12px;}
.src-name{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);flex:1;}
.src-count{font-size:16px;font-weight:900;color:#fff;letter-spacing:-.5px;flex-shrink:0;}
.src-closed-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(200,255,0,.1);color:var(--g);flex-shrink:0;}
.src-closed-pill.zero{background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);}

/* ── Deal stage panel ── */
.ds-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.ds-row:last-child{border-bottom:none;}
.ds-stage{font-size:11px;font-weight:600;color:rgba(255,255,255,.45);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ds-bar-wrap{width:90px;flex-shrink:0;}
.ds-bar-track{height:5px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;}
.ds-bar-fill{height:5px;border-radius:999px;transition:width .7s ease;}
.ds-count{font-size:13px;font-weight:900;color:rgba(255,255,255,.7);width:20px;text-align:right;flex-shrink:0;}

/* ── Loading ── */
.loading{display:flex;align-items:center;justify-content:center;min-height:280px;flex-direction:column;gap:10px;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.ld-txt{font-size:11px;color:rgba(255,255,255,.2);font-weight:600;}

.footer{text-align:center;padding:24px 0 2px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.08);}

/* Light mode */
body.light{background:#F0F0F0;color:#111;}
body.light .card{background:#fff;border-color:rgba(0,0,0,.07);}
body.light .kpi-lbl{color:rgba(0,0,0,.4);}
body.light .kpi-sub{color:rgba(0,0,0,.35);}
body.light .kpi-val{color:#111;}
body.light .ph-title{color:#111;}
body.light .ph-badge{background:rgba(0,0,0,.05);color:rgba(0,0,0,.45);border-color:rgba(0,0,0,.09);}
body.light .f-name{color:rgba(0,0,0,.45);}
body.light .f-track{background:rgba(0,0,0,.06);}
body.light .f-count{color:rgba(0,0,0,.5);}
body.light .f-divider{background:rgba(0,0,0,.06);}
body.light .f-drop-lbl{color:rgba(0,0,0,.3);}
body.light .action-row{border-color:rgba(0,0,0,.05);}
body.light .action-name{color:rgba(0,0,0,.8);}
body.light .action-sub{color:rgba(0,0,0,.35);}
body.light .action-empty{color:rgba(0,0,0,.3);}
body.light .src-row{border-color:rgba(0,0,0,.05);}
body.light .src-icon-wrap{background:rgba(0,0,0,.05);}
body.light .src-name{color:rgba(0,0,0,.65);}
body.light .src-count{color:#111;}
body.light .ds-row{border-color:rgba(0,0,0,.05);}
body.light .ds-stage{color:rgba(0,0,0,.45);}
body.light .ds-bar-track{background:rgba(0,0,0,.07);}
body.light .ds-count{color:rgba(0,0,0,.65);}
body.light .mon-pill{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1);}
body.light .mon-btn{color:rgba(0,0,0,.45);}
body.light .mon-lbl{color:rgba(0,0,0,.65);}
body.light .icon-btn{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.09);color:rgba(0,0,0,.5);}
body.light .ts{color:rgba(0,0,0,.25);}
body.light .brand{color:#111;}
body.light .footer{color:rgba(0,0,0,.12);}
body.light .chart-xaxis span{color:rgba(0,0,0,.3);}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-left">
    <span class="brand">Opxio</span>
    <div class="mon-pill">
      <button class="mon-btn" onclick="mnPrev()">&#8249;</button>
      <span class="mon-lbl" id="mn-lbl"></span>
      <button class="mon-btn" id="mn-next" onclick="mnNext()" disabled>&#8250;</button>
    </div>
  </div>
  <div class="topbar-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" id="mb" onclick="toggleMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <button class="icon-btn" id="rb" onclick="doRefresh()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
</div>

<div id="main">
  <div class="loading"><div class="spinner"></div><div class="ld-txt">Loading pipeline</div></div>
</div>

<div class="footer">Opxio.io</div>

<script>
const _tok = new URLSearchParams(location.search).get('token') || '';
const _now  = new Date();
let filterMonth = null;

const SRC_ICONS = {
  'LinkedIn':          'https://widgets.opxio.io/icons/social/linkedin.png',
  'Referral':          'https://widgets.opxio.io/icons/social/referral.png',
  'WhatsApp':          'https://widgets.opxio.io/icons/social/whatsapp.png',
  'Threads':           'https://widgets.opxio.io/icons/social/threads.png',
  'Instagram':         'https://widgets.opxio.io/icons/social/instagram.png',
  'TikTok':            'https://widgets.opxio.io/icons/social/tiktok.png',
  'Cold Outreach':     'https://widgets.opxio.io/icons/social/other-sources.png',
  'Website / Organic': 'https://widgets.opxio.io/icons/social/other-sources.png',
  'Ads':               'https://widgets.opxio.io/icons/social/other-sources.png',
  'Notion Marketplace':'https://widgets.opxio.io/icons/social/other-sources.png',
};
const LEAD_COLORS = [
  'rgba(255,255,255,.13)',
  'rgba(200,255,0,.22)',
  'rgba(200,255,0,.35)',
  'rgba(200,255,0,.5)',
  'rgba(200,255,0,.65)',
  'rgba(200,255,0,.85)',
];
const DEAL_COLORS = ['rgba(96,165,250,.5)','rgba(192,132,252,.5)','rgba(251,191,36,.5)','rgba(249,115,22,.5)','rgba(200,255,0,.8)'];

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtRM(n){ if(n>=1000000) return 'RM '+(n/1000000).toFixed(1)+'M'; if(n>=1000) return 'RM '+(n/1000).toFixed(0)+'K'; return n?'RM '+n:'—'; }
function fmtMon(fm){ const d=fm?new Date(fm.year,fm.month,1):new Date(); return d.toLocaleString('default',{month:'long',year:'numeric'}); }
function fmtMonShort(fm){ const d=fm?new Date(fm.year,fm.month,1):new Date(); return d.toLocaleString('default',{month:'short',year:'numeric'}); }

function updateNav(){
  document.getElementById('mn-lbl').textContent = fmtMonShort(filterMonth);
  const isCur=!filterMonth||(filterMonth.year===_now.getFullYear()&&filterMonth.month===_now.getMonth());
  document.getElementById('mn-next').disabled=isCur;
}
function mnPrev(){ if(!filterMonth) filterMonth={year:_now.getFullYear(),month:_now.getMonth()}; filterMonth.month--; if(filterMonth.month<0){filterMonth.month=11;filterMonth.year--;} updateNav(); load(); }
function mnNext(){ if(!filterMonth) return; filterMonth.month++; if(filterMonth.month>11){filterMonth.month=0;filterMonth.year++;} if(filterMonth.year>_now.getFullYear()||(filterMonth.year===_now.getFullYear()&&filterMonth.month>=_now.getMonth())) filterMonth=null; updateNav(); load(); }

// ── SVG Line Chart ────────────────────────────────────────────────────────
function renderLineChart(trend) {
  const W=520, H=90, pL=6, pR=6, pT=10, pB=4;
  const cW=W-pL-pR, cH=H-pT-pB;
  const vals = trend.map(t=>t.count);
  const maxV = Math.max(...vals, 1);
  const pts  = vals.map((v,i) => ({
    x: pL + (i/(vals.length-1))*cW,
    y: pT + (1 - v/maxV)*cH
  }));

  // Smooth bezier path
  let path = `M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const cp1x=pts[i-1].x+(pts[i].x-pts[i-1].x)*0.4;
    const cp1y=pts[i-1].y;
    const cp2x=pts[i].x-(pts[i].x-pts[i-1].x)*0.4;
    const cp2y=pts[i].y;
    path+=` C${cp1x},${cp1y} ${cp2x},${cp2y} ${pts[i].x},${pts[i].y}`;
  }
  const areaPath=path+` L${pts[pts.length-1].x},${pT+cH} L${pts[0].x},${pT+cH} Z`;

  const dots = pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?'var(--g)':'rgba(200,255,0,.6)'}" stroke="${i===pts.length-1?'#191919':'none'}" stroke-width="2"/>`).join('');

  const svgId = 'cg_'+Math.random().toString(36).slice(2,7);
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px;">
      <defs>
        <linearGradient id="${svgId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#C8FF00" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#C8FF00" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#${svgId})"/>
      <path d="${path}" fill="none" stroke="var(--g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div class="chart-xaxis">
      ${trend.map((t,i)=>`<span${i===trend.length-1?' class="cur"':''}>${esc(t.label)}</span>`).join('')}
    </div>
  </div>`;
}

// ── Renderers ─────────────────────────────────────────────────────────────
function renderFunnel(items, colors, showDivider, dropped) {
  const max = Math.max(...items.map(i=>i.count), 1);
  const rows = items.map((item,idx) => {
    const w = item.count>0 ? Math.max(Math.round((item.count/max)*100),2) : 0;
    return `<div class="f-row">
      <span class="f-name">${esc(item.stage)}</span>
      <div class="f-track"><div class="f-fill" style="width:${w}%;background:${colors[idx]||colors[colors.length-1]};"></div></div>
      <span class="f-count">${item.count}</span>
    </div>`;
  }).join('');

  let footer = '';
  if (showDivider && dropped !== undefined) {
    footer = `<div class="f-divider"></div>
      <div class="f-dropped">
        <span class="f-drop-lbl">Dropped this period</span>
        <span class="f-drop-pill">Unqualified ${dropped.unqualified||0}</span>
      </div>`;
  }
  return rows + footer;
}

function renderActions(actions) {
  const rows = [];
  for (const name of (actions.hotLeads||[])) {
    rows.push({ dot:'var(--red)', name, sub:'Hot lead', tag:'HOT', tagBg:'rgba(255,107,107,.12)', tagCol:'var(--red)' });
  }
  for (const d of (actions.stalledDeals||[])) {
    rows.push({ dot:'var(--amber)', name:d.name, sub:d.stage, tag:`${d.daysStale}d stale`, tagBg:'rgba(251,191,36,.12)', tagCol:'var(--amber)' });
  }
  for (const f of (actions.followupDue||[])) {
    rows.push({ dot:'var(--blue)', name:f.name, sub:'Follow-up overdue', tag:'Follow up', tagBg:'rgba(96,165,250,.12)', tagCol:'var(--blue)' });
  }
  if (!rows.length) return `<div class="action-empty">No actions needed — pipeline looks clean</div>`;
  return rows.map(r=>`<div class="action-row">
    <div class="action-dot" style="background:${r.dot};"></div>
    <div class="action-info">
      <div class="action-name">${esc(r.name)}</div>
      <div class="action-sub">${esc(r.sub)}</div>
    </div>
    <span class="action-tag" style="background:${r.tagBg};color:${r.tagCol};">${esc(r.tag)}</span>
  </div>`).join('');
}

function renderSources(obj) {
  if (!obj || !Object.keys(obj).length) return `<div class="action-empty">No source data yet</div>`;
  const entries = Object.entries(obj).sort((a,b)=>b[1].leads-a[1].leads).slice(0,6);
  return entries.map(([name,{leads,closed}])=>{
    const icon = SRC_ICONS[name];
    const iconEl = icon
      ? `<img src="${icon}" width="16" height="16" onerror="this.style.display='none'">`
      : `<span class="src-icon-fallback">●</span>`;
    return `<div class="src-row">
      <div class="src-icon-wrap">${iconEl}</div>
      <span class="src-name">${esc(name)}</span>
      <span class="src-count">${leads}</span>
      <span class="src-closed-pill${closed===0?' zero':''}">${closed} closed</span>
    </div>`;
  }).join('');
}

function renderDealStages(funnel) {
  const max = Math.max(...funnel.map(f=>f.count),1);
  return funnel.map((f,i)=>{
    const w = Math.round((f.count/max)*100);
    return `<div class="ds-row">
      <span class="ds-stage">${esc(f.stage)}</span>
      <div class="ds-bar-wrap"><div class="ds-bar-track"><div class="ds-bar-fill" style="width:${w}%;background:${DEAL_COLORS[i]||DEAL_COLORS[DEAL_COLORS.length-1]};"></div></div></div>
      <span class="ds-count">${f.count}</span>
    </div>`;
  }).join('');
}

// ── Main render ───────────────────────────────────────────────────────────
function render(d) {
  const kpi = d.kpi || {};
  const mon = fmtMonShort(filterMonth);
  const convCol = kpi.convRate>=30?'var(--g)':kpi.convRate>0?'var(--amber)':'rgba(255,255,255,.25)';

  // Row 1 — KPIs
  const row1 = `<div class="g4 row">
    <div class="card-hero">
      <span class="hero-eyebrow">New Leads — ${mon}</span>
      <div class="hero-val">${kpi.newLeadsMTD??0}</div>
      <div class="hero-sub">Leads this month</div>
    </div>
    <div class="card">
      <span class="kpi-lbl">Closed Won</span>
      <div class="kpi-val" style="color:${kpi.closedWonMTD>0?'var(--g)':'rgba(255,255,255,.2)'};">${kpi.closedWonMTD??0}</div>
      <div class="kpi-sub">Deals won</div>
    </div>
    <div class="card">
      <span class="kpi-lbl">Conversion Rate</span>
      <div class="kpi-val" style="color:${convCol};">${kpi.convRate??0}%</div>
      <div class="kpi-sub">Leads → Converted</div>
    </div>
    <div class="card">
      <span class="kpi-lbl">Pipeline Value</span>
      <div class="kpi-val" style="font-size:28px;letter-spacing:-1px;color:var(--blue);">${fmtRM(kpi.pipelineValue)}</div>
      <div class="kpi-sub">Active leads</div>
    </div>
  </div>`;

  // Row 2 — Funnel + Actions
  const row2 = `<div class="g2-main row">
    <div class="card">
      <div class="ph">
        <span class="ph-title">Pipeline Funnel</span>
        <span class="ph-badge green">Current month leads</span>
      </div>
      ${renderFunnel(d.leadFunnel||[], LEAD_COLORS, true, d.dropped)}
    </div>
    <div class="card">
      <div class="ph">
        <span class="ph-title">Action Items</span>
        ${(d.actions?.hotLeads?.length||d.actions?.stalledDeals?.length||d.actions?.followupDue?.length)?`<span class="ph-badge" style="background:rgba(255,107,107,.1);color:var(--red);border-color:rgba(255,107,107,.2);">Needs attention</span>`:''}
      </div>
      ${renderActions(d.actions||{})}
    </div>
  </div>`;

  // Row 3 — Chart + Sources + Deal stages
  const totalSrcLeads = Object.values(d.sourceBreakdown||{}).reduce((s,v)=>s+(v.leads||0),0);
  const row3 = `<div class="g3 row">
    <div class="card">
      <div class="ph">
        <span class="ph-title">Leads Incoming by Month</span>
        <span class="ph-badge green">${d.totals?.leads||0} leads total</span>
      </div>
      ${renderLineChart(d.monthlyTrend||[])}
    </div>
    <div class="card">
      <div class="ph">
        <span class="ph-title">Lead Sources</span>
        <span class="ph-badge">${fmtMonShort(filterMonth)}</span>
      </div>
      ${renderSources(d.sourceBreakdown)}
    </div>
    <div class="card">
      <div class="ph">
        <span class="ph-title">Deal Pipeline</span>
        <span class="ph-badge">${kpi.openDeals||0} open · ${fmtRM(kpi.pipelineValue)}</span>
      </div>
      ${renderDealStages(d.dealFunnel||[])}
    </div>
  </div>`;

  document.getElementById('main').innerHTML = row1 + row2 + row3;
  document.getElementById('ts').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

let _light=false;
function toggleMode(){ _light=!_light; document.body.classList.toggle('light',_light); }

let _ctrl=null;
async function load(){
  if(_ctrl) _ctrl.abort();
  _ctrl=new AbortController();
  const sig=_ctrl.signal;
  const rb=document.getElementById('rb');
  if(rb) rb.classList.add('spinning');
  try{
    const p=new URLSearchParams();
    if(_tok) p.set('token',_tok);
    if(filterMonth){ p.set('month',filterMonth.month); p.set('year',filterMonth.year); }
    const r=await fetch('https://api.opxio.io/api/clients/opxio/sales-pipeline?'+p.toString(),{signal:sig});
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){
    if(e.name==='AbortError') return;
    document.getElementById('main').innerHTML=`<div class="loading"><div style="color:var(--red);font-size:12px;font-weight:700;">Failed — ${esc(e.message)}</div></div>`;
  }finally{
    if(!sig.aborted){ const b=document.getElementById('rb'); if(b) b.classList.remove('spinning'); }
  }
}
function doRefresh(){ load(); }

updateNav();
load();
setInterval(load, 3*60*1000);
</script>
