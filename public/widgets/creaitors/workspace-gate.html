<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Workspace Gate</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 28px;background:#191919;color:#fff;overflow-y:auto;overflow-x:hidden;height:100%;display:flex;align-items:center;justify-content:center;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.12);--gb:rgba(170,255,0,.18);--muted:rgba(255,255,255,.4);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;}

.gate{width:100%;max-width:420px;}

/* Card */
.card{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:28px;transition:border-color .2s;}
.card:hover{border-color:rgba(170,255,0,.08);}

/* Header inside card */
.card-hdr{text-align:center;margin-bottom:20px;}
.card-hdr .icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;transition:all .15s;}
.card-hdr .icon svg{width:18px;height:18px;stroke:var(--g);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:4px;}
.h-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.03em;}

/* Fields */
.field{margin-bottom:14px;}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;display:block;}

.field select,
.field input{
  width:100%;padding:12px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  color:#fff;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:500;
  outline:none;
  transition:all .15s;
  -webkit-appearance:none;appearance:none;
}
.field select{
  cursor:pointer;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 14px center;
  padding-right:34px;
}
.field select option{background:#1E1E1E;color:#fff;}
.field select optgroup{color:rgba(255,255,255,.3);font-weight:700;font-size:11px;}
.field input::placeholder{color:rgba(255,255,255,.2);}
.field select:focus,.field input:focus{border-color:rgba(170,255,0,.2);background:rgba(170,255,0,.08);}

/* Button — matches icon-btn hover pattern */
.btn{
  width:100%;padding:12px 14px;
  background:var(--gm);
  border:1px solid var(--gb);
  border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:700;
  color:var(--g);
  cursor:pointer;
  transition:all .15s;
  margin-top:6px;
  letter-spacing:-.01em;
}
.btn:hover{background:rgba(170,255,0,.18);}
.btn:active{background:rgba(170,255,0,.25);}
.btn:disabled{opacity:.2;cursor:not-allowed;}

/* Messages */
.msg{font-size:11px;font-weight:600;margin-top:12px;text-align:center;opacity:0;transition:opacity .2s;color:#FF6B6B;}
.msg.visible{opacity:1;}

/* Success state */
.success-state{text-align:center;}
.success-state .check{width:48px;height:48px;border-radius:12px;background:var(--gm);border:1px solid var(--gb);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
.success-state .check svg{width:24px;height:24px;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.success-state .welcome{font-size:22px;font-weight:900;letter-spacing:-.03em;color:#fff;margin-bottom:2px;}
.success-state .verified{font-size:11px;font-weight:600;color:rgba(170,255,0,.5);margin-bottom:18px;}

.open-link{
  display:block;width:100%;padding:14px;
  background:var(--g);
  border:none;border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:800;
  color:#191919;
  text-decoration:none;text-align:center;
  transition:opacity .15s;
  letter-spacing:-.01em;
}
.open-link:hover{opacity:.85;}

/* Footer */
.wgt-footer{text-align:center;padding:16px 0 2px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
</style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="card">
      <div class="card-hdr">
        <div class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            <circle cx="12" cy="16.5" r="1.5"/>
          </svg>
        </div>
        <div class="eyebrow">Creaitors</div>
        <div class="h-title">Team Workspace</div>
      </div>

      <form id="gateForm">
        <div class="field">
          <span class="field-label">Name</span>
          <select id="staffSelect">
            <option value="" disabled selected>Choose your name</option>
          </select>
        </div>
        <div class="field">
          <span class="field-label">Password</span>
          <input type="password" id="passInput" placeholder="Enter your password" autocomplete="off"/>
        </div>
        <button type="submit" class="btn" id="enterBtn" disabled>Enter Workspace</button>
      </form>
      <p class="msg" id="msgEl">Wrong password. Try again.</p>
    </div>
    <div class="wgt-footer">Widgets by Opxio.io</div>
  </div>

<script>
const STAFF = [
  { name: 'Maisarah',       dept: 'Content Creator',  page: 'https://www.notion.so/502736ebbe34829aada981e516950457', pw: 'maisarah2026' },
  { name: 'Firdaus',        dept: 'Content Creator',  page: 'https://www.notion.so/e0c736ebbe3483b685990149c8c57a64', pw: 'firdaus2026' },
  { name: 'Sufyan Habib',   dept: 'Content Creator',  page: 'https://www.notion.so/27a736ebbe3482eeb662814a0a7f9c93', pw: 'sufyan2026' },
  { name: 'Hendra Gumilar', dept: 'Videographer',     page: 'https://www.notion.so/4b3736ebbe348283a75b01c0f12d9587', pw: 'hendra2026' },
  { name: 'Richard',        dept: 'Videographer',     page: 'https://www.notion.so/0ff736ebbe348340bdaf81d516956d7b', pw: 'richard2026' },
  { name: 'Rifki Purnama',  dept: 'Videographer',     page: 'https://www.notion.so/bd3736ebbe3482bd9b4781b0689119ea', pw: 'rifki2026' },
  { name: 'Aina Zahara',    dept: 'KOL Marketing',    page: 'https://www.notion.so/401736ebbe34822cb60a0115a5a4722d', pw: 'aina2026' },
];

const select = document.getElementById('staffSelect');
const depts = {};
STAFF.forEach((s, i) => {
  if (!depts[s.dept]) depts[s.dept] = [];
  depts[s.dept].push({ ...s, index: i });
});
Object.entries(depts).forEach(([dept, members]) => {
  const group = document.createElement('optgroup');
  group.label = dept;
  members.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.index;
    opt.textContent = m.name;
    group.appendChild(opt);
  });
  select.appendChild(group);
});

const passInput = document.getElementById('passInput');
const enterBtn = document.getElementById('enterBtn');
function checkReady() {
  enterBtn.disabled = !(select.value && passInput.value);
}
select.addEventListener('change', checkReady);
passInput.addEventListener('input', checkReady);

document.getElementById('gateForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const msgEl = document.getElementById('msgEl');
  const idx = parseInt(select.value);
  const staff = STAFF[idx];
  if (!staff) return;

  if (passInput.value === staff.pw) {
    document.querySelector('.card').innerHTML = `
      <div class="success-state">
        <div class="check">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="welcome">${escapeHtml(staff.name)}</div>
        <div class="verified">Access verified</div>
        <a href="${staff.page}" target="_blank" rel="noopener" class="open-link">Open Workspace</a>
      </div>
    `;
  } else {
    msgEl.classList.add('visible');
    passInput.value = '';
    passInput.focus();
    checkReady();
    setTimeout(() => msgEl.classList.remove('visible'), 2500);
  }
});

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
