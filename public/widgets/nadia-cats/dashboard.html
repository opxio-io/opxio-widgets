<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cat Health HQ</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Satoshi',-apple-system,sans-serif;background:#191919;color:#fff;padding:20px 18px 52px;min-height:100vh;}
:root{
  --g:#C8FF00;
  --muted:rgba(255,255,255,.4);
  --faint:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);
  --card:#232323;
  --amber:#FBBF24;--blue:#60A5FA;--red:#FF6B6B;--teal:#34D399;--purple:#C084FC;
}

/* Base */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.hdr-title{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;}
.ts{font-size:11px;color:rgba(255,255,255,.2);margin-top:3px;}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--faint);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.icon-btn:hover{background:rgba(200,255,0,.08);border-color:rgba(200,255,0,.25);color:var(--g);}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
.icon-btn svg{width:15px;height:15px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Cat nav */
.cat-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;}
.cat-pill{padding:8px 20px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--border);background:var(--faint);color:var(--muted);cursor:pointer;transition:all .15s;}
.cat-pill:hover{border-color:rgba(200,255,0,.3);color:var(--g);}
.cat-pill.active{background:var(--g);border-color:var(--g);color:#191919;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.badge-green{background:rgba(52,211,153,.12);color:var(--teal);}
.badge-blue{background:rgba(96,165,250,.1);color:var(--blue);}
.badge-purple{background:rgba(192,132,252,.1);color:var(--purple);}
.badge-amber{background:rgba(251,191,36,.1);color:var(--amber);}
.badge-red{background:rgba(255,107,107,.12);color:var(--red);}
.badge-gray{background:var(--faint);color:var(--muted);}

/* Cat hero */
.cat-hero{margin-bottom:14px;}
.cat-name{font-size:42px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-bottom:10px;}
.cat-badges{display:flex;flex-wrap:wrap;gap:6px;}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
@media(max-width:400px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{padding:16px 14px;}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;}
.kpi-val{font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px;}
.lime{color:var(--g);}
.amber-c{color:var(--amber);}
.teal-c{color:var(--teal);}
.purple-c{color:var(--purple);}
.dim{color:rgba(255,255,255,.18);}

/* GS Progress */
.gs-card{padding:20px 20px 18px;margin-bottom:12px;}
.gs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:14px;}
.gs-big{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.gs-day-num{font-size:56px;font-weight:900;letter-spacing:-.05em;color:var(--g);line-height:1;}
.gs-day-of{font-size:20px;font-weight:600;color:rgba(255,255,255,.25);}
.gs-bar-outer{height:10px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;margin-bottom:9px;}
.gs-bar-inner{height:100%;border-radius:999px;background:var(--g);transition:width .5s;}
.gs-dates{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;}
.gs-note{font-size:12px;color:var(--amber);margin-top:10px;padding:10px 14px;background:rgba(251,191,36,.07);border-radius:10px;border:1px solid rgba(251,191,36,.15);}
.gs-detail{font-size:13px;color:var(--muted);margin-top:10px;}

/* Next appt */
.appt-bar{padding:13px 16px;border-radius:12px;background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.14);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.appt-lbl{font-size:11px;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.08em;}
.appt-date{font-size:15px;font-weight:700;color:var(--blue);}

/* Emergency */
.emergency{padding:14px 16px;border-radius:12px;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.2);margin-bottom:12px;}
.emergency-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,107,107,.55);margin-bottom:4px;}
.emergency-text{font-size:14px;color:var(--red);font-weight:600;}

/* Section card */
.section{padding:18px 18px 16px;margin-bottom:12px;}
.section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:14px;}

/* Med list */
.med-row{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.med-row:last-child{border-bottom:none;padding-bottom:0;}
.med-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.dot-gs{background:var(--purple);}
.dot-support{background:var(--blue);}
.dot-other{background:var(--amber);}
.med-name{font-size:15px;font-weight:700;line-height:1.3;}
.med-detail{font-size:12px;color:var(--muted);margin-top:3px;}
.no-data{font-size:13px;color:rgba(255,255,255,.2);}

/* Two-col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
@media(max-width:520px){.two-col{grid-template-columns:1fr;}}

/* Row items */
.row-item{display:flex;align-items:flex-start;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:8px;}
.row-item:last-child{border-bottom:none;padding-bottom:0;}
.row-main{font-size:13px;font-weight:600;line-height:1.3;}
.row-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.row-right{text-align:right;flex-shrink:0;}
.row-date{font-size:11px;color:var(--muted);}
.row-val{font-size:16px;font-weight:700;}

/* Loading / error */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:14px;color:var(--muted);font-size:14px;}
.spin-ring{width:30px;height:30px;border:2px solid rgba(255,255,255,.08);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.error-box{padding:24px;border-radius:14px;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.2);color:var(--red);font-size:13px;text-align:center;line-height:1.6;}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">Cat Health HQ</div>
    <div class="ts" id="ts">Loading…</div>
  </div>
  <button class="icon-btn" id="refreshBtn" onclick="refresh()" title="Refresh">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M13.5 2.5A6.5 6.5 0 1 1 2.5 8"/>
      <polyline points="0,5 2.5,8 5,5"/>
    </svg>
  </button>
</div>

<div class="cat-nav" id="catNav"></div>
<div class="restock-strip" id="restockStrip" style="display:none"></div>
<div id="content"><div class="loading"><div class="spin-ring"></div>Loading…</div></div>

<script>
const API = 'https://api.opxio.io/api/clients/nadia-cats/dashboard'
let _data = null, _catIdx = 0, _ctrl = null

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
function fmtDate(d) {
  if (!d) return '—'
  return new Date(d + 'T00:00:00').toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'})
}
function fmtShort(d) {
  if (!d) return '—'
  return new Date(d + 'T00:00:00').toLocaleDateString('en-MY',{day:'numeric',month:'short'})
}
function daysSince(d) {
  if (!d) return null
  return Math.floor((Date.now() - new Date(d + 'T00:00:00').getTime()) / 86400000)
}


function renderRestockAlerts(alerts) {
  const strip = document.getElementById('restockStrip')
  if (!alerts || alerts.length === 0) { strip.style.display = 'none'; return }
  strip.style.display = 'flex'
  strip.innerHTML = alerts.map(a => {
    // Extract key note (first sentence / refill instruction)
    const noteShort = (a.notes || '').split(/REFILL REMINDER:|\n/)[0].replace(/^\s+/,'').trim()
    const refillNote = (a.notes || '').includes('REFILL REMINDER:')
      ? a.notes.split('REFILL REMINDER:')[1]?.split('.')[0]?.trim() || ''
      : ''
    return `<div class="restock-card">
      <div class="restock-dot"></div>
      <div>
        <div class="restock-cat">${esc(a.catName)} — Restock needed</div>
        <div class="restock-med">${esc(a.medName)}</div>
        ${refillNote ? `<div class="restock-note">${esc(refillNote)}</div>` : ''}
        ${a.supplier ? `<div class="restock-note" style="color:rgba(251,191,36,.5)">From: ${esc(a.supplier)}</div>` : ''}
      </div>
    </div>`
  }).join('')
}

function renderCat(cat) {
  const gs  = cat.gsActive
  const p   = gs?.gsProgress
  const meds = cat.activeMeds || []
  const daysLast = daysSince(cat.lastVisitDate)
  let html = ''

  // Emergency
  if (cat.emergencyNotes) {
    html += `<div class="emergency">
      <div class="emergency-lbl">Emergency Notes</div>
      <div class="emergency-text">${esc(cat.emergencyNotes)}</div>
    </div>`
  }

  // Next appt
  if (cat.nextAppt) {
    html += `<div class="appt-bar">
      <span class="appt-lbl">Next Appointment</span>
      <span class="appt-date">${fmtDate(cat.nextAppt)}</span>
    </div>`
  }

  // Name + badges
  html += `<div class="cat-hero">
    <div class="cat-name">${esc(cat.name)}</div>
    <div class="cat-badges">
      ${cat.status  ? `<span class="badge ${statusCls(cat.status)}">${esc(cat.status)}</span>` : ''}
      ${cat.fipType ? `<span class="badge badge-purple">${esc(cat.fipType)}</span>` : ''}
      ${cat.sex     ? `<span class="badge badge-gray">${esc(cat.sex)}</span>` : ''}
      ${cat.age     ? `<span class="badge badge-gray">${esc(cat.age)}</span>` : ''}
    </div>
  </div>`

  // KPIs
  html += `<div class="kpi-row">
    <div class="card kpi">
      <div class="kpi-lbl">Weight</div>
      <div class="kpi-val lime">${cat.latestWeight != null ? cat.latestWeight : '—'}</div>
      <div class="kpi-sub">${cat.latestWeight != null ? 'kg · ' + fmtShort(cat.latestWeightDate) : 'not logged'}</div>
    </div>
    <div class="card kpi">
      <div class="kpi-lbl">GS Day</div>
      <div class="kpi-val ${p ? 'purple-c' : 'dim'}">${p ? p.day : '—'}</div>
      <div class="kpi-sub">${p ? 'of 84' : 'no GS'}</div>
    </div>
    <div class="card kpi">
      <div class="kpi-lbl">Last Vet</div>
      <div class="kpi-val ${daysLast != null && daysLast > 30 ? 'amber-c' : daysLast != null ? 'teal-c' : 'dim'}">${daysLast != null ? daysLast + 'd' : '—'}</div>
      <div class="kpi-sub">${cat.lastVisitDate ? 'ago' : 'no visits'}</div>
    </div>
  </div>`

  // GS card
  if (gs && p) {
    html += `<div class="card gs-card">
      <div class="gs-lbl">GS-441524 Treatment</div>
      <div class="gs-big">
        <span class="gs-day-num">${p.day}</span>
        <span class="gs-day-of">/ 84 days</span>
        <span class="badge ${p.completed ? 'badge-green' : p.pastDay42 ? 'badge-purple' : 'badge-blue'}" style="margin-left:4px">
          ${p.completed ? 'Completed' : p.pastDay42 ? 'Phase 2' : 'Phase 1'}
        </span>
      </div>
      <div class="gs-bar-outer"><div class="gs-bar-inner" style="width:${p.pct}%"></div></div>
      <div class="gs-dates">
        <span>Started ${fmtDate(gs.startDate)}</span>
        <span>Ends ${fmtDate(gs.day84Completion || p.day84)}</span>
      </div>
      ${gs.dosage ? `<div class="gs-detail">${[gs.gsForm, gs.dosage + (gs.unit ? ' ' + gs.unit : ''), gs.gsConcentration].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
      ${!p.pastDay42 ? `<div class="gs-note">Day 42 vet check: ${fmtDate(gs.day42Milestone || p.day42)}</div>` : ''}
    </div>`
  }

  // Meds
  html += `<div class="card section">
    <div class="section-lbl">Active Medications (${meds.length})</div>
    ${meds.length === 0 ? '<div class="no-data">None recorded</div>' : meds.map(m => `
    <div class="med-row">
      <div class="med-dot ${m.category==='GS Treatment'?'dot-gs':m.category==='Supportive Care'?'dot-support':'dot-other'}"></div>
      <div>
        <div class="med-name">${esc(m.name)}</div>
        <div class="med-detail">${[m.dosage, m.unit, m.purpose].filter(Boolean).map(esc).join(' · ')}</div>
      </div>
    </div>`).join('')}
  </div>`

  // Two-col: vet visits + weight log
  const visits = (cat.vetVisits || []).slice(0, 4)
  const wlog   = (cat.weightLog || []).slice(0, 5)
  html += `<div class="two-col">
    <div class="card section">
      <div class="section-lbl">Vet Visits</div>
      ${visits.length === 0 ? '<div class="no-data">None recorded</div>' : visits.map(v => `
      <div class="row-item">
        <div>
          <div class="row-main">${esc(v.visitType || v.title || 'Visit')}</div>
          ${v.clinic ? `<div class="row-sub">${esc(v.clinic)}</div>` : ''}
        </div>
        <div class="row-right">
          <div class="row-date">${fmtShort(v.date)}</div>
          ${v.cost != null ? `<div style="font-size:11px;font-weight:700;color:var(--amber)">RM ${v.cost}</div>` : ''}
        </div>
      </div>`).join('')}
    </div>
    <div class="card section">
      <div class="section-lbl">Weight Log</div>
      ${wlog.length === 0 ? '<div class="no-data">None recorded</div>' : wlog.map(w => `
      <div class="row-item">
        <span class="row-val">${w.weight != null ? w.weight + ' kg' : '—'}</span>
        <div class="row-right">
          <div class="row-date">${fmtShort(w.date)}</div>
          ${w.trend === 'Gaining' ? `<div style="font-size:12px;color:var(--teal);font-weight:700">↑</div>` : w.trend === 'Losing' ? `<div style="font-size:12px;color:var(--red);font-weight:700">↓</div>` : ''}
        </div>
      </div>`).join('')}
    </div>
  </div>`

  document.getElementById('content').innerHTML = html
}

function statusCls(s) {
  return {
    'Active Treatment':'badge-green',
    'Monitoring':'badge-amber',
    'Stable':'badge-blue',
    'Critical':'badge-red'
  }[s] || 'badge-gray'
}

function buildNav() {
  document.getElementById('catNav').innerHTML = (_data.cats || []).map((cat, i) =>
    `<button class="cat-pill ${i === _catIdx ? 'active' : ''}" onclick="selectCat(${i})">${esc(cat.name)}</button>`
  ).join('')
}

function selectCat(idx) {
  _catIdx = idx
  buildNav()
  renderCat(_data.cats[idx])
  window.scrollTo({ top: 0, behavior: 'smooth' })
}

async function load(force = false) {
  if (_ctrl) _ctrl.abort()
  _ctrl = new AbortController()
  const btn = document.getElementById('refreshBtn')
  btn.classList.add('spinning')
  try {
    const r = await fetch(`${API}${force ? '?force=1' : ''}`, { signal: _ctrl.signal })
    if (!r.ok) throw new Error(`HTTP ${r.status}`)
    _data = await r.json()
    document.getElementById('ts').textContent =
      'Updated ' + new Date(_data.updatedAt).toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'})
    renderRestockAlerts(_data.restockAlerts || [])
    buildNav()
    renderCat(_data.cats[Math.min(_catIdx, _data.cats.length - 1)])
  } catch(e) {
    if (e.name === 'AbortError') return
    document.getElementById('content').innerHTML =
      `<div class="error-box">Failed to load: ${esc(e.message)}<br><br>
       <button onclick="load(true)" style="margin-top:10px;padding:8px 20px;border-radius:8px;background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.2);color:var(--g);font-size:13px;cursor:pointer;font-family:inherit">Retry</button></div>`
  } finally {
    btn.classList.remove('spinning')
  }
}

function refresh() { load(true) }
load()
</script>
</body>
</html>
