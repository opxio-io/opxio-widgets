<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Client Accounts</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 28px;background:#191919;color:#fff;overflow-y:auto;overflow-x:hidden;height:100%;transition:background .3s,color .3s;}
body.light{background:#FFFFFF;color:#111;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.12);--gb:rgba(170,255,0,.18);--amber:#FBBF24;--red:#FF6B6B;--muted:rgba(255,255,255,.4);}
body.light{--g:#fff;--gm:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--muted:rgba(0,0,0,.5);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;}
body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);}

.card{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:16px;transition:border-color .2s;}
.card:hover{border-color:rgba(170,255,0,.08);}
body.light .card{background:#1E1E1E;border-color:rgba(255,255,255,.06);}

.icon-btn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.icon-btn:hover{background:rgba(170,255,0,.08);border-color:rgba(170,255,0,.2);color:var(--g);}
.icon-btn svg{width:14px;height:14px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
body.light .icon-btn{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.07);color:rgba(255,255,255,.65);}
body.light .icon-btn:hover{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12);color:var(--g);}

.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.h-right{display:flex;align-items:center;gap:8px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:2px;}
body.light .eyebrow{color:rgba(0,0,0,.35);}
.h-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.03em;}
body.light .h-title{color:#111;}
.ts{font-size:11px;font-weight:500;color:rgba(255,255,255,.2);}
body.light .ts{color:rgba(0,0,0,.32);}
.sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.25);margin:18px 0 10px;}
body.light .sec-lbl{color:rgba(255,255,255,.65);}

/* ── STAT CARDS ── */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:600px){.g4{grid-template-columns:repeat(2,1fr);}}
.stat{padding:18px 20px;position:relative;overflow:hidden;}
.s-dot{position:absolute;top:14px;right:14px;width:6px;height:6px;border-radius:50%;opacity:.6;}
.s-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;display:block;}
.s-val{font-size:30px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:var(--g);}
.s-sub{font-size:11px;font-weight:600;color:rgba(255,255,255,.22);margin-top:6px;}
body.light .s-sub{color:rgba(255,255,255,.22);}

/* ── MID ROW ── */
.mid-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
@media(max-width:700px){.mid-row{grid-template-columns:1fr;}}
.panel{padding:20px 22px;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.3);}
body.light .panel-title{color:rgba(255,255,255,.65);}
.panel-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gm);color:var(--g);border:1px solid var(--gb);}

/* ── HEALTH RING + BARS ── */
.health-wrap{display:flex;align-items:center;gap:20px;}
@media(max-width:500px){.health-wrap{flex-direction:column;}}
.ov-ring-wrap{position:relative;flex-shrink:0;width:120px;height:120px;}
.ring-svg{width:120px;height:120px;overflow:visible;}
.ov-ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
.ov-ring-pct{font-size:24px;font-weight:900;color:var(--g);letter-spacing:-1px;line-height:1;}
.ov-ring-sub{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.25);margin-top:4px;}
body.light .ov-ring-sub{color:rgba(255,255,255,.5);}
.ov-ring-track{fill:none;stroke:rgba(255,255,255,.06);}
body.light .ov-ring-track{stroke:rgba(0,0,0,.1);}
.health-bars{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;}
.hb-row{display:flex;align-items:center;gap:8px;}
.hb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.hb-label{font-size:11px;font-weight:700;color:var(--muted);width:60px;flex-shrink:0;}
.hb-track{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;}
body.light .hb-track{background:rgba(0,0,0,.05);}
.hb-fill{height:6px;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.hb-val{font-size:13px;font-weight:900;color:#fff;width:32px;text-align:right;flex-shrink:0;}
body.light .hb-val{color:rgba(255,255,255,.9);}
.hb-pct{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);width:32px;text-align:right;flex-shrink:0;}
body.light .hb-pct{color:rgba(255,255,255,.4);}

/* ── OS COVERAGE BARS ── */
.os-bars{display:flex;flex-direction:column;gap:10px;}
.os-row{display:flex;align-items:center;gap:10px;}
.os-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.os-label{font-size:11px;font-weight:700;width:110px;flex-shrink:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.os-track{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;}
body.light .os-track{background:rgba(0,0,0,.05);}
.os-fill{height:6px;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.os-count{font-size:13px;font-weight:900;color:#fff;width:32px;text-align:right;flex-shrink:0;}
body.light .os-count{color:rgba(255,255,255,.9);}

/* ── CLIENT LIST ── */
.proj-scroll{max-height:300px;overflow-y:auto;padding-right:2px;}
.proj-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);}
body.light .proj-item{border-bottom-color:rgba(0,0,0,.05);}
.proj-item:last-child{border-bottom:none;}
.proj-info{flex:1;min-width:0;}
.proj-name{font-size:13px;font-weight:700;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
body.light .proj-name{color:rgba(255,255,255,.9);}
.proj-meta{font-size:11px;font-weight:600;color:rgba(255,255,255,.28);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
body.light .proj-meta{color:rgba(255,255,255,.65);}
.proj-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;border:1px solid transparent;}
body.light .proj-badge{background:rgba(0,0,0,.05);color:rgba(255,255,255,.65);}
.proj-tags{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}

/* ── GROWTH CHART ── */
.chart-wrap{position:relative;width:100%;height:140px;}
.ctip{position:absolute;background:#2a2a2a;border:1px solid rgba(170,255,0,.2);border-radius:8px;padding:6px 11px;font-family:'Satoshi',-apple-system,sans-serif;font-size:11px;font-weight:700;color:#AAFF00;pointer-events:none;display:none;white-space:nowrap;z-index:10;}

.empty{padding:40px;text-align:center;font-size:12px;color:rgba(255,255,255,.18);}
body.light .empty{color:rgba(255,255,255,.4);}
.wgt-footer{text-align:center;padding:20px 0 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.12);}
body.light .wgt-footer{color:rgba(0,0,0,.25);}
</style></head><body>

<div class="header">
  <div class="h-left">
    <div class="eyebrow" id="_eyebrow">Revenue OS · Opxio</div>
    <h1 class="h-title">Client Accounts</h1>
  </div>
  <div class="h-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" onclick="doRefresh()" id="rb" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
    <button class="icon-btn" onclick="toggleMode()" id="mb" title="Toggle light/dark">
      <svg id="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
</div>

<!-- STAT CARDS -->
<div class="g4">
  <div class="card stat"><div class="s-dot" style="background:var(--g);"></div><span class="s-lbl">Total Clients</span><div class="s-val" id="s-total">0</div><div class="s-sub" id="s-total-sub">All accounts</div></div>
  <div class="card stat"><div class="s-dot" style="background:var(--g);"></div><span class="s-lbl">Active</span><div class="s-val" id="s-active">0</div><div class="s-sub">Live accounts</div></div>
  <div class="card stat"><div class="s-dot" style="background:var(--g);"></div><span class="s-lbl">Onboarding</span><div class="s-val" id="s-onboarding">0</div><div class="s-sub">Setting up</div></div>
  <div class="card stat"><div class="s-dot" style="background:var(--g);"></div><span class="s-lbl">Expansion Ready</span><div class="s-val" id="s-expansion">0</div><div class="s-sub">Flagged for growth</div></div>
</div>

<!-- MID ROW: Health Ring + OS Coverage -->
<div class="sec-lbl">Accounts</div>
<div class="mid-row">
  <!-- LEFT: Client Health Ring -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">Client Health</span>
      <span class="panel-badge" id="health-badge">—</span>
    </div>
    <div class="health-wrap">
      <div class="ov-ring-wrap">
        <svg class="ring-svg" width="120" height="120" viewBox="0 0 120 120" id="health-ring-svg">
          <circle class="ov-ring-track" cx="60" cy="60" r="50" fill="none" stroke-width="8"/>
        </svg>
        <div class="ov-ring-center">
          <div class="ov-ring-pct" id="ring-pct">—</div>
          <div class="ov-ring-sub">Healthy</div>
        </div>
      </div>
      <div class="health-bars" id="health-bars"></div>
    </div>
  </div>
  <!-- RIGHT: OS Coverage -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">OS Coverage</span>
      <span class="panel-badge" id="os-badge">—</span>
    </div>
    <div class="os-bars" id="os-bars"></div>
  </div>
</div>

<!-- CLIENT GROWTH -->
<div class="sec-lbl">Growth</div>
<div class="card panel">
  <div class="panel-hdr">
    <span class="panel-title">Client Growth</span>
    <span class="panel-badge" id="growth-badge">—</span>
  </div>
  <div class="chart-wrap" id="cwrap">
    <svg id="growth-chart" style="display:block;overflow:visible;"></svg>
    <div class="ctip" id="ctip"></div>
  </div>
</div>

<!-- ALL CLIENTS -->
<div class="sec-lbl">All Clients</div>
<div class="card panel">
  <div class="panel-hdr">
    <span class="panel-title">Client List</span>
    <span class="panel-badge" id="list-badge">—</span>
  </div>
  <div class="proj-scroll" id="client-list"></div>
</div>

<script>
const _tok=new URLSearchParams(location.search).get('token')||'';
function apiUrl(p){ p='https://api.opxio.io'+p; return _tok?p+'?token='+encodeURIComponent(_tok):p;}
let light=false;
const SUN_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function toggleMode(){light=!light;document.body.classList.toggle('light',light);const mb=document.getElementById('mb');if(mb)mb.innerHTML=light?MOON_ICON:SUN_ICON;}
function setTs(){document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const CIRC=2*Math.PI*50;
const OS_COLORS=['#AAFF00','#60A5FA','#FBBF24','#A78BFA','#FB923C','#34D399','#F472B6'];

function fmtDate(iso){
  if(!iso)return null;
  try{return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});}
  catch{return null;}
}
function daysSince(iso){
  if(!iso)return null;
  const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(d===0)return'Today';if(d===1)return'Yesterday';
  if(d<7)return d+'d ago';if(d<30)return Math.floor(d/7)+'w ago';
  if(d<365)return Math.floor(d/30)+'mo ago';return Math.floor(d/365)+'y ago';
}

// ── HEALTH RING ──────────────────────────────────────────────────────────────
function renderHealth(hc, total){
  const green=hc['🟢 Green']||0, amber=hc['🟡 Amber']||0, red=hc['🔴 Red']||0;
  const tot=total||(green+amber+red)||1;
  const pct=n=>tot>0?Math.round((n/tot)*100):0;

  document.getElementById('health-badge').textContent=tot+' account'+(tot!==1?'s':'');
  document.getElementById('ring-pct').textContent=pct(green)+'%';

  // Draw ring
  const svg=document.getElementById('health-ring-svg');
  svg.querySelectorAll('.h-arc').forEach(e=>e.remove());
  const items=[
    {val:green,color:'#AAFF00'},
    {val:amber, color:'#FBBF24'},
    {val:red,   color:'#FF6B6B'},
  ];
  let offset=0;
  items.forEach(item=>{
    if(item.val<=0)return;
    const frac=item.val/tot;
    const len=frac*CIRC;
    const arc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    arc.setAttribute('class','h-arc');
    arc.setAttribute('cx','60');arc.setAttribute('cy','60');arc.setAttribute('r','50');
    arc.setAttribute('fill','none');arc.setAttribute('stroke',item.color);
    arc.setAttribute('stroke-width','8');arc.setAttribute('stroke-linecap','round');
    arc.setAttribute('stroke-dasharray',`${Math.max(len-2,1)} ${CIRC}`);
    arc.setAttribute('transform',`rotate(${-90+offset*360} 60 60)`);
    arc.style.transition='all .8s cubic-bezier(.4,0,.2,1)';
    svg.appendChild(arc);
    offset+=frac;
  });

  // Bars
  const barItems=[
    {label:'Healthy', val:green, color:'#AAFF00', dot:'#AAFF00'},
    {label:'At Risk',  val:amber,  color:'#FBBF24', dot:'#FBBF24'},
    {label:'Critical', val:red,    color:'#FF6B6B', dot:'#FF6B6B'},
  ];
  const barMax=Math.max(...barItems.map(s=>s.val),1);
  document.getElementById('health-bars').innerHTML=barItems.map(s=>{
    const w=Math.round((s.val/barMax)*100);
    const p=pct(s.val);
    return`<div class="hb-row">
      <div class="hb-dot" style="background:${s.dot}"></div>
      <span class="hb-label">${s.label}</span>
      <div class="hb-track"><div class="hb-fill" style="width:${w}%;background:${s.color}"></div></div>
      <span class="hb-val">${s.val}</span>
      <span class="hb-pct">${p}%</span>
    </div>`;
  }).join('');
}

// ── OS COVERAGE ──────────────────────────────────────────────────────────────
function renderOS(clients){
  const counts={};
  for(const c of clients) for(const os of(c.osInstalled||[])) if(os&&os!=='Base OS') counts[os]=(counts[os]||0)+1;
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=sorted.reduce((s,[,v])=>s+v,0);
  document.getElementById('os-badge').textContent=total+' install'+(total!==1?'s':'');
  if(!sorted.length){document.getElementById('os-bars').innerHTML='<div style="font-size:11px;color:rgba(255,255,255,.2);">No data</div>';return;}
  const barMax=sorted[0][1];
  document.getElementById('os-bars').innerHTML=sorted.map(([os,n],i)=>{
    const col=OS_COLORS[i%OS_COLORS.length];
    const w=Math.round((n/barMax)*100);
    return`<div class="os-row">
      <div class="os-dot" style="background:${col}"></div>
      <span class="os-label">${esc(os)}</span>
      <div class="os-track"><div class="os-fill" style="width:${w}%;background:${col}"></div></div>
      <span class="os-count">${n}</span>
    </div>`;
  }).join('');
}

// ── GROWTH CHART ─────────────────────────────────────────────────────────────
let _chartData=[];
function buildChartData(clients){
  const now=new Date();
  const months=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({year:d.getFullYear(),month:d.getMonth(),m:d.toLocaleString('default',{month:'short'}),v:0});
  }
  for(const c of clients){
    if(!c.installDate)continue;
    const d=new Date(c.installDate);
    const e=months.find(m=>m.year===d.getFullYear()&&m.month===d.getMonth());
    if(e)e.v++;
  }
  return months;
}
function drawChart(){
  const wrap=document.getElementById('cwrap'),svgEl=document.getElementById('growth-chart');
  if(!wrap||!svgEl||!_chartData.length)return;
  const ns='http://www.w3.org/2000/svg';
  const W=wrap.offsetWidth||600,H=wrap.offsetHeight||140;
  svgEl.setAttribute('width',W);svgEl.setAttribute('height',H);svgEl.innerHTML='';
  const PAD={t:12,r:14,b:28,l:22};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const maxV=Math.max(..._chartData.map(d=>d.v),1);
  const AC='#AAFF00',dim='rgba(255,255,255,.25)',grid='rgba(255,255,255,.04)';
  const xP=i=>PAD.l+(i/(_chartData.length-1||1))*cW;
  const yP=v=>PAD.t+cH-(v/maxV)*cH;
  // Grid lines
  for(let i=0;i<=3;i++){
    const y=PAD.t+(i/3)*cH;
    const gl=document.createElementNS(ns,'line');
    gl.setAttribute('x1',PAD.l);gl.setAttribute('x2',W-PAD.r);gl.setAttribute('y1',y);gl.setAttribute('y2',y);
    gl.setAttribute('stroke',grid);gl.setAttribute('stroke-dasharray','3,5');svgEl.appendChild(gl);
    if(i<3){const t=document.createElementNS(ns,'text');t.setAttribute('x',PAD.l-4);t.setAttribute('y',y+4);t.setAttribute('text-anchor','end');t.setAttribute('fill',dim);t.setAttribute('font-size','9');t.setAttribute('font-family','Satoshi,-apple-system,sans-serif');t.textContent=Math.round(maxV-(i/3)*maxV);svgEl.appendChild(t);}
  }
  // X labels
  _chartData.forEach((d,i)=>{
    if(i%2!==0&&i!==_chartData.length-1)return;
    const isCur=i===_chartData.length-1;
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',xP(i));t.setAttribute('y',H-PAD.b+14);t.setAttribute('text-anchor','middle');
    t.setAttribute('fill',isCur?AC:dim);t.setAttribute('font-size','9');t.setAttribute('font-weight',isCur?'700':'500');
    t.setAttribute('font-family','Satoshi,-apple-system,sans-serif');t.textContent=d.m;svgEl.appendChild(t);
  });
  // Smooth curve
  function smooth(pts){if(pts.length<2)return`M ${pts[0][0]} ${pts[0][1]}`;let s=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x1,y1]=pts[i-1],[x2,y2]=pts[i],cx=(x1+x2)/2;s+=` C ${cx} ${y1} ${cx} ${y2} ${x2} ${y2}`;}return s;}
  const pts=_chartData.map((d,i)=>[xP(i),yP(d.v)]);
  const pathD=smooth(pts),last=pts[pts.length-1],first=pts[0];
  // Gradient fill
  const defs=document.createElementNS(ns,'defs');
  const grad=document.createElementNS(ns,'linearGradient');
  grad.setAttribute('id','gAcc');grad.setAttribute('x1','0');grad.setAttribute('y1','0');grad.setAttribute('x2','0');grad.setAttribute('y2','1');
  const s1=document.createElementNS(ns,'stop');s1.setAttribute('offset','0%');s1.setAttribute('stop-color',AC);s1.setAttribute('stop-opacity','0.16');
  const s2=document.createElementNS(ns,'stop');s2.setAttribute('offset','100%');s2.setAttribute('stop-color',AC);s2.setAttribute('stop-opacity','0');
  grad.appendChild(s1);grad.appendChild(s2);defs.appendChild(grad);svgEl.insertBefore(defs,svgEl.firstChild);
  const area=document.createElementNS(ns,'path');area.setAttribute('d',pathD+` L ${last[0]} ${H-PAD.b} L ${first[0]} ${H-PAD.b} Z`);area.setAttribute('fill','url(#gAcc)');svgEl.appendChild(area);
  const line=document.createElementNS(ns,'path');line.setAttribute('d',pathD);line.setAttribute('fill','none');line.setAttribute('stroke',AC);line.setAttribute('stroke-width','1.8');line.setAttribute('stroke-linecap','round');svgEl.appendChild(line);
  // Dots
  _chartData.forEach((d,i)=>{
    const isCur=i===_chartData.length-1;
    const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',xP(i));dot.setAttribute('cy',yP(d.v));
    dot.setAttribute('r',isCur?'4.5':'3');dot.setAttribute('fill',isCur?AC:'#1E1E1E');dot.setAttribute('stroke',AC);dot.setAttribute('stroke-width','1.8');
    if(isCur)dot.setAttribute('filter','drop-shadow(0 0 5px rgba(170,255,0,.6))');svgEl.appendChild(dot);
  });
  // Hover
  const hL=document.createElementNS(ns,'line');hL.setAttribute('stroke','rgba(170,255,0,.1)');hL.setAttribute('stroke-width','1');hL.setAttribute('y1',PAD.t);hL.setAttribute('y2',H-PAD.b);hL.style.opacity='0';svgEl.appendChild(hL);
  const tip=document.getElementById('ctip');
  wrap.onmousemove=function(e){
    const rect=wrap.getBoundingClientRect(),mx=e.clientX-rect.left;
    let bi=null,bd=Infinity;_chartData.forEach((_,i)=>{const dist=Math.abs(xP(i)-mx);if(dist<bd){bd=dist;bi=i;}});
    if(bi===null||bd>50){hide();return;}
    const d=_chartData[bi],px=xP(bi);
    hL.setAttribute('x1',px);hL.setAttribute('x2',px);hL.style.opacity='1';
    tip.style.display='block';tip.style.left=Math.min(e.clientX-rect.left+14,rect.width-130)+'px';tip.style.top=(e.clientY-rect.top-44)+'px';
    tip.innerHTML=`<span style="color:rgba(255,255,255,.35);font-size:9px;">${d.m}</span>&nbsp;&nbsp;${d.v} client${d.v!==1?'s':''}`;
  };
  wrap.onmouseleave=hide;
  function hide(){tip.style.display='none';hL.style.opacity='0';}
}

// ── CLIENT LIST ───────────────────────────────────────────────────────────────
function healthColor(h){
  if(h==='🟢 Green')return'#AAFF00';
  if(h==='🟡 Amber')return'#FBBF24';
  if(h==='🔴 Red')  return'#FF6B6B';
  return'rgba(255,255,255,.15)';
}
function healthLabel(h){
  if(h==='🟢 Green')return'Healthy';
  if(h==='🟡 Amber')return'At Risk';
  if(h==='🔴 Red')  return'Critical';
  return'—';
}
function statusColor(s){
  if(s==='Active')     return'var(--g)';
  if(s==='Onboarding') return'rgba(255,255,255,.4)';
  return'rgba(255,255,255,.2)';
}

function renderClients(clients){
  const total=clients.length;
  document.getElementById('list-badge').textContent=total+' client'+(total!==1?'s':'');
  if(!total){document.getElementById('client-list').innerHTML='<div class="empty">No client accounts yet</div>';return;}

  const sO={'Active':0,'Onboarding':1,'Past Client':2};
  const hO={'🔴 Red':0,'🟡 Amber':1,'🟢 Green':2,'':3};
  const sorted=[...clients].sort((a,b)=>{
    const sd=(sO[a.status]??3)-(sO[b.status]??3);
    if(sd!==0)return sd;
    return(hO[a.health||'']??3)-(hO[b.health||'']??3);
  });

  document.getElementById('client-list').innerHTML=sorted.map(c=>{
    const hCol=healthColor(c.health);
    const hLbl=healthLabel(c.health);
    const sCol=statusColor(c.status);
    const installDate=fmtDate(c.installDate);
    const touch=daysSince(c.lastTouchpoint);
    const osNonBase=(c.osInstalled||[]).filter(o=>o&&o!=='Base OS');
    const metaParts=[installDate?'Installed '+installDate:null,touch||null].filter(Boolean);
    const meta=metaParts.join(' · ');

    return`<div class="proj-item" style="cursor:pointer;" onclick="if('${esc(c.url||'')}')window.open('${esc(c.url||'')}','_blank')">
      <div class="proj-info">
        <div class="proj-name">${esc(c.name||'Unnamed')}</div>
        ${meta?`<div class="proj-meta">${esc(meta)}</div>`:''}
      </div>
      <div class="proj-tags">
        ${osNonBase.slice(0,2).map(o=>`<span class="proj-badge" style="color:rgba(255,255,255,.45);border-color:rgba(255,255,255,.08);">${esc(o.replace(' OS',''))}</span>`).join('')}
        ${osNonBase.length>2?`<span class="proj-badge" style="color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.06);">+${osNonBase.length-2}</span>`:''}
        <span class="proj-badge" style="color:${hCol};border-color:${hCol}22;">${hLbl}</span>
        ${c.status?`<span class="proj-badge" style="color:${sCol};border-color:${sCol.includes('var')?'rgba(170,255,0,.2)':sCol+'22'};">${esc(c.status)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── LOAD ──────────────────────────────────────────────────────────────────────
async function loadData(){
  try{
    const r=await fetch(apiUrl('/api/data/accounts'));
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const total=j.total||0;
    document.getElementById('s-total').textContent=total;
    document.getElementById('s-total-sub').textContent=total===1?'1 account':total+' accounts';
    document.getElementById('s-active').textContent=j.statusCounts?.['Active']??0;
    document.getElementById('s-onboarding').textContent=j.statusCounts?.['Onboarding']??0;
    document.getElementById('s-expansion').textContent=j.expansionCandidates??0;
    renderHealth(j.healthCounts||{},total);
    renderOS(j.clients||[]);
    const tracked=(j.clients||[]).filter(c=>c.installDate).length;
    document.getElementById('growth-badge').textContent=tracked+' tracked';
    _chartData=buildChartData(j.clients||[]);
    setTimeout(drawChart,50);
    renderClients(j.clients||[]);
    setTs();
  }catch(e){
    console.error('accounts:',e);
    document.getElementById('client-list').innerHTML='<div class="empty" style="color:#FF6B6B;">Failed to load — check token</div>';
  }
}
function doRefresh(){const b=document.getElementById('rb');if(b)b.classList.add('spinning');loadData().finally(()=>{const b2=document.getElementById('rb');if(b2)b2.classList.remove('spinning');});}
setTs();loadData();setInterval(loadData,5*60*1000);
