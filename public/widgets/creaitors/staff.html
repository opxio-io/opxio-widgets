<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Creaitors Staff</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Satoshi',sans-serif;background:#0d0d0d;color:#f0f0f0;min-height:100vh;padding:20px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hdr-title{font-size:15px;font-weight:700;color:#f0f0f0;letter-spacing:.3px}
.hdr-sub{font-size:11px;color:#555;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #2a2a2a;background:#1a1a1a;color:#666;transition:all .15s}
.tab.active{background:#aaff00;color:#0d0d0d;border-color:#aaff00}
.view-btns{display:flex;gap:4px;margin-left:auto}
.vbtn{padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #2a2a2a;background:#1a1a1a;color:#555;transition:all .15s}
.vbtn.active{background:#222;color:#aaff00;border-color:#aaff00}
.dash{display:flex;flex-direction:column;gap:10px}
/* CARD */
.card{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card-top{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#888;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.name-wrap{flex:1;min-width:0}
.name{font-size:13px;font-weight:700;color:#f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:11px;color:#555;margin-top:1px}
.kpi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kpi-good{background:#aaff00}
.kpi-low{background:#ff6b35}
.kpi-none{background:#333}
/* WEEK 2x2 grid */
.team-wk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.twg-item{background:#1a1a1a;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.twg-num{font-size:20px;font-weight:700;line-height:1}
.twg-sub{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.twg-item.pln .twg-num{color:#60a5fa}
.twg-item.sht .twg-num{color:#f472b6}
.twg-item.edt .twg-num{color:#a78bfa}
.twg-item.pst .twg-num{color:#aaff00}
.twg-item.pln .twg-sub{color:#60a5fa}
.twg-item.sht .twg-sub{color:#f472b6}
.twg-item.edt .twg-sub{color:#a78bfa}
.twg-item.pst .twg-sub{color:#aaff00}
.wk-footer{display:flex;align-items:center;justify-content:space-between;padding-top:4px;border-top:1px solid #1e1e1e}
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-lbl{font-size:11px;color:#555}
.wk-arr{background:none;border:none;color:#555;cursor:pointer;font-size:14px;padding:2px 4px;transition:color .15s}
.wk-arr:hover{color:#aaff00}
.wkf-time{font-size:11px;color:#555}
.wkf-tot{font-size:11px;font-weight:600;color:#888}
/* YEARLY bars */
.yr-rows{display:flex;flex-direction:column;gap:6px}
.yr-row{display:grid;grid-template-columns:60px 1fr 32px;align-items:center;gap:8px}
.yr-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.yr-bar{height:6px;background:#1e1e1e;border-radius:3px;overflow:hidden}
.yr-fill{height:100%;border-radius:3px;transition:width .4s ease}
.yr-val{font-size:12px;font-weight:700;text-align:right;color:#888}
.yr-label.pln{color:#60a5fa} .yr-fill.pln{background:#60a5fa}
.yr-label.sht{color:#f472b6} .yr-fill.sht{background:#f472b6}
.yr-label.edt{color:#a78bfa} .yr-fill.edt{background:#a78bfa}
.yr-label.pst{color:#aaff00} .yr-fill.pst{background:#aaff00}
.yr-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid #1e1e1e;font-size:11px;color:#555}
.yr-hrs{color:#888;font-weight:600}
/* MONTH table */
.mth-table{width:100%;border-collapse:collapse;font-size:12px}
.mth-table th{font-size:10px;font-weight:600;color:#444;text-transform:uppercase;letter-spacing:.5px;padding:4px 6px;text-align:center;border-bottom:1px solid #1e1e1e}
.mth-table th:first-child{text-align:left}
.mth-table td{padding:5px 6px;border-bottom:1px solid #111;text-align:center;vertical-align:top}
.mth-table td:first-child{text-align:left}
.mth-table tr:last-child td{border-bottom:none}
.mth-table .team-row td{color:#888}
.tot-val{font-size:13px;font-weight:700;color:#f0f0f0;display:block}
.mom-pct{font-size:10px;font-weight:600;margin-top:1px}
.mom-up{color:#aaff00} .mom-dn{color:#ff6b35} .mom-fl{color:#555}
.no-act-cell{font-size:10px;color:#333;font-style:italic}
/* stage breakdown in monthly */
.stg-break{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;font-size:9px}
.stg-pip{font-weight:600}
.sp-sep{color:#333}
.sp-pln{color:#60a5fa} .sp-sht{color:#f472b6} .sp-edt{color:#a78bfa} .sp-pst{color:#aaff00}
/* COMPACT LIST */
.cmp-list{display:flex;flex-direction:column;gap:6px}
.cmp-row{display:grid;grid-template-columns:1fr auto auto auto auto;align-items:center;gap:10px;padding:8px 12px;background:#141414;border:1px solid #1e1e1e;border-radius:10px}
.cmp-name{font-size:12px;font-weight:600;color:#f0f0f0;display:flex;align-items:center;gap:8px}
.cmp-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:#1e1e1e;color:#555;font-weight:600}
.cmp-val{font-size:12px;font-weight:700;color:#f0f0f0;text-align:center;min-width:32px}
.cmp-mth{display:flex;flex-direction:column;align-items:center;gap:1px}
/* loading / error */
.loading{text-align:center;padding:60px 20px;color:#444;font-size:13px}
.error{text-align:center;padding:40px 20px;color:#ff6b35;font-size:13px}
/* team avg row */
.team-sep{height:1px;background:#222;margin:4px 0}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="hdr-title">Staff Breakdown</div>
    <div class="hdr-sub" id="sub-lbl">Loading…</div>
  </div>
</div>
<div class="tabs" id="tabs">
  <button class="tab active" data-tab="week">Week</button>
  <button class="tab" data-tab="month">Month</button>
  <button class="tab" data-tab="year">Yearly</button>
  <div class="view-btns" id="view-btns" style="display:none">
    <button class="vbtn active" data-view="card">Card</button>
    <button class="vbtn" data-view="compact">List</button>
  </div>
</div>
<div class="dash" id="dash"><div class="loading">Loading staff data…</div></div>

<script>
var _tok = (new URLSearchParams(location.search)).get('token') || '';
var _data = null;
var _tab  = 'week';
var _view = 'card';
var _wkOff = 0;

var STAGES = [
  {k:'planning', c:'pln', a:'Planning'},
  {k:'shooting', c:'sht', a:'Shooting'},
  {k:'editing',  c:'edt', a:'Editing'},
  {k:'posting',  c:'pst', a:'Posting'}
];

/* ── helpers ── */
function fmtH(h){ return h ? h+'h' : ''; }

function weekRange(off) {
  var d = new Date(); d.setHours(0,0,0,0);
  var dow = d.getDay(); var mon = new Date(d); mon.setDate(d.getDate() - ((dow+6)%7) + off*7);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  var fmt = function(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
  return {s: fmt(mon), e: fmt(sun), label: fmtDate(mon)+' – '+fmtDate(sun)};
}
function fmtDate(d){ var ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return String(d.getDate())+' '+ms[d.getMonth()]; }

function sliceWeek(tasks, off) {
  var r = weekRange(off);
  var o = {planning:0,shooting:0,editing:0,posting:0,mins:0};
  (tasks||[]).forEach(function(t){
    if(!t.isDone) return;
    var d = t.doneDate;
    if(d && d>=r.s && d<=r.e){ o[t.stage]++; o.mins+=t.mins; }
  });
  o.hrs = Math.round((o.mins/60)*10)/10;
  o.total = o.planning+o.shooting+o.editing+o.posting;
  return o;
}

function sliceYear(tasks) {
  var yr = new Date().getFullYear()+'';
  var o = {planning:0,shooting:0,editing:0,posting:0,mins:0};
  (tasks||[]).forEach(function(t){
    if(!t.isDone) return;
    if(t.doneDate && t.doneDate.slice(0,4)===yr){ o[t.stage]++; o.mins+=t.mins; }
  });
  o.hrs = Math.round((o.mins/60)*10)/10;
  o.total = o.planning+o.shooting+o.editing+o.posting;
  return o;
}

function weeksInMonth() {
  var now = new Date(); now.setHours(0,0,0,0);
  var yr=now.getFullYear(), mo=now.getMonth();
  var first=new Date(yr,mo,1), last=new Date(yr,mo+1,0);
  var weeks=[], cur=new Date(first);
  cur.setDate(cur.getDate()-((cur.getDay()+6)%7));
  while(cur<=last){
    var s=new Date(cur), e=new Date(cur); e.setDate(e.getDate()+6);
    var fmt=function(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
    weeks.push({s:fmt(s),e:fmt(e),label:'W'+weeks.length+1});
    cur.setDate(cur.getDate()+7);
  }
  weeks.forEach(function(w,i){w.label='W'+(i+1);});
  return weeks;
}

function sliceMonth(tasks, ws, we) {
  var o={planning:0,shooting:0,editing:0,posting:0,mins:0};
  (tasks||[]).forEach(function(t){
    if(!t.isDone) return;
    var d=t.doneDate;
    if(d && d>=ws && d<=we){ o[t.stage]++; o.mins+=t.mins; }
  });
  o.total=o.planning+o.shooting+o.editing+o.posting;
  return o;
}

function isActiveInRange(tasks,s,e){
  return (tasks||[]).some(function(t){ return t.isDone && t.doneDate && t.doneDate>=s && t.doneDate<=e; });
}

function kpiClass(tot, avg){
  if(!tot) return 'kpi-none';
  return tot >= avg ? 'kpi-good' : 'kpi-low';
}

function initials(name){ return (name||'?').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }

function avatarEl(e){
  if(e.avatarUrl) return '<div class="avatar"><img src="'+e.avatarUrl+'" onerror="this.parentNode.innerHTML=\''+initials(e.name)+'\'"/></div>';
  return '<div class="avatar">'+initials(e.name)+'</div>';
}

function momPct(cur, prev){
  if(!cur || !prev) return '';
  var p=Math.round(((cur-prev)/prev)*100);
  var cls=p>0?'mom-up':p<0?'mom-dn':'mom-fl';
  return '<div class="mom-pct '+cls+'">'+(p>0?'+':'')+p+'%</div>';
}

function noActCell(){ return '<span class="no-act-cell">No activity</span>'; }

function stgBreak(s){
  var parts=STAGES.filter(function(x){return(s[x.k]||0)>0;});
  if(!parts.length) return '';
  return '<div class="stg-break">'+parts.map(function(x,i){
    return (i>0?'<span class="stg-pip sp-sep">&nbsp;&middot;&nbsp;</span>':'')
      +'<span class="stg-pip sp-'+x.c+'">'+s[x.k]+' '+x.a+'</span>';
  }).join('')+'</div>';
}

/* ── WEEK view ── */
function mkWeekCard(e, wkS, kc){
  var grid='<div class="team-wk-grid">'
    +'<div class="twg-item pln"><div class="twg-num">'+(wkS.planning||0)+'</div><div class="twg-sub">Planning</div></div>'
    +'<div class="twg-item sht"><div class="twg-num">'+(wkS.shooting||0)+'</div><div class="twg-sub">Shooting</div></div>'
    +'<div class="twg-item edt"><div class="twg-num">'+(wkS.editing||0)+'</div><div class="twg-sub">Editing</div></div>'
    +'<div class="twg-item pst"><div class="twg-num">'+(wkS.posting||0)+'</div><div class="twg-sub">Posting</div></div>'
    +'</div>';
  var timeStr=wkS.hrs?'<span class="wkf-time">'+fmtH(wkS.hrs)+'</span>':'';
  var totStr='<span class="wkf-tot">'+wkS.total+' tasks</span>';
  var footer='<div class="wk-footer">'+totStr+timeStr+'</div>';
  return '<div class="card">'
    +'<div class="card-top">'+avatarEl(e)+'<div class="name-wrap"><div class="name">'+e.name+'</div><div class="role">'+e.role+'</div></div>'
    +'<div class="kpi-dot '+kc+'"></div></div>'
    +grid+footer+'</div>';
}

function renderWeek(d){
  var emps=d.employees.filter(function(e){ return e.status!=='Inactive'; });
  var wr=weekRange(_wkOff);
  var wkStats=emps.map(function(e){ return sliceWeek(e.tasks,_wkOff); });
  var totals=wkStats.map(function(s){ return s.total; });
  var avg=totals.length?Math.round(totals.reduce(function(a,b){return a+b;},0)/totals.length):0;

  document.getElementById('sub-lbl').textContent=wr.label+' · Team avg '+avg;

  if(_view==='card'){
    document.getElementById('view-btns').style.display='flex';
    var nav='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      +'<button class="wk-arr" onclick="shiftWk(-1)">&#8592;</button>'
      +'<span class="wk-lbl">'+wr.label+'</span>'
      +'<button class="wk-arr" onclick="shiftWk(1)">&#8594;</button>'
      +'</div>';
    var html=nav;
    emps.forEach(function(e,i){ html+=mkWeekCard(e,wkStats[i],kpiClass(wkStats[i].total,avg)); });
    document.getElementById('dash').innerHTML=html;
  } else {
    document.getElementById('view-btns').style.display='flex';
    var nav='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      +'<button class="wk-arr" onclick="shiftWk(-1)">&#8592;</button>'
      +'<span class="wk-lbl">'+wr.label+'</span>'
      +'<button class="wk-arr" onclick="shiftWk(1)">&#8594;</button>'
      +'</div>';
    var rows='<div class="cmp-list">';
    emps.forEach(function(e,i){
      var s=wkStats[i];
      var kc=kpiClass(s.total,avg);
      rows+='<div class="cmp-row">'
        +'<div class="cmp-name"><div class="kpi-dot '+kc+'" style="width:6px;height:6px"></div>'+e.name+'</div>'
        +STAGES.map(function(st){ return '<div class="cmp-val" style="color:'+(s[st.k]?'#f0f0f0':'#333')+'">'+s[st.k]+'</div>'; }).join('')
        +'</div>';
    });
    rows+='</div>';
    document.getElementById('dash').innerHTML=nav+rows;
  }
}

function shiftWk(n){ _wkOff+=n; renderWeek(_data); }

/* ── MONTH view ── */
function renderMonth(d){
  var emps=d.employees.filter(function(e){ return e.status!=='Inactive'; });
  var weeks=weeksInMonth();
  document.getElementById('sub-lbl').textContent=d.monthLabel+' · '+weeks.length+' weeks';
  document.getElementById('view-btns').style.display='flex';

  if(_view==='card'){
    var html='<div style="overflow-x:auto"><table class="mth-table"><thead><tr>'
      +'<th>Staff</th>'
      +weeks.map(function(w){ return '<th>'+w.label+'</th>'; }).join('')
      +'<th>MTH</th></tr></thead><tbody>';

    emps.forEach(function(e){
      var mthTot=e.monthStats.planning+e.monthStats.shooting+e.monthStats.editing+e.monthStats.posting;
      html+='<tr><td><b style="font-size:12px">'+e.name+'</b></td>';
      weeks.forEach(function(w){
        var s=sliceMonth(e.tasks,w.s,w.e);
        var cell=s.total?('<b>'+s.total+'</b>'+stgBreak(s)):noActCell();
        html+='<td>'+cell+'</td>';
      });
      var mthCell=mthTot
        ?('<span class="tot-val">'+mthTot+'</span>'+momPct(mthTot,e.prevMonthTotal||0))
        :noActCell();
      html+='<td>'+mthCell+'</td></tr>';
    });
    html+='</tbody></table></div>';
    document.getElementById('dash').innerHTML=html;
  } else {
    var html='<div class="cmp-list">';
    emps.forEach(function(e){
      var mthTot=e.monthStats.planning+e.monthStats.shooting+e.monthStats.editing+e.monthStats.posting;
      html+='<div class="cmp-row">'
        +'<div class="cmp-name">'+e.name+'</div>'
        +'<div class="cmp-mth">'
        +(mthTot?'<span class="tot-val">'+mthTot+'</span>'+momPct(mthTot,e.prevMonthTotal||0):noActCell())
        +'</div></div>';
    });
    html+='</div>';
    document.getElementById('dash').innerHTML=html;
  }
}

/* ── YEAR view ── */
function mkYearCard(e, ys, kc){
  var tot=ys.total||0;
  var rows='<div class="yr-rows">';
  STAGES.forEach(function(st){
    var v=ys[st.k]||0;
    var pct=tot>0?Math.min(100,Math.round((v/tot)*100)):0;
    rows+='<div class="yr-row">'
      +'<div class="yr-label '+st.c+'">'+st.a+'</div>'
      +'<div class="yr-bar"><div class="yr-fill '+st.c+'" style="width:'+pct+'%"></div></div>'
      +'<div class="yr-val">'+(v||'&mdash;')+'</div></div>';
  });
  rows+='</div>';
  var footer='<div class="yr-footer"><span>'+new Date().getFullYear()+' total</span>'
    +(ys.hrs?'<span class="yr-hrs">'+fmtH(ys.hrs)+'</span>':'')+'</div>';
  return '<div class="card">'
    +'<div class="card-top">'+avatarEl(e)+'<div class="name-wrap"><div class="name">'+e.name+'</div><div class="role">'+e.role+'</div></div>'
    +'<div class="kpi-dot '+kc+'"></div></div>'
    +rows+footer+'</div>';
}

function renderYear(d){
  var emps=d.employees.filter(function(e){ return e.status!=='Inactive'; });
  var yrStats=emps.map(function(e){ return sliceYear(e.tasks); });
  var totals=yrStats.map(function(s){ return s.total; });
  var avg=totals.length?Math.round(totals.reduce(function(a,b){return a+b;},0)/totals.length):0;
  document.getElementById('sub-lbl').textContent=new Date().getFullYear()+' · Team avg '+avg;
  document.getElementById('view-btns').style.display='flex';

  if(_view==='card'){
    var html='';
    emps.forEach(function(e,i){ html+=mkYearCard(e,yrStats[i],kpiClass(yrStats[i].total,avg)); });
    document.getElementById('dash').innerHTML=html;
  } else {
    var html='<div class="cmp-list">';
    emps.forEach(function(e,i){
      var s=yrStats[i];
      var kc=kpiClass(s.total,avg);
      html+='<div class="cmp-row">'
        +'<div class="cmp-name"><div class="kpi-dot '+kc+'" style="width:6px;height:6px"></div>'+e.name+'</div>'
        +STAGES.map(function(st){ return '<div class="cmp-val" style="color:'+(s[st.k]?'#f0f0f0':'#333')+'">'+s[st.k]+'</div>'; }).join('')
        +'</div>';
    });
    html+='</div>';
    document.getElementById('dash').innerHTML=html;
  }
}

/* ── render dispatcher ── */
function render(d){
  if(_tab==='week') renderWeek(d);
  else if(_tab==='month') renderMonth(d);
  else renderYear(d);
}

/* ── tabs / view wiring ── */
document.getElementById('tabs').addEventListener('click',function(ev){
  var btn=ev.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  _tab=btn.dataset.tab;
  if(_data) render(_data);
});

document.getElementById('view-btns').addEventListener('click',function(ev){
  var btn=ev.target.closest('.vbtn');
  if(!btn) return;
  document.querySelectorAll('.vbtn').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  _view=btn.dataset.view;
  if(_data) render(_data);
});

/* ── fetch ── */
function loadData(){
  return fetch('/api/creaitors/employee-stats?token='+_tok)
    .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json(); })
    .then(function(d){ _data=d; render(d); })
    .catch(function(e){ document.getElementById('dash').innerHTML='<div class="error">Failed to load: '+e.message+'</div>'; });
}

loadData();
</script>
</body>
</html>
