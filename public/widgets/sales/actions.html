<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (window.self === window.top) {
  window.stop(); document.open();
  document.write('<html><head><style>*{margin:0;padding:0}html,body{height:100%;background:#191919;}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:sans-serif;}</style></head><body><div style="color:#555;font-size:13px;letter-spacing:.5px;">RESTRICTED ACCESS</div><div style="color:#333;font-size:12px;">This widget is for Notion only.</div></body></html>');
  document.close();
}
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Action Items</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#191919; --card:#222222;
  --border:rgba(255,255,255,0.07);
  --g:#C8FF00; --amber:#FBBF24; --red:#FF6B6B; --blue:#60A5FA;
  --muted:rgba(255,255,255,0.38); --sub:rgba(255,255,255,0.55);
  --r:16px;
}
html,body{width:100%;}
body{background:var(--bg);font-family:'Satoshi',sans-serif;color:#fff;padding:18px 20px 28px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;}
.top-bar-left{display:flex;align-items:center;gap:10px;}
.wgt-title{font-size:17px;font-weight:900;letter-spacing:-0.4px;color:#fff;}
.wgt-org{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:100px;padding:3px 10px;}
.live-badge{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:100px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--sub);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0;animation:pulse 1.8s ease-in-out infinite;}

/* 3-col grid */
.actions-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:start;}
@media(max-width:860px){.actions-grid{grid-template-columns:1fr;}}

/* Column card */
.col-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;}

/* Column header */
.col-hdr{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.col-hdr-left{display:flex;align-items:center;gap:8px;}
.col-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.col-title{font-size:13px;font-weight:700;}
.col-count{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;}

/* Item list — scrollable */
.item-list{padding:10px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
.item-list::-webkit-scrollbar{width:3px;}
.item-list::-webkit-scrollbar-track{background:transparent;}
.item-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;}

/* Item row */
.item-row{border-radius:10px;padding:11px 14px;border-left:3px solid transparent;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;transition:background .12s;}
.item-row:hover{background:rgba(255,255,255,.055);}
.item-body{min-width:0;flex:1;}
.item-name{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.item-sub{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;flex-shrink:0;margin-top:1px;white-space:nowrap;}

/* Clear state */
.clear-state{padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.clear-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.15);}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;min-height:180px;flex-direction:column;gap:10px;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:11px;color:rgba(255,255,255,.25);font-weight:600;}
.footer{text-align:center;padding:22px 0 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <span class="wgt-title">Action Items</span>
    <span class="wgt-org">OPXIO</span>
  </div>
  <div class="live-badge"><span class="live-dot"></span>Live data</div>
</div>

<div id="main">
  <div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div></div>
</div>

<div class="footer">Widgets by Opxio.io</div>

<script>
var _tok = new URLSearchParams(location.search).get('token') || '';

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderCol(cfg, items){
  var count = items.length;
  var countHtml = count > 0
    ? '<span class="col-count" style="background:'+cfg.countBg+';color:'+cfg.color+';">'+count+'</span>'
    : '<span class="col-count" style="background:rgba(255,255,255,.05);color:var(--muted);">0</span>';

  var bodyHtml;
  if(count === 0){
    bodyHtml = '<div class="clear-state"><div class="clear-label">Nothing here right now</div></div>';
  } else {
    bodyHtml = '<div class="item-list">'
      + items.map(function(item){
          return '<div class="item-row" style="border-left-color:'+cfg.color+';">'
            +'<div class="item-body">'
            +'<div class="item-name">'+esc(item.name)+'</div>'
            +'<div class="item-sub">'+esc(item.sub)+'</div>'
            +'</div>'
            +(item.badge
              ? '<span class="item-badge" style="background:'+cfg.countBg+';color:'+cfg.color+';">'+esc(item.badge)+'</span>'
              : '')
            +'</div>';
        }).join('')
      +'</div>';
  }

  return '<div class="col-card">'
    +'<div class="col-hdr" style="background:'+cfg.hdrBg+';border-bottom:1px solid '+cfg.borderColor+';">'
      +'<div class="col-hdr-left">'
        +'<div class="col-icon" style="background:'+cfg.iconBg+';color:'+cfg.color+';">'+cfg.icon+'</div>'
        +'<span class="col-title">'+cfg.title+'</span>'
      +'</div>'
      +countHtml
    +'</div>'
    +bodyHtml
    +'</div>';
}

function render(d){
  var actions = d.actions || {};
  var hotLeads    = actions.hotLeads     || [];
  var stalledDeals= actions.stalledDeals || [];
  var followupDue = actions.followupDue  || [];

  var hotItems = hotLeads.map(function(name){
    return { name: name, sub: 'Hot lead — needs attention', badge: 'HOT' };
  });
  var stalledItems = stalledDeals.map(function(deal){
    var sub = deal.stage || '';
    if(deal.os && deal.os !== '—') sub += ' · ' + deal.os;
    return { name: deal.name, sub: sub, badge: deal.daysStale + 'd stale' };
  });
  var followItems = followupDue.map(function(f){
    return { name: f.name, sub: 'Follow-up overdue', badge: null };
  });

  var cfgHot = {
    title:'Hot Leads', icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg>',
    color:'var(--red)', countBg:'rgba(255,107,107,.12)',
    iconBg:'rgba(255,107,107,.15)', hdrBg:'rgba(255,107,107,.07)', borderColor:'rgba(255,107,107,.15)'
  };
  var cfgStalled = {
    title:'Stalled Deals', icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    color:'var(--amber)', countBg:'rgba(251,191,36,.12)',
    iconBg:'rgba(251,191,36,.15)', hdrBg:'rgba(251,191,36,.07)', borderColor:'rgba(251,191,36,.15)'
  };
  var cfgFollow = {
    title:'Follow-up Due', icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 8 22 2 16 2"/><line x1="22" y1="2" x2="15" y2="9"/><path d="M21 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.23h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l.77-.77a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 17z"/></svg>',
    color:'var(--blue)', countBg:'rgba(96,165,250,.12)',
    iconBg:'rgba(96,165,250,.15)', hdrBg:'rgba(96,165,250,.07)', borderColor:'rgba(96,165,250,.15)'
  };

  document.getElementById('main').innerHTML =
    '<div class="actions-grid">'
    + renderCol(cfgHot,     hotItems)
    + renderCol(cfgStalled, stalledItems)
    + renderCol(cfgFollow,  followItems)
    + '</div>';
}

var _loadCtrl = null;
var _cache    = null;
var CACHE_TTL = 5 * 60 * 1000;

function load(){
  if(_loadCtrl) _loadCtrl.abort();
  if(_cache && (Date.now() - _cache.ts) < CACHE_TTL){ render(_cache.data); return; }
  _loadCtrl = new AbortController();
  var sig = _loadCtrl.signal;
  var timer = setTimeout(function(){ _loadCtrl.abort(); }, 25000);
  var params = new URLSearchParams();
  if(_tok) params.set('token', _tok);
  fetch('https://api.opxio.io/api/clients/opxio/sales-pipeline?' + params.toString(), { signal: sig })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){ _cache = { data: data, ts: Date.now() }; render(data); })
    .catch(function(e){
      if(e.name === 'AbortError') return;
      document.getElementById('main').innerHTML='<div class="loading"><div style="color:var(--red);font-size:12px;font-weight:700;">Failed — '+esc(e.message)+'</div></div>';
    })
    .finally(function(){ clearTimeout(timer); });
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
