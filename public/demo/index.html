<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opxio — Live Demo</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0D0D;
      --surface: #161616;
      --border: rgba(255,255,255,.07);
      --lime: #AAFF00;
      --text: #fff;
      --muted: rgba(255,255,255,.38);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Satoshi', -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,13,13,.96);
      backdrop-filter: blur(12px);
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-sq {
      width: 22px;
      height: 22px;
      background: var(--lime);
      border-radius: 5px;
    }
    .hdr-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .demo-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .btn-book {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      background: var(--lime);
      color: #0D0D0D;
      border: none;
      border-radius: 7px;
      padding: 7px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn-book:hover { opacity: .82; }

    /* ── OS tabs ── */
    .os-nav {
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 0 36px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 56px;
      z-index: 90;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .os-nav::-webkit-scrollbar { display: none; }
    .os-tab {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0 18px;
      height: 44px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
      position: relative;
      top: 1px;
    }
    .os-tab:hover { color: rgba(255,255,255,.7); }
    .os-tab.active {
      color: var(--text);
      border-bottom-color: var(--lime);
    }

    /* ── Widget sub-tabs ── */
    .w-nav {
      display: flex;
      gap: 6px;
      padding: 14px 36px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }
    .w-nav::-webkit-scrollbar { display: none; }
    .w-tab {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      background: rgba(255,255,255,.04);
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 6px 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .12s, background .12s, border-color .12s;
    }
    .w-tab:hover {
      color: rgba(255,255,255,.7);
      background: rgba(255,255,255,.07);
    }
    .w-tab.active {
      color: var(--lime);
      background: rgba(170,255,0,.08);
      border-color: rgba(170,255,0,.18);
    }

    /* ── Viewer ── */
    .viewer {
      padding: 28px 36px 60px;
    }
    .viewer-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .viewer-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.3px;
    }
    .viewer-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.5;
    }
    .viewer-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 9px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .frame-wrap {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #191919;
    }
    .frame-wrap iframe {
      width: 100%;
      border: none;
      display: block;
    }

    /* ── Footer ── */
    .ftr {
      border-top: 1px solid var(--border);
      padding: 18px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ftr-l { font-size: 12px; color: var(--muted); }
    .ftr-l strong { color: var(--text); }
    .ftr-r { display: flex; gap: 16px; }
    .ftr-r a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: color .12s;
    }
    .ftr-r a:hover { color: var(--text); }
  </style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-sq"></div>
    Opxio
  </div>
  <div class="hdr-right">
    <span class="demo-label">Live demo</span>
    <a href="https://opxio.io/book" class="btn-book">Book Free Call</a>
  </div>
</header>

<nav class="os-nav" id="osNav">
  <button class="os-tab active" data-os="revenue">Revenue OS</button>
  <button class="os-tab" data-os="operations">Operations OS</button>
  <button class="os-tab" data-os="marketing">Marketing OS</button>
  <button class="os-tab" data-os="finance">Finance OS</button>
</nav>

<div class="w-nav" id="wNav"></div>

<div class="viewer">
  <div class="viewer-meta">
    <div>
      <div class="viewer-title" id="vTitle"></div>
      <div class="viewer-desc" id="vDesc"></div>
    </div>
    <div class="viewer-badge" id="vBadge"></div>
  </div>
  <div class="frame-wrap">
    <iframe id="vFrame" scrolling="no"></iframe>
  </div>
</div>

<footer class="ftr">
  <div class="ftr-l"><strong>Opxio</strong> &mdash; Business Operating Systems, built in Notion</div>
  <div class="ftr-r">
    <a href="https://opxio.io">opxio.io</a>
    <a href="https://opxio.io/book">Book a call</a>
    <a href="mailto:hello@opxio.io">hello@opxio.io</a>
  </div>
</footer>

<script>
const T = 'opxio_demo_showcase_2026'

const OS = {
  revenue: {
    widgets: [
      { name: 'Lead Pipeline',     desc: 'Every lead tracked from first touch to converted — funnel, outcomes, follow-ups.',  module: 'CRM & Pipeline',            path: 'revenue/leads',            height: 620, params: '?token='+T },
      { name: 'Deals Pipeline',    desc: 'Deal stages from incoming to delivered. Board view, won/lost, and values.',         module: 'CRM & Pipeline',            path: 'revenue/deals',            height: 640, params: '?token='+T },
      { name: 'Revenue Overview',  desc: 'Monthly revenue, deal stats, and top-line numbers in a single view.',               module: 'Billing & Payment Tracker', path: 'revenue/overview',         height: 500, params: '?token='+T },
      { name: 'Billing Tracker',   desc: 'Deposit pending, balance due, and collected payments across all invoices.',         module: 'Billing & Payment Tracker', path: 'revenue/billing',          height: 540, params: '?token='+T },
      { name: 'Top Products',      desc: 'Best-selling packages ranked by units. See which OS installs are winning.',         module: 'Product & Pricing Catalogue', path: 'revenue/topproducts',   height: 460, params: '?token='+T },
      { name: 'Upcoming Meetings', desc: 'Discovery calls, check-ins, and follow-ups scheduled for the week ahead.',         module: 'Meetings & Calls Log',      path: 'revenue/schedule',         height: 480, params: '?token='+T },
    ]
  },
  operations: {
    widgets: [
      { name: 'Active Projects',   desc: 'All active builds with phase progress, completion rates, and team assignments.',    module: 'Project & Task Management', path: 'operations/projects',      height: 600, params: '?token='+T },
      { name: 'Task Board',        desc: 'Kanban across all projects. Filter by project, status, or assignee.',              module: 'Project & Task Management', path: 'operations/kanban',        height: 560, params: '?token='+T },
      { name: 'Project Timeline',  desc: 'Gantt view across all active projects. Phase-by-phase delivery timeline.',         module: 'Project & Task Management', path: 'operations/gantt',         height: 540, params: '?token='+T },
      { name: 'Team Workload',     desc: 'Tasks per team member, completion rate, and capacity at a glance.',                module: 'Resource & Capacity Planner', path: 'operations/team',        height: 460, params: '?token='+T },
      { name: 'Project Progress',  desc: 'Phase-by-phase progress for a single project. Active and upcoming tasks.',         module: 'Client Delivery Tracker',   path: 'operations/progress',      height: 520, params: '?project=demo' },
    ]
  },
  marketing: {
    widgets: [
      { name: 'Marketing Command', desc: 'KPIs across all marketing — campaigns, content, and lead gen in one view.',        module: 'Marketing Performance Tracker', path: 'marketing/marketing-command', height: 560, params: '?token='+T },
      { name: 'Campaign Tracker',  desc: 'Active campaigns with status, budget, and performance overview.',                  module: 'Campaign Tracker',          path: 'marketing/campaigns',      height: 500, params: '?token='+T },
      { name: 'Content Pipeline',  desc: 'Content pieces by stage — briefed, in production, review, published.',            module: 'Content Production Tracker', path: 'marketing/content-pipeline', height: 520, params: '?token='+T },
    ]
  },
  finance: {
    widgets: [
      { name: 'Finance Snapshot',  desc: 'Income, expenses, and P&L — monthly trend and expense category breakdown.',        module: 'Finance Ledger',            path: 'revenue/finance',          height: 560, params: '?token='+T },
      { name: 'Invoice Tracker',   desc: 'Pending deposits, balance due, and collected payments. Full invoice pipeline.',   module: 'Invoice & Payment Tracker', path: 'revenue/billing',          height: 540, params: '?token='+T },
      { name: 'Top Products',      desc: 'Best-selling packages ranked by units sold and revenue contribution.',             module: 'Product & Pricing Catalogue', path: 'revenue/topproducts',   height: 460, params: '?token='+T },
    ]
  }
}

let currentOS = 'revenue'
let currentW  = 0

function renderWidgetTabs(os) {
  const nav = document.getElementById('wNav')
  nav.innerHTML = ''
  OS[os].widgets.forEach((w, i) => {
    const btn = document.createElement('button')
    btn.className = 'w-tab' + (i === 0 ? ' active' : '')
    btn.textContent = w.name
    btn.onclick = () => selectWidget(os, i)
    nav.appendChild(btn)
  })
}

function selectWidget(os, idx) {
  currentW = idx
  document.querySelectorAll('.w-tab').forEach((b, i) => b.classList.toggle('active', i === idx))

  const w = OS[os].widgets[idx]
  document.getElementById('vTitle').textContent  = w.name
  document.getElementById('vDesc').textContent   = w.desc
  document.getElementById('vBadge').textContent  = w.module

  const frame = document.getElementById('vFrame')
  frame.height = w.height
  frame.src    = '/widgets/' + w.path + '.html' + w.params
}

function selectOS(os) {
  currentOS = os
  document.querySelectorAll('.os-tab').forEach(b => b.classList.toggle('active', b.dataset.os === os))
  renderWidgetTabs(os)
  selectWidget(os, 0)
}

document.querySelectorAll('.os-tab').forEach(btn => {
  btn.addEventListener('click', () => selectOS(btn.dataset.os))
})

// Init
selectOS('revenue')
</script>
</body>
</html>
