<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (window.self === window.top) {
  window.stop(); document.open();
  document.write('<html><head><style>*{margin:0;padding:0}html,body{height:100%;background:#191919;}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:sans-serif;}</style></head><body><div style="color:#555;font-size:13px;letter-spacing:.5px;">RESTRICTED ACCESS</div><div style="color:#333;font-size:12px;">This widget is for Notion only.</div></body></html>');
  document.close();
}
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Targets</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #191919; --card: #222222;
  --border: rgba(255,255,255,0.07);
  --g: #C8FF00; --amber: #FBBF24; --red: #FF6B6B;
  --muted: rgba(255,255,255,0.38); --sub: rgba(255,255,255,0.55);
  --r: 14px;
}
html, body { width: 100%; min-height: 100%; background: var(--bg); font-family: 'Satoshi', sans-serif; color: #fff; }
body { padding: 14px 16px 16px; }

.top-bar { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
.wgt-title { font-size: 14px; font-weight: 900; letter-spacing: -0.3px; }
.org-pill { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 100px; padding: 3px 9px; }
.mn-wrap { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 100px; overflow: hidden; }
.mn-btn { background: none; border: none; color: var(--sub); cursor: pointer; padding: 5px 11px; font-size: 14px; font-weight: 700; line-height: 1; font-family: inherit; transition: color .15s; }
.mn-btn:hover:not(:disabled) { color: #fff; }
.mn-btn:disabled { opacity: .25; cursor: default; }
.mn-lbl { font-size: 11px; font-weight: 700; color: var(--sub); padding: 0 4px; min-width: 72px; text-align: center; }

.strip { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }

.tile {
  background: rgba(255,255,255,.025);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 14px 16px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  transition: border-color .2s;
}
.tile:hover { border-color: rgba(255,255,255,.13); }

.tile-type {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 4px; width: 100%;
}

.donut-wrap {
  position: relative; width: 88px; height: 88px;
  margin: 6px auto 10px;
}
.donut-wrap svg { display: block; }
.donut-pct {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; letter-spacing: -.8px; color: #fff;
}

.tile-nums { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
.tile-nums .sep { color: var(--muted); font-weight: 500; }
.tile-nums .tgt { color: var(--sub); }

.tile-status { font-size: 11px; font-weight: 700; margin-top: 7px; }
.tile-status.on-track { color: var(--g); }
.tile-status.at-risk  { color: var(--amber); }
.tile-status.behind   { color: var(--red); }

.empty { padding: 28px; text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; background: rgba(255,255,255,.02); border: 1px dashed rgba(255,255,255,.07); border-radius: var(--r); }

.skel { background: linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; display: block; }
@keyframes shimmer { to { background-position: -200% 0; } }

.err-bar { margin-top: 10px; padding: 10px 14px; background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.2); border-radius: 10px; font-size: 12px; color: #FF6B6B; display: none; }

@media (max-width: 800px) { .strip { grid-template-columns: 1fr 1fr; } }
@media (max-width: 500px) { .strip { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="top-bar">
  <span class="wgt-title">Targets</span>
  <span class="org-pill">OPXIO</span>
  <div class="mn-wrap">
    <button class="mn-btn" id="mnPrev" onclick="shiftMonth(-1)">&#8249;</button>
    <span class="mn-lbl" id="mnLbl">—</span>
    <button class="mn-btn" id="mnNext" onclick="shiftMonth(1)" disabled>&#8250;</button>
  </div>
</div>

<div id="strip" class="strip">
  <div class="tile"><span class="skel" style="height:11px;width:70px;margin-bottom:8px"></span><span class="skel" style="width:88px;height:88px;border-radius:50%;margin-bottom:12px"></span><span class="skel" style="height:13px;width:80px;margin-bottom:6px"></span><span class="skel" style="height:11px;width:60px"></span></div>
  <div class="tile"><span class="skel" style="height:11px;width:70px;margin-bottom:8px"></span><span class="skel" style="width:88px;height:88px;border-radius:50%;margin-bottom:12px"></span><span class="skel" style="height:13px;width:80px;margin-bottom:6px"></span><span class="skel" style="height:11px;width:60px"></span></div>
  <div class="tile"><span class="skel" style="height:11px;width:70px;margin-bottom:8px"></span><span class="skel" style="width:88px;height:88px;border-radius:50%;margin-bottom:12px"></span><span class="skel" style="height:13px;width:80px;margin-bottom:6px"></span><span class="skel" style="height:11px;width:60px"></span></div>
  <div class="tile"><span class="skel" style="height:11px;width:70px;margin-bottom:8px"></span><span class="skel" style="width:88px;height:88px;border-radius:50%;margin-bottom:12px"></span><span class="skel" style="height:13px;width:80px;margin-bottom:6px"></span><span class="skel" style="height:11px;width:60px"></span></div>
</div>

<div class="err-bar" id="errBar">Unable to load data. Check token or connection.</div>

<script>
const API = 'https://api.opxio.io/api/clients/opxio/targets'
const tok = new URLSearchParams(location.search).get('token') || ''
const now = new Date()
let offset = 0, ctrl = null

function monthState() {
  const d = new Date(now.getFullYear(), now.getMonth() + offset, 1)
  return { year: d.getFullYear(), month: d.getMonth(), d }
}
function fmt(d) { return d.toLocaleString('default', { month: 'short', year: 'numeric' }) }
function shiftMonth(delta) {
  offset = Math.min(0, offset + delta)
  document.getElementById('mnNext').disabled = offset >= 0
  document.getElementById('mnPrev').disabled = offset <= -24
  load()
}
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function fmtVal(val, type, currency) {
  if (type === 'Revenue') {
    const sym = currency === 'USD' ? 'USD ' : currency === 'SGD' ? 'SGD ' : currency === 'CAD' ? 'CAD ' : 'MYR '
    if (val >= 1000000) return sym + (val/1000000).toFixed(1).replace(/\.0$/,'') + 'M'
    if (val >= 1000)    return sym + Math.round(val/1000) + 'K'
    return sym + Math.round(val)
  }
  return String(Math.round(val))
}

function statusClass(pct) {
  if (pct >= 80) return 'on-track'
  if (pct >= 40) return 'at-risk'
  return 'behind'
}

function donutSvg(pct, sc) {
  var r = 34, cx = 44, cy = 44
  var circ = 2 * Math.PI * r
  var off  = circ * (1 - Math.min(pct, 100) / 100)
  var col  = sc === 'on-track' ? '#C8FF00' : sc === 'at-risk' ? '#FBBF24' : '#FF6B6B'
  return '<svg viewBox="0 0 88 88" width="88" height="88">'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="7"/>'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round"'
    + ' stroke-dasharray="'+circ.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"'
    + ' transform="rotate(-90 '+cx+' '+cy+')"/>'
    + '</svg>'
}

function render(data) {
  var strip = document.getElementById('strip')
  var targets = data.targets

  if (!targets || targets.length === 0) {
    strip.innerHTML = '<div class="empty" style="grid-column:1/-1">No targets set for this period</div>'
    return
  }

  strip.style.gridTemplateColumns = 'repeat('+Math.min(targets.length, 4)+', 1fr)'

  strip.innerHTML = targets.map(function(t) {
    var sc   = statusClass(t.pct)
    var aFmt = fmtVal(t.actual, t.type, t.currency)
    var tFmt = fmtVal(t.target, t.type, t.currency)
    var lbl  = sc === 'on-track' ? 'On track' : sc === 'at-risk' ? 'Needs push' : 'Behind'
    return '<div class="tile">'
      + '<div class="tile-type">'+esc(t.type)+'</div>'
      + '<div class="donut-wrap">'+donutSvg(t.pct, sc)+'<div class="donut-pct">'+t.pct+'%</div></div>'
      + '<div class="tile-nums">'+esc(aFmt)+'<span class="sep"> / </span><span class="tgt">'+esc(tFmt)+'</span></div>'
      + '<div class="tile-status '+sc+'">'+lbl+'</div>'
      + '</div>'
  }).join('')
}

async function load() {
  if (ctrl) ctrl.abort()
  ctrl = new AbortController()
  var ms = monthState()
  document.getElementById('mnLbl').textContent = fmt(ms.d)
  document.getElementById('mnNext').disabled = offset >= 0
  document.getElementById('mnPrev').disabled = offset <= -24
  document.getElementById('errBar').style.display = 'none'
  try {
    var r = await fetch(API+'?token='+encodeURIComponent(tok)+'&month='+ms.month+'&year='+ms.year, { signal: ctrl.signal })
    if (!r.ok) throw new Error('HTTP '+r.status)
    render(await r.json())
  } catch(e) {
    if (e.name === 'AbortError') return
    document.getElementById('errBar').style.display = 'block'
    console.error(e)
  }
}

load()
</script>
</body>
</html>
