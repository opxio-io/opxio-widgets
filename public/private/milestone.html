<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Journey Tracker</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Satoshi',-apple-system,sans-serif;background:#090909;color:#fff;padding:20px 18px 48px;overflow-y:auto;}
:root{
  --g:#AAFF00;--gm:rgba(170,255,0,.08);--gb:rgba(170,255,0,.2);
  --rose:#FF3E8F;--rosem:rgba(255,62,143,.08);--roseb:rgba(255,62,143,.18);
  --gold:#FFB800;--red:#FF4040;--blue:#5BC4FF;
  --card:#111;--border:rgba(255,255,255,.07);
}
/* Header */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.hdr h1{font-size:18px;font-weight:900;letter-spacing:-.04em;}
.hdr-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.38);margin-top:2px;}
.hdr-r{display:flex;align-items:center;gap:5px;}
.ts{font-size:9px;color:rgba(255,255,255,.25);font-weight:500;}
.ib{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.ib:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.ib svg{width:12px;height:12px;}
.ib.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
@media(max-width:580px){.stats{grid-template-columns:repeat(2,1fr);}}
.sc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px 12px 10px;}
.sc-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.4);margin-bottom:6px;}
.sc-row{display:flex;align-items:baseline;gap:4px;}
.sc-v{font-size:24px;font-weight:900;letter-spacing:-1.2px;line-height:1;}
.sc-v.sm{font-size:18px;}
.sc-u{font-size:12px;font-weight:700;color:rgba(255,255,255,.3);}
.sc-s{font-size:9.5px;font-weight:500;color:rgba(255,255,255,.35);margin-top:3px;}
/* Progress bar */
.xp-wrap{margin-bottom:20px;}
.xp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.xp-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:rgba(255,255,255,.3);}
.xp-pct{font-size:12px;font-weight:900;letter-spacing:-.04em;color:var(--g);}
/* Bar zone — ticks poke 5px above + below the track */
.xp-bar-zone{position:relative;padding:5px 0;margin-bottom:4px;}
.px-track{height:6px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;}
.px-fill{height:100%;width:0%;transition:width 1.2s cubic-bezier(.4,0,.2,1);
  background-image:repeating-linear-gradient(90deg,var(--g) 0,var(--g) 10px,rgba(0,0,0,.45) 10px,rgba(0,0,0,.45) 12px);
  background-size:12px 100%;box-shadow:0 0 6px rgba(170,255,0,.15);}
/* Tick markers — sit absolute inside .xp-bar-zone */
.wp-tick{position:absolute;top:0;bottom:0;width:2px;transform:translateX(-50%);background:rgba(255,255,255,.18);border-radius:1px;pointer-events:none;}
.wp-tick.wp-act{background:var(--g);box-shadow:0 0 5px rgba(170,255,0,.45);}
/* Labels row */
.xp-waypoints{position:relative;height:34px;}
.wp-lbl{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;color:rgba(255,255,255,.52);white-space:nowrap;background:rgba(255,255,255,.07);border-radius:3px;padding:2px 6px;line-height:1.4;}
.wp-lbl.wp-act{color:var(--g);background:rgba(170,255,0,.1);}
.xp-ends{display:flex;justify-content:space-between;margin-top:6px;}
.xp-e{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.22);}
.xp-e.now{color:rgba(170,255,0,.55);}
/* Section label */
.sec{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.sec span{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.28);}
.sec::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}
/* Active milestone card */
.active-card{background:var(--card);border:1px solid rgba(170,255,0,.13);border-radius:12px;padding:15px;margin-bottom:14px;position:relative;}
.active-card::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(170,255,0,.3),transparent);}
.ac-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:11px;}
.ac-stage{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.27);margin-bottom:4px;}
.ac-wt{display:flex;align-items:baseline;gap:5px;}
.ac-wv{font-size:36px;font-weight:900;letter-spacing:-2px;line-height:1;color:var(--g);}
.ac-wu{font-size:13px;font-weight:700;color:rgba(170,255,0,.42);}
.ac-top-r{text-align:right;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.badge.active{background:var(--gm);color:var(--g);border:1px solid var(--gb);}
.badge .dot{width:4px;height:4px;border-radius:50%;background:currentColor;animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.ac-days{font-size:13px;font-weight:900;letter-spacing:-.02em;margin-top:5px;}
.ac-days.ok{color:var(--g);}
.ac-days.warn{color:var(--red);}
.ac-dl{font-size:8.5px;color:rgba(255,255,255,.27);margin-top:2px;}
.ac-bar{margin-bottom:12px;}
.px-sm{height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.px-sm-fill{height:100%;width:0%;transition:width 1.3s ease;
  background-image:repeating-linear-gradient(90deg,var(--g) 0,var(--g) 6px,rgba(0,0,0,.5) 6px,rgba(0,0,0,.5) 8px);
  background-size:8px 100%;box-shadow:0 0 4px rgba(170,255,0,.15);}
.ac-bar-sub{font-size:8.5px;color:rgba(255,255,255,.27);margin-top:4px;}
.rwd-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:rgba(255,255,255,.27);margin-bottom:7px;}
/* Ticket */
.ticket{display:flex;background:#181818;border:1px solid rgba(255,255,255,.13);border-radius:8px;overflow:visible;position:relative;margin-bottom:7px;}
.ticket::before,.ticket::after{content:'';position:absolute;right:calc(62px - 5.5px);width:11px;height:11px;background:#111;border-radius:50%;border:1px solid rgba(255,255,255,.1);}
.ticket::before{top:-5.5px;}.ticket::after{bottom:-5.5px;}
.ticket.upcoming-ticket .t-dish{filter:blur(5px);user-select:none;}
.ticket.upcoming-ticket::before,.ticket.upcoming-ticket::after{display:none;}
.ticket-main{flex:1;padding:9px 12px;border-right:1.5px dashed rgba(255,255,255,.11);}
.ticket-stub{width:62px;padding:8px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;}
.t-cat{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px;}
.t-cat.main-meal{color:#FF7040;}.t-cat.dessert{color:var(--rose);}.t-cat.drinks{color:var(--blue);}.t-cat.fine-dining{color:var(--gold);}.t-cat.snack{color:#FFD232;}
.t-dish{font-size:14px;font-weight:900;letter-spacing:-.03em;color:#fff;line-height:1.2;}
.t-stub-lbl{font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.28);text-align:center;line-height:1.4;}
.t-stub-wt{font-size:13px;font-weight:900;letter-spacing:-.04em;color:rgba(255,255,255,.58);text-align:center;line-height:1.1;}
.t-stub-wu{font-size:7.5px;font-weight:700;color:rgba(255,255,255,.25);text-align:center;}
.t-stub-lock{font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.25);text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:1px 4px;margin-top:1px;}
.t-stub-earned{font-size:6.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(170,255,0,.5);text-align:center;border:1px solid rgba(170,255,0,.2);border-radius:3px;padding:1px 4px;margin-top:1px;}
.tba{font-size:10px;color:rgba(255,255,255,.2);font-style:italic;padding:4px 0;}
/* Bonus strip */
.bonus-strip{background:#0d0d07;border:1px solid rgba(255,184,0,.12);border-radius:7px;padding:10px 12px;margin-top:6px;}
.bonus-strip.done{border-color:rgba(255,184,0,.4);background:#131100;}
.bs-lbl{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--gold);margin-bottom:3px;}
.bs-tgt{font-size:8.5px;font-weight:600;color:rgba(255,255,255,.3);margin-bottom:2px;}
.bs-txt{font-size:12px;font-weight:700;color:#fff;}
.bs-hint{font-size:8.5px;color:rgba(255,184,0,.3);margin-top:4px;}
/* Roadmap */
.roadmap{display:flex;flex-direction:column;gap:5px;margin-bottom:20px;}
.rm-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.rm-l{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.rm-stage{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.2);flex-shrink:0;}
.rm-wt{font-size:15px;font-weight:900;letter-spacing:-.04em;color:rgba(255,255,255,.48);flex-shrink:0;}
.rm-wu{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);margin-left:1px;flex-shrink:0;}
.rm-rwd{font-size:8.5px;color:rgba(255,255,255,.18);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rm-r{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;}
.rm-days{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);}
.rm-dl{font-size:8px;color:rgba(255,255,255,.18);margin-top:1px;}
/* Log */
.log-list{display:flex;flex-direction:column;gap:5px;}
.log-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:9px 12px;}
.log-date{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.35);min-width:75px;}
.log-w{display:flex;align-items:baseline;gap:3px;}
.log-wv{font-size:15px;font-weight:900;letter-spacing:-.03em;color:var(--g);}
.log-wu{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);}
.log-bmi{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.28);margin-left:auto;}
/* Log weight form */
.log-btn{display:flex;align-items:center;gap:6px;background:var(--gm);border:1px solid var(--gb);border-radius:7px;padding:7px 12px;font-family:inherit;font-size:10px;font-weight:700;color:var(--g);cursor:pointer;letter-spacing:.06em;transition:all .15s;margin-bottom:14px;}
.log-btn:hover{background:rgba(170,255,0,.14);border-color:rgba(170,255,0,.35);}
.log-btn svg{width:11px;height:11px;flex-shrink:0;}
.log-form{background:var(--card);border:1px solid rgba(170,255,0,.14);border-radius:10px;padding:14px 15px;margin-bottom:14px;}
.log-form-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.lf-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:80px;}
.lf-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);}
.lf-input{background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:13px;font-weight:700;color:#fff;outline:none;transition:border-color .15s;width:100%;}
.lf-input:focus{border-color:rgba(170,255,0,.4);}
.lf-input::placeholder{color:rgba(255,255,255,.2);font-weight:500;}
.lf-submit{background:var(--g);border:none;border-radius:6px;padding:7px 16px;font-family:inherit;font-size:11px;font-weight:900;color:#090909;cursor:pointer;letter-spacing:.04em;transition:opacity .15s;white-space:nowrap;flex-shrink:0;}
.lf-submit:hover{opacity:.85;}
.lf-submit:disabled{opacity:.4;cursor:not-allowed;}
.lf-msg{font-size:9.5px;font-weight:600;margin-top:8px;}
.lf-msg.ok{color:var(--g);}
.lf-msg.fail{color:var(--red);}
.err{background:rgba(255,50,50,.06);border:1px solid rgba(255,50,50,.12);border-radius:7px;padding:10px 13px;font-size:10px;color:rgba(255,100,100,.7);margin-bottom:12px;}
.empty{font-size:10px;color:rgba(255,255,255,.22);font-style:italic;}
footer{display:block;text-align:center;padding:20px 0 0;font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.05);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:99px;}
</style>
</head><body>

<div class="hdr">
  <div>
    <h1>Weight Loss Journey</h1>
    <div class="hdr-sub" id="sub">Loading…</div>
  </div>
  <div class="hdr-r">
    <span class="ts" id="ts"></span>
    <button class="ib" onclick="doRefresh()" id="rb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
</div>

<div id="err-wrap"></div>

<div class="stats">
  <div class="sc"><div class="sc-lbl">Current Weight</div><div class="sc-row"><div class="sc-v" id="s-cw">—</div><div class="sc-u">kg</div></div><div class="sc-s">current</div></div>
  <div class="sc"><div class="sc-lbl">Total Lost</div><div class="sc-row"><div class="sc-v" id="s-lost">—</div><div class="sc-u">kg</div></div><div class="sc-s">from 125 kg</div></div>
  <div class="sc"><div class="sc-lbl">BMI</div><div class="sc-row"><div class="sc-v sm" id="s-bmi">—</div></div><div class="sc-s" id="s-bmi-lbl">—</div></div>
  <div class="sc"><div class="sc-lbl">To Next Target</div><div class="sc-row"><div class="sc-v sm" id="s-next">—</div><div class="sc-u" id="s-next-u">kg</div></div><div class="sc-s" id="s-next-lbl">—</div></div>
</div>

<div class="xp-wrap" id="xp-wrap" style="display:none">
  <div class="xp-top"><span class="xp-lbl">Overall Progress</span><span class="xp-pct" id="xp-pct">0%</span></div>
  <div class="xp-bar-zone" id="xp-bar-zone">
    <div class="px-track"><div class="px-fill" id="xp-fill"></div></div>
  </div>
  <div class="xp-waypoints" id="xp-waypoints"></div>
  <div class="xp-ends">
    <span class="xp-e">125 kg</span>
    <span class="xp-e now" id="xp-now"></span>
    <span class="xp-e" id="xp-goal"></span>
  </div>
</div>

<div class="sec" id="active-sec" style="display:none"><span>Current Milestone</span></div>
<div id="active-wrap"></div>

<div class="sec" id="roadmap-sec" style="display:none"><span>Upcoming</span></div>
<div class="roadmap" id="roadmap"></div>

<div class="sec"><span>Weight Log</span></div>
<button class="log-btn" onclick="toggleLogForm()" id="log-btn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  Log Weight
</button>
<div class="log-form" id="log-form" style="display:none">
  <div class="log-form-row">
    <div class="lf-group" style="max-width:100px">
      <label class="lf-lbl">Weight (kg)</label>
      <input class="lf-input" type="number" id="lf-weight" step="0.01" min="30" max="200" placeholder="88.25"/>
    </div>
    <div class="lf-group" style="max-width:130px">
      <label class="lf-lbl">Date</label>
      <input class="lf-input" type="date" id="lf-date"/>
    </div>
    <button class="lf-submit" onclick="submitLog()" id="lf-sub">Save</button>
  </div>
  <div id="lf-msg" style="display:none"></div>
</div>
<div class="log-list" id="log-list"></div>

<footer>Opxio.io</footer>

<script>
const _tok = new URLSearchParams(location.search).get('token')||'';
function apiUrl(){ return '/api/private/milestone'+(_tok?'?token='+encodeURIComponent(_tok):''); }
const CAT_CSS={'Main Meal':'main-meal','Dessert':'dessert','Drinks':'drinks','Fine Dining':'fine-dining','Snack':'snack'};
const START=125;

function strip(s){ return s?s.replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27BF}]|\uFE0F/gu,'').trim():s; }
function bmiLabel(v){ if(!v)return''; if(v<18.5)return'Underweight'; if(v<25)return'Healthy Range'; if(v<30)return'Overweight'; return'Obese'; }
function daysLeft(ds){ if(!ds)return null; const n=new Date();n.setHours(0,0,0,0); const d=new Date(ds);d.setHours(0,0,0,0); return Math.round((d-n)/86400000); }
function fmtDate(ds,sh){ if(!ds)return''; return new Date(ds).toLocaleDateString('en-MY',sh?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'}); }
function shortLoc(loc){
  if(!loc)return'';
  if(loc.length<=28)return loc;
  const parts=loc.split(',').map(p=>p.trim()).filter(p=>p.length>0);
  if(parts.length>=2){ const city=parts[parts.length-2].replace(/^\d+\s*/,''); if(city.length>2&&city.length<=20)return city; }
  if(parts.length>=1&&parts[parts.length-1].length<=15)return parts[parts.length-1];
  return loc.substring(0,26)+'…';
}
function daysBadge(days,status){
  if(status==='Achieved'||status==='Claimed') return '<div class="ac-days ok">Completed</div>';
  if(days===null)return'';
  if(days<0)  return`<div class="ac-days warn">${Math.abs(days)}d overdue</div>`;
  if(days===0)return'<div class="ac-days warn">Due today</div>';
  if(days<=10)return`<div class="ac-days warn">${days} days left</div>`;
  return`<div class="ac-days ok">${days} days left</div>`;
}

function ticketHtml(dish,cat,targetWeight,stageIdx,milestoneStatus){
  const catCls=CAT_CSS[cat]||'';
  const isUpcoming=milestoneStatus==='Upcoming';
  const isEarned=milestoneStatus==='Achieved'||milestoneStatus==='Claimed';
  const cls=isUpcoming?'upcoming-ticket':'';
  const stubStatus=isEarned
    ?`<div class="t-stub-earned">Earned</div>`
    :`<div class="t-stub-lock">Locked</div>`;
  return`<div class="ticket ${cls}">
    <div class="ticket-main">
      ${cat?`<div class="t-cat ${catCls}">${cat}</div>`:''}
      <div class="t-dish">${strip(dish)||'TBA'}</div>
    </div>
    <div class="ticket-stub">
      <div class="t-stub-lbl">Stage ${stageIdx+1}</div>
      <div class="t-stub-wt">${targetWeight??'—'}</div>
      <div class="t-stub-wu">kg</div>
      ${stubStatus}
    </div>
  </div>`;
}

function renderTickets(m,idx){
  const main=m.rewards.filter(r=>r.type!=='Bonus Reward');
  if(main.length) return main.map(r=>ticketHtml(r.dish,r.category,m.targetWeight,idx,m.status)).join('');
  if(m.foodReward) return ticketHtml(m.foodReward,null,m.targetWeight,idx,m.status);
  return'<div class="tba">Reward TBA</div>';
}

function bonusHtml(m){
  if(!m.bonusTarget)return'';
  const done=m.bonusAchieved;
  return`<div class="bonus-strip${done?' done':''}">
    <div class="bs-lbl">Bonus Reward${done?(m.bonusClaimed?' — Claimed':' — Unlocked!'):''}</div>
    <div class="bs-tgt">Drop below ${m.bonusTarget} kg</div>
    <div class="bs-txt">${strip(m.bonusReward)||'TBA'}</div>
    ${!done?`<div class="bs-hint">Reach ${m.bonusTarget} kg to unlock</div>`:''}
  </div>`;
}

function activeCardHtml(m,idx,cw){
  const days=daysLeft(m.deadline);
  const barPct=cw&&m.targetWeight?Math.min(100,Math.max(0,(START-cw)/(START-m.targetWeight)*100)):0;
  const toGo=cw&&m.targetWeight?(cw-m.targetWeight).toFixed(2):null;
  return`<div class="active-card">
    <div class="ac-top">
      <div>
        <div class="ac-stage">Stage ${idx+1}</div>
        <div class="ac-wt"><div class="ac-wv">${m.targetWeight??'—'}</div><div class="ac-wu">kg</div></div>
      </div>
      <div class="ac-top-r">
        <span class="badge active"><span class="dot"></span>Active</span>
        ${daysBadge(days,m.status)}
        ${m.deadline?`<div class="ac-dl">${fmtDate(m.deadline,false)}</div>`:''}
      </div>
    </div>
    <div class="ac-bar">
      <div class="px-sm"><div class="px-sm-fill" style="width:${barPct.toFixed(1)}%"></div></div>
      ${toGo!==null?`<div class="ac-bar-sub">${toGo} kg to go</div>`:''}
    </div>
    <div class="rwd-lbl">Reward</div>
    ${renderTickets(m,idx)}
    ${bonusHtml(m)}
  </div>`;
}

function roadmapHtml(m,idx){
  const days=daysLeft(m.deadline);
  const dStr=days===null?'':days>0?`${days}d left`:days===0?'Today':`${Math.abs(days)}d late`;
  const rwdName=m.rewards.find(r=>r.type!=='Bonus Reward')?.dish||m.foodReward||'';
  return`<div class="rm-item">
    <div class="rm-l">
      <span class="rm-stage">Stage ${idx+1}</span>
      <span class="rm-wt">${m.targetWeight??'—'}</span><span class="rm-wu">kg</span>
      ${rwdName?`<span class="rm-rwd">· ${strip(rwdName)}</span>`:''}
    </div>
    <div class="rm-r">
      ${dStr?`<div class="rm-days">${dStr}</div>`:''}
      ${m.deadline?`<div class="rm-dl">${fmtDate(m.deadline,true)}</div>`:''}
    </div>
  </div>`;
}

async function loadData(){
  try{
    const res=await fetch(apiUrl());
    const d=await res.json();
    if(d.error){ document.getElementById('err-wrap').innerHTML=`<div class="err">Error — ${d.error}</div>`; return; }
    document.getElementById('err-wrap').innerHTML='';

    const cw=d.currentWeight;
    document.getElementById('sub').textContent=`Started at ${d.startWeight} kg · ${d.startDate}`;
    document.getElementById('s-cw').textContent=cw??'—';
    document.getElementById('s-lost').textContent=d.lostTotal??'—';
    document.getElementById('s-bmi').textContent=d.currentBMI??'—';
    document.getElementById('s-bmi-lbl').textContent=bmiLabel(d.currentBMI);

    const ms=d.milestones||[];
    const active=ms.find(m=>m.status==='Active');
    const upcoming=ms.filter(m=>m.status==='Upcoming');

    if(active&&cw){
      const diff=+(cw-active.targetWeight).toFixed(2);
      document.getElementById('s-next').textContent=diff>0?diff:'Done';
      document.getElementById('s-next-u').textContent=diff>0?'kg':'';
      document.getElementById('s-next-lbl').textContent=diff>0?`to ${active.targetWeight} kg`:'Target hit!';
    }

    // Progress bar + waypoints (goal = 60 kg)
    const goal=d.goalWeight||60;
    if(d.journeyProgress!==null&&cw){
      document.getElementById('xp-wrap').style.display='';
      const pct=Math.min(Math.max(d.journeyProgress,0),100);
      document.getElementById('xp-pct').textContent=pct.toFixed(1)+'%';
      document.getElementById('xp-now').textContent=cw+' kg';
      document.getElementById('xp-goal').textContent=goal+' kg';
      setTimeout(()=>{ document.getElementById('xp-fill').style.width=pct+'%'; },80);
      const barZone=document.getElementById('xp-bar-zone');
      const wpc=document.getElementById('xp-waypoints');
      // Assign stagger rows to avoid overlap on closely-spaced waypoints
      const wpItems=ms.filter(m=>m.targetWeight);
      // Greedy row assignment: place each label on the lowest row where it won't overlap previous label on that row
      const rowLastRight={};  // row → rightmost pixel edge of last label placed there
      const BAR_W=320; // conservative estimate of bar width in px
      const LBL_W_PX=48; // approx width of "XX kg" label at 10px bold + 12px padding
      wpItems.forEach((m,i)=>{
        const wpPct=Math.min(((START-m.targetWeight)/(START-goal))*100,100);
        const isAct=m.status==='Active';
        const centerPx=wpPct/100*BAR_W;
        // Find a row (0,1,2) where this label fits without overlapping
        let row=0;
        for(let r=0;r<=2;r++){
          const lastRight=rowLastRight[r]??-999;
          if(centerPx-LBL_W_PX/2 >= lastRight+4){ row=r; break; }
          row=r+1; // fallback: push to next row
        }
        rowLastRight[row]=(rowLastRight[row]??-999);
        rowLastRight[row]=centerPx+LBL_W_PX/2;
        // Tick pokes through the bar zone
        const tick=document.createElement('div');
        tick.className='wp-tick'+(isAct?' wp-act':'');
        tick.style.left=wpPct.toFixed(1)+'%';
        barZone.appendChild(tick);
        // Label — staggered vertical position by row
        const lbl=document.createElement('div');
        lbl.className='wp-lbl'+(isAct?' wp-act':'');
        lbl.style.left=wpPct.toFixed(1)+'%';
        lbl.style.top=(row*16)+'px';
        lbl.textContent=m.targetWeight+' kg';
        wpc.appendChild(lbl);
      });
    }

    // Active milestone
    if(active){
      document.getElementById('active-sec').style.display='';
      document.getElementById('active-wrap').innerHTML=activeCardHtml(active,ms.indexOf(active),cw);
    } else {
      document.getElementById('active-wrap').innerHTML='<div class="empty" style="margin-bottom:16px">No active milestone.</div>';
    }

    // Roadmap
    if(upcoming.length){
      document.getElementById('roadmap-sec').style.display='';
      document.getElementById('roadmap').innerHTML=upcoming.map(m=>roadmapHtml(m,ms.indexOf(m))).join('');
    }

    // Log
    const logs=(d.logs||[]).slice(0,5);
    if(logs.length){
      document.getElementById('log-list').innerHTML=logs.map(l=>{
        const ds=l.date?fmtDate(l.date,false):'—';
        return`<div class="log-row"><span class="log-date">${ds}</span><div class="log-w"><span class="log-wv">${l.weight??'—'}</span><span class="log-wu">kg</span></div>${l.bmi?`<span class="log-bmi">BMI ${l.bmi}</span>`:''}</div>`;
      }).join('');
    }

    document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('err-wrap').innerHTML=`<div class="err">Load failed — ${e.message}</div>`;
  }
}

function doRefresh(){
  const b=document.getElementById('rb');
  if(b)b.classList.add('spinning');
  loadData().finally(()=>{ const b2=document.getElementById('rb'); if(b2)b2.classList.remove('spinning'); });
}

function toggleLogForm(){
  const f=document.getElementById('log-form');
  const open=f.style.display==='none';
  f.style.display=open?'':'none';
  if(open){
    // default date to today
    const inp=document.getElementById('lf-date');
    if(!inp.value) inp.value=new Date().toISOString().split('T')[0];
    document.getElementById('lf-weight').focus();
    document.getElementById('lf-msg').style.display='none';
  }
}

async function submitLog(){
  const wEl=document.getElementById('lf-weight');
  const dEl=document.getElementById('lf-date');
  const msgEl=document.getElementById('lf-msg');
  const btn=document.getElementById('lf-sub');
  const w=parseFloat(wEl.value);
  if(!w||isNaN(w)){ msgEl.className='lf-msg fail'; msgEl.textContent='Enter a valid weight.'; msgEl.style.display=''; return; }
  btn.disabled=true; btn.textContent='Saving…';
  msgEl.style.display='none';
  try{
    const res=await fetch('/api/private/log-weight?token='+encodeURIComponent(_tok),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({weight:w, date:dEl.value||undefined})
    });
    const data=await res.json();
    if(data.success){
      msgEl.className='lf-msg ok'; msgEl.textContent=`Logged ${w} kg on ${data.date}.`; msgEl.style.display='';
      wEl.value='';
      setTimeout(()=>{ document.getElementById('log-form').style.display='none'; loadData(); },1200);
    } else {
      msgEl.className='lf-msg fail'; msgEl.textContent=data.error||'Failed.'; msgEl.style.display='';
    }
  }catch(e){
    msgEl.className='lf-msg fail'; msgEl.textContent='Network error.'; msgEl.style.display='';
  }
  btn.disabled=false; btn.textContent='Save';
}

loadData();
setInterval(loadData,5*60*1000);
</script>
</body></html>
