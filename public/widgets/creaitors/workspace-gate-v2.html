<style>
*{margin:0;padding:0;box-sizing:border-box;}html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 28px;background:#191919;color:#fff;overflow-y:auto;overflow-x:hidden;height:100%;display:flex;align-items:center;justify-content:center;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.12);--gb:rgba(170,255,0,.18);--muted:rgba(255,255,255,.4);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:999px;}

.gate{width:100%;max-width:420px;}

.card{background:#1E1E1E;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:28px;transition:border-color .2s;}
.card:hover{border-color:rgba(170,255,0,.08);}

.card-hdr{text-align:center;margin-bottom:20px;}
.card-hdr .icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;transition:all .15s;}
.card-hdr .icon svg{width:18px;height:18px;stroke:var(--g);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:4px;}
.h-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.03em;}
.h-sub{font-size:11px;font-weight:500;color:rgba(255,255,255,.2);margin-top:4px;}

.field{margin-bottom:14px;}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;display:block;}

.field select,
.field input{
  width:100%;padding:12px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  color:#fff;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:500;
  outline:none;
  transition:all .15s;
  -webkit-appearance:none;appearance:none;
}
.field select{
  cursor:pointer;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 14px center;
  padding-right:34px;
}
.field select option{background:#1E1E1E;color:#fff;}
.field select optgroup{color:rgba(255,255,255,.3);font-weight:700;font-size:11px;}

/* Custom dropdown */
.cs-wrap{position:relative;width:100%;}
.cs-trigger{
  width:100%;padding:12px 34px 12px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  color:rgba(255,255,255,.25);
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:500;
  outline:none;cursor:pointer;
  transition:all .15s;text-align:left;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cs-trigger.selected{color:#fff;}
.cs-trigger:focus,.cs-trigger.open{border-color:rgba(170,255,0,.2);background-color:rgba(170,255,0,.08);}
.cs-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:999;
  background:#1E1E1E;border:1px solid rgba(255,255,255,.1);
  border-radius:8px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:none;max-height:240px;overflow-y:auto;
}
.cs-dropdown.open{display:block;}
.cs-group-label{
  padding:8px 12px 4px;
  font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;
  color:rgba(255,255,255,.25);
}
.cs-option{
  padding:10px 14px;
  font-size:13px;font-weight:500;color:rgba(255,255,255,.75);
  cursor:pointer;transition:background .1s;
}
.cs-option:hover{background:rgba(255,255,255,.06);color:#fff;}
.cs-option.selected{background:rgba(170,255,0,.08);color:var(--g);}
.field input::placeholder{color:rgba(255,255,255,.2);}
.field select:focus,.field input:focus{border-color:rgba(170,255,0,.2);background:rgba(170,255,0,.08);}

/* Password field with eye toggle */
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
  display:flex;align-items:center;justify-content:center;
}
.pw-toggle svg{width:16px;height:16px;stroke:rgba(255,255,255,.25);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s;}
.pw-toggle:hover svg{stroke:rgba(255,255,255,.5);}

.btn{
  width:100%;padding:12px 14px;
  background:var(--gm);
  border:1px solid var(--gb);
  border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:700;
  color:var(--g);
  cursor:pointer;
  transition:all .15s;
  margin-top:6px;
  letter-spacing:-.01em;
}
.btn:hover{background:rgba(170,255,0,.18);}
.btn:active{background:rgba(170,255,0,.25);}
.btn:disabled{opacity:.2;cursor:not-allowed;}
.btn.loading{pointer-events:none;opacity:.5;}

.btn-secondary{
  width:100%;padding:10px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:12px;font-weight:600;
  color:rgba(255,255,255,.3);
  cursor:pointer;
  transition:all .15s;
  margin-top:8px;
}
.btn-secondary:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);}

.btn-forgot{
  width:100%;padding:8px;margin-top:10px;
  background:none;border:none;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,.2);
  cursor:pointer;transition:color .15s;
  text-align:center;
}
.btn-forgot:hover{color:rgba(255,255,255,.4);}

.msg{font-size:11px;font-weight:600;margin-top:12px;text-align:center;opacity:0;transition:opacity .2s;}
.msg.error{color:#FF6B6B;opacity:1;}
.msg.success{color:var(--g);opacity:1;}

/* Backup code display */
.backup-box{
  background:rgba(0,0,0,.3);
  border:1px dashed rgba(170,255,0,.25);
  border-radius:10px;
  padding:16px;margin:16px 0;
  text-align:center;
}
.backup-box .code-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:8px 0 4px;
}
.backup-box .code{
  font-size:28px;font-weight:900;
  letter-spacing:.15em;
  color:var(--g);
  font-family:'Satoshi',monospace;
}
.backup-box .copy-btn{
  background:rgba(170,255,0,.1);border:1px solid rgba(170,255,0,.15);
  border-radius:6px;padding:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.backup-box .copy-btn:hover{background:rgba(170,255,0,.2);}
.backup-box .copy-btn svg{width:16px;height:16px;stroke:var(--g);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.backup-box .hint{
  font-size:10px;font-weight:600;
  color:rgba(255,255,255,.25);
  text-transform:uppercase;
  letter-spacing:.1em;
}
.backup-warning{
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,.35);
  line-height:1.5;
  margin-bottom:16px;
  text-align:center;
}

/* Success state */
.success-state{text-align:center;}
.success-state .check{width:48px;height:48px;border-radius:12px;background:var(--gm);border:1px solid var(--gb);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
.success-state .check svg{width:24px;height:24px;stroke:var(--g);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.success-state .welcome{font-size:22px;font-weight:900;letter-spacing:-.03em;color:#fff;margin-bottom:2px;}
.success-state .verified{font-size:11px;font-weight:600;color:rgba(170,255,0,.5);margin-bottom:18px;}

.open-link{
  display:block;width:100%;padding:14px;
  background:var(--g);
  border:none;border-radius:8px;
  font-family:'Satoshi',-apple-system,sans-serif;
  font-size:14px;font-weight:800;
  color:#191919;
  text-decoration:none;text-align:center;
  transition:opacity .15s;
  letter-spacing:-.01em;
}
.open-link:hover{opacity:.85;}

.skeleton{background:rgba(255,255,255,.04);border-radius:8px;height:44px;margin-bottom:14px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:.4;}50%{opacity:.8;}}

.wgt-footer{text-align:center;padding:20px 0 4px;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
.wgt-footer a{color:rgba(255,255,255,.1);text-decoration:none;}

.hidden{display:none;}
</style>
</head>

<script>
// ── CLIPBOARD HELPER ──
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return copyToClipboard(text);
  }
  // Fallback for iframes / restricted contexts
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

// ── SVG ICONS ──
const ICO = {
  eyeOff: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
  eyeOn: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  copy: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polyline points="20 6 9 17 4 12"/></svg>'
};

// ── CONFIG ──
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';
const API = 'https://api.opxio.io/api/clients/creaitors';

// ── STATE ──
let staffList = [];
let currentStaff = null;
let currentPassword = '';

// ── HELPERS ──
async function post(endpoint, body) {
  const r = await fetch(`${API}/${endpoint}?token=${TOKEN}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return { status: r.status, data: await r.json() };
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function flash(el, cls, text, ms) {
  el.className = 'msg ' + cls;
  el.textContent = text;
  if (ms) setTimeout(() => { el.className = 'msg'; }, ms);
}

function buildSelect() {
  const depts = {};
  staffList.forEach(s => {
    if (!depts[s.dept]) depts[s.dept] = [];
    depts[s.dept].push(s);
  });
  let html = '<option value="" disabled selected>Choose your name</option>';
  Object.entries(depts).forEach(([dept, members]) => {
    html += `<optgroup label="${esc(dept)}">`;
    members.forEach(m => { html += `<option value="${m.id}">${esc(m.name)}</option>`; });
    html += '</optgroup>';
  });
  return html;
}

function buildCustomSelect(id) {
  const depts = {};
  staffList.forEach(s => {
    if (!depts[s.dept]) depts[s.dept] = [];
    depts[s.dept].push(s);
  });
  let opts = '';
  Object.entries(depts).forEach(([dept, members]) => {
    opts += `<div class="cs-group-label">${esc(dept)}</div>`;
    members.forEach(m => {
      opts += `<div class="cs-option" data-value="${m.id}">${esc(m.name)}</div>`;
    });
  });
  return `<div class="cs-wrap" id="${id}-wrap">
    <button type="button" class="cs-trigger" id="${id}" data-value="">${esc('Choose your name')}</button>
    <div class="cs-dropdown" id="${id}-dropdown">${opts}</div>
  </div>`;
}

function initCustomSelect(id, onChange) {
  const trigger = document.getElementById(id);
  const dropdown = document.getElementById(id + '-dropdown');
  if (!trigger || !dropdown) return;

  trigger.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');
    document.querySelectorAll('.cs-dropdown.open').forEach(d => {
      d.classList.remove('open');
      d.previousElementSibling && d.previousElementSibling.classList.remove('open');
    });
    if (!isOpen) { dropdown.classList.add('open'); trigger.classList.add('open'); }
  });

  dropdown.querySelectorAll('.cs-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const val = opt.dataset.value;
      const label = opt.textContent;
      trigger.dataset.value = val;
      trigger.textContent = label;
      trigger.classList.add('selected');
      trigger.classList.remove('open');
      dropdown.classList.remove('open');
      dropdown.querySelectorAll('.cs-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      if (onChange) onChange(val);
    });
  });

  document.addEventListener('click', e => {
    if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      trigger.classList.remove('open');
    }
  });
}

function show(id) {
  ['loginView','changeView','backupView','forgotView','successView'].forEach(v => {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}

// ── PASSWORD TOGGLE ──
function initPwToggles(container) {
  (container || document).querySelectorAll('.pw-toggle').forEach(btn => {
    btn.innerHTML = ICO.eyeOff;
    btn.addEventListener('click', function() {
      const input = document.getElementById(this.dataset.target);
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      this.innerHTML = showing ? ICO.eyeOff : ICO.eyeOn;
    });
  });
}

// ── COPY TO CLIPBOARD ──
function initCopyBtn(code) {
  const btn = document.getElementById('copyBtn');
  if (!btn) return;
  btn.innerHTML = ICO.copy;
  btn.addEventListener('click', function() {
    copyToClipboard(code).then(() => {
      btn.innerHTML = ICO.check;
      const hint = document.getElementById('copyHint');
      if (hint) hint.textContent = 'Copied!';
      setTimeout(() => {
        btn.innerHTML = ICO.copy;
        if (hint) hint.textContent = 'Screenshot or write this down';
      }, 2000);
    });
  });
}

// ── MAKE PW FIELD HTML ──
function pwFieldHtml(id, placeholder) {
  return `<div class="pw-wrap">
    <input type="password" id="${id}" placeholder="${esc(placeholder)}" autocomplete="new-password"/>
    <button type="button" class="pw-toggle" data-target="${id}" aria-label="Toggle password visibility"></button>
  </div>`;
}

// ── INIT ──
async function init() {
  try {
    const r = await fetch(`${API}/workspace-staff?token=${TOKEN}`);
    const data = await r.json();
    if (!data.staff) throw new Error();
    staffList = data.staff;
    renderLogin();
  } catch(e) {
    document.getElementById('loginForm').innerHTML = '<p class="msg error" style="opacity:1;">Failed to load. Check widget token.</p>';
  }
}

function renderLogin() {
  document.getElementById('loginForm').innerHTML = `
    <form id="authForm">
      <div class="field">
        <span class="field-label">Name</span>
        ${buildCustomSelect('staffSelect')}
      </div>
      <div class="field">
        <span class="field-label">Password</span>
        <div class="pw-wrap">
          <input type="password" id="passInput" placeholder="Enter your password" autocomplete="off"/>
          <button type="button" class="pw-toggle" data-target="passInput" aria-label="Toggle password visibility"></button>
        </div>
      </div>
      <button type="submit" class="btn" id="enterBtn" disabled>Enter Workspace</button>
    </form>
    <button type="button" class="btn-forgot" id="forgotBtn">Forgot password?</button>
  `;

  initPwToggles(document.getElementById('loginForm'));

  const pw = document.getElementById('passInput');
  const btn = document.getElementById('enterBtn');
  function check() {
    const sel = document.getElementById('staffSelect');
    btn.disabled = !(sel && sel.dataset.value && pw.value);
  }
  initCustomSelect('staffSelect', () => check());
  pw.addEventListener('input', check);
  document.getElementById('authForm').addEventListener('submit', handleLogin);
  document.getElementById('forgotBtn').addEventListener('click', showForgot);
}

// ── LOGIN ──
async function handleLogin(e) {
  e.preventDefault();
  const staffId = document.getElementById('staffSelect').dataset.value;
  const password = document.getElementById('passInput').value;
  const msgEl = document.getElementById('loginMsg');
  const btn = document.getElementById('enterBtn');

  btn.classList.add('loading'); btn.textContent = 'Verifying...';
  msgEl.className = 'msg';

  const { status, data } = await post('workspace-auth', { staff_id: staffId, password });

  btn.classList.remove('loading'); btn.textContent = 'Enter Workspace';

  if (status === 200 && data.ok) {
    currentStaff = { id: staffId, name: data.name, page: data.page, must_change: data.must_change };
    currentPassword = password;
    data.must_change ? showChange() : showSuccess();
  } else {
    flash(msgEl, 'error', 'Wrong password. Try again.', 2500);
    document.getElementById('passInput').value = '';
    document.getElementById('passInput').focus();
    btn.disabled = true;
  }
}

// ── CHANGE PASSWORD ──
function showChange() {
  show('changeView');
  document.getElementById('changeName').textContent = currentStaff.name;
  initPwToggles(document.getElementById('changeView'));

  const np = document.getElementById('newPw');
  const cp = document.getElementById('confirmPw');
  const btn = document.getElementById('changeBtn');

  function check() { btn.disabled = !(np.value.length >= 6 && cp.value.length >= 6); }
  np.addEventListener('input', check);
  cp.addEventListener('input', check);
  document.getElementById('changeForm').addEventListener('submit', handleChange);
}

async function handleChange(e) {
  e.preventDefault();
  const np = document.getElementById('newPw').value;
  const cp = document.getElementById('confirmPw').value;
  const msg = document.getElementById('changeMsg');
  const btn = document.getElementById('changeBtn');

  if (np !== cp) { flash(msg, 'error', "Passwords don't match.", 2500); return; }
  if (np.length < 6) { flash(msg, 'error', 'Minimum 6 characters.', 2500); return; }

  btn.classList.add('loading'); btn.textContent = 'Saving...';

  const { status, data } = await post('workspace-password', {
    staff_id: currentStaff.id,
    old_password: currentPassword,
    new_password: np
  });

  btn.classList.remove('loading'); btn.textContent = 'Set Password';

  if (status === 200 && data.ok) {
    data.backup_code ? showBackupCode(data.backup_code) : showSuccess();
  } else {
    flash(msg, 'error', 'Something went wrong. Try again.', 2500);
  }
}

// ── BACKUP CODE ──
function showBackupCode(code) {
  show('backupView');
  document.getElementById('backupCode').textContent = code;
  initCopyBtn(code);
  document.getElementById('backupContinueBtn').addEventListener('click', () => showSuccess());
}

// ── FORGOT PASSWORD ──
function showForgot() {
  show('forgotView');
  const fv = document.getElementById('forgotView');

  fv.innerHTML = `
    <div class="card-hdr">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <div class="eyebrow">Reset Password</div>
      <div class="h-title">Backup Code</div>
      <div class="h-sub">Enter your backup code to reset</div>
    </div>
    <form id="resetForm">
      <div class="field">
        <span class="field-label">Your Name</span>
        ${buildCustomSelect('resetSelect')}
      </div>
      <div class="field">
        <span class="field-label">Backup Code</span>
        <input type="text" id="resetCode" placeholder="XXXX-XXXX" autocomplete="off" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700;"/>
      </div>
      <div class="field">
        <span class="field-label">New Password</span>
        ${pwFieldHtml('resetNewPw', 'Min 6 characters')}
      </div>
      <div class="field">
        <span class="field-label">Confirm Password</span>
        ${pwFieldHtml('resetConfirmPw', 'Type it again')}
      </div>
      <button type="submit" class="btn" id="resetBtn" disabled>Reset Password</button>
    </form>
    <p class="msg" id="resetMsg"></p>
    <button type="button" class="btn-secondary" id="backBtn">Back to login</button>
  `;

  initPwToggles(fv);

  const code = document.getElementById('resetCode');
  const npw = document.getElementById('resetNewPw');
  const cpw = document.getElementById('resetConfirmPw');
  const btn = document.getElementById('resetBtn');

  function check() {
    const sel = document.getElementById('resetSelect');
    btn.disabled = !(sel && sel.dataset.value && code.value.length >= 4 && npw.value.length >= 6 && cpw.value.length >= 6);
  }
  initCustomSelect('resetSelect', () => check());
  code.addEventListener('input', check);
  npw.addEventListener('input', check);
  cpw.addEventListener('input', check);

  document.getElementById('resetForm').addEventListener('submit', handleReset);
  document.getElementById('backBtn').addEventListener('click', () => { show('loginView'); });
}

async function handleReset(e) {
  e.preventDefault();
  const staffId = document.getElementById('resetSelect').dataset.value;
  const code = document.getElementById('resetCode').value;
  const npw = document.getElementById('resetNewPw').value;
  const cpw = document.getElementById('resetConfirmPw').value;
  const msg = document.getElementById('resetMsg');
  const btn = document.getElementById('resetBtn');

  if (npw !== cpw) { flash(msg, 'error', "Passwords don't match.", 2500); return; }

  btn.classList.add('loading'); btn.textContent = 'Resetting...';

  const { status, data } = await post('workspace-self-reset', {
    staff_id: staffId,
    backup_code: code,
    new_password: npw
  });

  btn.classList.remove('loading'); btn.textContent = 'Reset Password';

  if (status === 200 && data.ok) {
    const staff = staffList.find(s => s.id === staffId);
    const fv = document.getElementById('forgotView');
    fv.innerHTML = `
      <div class="card-hdr">
        <div class="icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12l2 2 4-4"/>
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
          </svg>
        </div>
        <div class="eyebrow">Password Reset</div>
        <div class="h-title">${esc(staff ? staff.name : 'Done')}</div>
      </div>
      <div class="backup-box">
        <div class="hint">Your new recovery code</div>
        <div class="code-row">
          <span class="code" id="newResetCode">${esc(data.new_backup_code)}</span>
          <button class="copy-btn" id="resetCopyBtn" aria-label="Copy code"></button>
        </div>
        <div class="hint" id="resetCopyHint">Screenshot or write this down</div>
      </div>
      <p class="backup-warning">Your password has been reset. Save this new backup code — the old one no longer works.</p>
      <button type="button" class="btn" id="resetDoneBtn">Back to Login</button>
    `;
    // Init copy button for the new code
    const rcBtn = document.getElementById('resetCopyBtn');
    rcBtn.innerHTML = ICO.copy;
    rcBtn.addEventListener('click', function() {
      copyToClipboard(data.new_backup_code).then(() => {
        rcBtn.innerHTML = ICO.check;
        const hint = document.getElementById('resetCopyHint');
        if (hint) hint.textContent = 'Copied!';
        setTimeout(() => {
          rcBtn.innerHTML = ICO.copy;
          if (hint) hint.textContent = 'Screenshot or write this down';
        }, 2000);
      });
    });
    document.getElementById('resetDoneBtn').addEventListener('click', () => { show('loginView'); });
  } else if (data.error === 'wrong_code') {
    flash(msg, 'error', 'Wrong backup code. Check and try again.', 2500);
  } else if (data.error === 'no_backup_code') {
    flash(msg, 'error', "No backup code set yet. Complete your first login to get one.", 3000);
  } else {
    flash(msg, 'error', 'Something went wrong. Try again.', 2500);
  }
}

// ── SUCCESS ──
function showSuccess() {
  show('successView');
  document.getElementById('successView').innerHTML = `
    <div class="success-state">
      <div class="check">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="welcome">${esc(currentStaff.name)}</div>
      <div class="verified">Access verified</div>
      <a href="${currentStaff.page}" target="_blank" rel="noopener" class="open-link">Open Workspace</a>
    </div>
  `;
}

// ── BOOT ──
init();
</script>
</body>
</html>
