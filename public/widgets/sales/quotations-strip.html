<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (window.self === window.top) {
  window.stop(); document.open();
  document.write('<html><head><style>*{margin:0;padding:0}html,body{height:100%;background:#191919;}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:sans-serif;}</style></head><body><div style="color:#555;font-size:13px;letter-spacing:.5px;">RESTRICTED ACCESS</div><div style="color:#333;font-size:12px;">This widget is for Notion only.</div></body></html>');
  document.close();
}
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Quotations</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #191919; --card: #222222;
  --border: rgba(255,255,255,0.07);
  --g: #C8FF00; --amber: #FBBF24; --red: #FF6B6B;
  --muted: rgba(255,255,255,0.38); --sub: rgba(255,255,255,0.55);
  --r: 14px;
}
html, body { width: 100%; min-height: 100%; background: var(--bg); font-family: 'Satoshi', sans-serif; color: #fff; }
body { padding: 14px 16px 16px; }
.top-bar { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
.wgt-title { font-size: 14px; font-weight: 900; letter-spacing: -0.3px; }
.org-pill { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 100px; padding: 3px 9px; }
.mn-wrap { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 100px; overflow: hidden; }
.mn-btn { background: none; border: none; color: var(--sub); cursor: pointer; padding: 5px 11px; font-size: 14px; font-weight: 700; line-height: 1; font-family: inherit; transition: color .15s; }
.mn-btn:hover:not(:disabled) { color: #fff; }
.mn-btn:disabled { opacity: .25; cursor: default; }
.mn-lbl { font-size: 11px; font-weight: 700; color: var(--sub); padding: 0 4px; min-width: 72px; text-align: center; }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.tile { background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px 14px; position: relative; overflow: hidden; transition: border-color .2s; display: flex; flex-direction: column; justify-content: space-between; }
.tile:hover { border-color: rgba(255,255,255,.13); }
.tile.hero { background: var(--g); border-color: transparent; }
.tile.hero::before { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(0,0,0,.07); }
.tile-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px; }
.tile.hero .tile-label { color: rgba(0,0,0,.65); }
.tile-val { font-size: 36px; font-weight: 900; letter-spacing: -2px; line-height: 1; margin-bottom: 4px; display: block; }
.tile.hero .tile-val { color: #000; }
.tile-sub { font-size: 11px; font-weight: 600; color: var(--sub); display: block; }
.tile.hero .tile-sub { color: rgba(0,0,0,.6); font-weight: 700; }
.tile-delta { position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 100px; line-height: 1.4; }
.tile-delta.up   { background: rgba(200,255,0,.12); color: var(--g); }
.tile-delta.dn   { background: rgba(255,107,107,.1); color: var(--red); }
.tile-delta.flat { background: rgba(255,255,255,.09); color: rgba(255,255,255,.5); }
.tile.hero .tile-delta.up,
.tile.hero .tile-delta.dn,
.tile.hero .tile-delta.flat { background: rgba(0,0,0,.2); color: rgba(0,0,0,.85); }
.funnel-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.f-pill { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 100px; padding: 5px 11px; font-size: 11px; font-weight: 700; color: var(--sub); white-space: nowrap; }
.f-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.f-pill .cnt { font-weight: 900; color: #fff; }
.dot-draft    { background: #555; }
.dot-ready    { background: var(--amber); }
.dot-sent     { background: #60A5FA; }
.dot-approved { background: var(--g); }
.dot-declined { background: var(--red); }
.dot-expired  { background: #444; }
.dot-review   { background: #A78BFA; }
.section-hd { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.items-list { display: flex; flex-direction: column; gap: 6px; }
.item-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.025); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; transition: border-color .2s; }
.item-row:hover { border-color: rgba(255,255,255,.12); }
.item-row.warn     { border-color: rgba(251,191,36,.25); background: rgba(251,191,36,.04); }
.item-row.expiring { border-color: rgba(255,107,107,.25); background: rgba(255,107,107,.04); }
.item-ref    { font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; min-width: 96px; }
.item-entity { font-size: 11px; color: var(--sub); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-badges { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
.badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px; white-space: nowrap; }
.badge-draft    { background: rgba(255,255,255,.08); color: rgba(255,255,255,.55); }
.badge-ready    { background: rgba(251,191,36,.12); color: var(--amber); }
.badge-sent     { background: rgba(96,165,250,.12); color: #60A5FA; }
.badge-followup { background: rgba(251,191,36,.15); color: var(--amber); border: 1px solid rgba(251,191,36,.3); }
.badge-expiring { background: rgba(255,107,107,.12); color: var(--red); border: 1px solid rgba(255,107,107,.25); }
.item-val { font-size: 12px; font-weight: 700; color: var(--sub); flex-shrink: 0; text-align: right; min-width: 70px; }
.skel { background: linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; display: block; }
@keyframes shimmer { to { background-position: -200% 0; } }
.skel-val { height: 36px; width: 56px; margin-bottom: 6px; }
.skel-sub { height: 12px; width: 88px; }
.err-bar { margin-top: 10px; padding: 10px 14px; background: rgba(255,107,107,.08); border: 1px solid rgba(255,107,107,.2); border-radius: 10px; font-size: 12px; color: #FF6B6B; display: none; }
@media (max-width: 700px) { .strip { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="top-bar">
  <span class="wgt-title">Quotations</span>
  <span class="org-pill">OPXIO</span>
  <div class="mn-wrap">
    <button class="mn-btn" id="mnPrev" onclick="shiftMonth(-1)">&#8249;</button>
    <span class="mn-lbl" id="mnLbl">—</span>
    <button class="mn-btn" id="mnNext" onclick="shiftMonth(1)" disabled>&#8250;</button>
  </div>
</div>
<div class="strip">
  <div class="tile hero">
    <span class="tile-label">Open Quotes</span>
    <span class="tile-val" id="valOpen"><span class="skel skel-val"></span></span>
    <span class="tile-sub" id="subOpen"><span class="skel skel-sub"></span></span>
  </div>
  <div class="tile">
    <span class="tile-label">Open Value</span>
    <span class="tile-val" id="valValue"><span class="skel skel-val"></span></span>
    <span class="tile-sub" id="subValue"><span class="skel skel-sub"></span></span>
    <span class="tile-delta" id="dltValue"></span>
  </div>
  <div class="tile">
    <span class="tile-label">Approved MTD</span>
    <span class="tile-val" id="valApproved"><span class="skel skel-val"></span></span>
    <span class="tile-sub" id="subApproved"><span class="skel skel-sub"></span></span>
    <span class="tile-delta" id="dltApproved"></span>
  </div>
  <div class="tile">
    <span class="tile-label">Win Rate</span>
    <span class="tile-val" id="valWinRate"><span class="skel skel-val"></span></span>
    <span class="tile-sub" id="subWinRate"><span class="skel skel-sub"></span></span>
  </div>
</div>
<div class="funnel-row" id="funnelRow">
  <span class="skel" style="height:28px;width:70px;border-radius:100px;"></span>
  <span class="skel" style="height:28px;width:90px;border-radius:100px;"></span>
  <span class="skel" style="height:28px;width:60px;border-radius:100px;"></span>
  <span class="skel" style="height:28px;width:80px;border-radius:100px;"></span>
</div>
<div class="section-hd" id="itemsHd" style="display:none;">Open Quotes</div>
<div class="items-list" id="itemsList"></div>
<div class="err-bar" id="errBar">Unable to load data. Check token or connection.</div>
<script>
const API = 'https://api.opxio.io/api/clients/opxio/quotes-pipeline'
const tok = new URLSearchParams(location.search).get('token') || ''
const now = new Date()
let offset = 0, ctrl = null
function monthState() {
  const d = new Date(now.getFullYear(), now.getMonth() + offset, 1)
  return { year: d.getFullYear(), month: d.getMonth(), d }
}
function prevOf(year, month) {
  return month === 0 ? { year: year-1, month: 11 } : { year, month: month-1 }
}
function fmt(d) { return d.toLocaleString('default', { month: 'short', year: 'numeric' }) }
function shiftMonth(delta) {
  offset = Math.min(0, offset + delta)
  document.getElementById('mnNext').disabled = offset >= 0
  document.getElementById('mnPrev').disabled = offset <= -24
  load()
}
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function setVal(id, html) { const e=document.getElementById(id); if(e) e.innerHTML=html }
function setText(id, t)   { const e=document.getElementById(id); if(e) e.textContent=t }
function fmtMoney(n, currency) {
  const c = currency || 'MYR'
  if (!n) return c+' 0'
  if (n>=1000000) return c+' '+(n/1000000).toFixed(1).replace(/\.0$/,'')+'M'
  if (n>=1000)    return c+' '+Math.round(n/1000)+'K'
  return c+' '+Math.round(n)
}
var _UP='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:3px;"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>'
var _DN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:3px;"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>'
var _FL='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:3px;"><line x1="5" y1="12" x2="19" y2="12"/></svg>'
function applyDelta(id, curr, prev) {
  const el=document.getElementById(id); if(!el) return
  if(prev==null||prev===0){el.className='tile-delta';el.innerHTML='';return}
  const pct=Math.round(((curr-prev)/prev)*100)
  if(pct===0){el.className='tile-delta flat';el.innerHTML=_FL+'0%';return}
  const up=pct>0
  el.className='tile-delta '+(up?'up':'dn')
  el.innerHTML=(up?_UP:_DN)+Math.abs(pct)+'%'
}
const S={
  'Draft':         {dot:'dot-draft',    badge:'badge-draft'},
  'Ready to Send': {dot:'dot-ready',    badge:'badge-ready'},
  'Sent':          {dot:'dot-sent',     badge:'badge-sent'},
  'Approved':      {dot:'dot-approved', badge:''},
  'Declined':      {dot:'dot-declined', badge:''},
  'Expired':       {dot:'dot-expired',  badge:''},
}
function funnelPill(status, count) {
  const m=S[status]||{dot:'dot-draft'}
  return '<span class="f-pill"><span class="dot '+m.dot+'"></span><span class="cnt">'+count+'</span> '+esc(status)+'</span>'
}
function itemBadge(item) {
  const m=S[item.status]||{badge:'badge-draft'}
  let h='<span class="badge '+(m.badge||'badge-draft')+'">'+esc(item.status)+'</span>'
  if(item.needsFollowUp) h+='<span class="badge badge-followup">&#9888; Follow Up</span>'
  if(item.expiringSoon)  h+='<span class="badge badge-expiring">Expiring</span>'
  return h
}
function showSkeletons() {
  const sv='<span class="skel skel-val"></span>', ss='<span class="skel skel-sub"></span>'
  ;['valOpen','valValue','valApproved','valWinRate'].forEach(id=>setVal(id,sv))
  ;['subOpen','subValue','subApproved','subWinRate'].forEach(id=>setVal(id,ss))
  ;['dltValue','dltApproved'].forEach(id=>{const e=document.getElementById(id);if(e){e.className='tile-delta';e.innerHTML=''}})
  document.getElementById('funnelRow').innerHTML=[70,90,60,80].map(w=>'<span class="skel" style="height:28px;width:'+w+'px;border-radius:100px;"></span>').join('')
  document.getElementById('itemsHd').style.display='none'
  document.getElementById('itemsList').innerHTML=''
}
function render(data, prev) {
  const kpi=data.kpi||{}, funnel=data.quoteFunnel||[], items=data.quoteActiveItems||[]
  const pk=prev&&prev.kpi?prev.kpi:null
  setVal('valOpen', esc(kpi.pendingCount||0))
  setText('subOpen', (kpi.issuedMTD||0)+' issued this period')
  const ov=kpi.openValue||0, pov=pk?(pk.openValue||0):null
  document.getElementById('valValue').style.fontSize=ov>=100000?'22px':ov>=10000?'28px':'36px'
  setVal('valValue', esc(fmtMoney(ov)))
  setText('subValue', (kpi.pendingCount||0)+' open quote'+((kpi.pendingCount||0)===1?'':'s'))
  applyDelta('dltValue', ov, pov)
  const am=kpi.approvedMTD||0, pam=pk?(pk.approvedMTD||0):null
  setVal('valApproved', esc(am))
  setText('subApproved', 'Quotes approved this period')
  applyDelta('dltApproved', am, pam)
  const wr=kpi.convRate
  document.getElementById('valWinRate').style.fontSize='36px'
  setVal('valWinRate', wr!=null?esc(wr+'%'):'<span style="font-size:22px;letter-spacing:-1px;color:rgba(255,255,255,.3)">—</span>')
  setText('subWinRate', wr!=null?'Decided quotes only':'No decided quotes yet')
  const fr=document.getElementById('funnelRow')
  const pills=funnel.filter(f=>f.count>0).map(f=>funnelPill(f.status,f.count)).join('')
  fr.innerHTML=pills||'<span style="color:var(--muted);font-size:11px;font-weight:600;">No quotes yet</span>'
  const hd=document.getElementById('itemsHd'), il=document.getElementById('itemsList')
  if(!items.length){hd.style.display='none';il.innerHTML='';return}
  hd.style.display='block'
  il.innerHTML=items.slice(0,8).map(item=>{
    const rc=item.expiringSoon?'item-row expiring':item.needsFollowUp?'item-row warn':'item-row'
    return '<div class="'+rc+'"><span class="item-ref">'+esc(item.refNo)+'</span><span class="item-entity">'+esc(item.entity)+'</span><span class="item-badges">'+itemBadge(item)+'</span><span class="item-val">'+esc(fmtMoney(item.amount,item.currency))+'</span></div>'
  }).join('')
}
async function fetchData(month, year) {
  const r=await fetch(API+'?token='+encodeURIComponent(tok)+'&month='+month+'&year='+year,{signal:ctrl.signal})
  if(!r.ok) throw new Error('HTTP '+r.status)
  return r.json()
}
async function load() {
  if(ctrl) ctrl.abort(); ctrl=new AbortController()
  const{year,month,d}=monthState()
  document.getElementById('mnLbl').textContent=fmt(d)
  document.getElementById('mnNext').disabled=offset>=0
  document.getElementById('mnPrev').disabled=offset<=-24
  showSkeletons()
  document.getElementById('errBar').style.display='none'
  const{year:py,month:pm}=prevOf(year,month)
  try {
    const[data,prev]=await Promise.all([fetchData(month,year),fetchData(pm,py).catch(()=>null)])
    render(data,prev)
  } catch(e) {
    if(e.name==='AbortError') return
    document.getElementById('errBar').style.display='block'
    console.error(e)
  }
}
load()
</script>
</body>
</html>
