<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Journey Tracker</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;background:#0E0E0E;color:#fff;padding:22px 20px 44px;overflow-y:auto;}

:root{
  --g:#AAFF00;--gd:#7ACC00;--gm:rgba(170,255,0,.08);--gb:rgba(170,255,0,.18);
  --rose:#FF3E8F;--rosem:rgba(255,62,143,.08);--roseb:rgba(255,62,143,.2);
  --gold:#FFB800;--goldm:rgba(255,184,0,.08);--goldb:rgba(255,184,0,.18);
  --blue:#5BC4FF;--bluem:rgba(91,196,255,.08);
  --card:#161616;--card2:#1C1C1C;--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
}

/* ── Header ─────────────────────── */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;}
.hdr h1{font-size:20px;font-weight:900;letter-spacing:-.04em;color:#fff;}
.hdr p{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);margin-top:3px;letter-spacing:.02em;}
.hdr-r{display:flex;align-items:center;gap:6px;}
.ts{font-size:9px;color:rgba(255,255,255,.15);font-weight:500;}
.icon-btn{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn svg{width:13px;height:13px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Stat cards ──────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr);}}
.sc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 13px 11px;position:relative;overflow:hidden;}
.sc::after{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,var(--c,var(--g)),transparent);}
.sc-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.25);margin-bottom:7px;}
.sc-val{font-size:26px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:var(--c,var(--g));}
.sc-val.sm{font-size:18px;}
.sc-sub{font-size:9px;font-weight:500;color:rgba(255,255,255,.18);margin-top:4px;}

/* ── Progress bar ─────────────────── */
.prog-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;margin-bottom:20px;}
.prog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.prog-head span{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.22);}
.prog-pct{font-size:14px;font-weight:900;letter-spacing:-.03em;color:var(--g);}
.bar-track{height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#AAFF00,#77CC00);width:0%;transition:width 1s cubic-bezier(.4,0,.2,1);}
.bar-ends{display:flex;justify-content:space-between;margin-top:9px;}
.bar-end{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);}
.bar-end.hi{color:var(--g);}

/* ── Section label ────────────────── */
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;}
.sec-bar{width:2.5px;height:11px;border-radius:99px;background:var(--g);opacity:.45;flex-shrink:0;}
.sec span{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:rgba(255,255,255,.22);}
.sec::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.04);}

/* ── Milestone card ───────────────── */
.ms-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;transition:border-color .2s;}
.ms-card.st-upcoming{background:var(--card);}
.ms-card.st-active{background:#121a0d;border-color:rgba(170,255,0,.15);}
.ms-card.st-achieved{background:#0d1419;border-color:rgba(91,196,255,.12);}
.ms-card.st-claimed{background:#130d1a;border-color:rgba(255,62,143,.1);}

/* Milestone header row */
.ms-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;}
.ms-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.ms-badge.upcoming{background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);}
.ms-badge.active{background:var(--gm);color:var(--g);border:1px solid var(--gb);}
.ms-badge.achieved{background:var(--bluem);color:var(--blue);border:1px solid rgba(91,196,255,.18);}
.ms-badge.claimed{background:var(--rosem);color:var(--rose);border:1px solid var(--roseb);}
.ms-badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.ms-badge.upcoming .dot,.ms-badge.achieved .dot,.ms-badge.claimed .dot{animation:none;}
.ms-name{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);}

/* Target + countdown */
.ms-body{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 16px 12px;}
.ms-target{font-size:44px;font-weight:900;letter-spacing:-2.5px;line-height:1;color:#fff;}
.ms-target sup{font-size:14px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:0;vertical-align:super;margin-left:1px;}
.ms-right{text-align:right;}
.ms-deadline{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.3);}
.ms-cd{font-size:12px;font-weight:900;letter-spacing:-.02em;margin-top:2px;}
.ms-cd.urgent{color:#FF6B35;}
.ms-cd.ok{color:var(--g);}
.ms-cd.done{color:var(--blue);}
.ms-cd.past{color:rgba(255,255,255,.2);}

/* Mini progress inside milestone */
.ms-prog{margin:0 16px 12px;height:3px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;}
.ms-prog-fill{height:100%;border-radius:99px;background:var(--g);transition:width 1.2s ease;}

/* Rewards section */
.ms-rewards{border-top:1px solid rgba(255,255,255,.04);padding:14px 16px 16px;background:rgba(0,0,0,.2);}
.rwd-group-lbl{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;margin-bottom:9px;color:rgba(255,255,255,.25);}
.rwd-group-lbl.bonus{color:var(--gold);}

.rwd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:8px;}

/* Reward card */
.rwd-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 11px 9px;position:relative;transition:all .15s;}
.rwd-card.unlocked{border-color:rgba(170,255,0,.12);background:#111a09;}
.rwd-card.unlocked:hover{border-color:rgba(170,255,0,.25);}
.rwd-card.claimed{border-color:rgba(255,62,143,.12);background:#140a0e;}
.rwd-card.is-bonus{border-color:rgba(255,184,0,.15);background:#12100a;}
.rwd-card.locked{filter:none;}

/* Locked overlay */
.rwd-card.locked .rwd-dish,.rwd-card.locked .rwd-loc{filter:blur(3px);user-select:none;pointer-events:none;}
.rwd-card.locked::before{content:'LOCKED';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.2);z-index:2;}

.rwd-cat{display:inline-flex;align-items:center;gap:3px;font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.25);margin-bottom:7px;}
.rwd-cat.main-meal{background:rgba(255,107,53,.08);color:#FF6B35;}
.rwd-cat.dessert{background:var(--rosem);color:var(--rose);}
.rwd-cat.drinks{background:var(--bluem);color:var(--blue);}
.rwd-cat.fine-dining{background:var(--goldm);color:var(--gold);}
.rwd-cat.snack{background:rgba(255,210,50,.06);color:#FFD232;}
.rwd-dish{font-size:12px;font-weight:700;letter-spacing:-.02em;color:#fff;margin-bottom:4px;line-height:1.2;}
.rwd-loc{font-size:9px;font-weight:500;color:rgba(255,255,255,.25);}
.rwd-status{margin-top:7px;font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.rwd-status.locked{color:rgba(255,255,255,.18);}
.rwd-status.unlocked{color:var(--g);}
.rwd-status.claimed{color:var(--rose);}

/* Bonus inline card */
.bonus-card{background:#131008;border:1px solid var(--goldb);border-radius:10px;padding:12px 14px;margin-top:8px;}
.bonus-card.achieved{border-color:rgba(255,184,0,.4);background:#1a1400;}
.bonus-head{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin-bottom:5px;}
.bonus-target-lbl{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.3);margin-bottom:3px;}
.bonus-text{font-size:13px;font-weight:700;color:#fff;}
.bonus-lock{font-size:9px;font-weight:700;color:rgba(255,184,0,.4);margin-top:4px;}

/* Empty */
.empty{font-size:10px;color:rgba(255,255,255,.15);font-style:italic;}

/* Log */
.log-rows{display:flex;flex-direction:column;gap:5px;}
.log-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 13px;}
.log-date{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.3);min-width:80px;}
.log-w{font-size:15px;font-weight:900;letter-spacing:-.03em;color:var(--g);}
.log-bmi{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.22);margin-left:auto;}
.log-note{font-size:9px;color:rgba(255,255,255,.18);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Error */
.err-banner{background:rgba(255,50,50,.07);border:1px solid rgba(255,50,50,.15);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:10px;color:rgba(255,100,100,.7);}

footer{display:block;text-align:center;padding:20px 0 0;font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.06);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:99px;}
</style>
</head><body>

<div class="hdr">
  <div>
    <h1>Weight Loss Journey</h1>
    <p id="sub">Loading…</p>
  </div>
  <div class="hdr-r">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" onclick="doRefresh()" id="rb" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
</div>

<div id="err-wrap"></div>

<div class="stats">
  <div class="sc" style="--c:var(--g)"><div class="sc-lbl">Current Weight</div><div class="sc-val" id="s-cw">—</div><div class="sc-sub">kg</div></div>
  <div class="sc" style="--c:var(--rose)"><div class="sc-lbl">Total Lost</div><div class="sc-val" id="s-lost">—</div><div class="sc-sub">kg since April 2024</div></div>
  <div class="sc" style="--c:var(--blue)"><div class="sc-lbl">BMI</div><div class="sc-val sm" id="s-bmi">—</div><div class="sc-sub" id="s-bmi-lbl">—</div></div>
  <div class="sc" style="--c:var(--gold)"><div class="sc-lbl">To Next Target</div><div class="sc-val sm" id="s-next">—</div><div class="sc-sub" id="s-next-lbl">kg to go</div></div>
</div>

<div class="prog-card" id="prog-card" style="display:none">
  <div class="prog-head">
    <span>Journey Progress</span>
    <span class="prog-pct" id="prog-pct">0%</span>
  </div>
  <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
  <div class="bar-ends">
    <span class="bar-end hi">125 kg · Start</span>
    <span class="bar-end" id="bar-mid"></span>
    <span class="bar-end" id="bar-end">Goal</span>
  </div>
</div>

<div class="sec"><div class="sec-bar"></div><span>Milestones & Rewards</span></div>
<div id="ms-wrap"></div>

<div class="sec" id="log-sec" style="display:none"><div class="sec-bar" style="background:var(--blue)"></div><span>Weight Log</span></div>
<div class="log-rows" id="log-rows"></div>

<footer>Opxio.io</footer>

<script>
const _tok = new URLSearchParams(location.search).get('token') || '';
function apiUrl() { return '/api/private/milestone' + (_tok ? '?token=' + encodeURIComponent(_tok) : ''); }

const CAT_CSS = {'Main Meal':'main-meal','Dessert':'dessert','Drinks':'drinks','Fine Dining':'fine-dining','Snack':'snack'};
const CAT_LBL = {'Main Meal':'Main Meal','Dessert':'Dessert','Drinks':'Drinks','Fine Dining':'Fine Dining','Snack':'Snack'};

function bmiLabel(v) {
  if (!v) return '';
  if (v < 18.5) return 'Underweight';
  if (v < 25)   return 'Healthy Range';
  if (v < 30)   return 'Overweight';
  return 'Obese';
}

function daysLeft(ds) {
  if (!ds) return null;
  const n = new Date(); n.setHours(0,0,0,0);
  const d = new Date(ds); d.setHours(0,0,0,0);
  return Math.round((d - n) / 86400000);
}

function cdHtml(days, status) {
  if (status === 'Achieved' || status === 'Claimed') return '<div class="ms-cd done">Completed</div>';
  if (days === null) return '';
  if (days < 0)  return `<div class="ms-cd urgent">${Math.abs(days)}d overdue</div>`;
  if (days === 0) return '<div class="ms-cd urgent">Due today</div>';
  if (days <= 7) return `<div class="ms-cd urgent">${days}d left</div>`;
  return `<div class="ms-cd ok">${days} days left</div>`;
}

function rwdCatHtml(cat) {
  if (!cat) return '';
  const cls = CAT_CSS[cat] || '';
  const lbl = CAT_LBL[cat] || cat;
  return `<div class="rwd-cat ${cls}">${lbl}</div>`;
}

function rwdCardHtml(r) {
  const statusCls = (r.status || 'locked').toLowerCase();
  const isBonus   = r.type === 'Bonus Reward';
  const dish      = r.dish || 'Reward TBA';
  const loc       = r.location || '';
  return `
  <div class="rwd-card ${statusCls}${isBonus ? ' is-bonus' : ''}">
    ${rwdCatHtml(r.category)}
    <div class="rwd-dish">${dish}</div>
    ${loc ? `<div class="rwd-loc">${loc}</div>` : ''}
    <div class="rwd-status ${statusCls}">${statusCls === 'locked' ? 'Locked' : statusCls === 'unlocked' ? 'Unlocked' : 'Claimed'}</div>
  </div>`;
}

function bonusHtml(m) {
  if (!m.bonusTarget) return '';
  const done = m.bonusAchieved;
  const head = done ? (m.bonusClaimed ? 'Bonus Claimed' : 'Bonus Unlocked!') : 'Bonus Unlock';
  const lock = done ? '' : `<div class="bonus-lock">Reach ${m.bonusTarget} kg to unlock</div>`;
  return `
  <div class="bonus-card${done?' achieved':''}">
    <div class="bonus-head">${head}</div>
    <div class="bonus-target-lbl">Bonus target: ${m.bonusTarget} kg</div>
    <div class="bonus-text">${m.bonusReward || 'Bonus reward TBA'}</div>
    ${lock}
  </div>`;
}

function msProg(current, target, start) {
  if (!current || !target) return '';
  const pct = Math.min(100, Math.max(0, ((start - current) / (start - target)) * 100));
  return `<div class="ms-prog"><div class="ms-prog-fill" style="width:${pct.toFixed(1)}%"></div></div>`;
}

function msCardHtml(m, currentWeight) {
  const stKey = (m.status || 'upcoming').toLowerCase();
  const days  = daysLeft(m.deadline);
  const dateStr = m.deadline
    ? new Date(m.deadline).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'})
    : 'No deadline';

  const mainRwds  = m.rewards.filter(r => r.type !== 'Bonus Reward');
  const hasLegacy = !mainRwds.length && m.foodReward;

  return `
  <div class="ms-card st-${stKey}">
    <div class="ms-head">
      <span class="ms-badge ${stKey}"><span class="dot"></span>${m.status}</span>
      <span class="ms-name">${m.name}</span>
    </div>
    <div class="ms-body">
      <div class="ms-target">${m.targetWeight ?? '—'}<sup>kg</sup></div>
      <div class="ms-right">
        <div class="ms-deadline">${dateStr}</div>
        ${cdHtml(days, m.status)}
      </div>
    </div>
    ${msProg(currentWeight, m.targetWeight, 125)}
    <div class="ms-rewards">
      <div class="rwd-group-lbl">Main Reward</div>
      ${mainRwds.length
        ? `<div class="rwd-grid">${mainRwds.map(rwdCardHtml).join('')}</div>`
        : hasLegacy
          ? `<div class="rwd-grid">${rwdCardHtml({dish:m.foodReward,location:m.rewardLocation,category:null,type:'Main Reward',status:m.status==='Claimed'?'Claimed':m.status==='Achieved'?'Unlocked':'Locked'})}</div>`
          : `<div class="empty">Reward not added yet</div>`
      }
      ${bonusHtml(m)}
    </div>
  </div>`;
}

async function loadData() {
  try {
    const r = await fetch(apiUrl());
    const d = await r.json();

    if (d.error) {
      document.getElementById('err-wrap').innerHTML =
        `<div class="err-banner">Data error: ${d.error} — check Notion integration connection.</div>`;
      return;
    } else {
      document.getElementById('err-wrap').innerHTML = '';
    }

    const cw = d.currentWeight;
    document.getElementById('sub').textContent = `Started at ${d.startWeight} kg · ${d.startDate}`;
    document.getElementById('s-cw').textContent   = cw ?? '—';
    document.getElementById('s-lost').textContent = d.lostTotal ?? '—';
    document.getElementById('s-bmi').textContent  = d.currentBMI ?? '—';
    document.getElementById('s-bmi-lbl').textContent = bmiLabel(d.currentBMI);

    // Next target
    const pending = (d.milestones || []).filter(m => m.status === 'Active' || m.status === 'Upcoming');
    const next = pending[0];
    if (next && cw) {
      const diff = +(cw - next.targetWeight).toFixed(2);
      document.getElementById('s-next').textContent = diff > 0 ? diff : 'Done';
      document.getElementById('s-next-lbl').textContent = diff > 0 ? `kg to ${next.targetWeight} kg` : 'Milestone reached!';
    }

    // Progress bar
    if (d.journeyProgress !== null && d.lowestTarget !== null && cw) {
      document.getElementById('prog-card').style.display = '';
      const pct = Math.min(Math.max(d.journeyProgress, 0), 100);
      document.getElementById('prog-pct').textContent = pct.toFixed(1) + '%';
      setTimeout(() => { document.getElementById('bar-fill').style.width = pct + '%'; }, 80);
      document.getElementById('bar-mid').textContent = cw + ' kg (now)';
      document.getElementById('bar-end').textContent = d.lowestTarget + ' kg';
    }

    // Milestones
    const ms = d.milestones || [];
    document.getElementById('ms-wrap').innerHTML = ms.length
      ? ms.map(m => msCardHtml(m, cw)).join('')
      : '<div class="empty">No milestones set yet.</div>';

    // Log
    const logs = (d.logs || []).slice(0, 5);
    if (logs.length) {
      document.getElementById('log-sec').style.display = '';
      document.getElementById('log-rows').innerHTML = logs.map(l => {
        const ds = l.date ? new Date(l.date).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'}) : '—';
        return `<div class="log-row">
          <span class="log-date">${ds}</span>
          <span class="log-w">${l.weight ?? '—'} kg</span>
          ${l.bmi ? `<span class="log-bmi">BMI ${l.bmi}</span>` : ''}
          ${l.notes ? `<span class="log-note">${l.notes}</span>` : ''}
        </div>`;
      }).join('');
    }

    document.getElementById('ts').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('err-wrap').innerHTML =
      `<div class="err-banner">Failed to load: ${e.message}</div>`;
  }
}

function doRefresh() {
  const b = document.getElementById('rb');
  if (b) b.classList.add('spinning');
  loadData().finally(() => { const b2 = document.getElementById('rb'); if(b2) b2.classList.remove('spinning'); });
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body></html>
