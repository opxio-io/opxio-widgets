<script>
if (window.self === window.top) {
  window.stop(); document.open();
  document.write('<html><head><style>*{margin:0;padding:0}html,body{height:100%;background:#191919;}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:sans-serif;}</style></head><body><div style="color:#555;font-size:13px;letter-spacing:.5px;">RESTRICTED ACCESS</div><div style="color:#333;font-size:12px;">This widget is for Notion only.</div></body></html>');
  document.close();
}
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Sales Pipeline</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#191919; --card:#222222;
  --border:rgba(255,255,255,0.07);
  --g:#C8FF00; --amber:#FBBF24; --red:#FF6B6B; --blue:#60A5FA;
  --muted:rgba(255,255,255,0.38); --sub:rgba(255,255,255,0.55);
  --r:18px;
}
html,body{width:100%;}
body{background:var(--bg);font-family:'Satoshi',sans-serif;color:#fff;padding:18px 20px 28px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px;}

/* Top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.top-bar-left{display:flex;align-items:center;gap:12px;}
/* logo-dot removed */
.wgt-title{font-size:17px;font-weight:900;letter-spacing:-0.4px;color:#fff;}
.wgt-org{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:100px;padding:3px 10px;}
.mn-pill{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:100px;overflow:hidden;}
.mn-btn{background:none;border:none;color:var(--sub);cursor:pointer;padding:6px 12px;font-size:14px;font-weight:700;transition:color .15s;line-height:1;font-family:inherit;}
.mn-btn:hover:not(:disabled){color:#fff;}
.mn-btn:disabled{opacity:.25;cursor:default;}
.mn-lbl{font-size:12px;font-weight:600;color:var(--sub);padding:0 4px;min-width:76px;text-align:center;}
.live-badge{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:100px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--sub);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.kpi-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px 18px;display:flex;flex-direction:column;}
.kpi-card.hero{background:var(--g);border-color:transparent;position:relative;overflow:hidden;}
.kpi-card.hero::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.08);}
.kpi-card.hero::after{content:'';position:absolute;bottom:-20px;right:50px;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.05);}
.kpi-card.hero .kpi-label{color:rgba(0,0,0,.7);font-size:11px;}
.kpi-card.hero .kpi-val{color:#000;}
.kpi-card.hero .kpi-sub{color:rgba(0,0,0,.65);font-weight:700;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block;}
.kpi-val{font-size:40px;font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:6px;}
.kpi-sub{font-size:11px;font-weight:500;color:var(--sub);margin-top:auto;padding-top:8px;}
.kpi-delta{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;line-height:1.4;}
.kpi-delta.up{background:rgba(200,255,0,.12);color:var(--g);}
.kpi-card.hero .kpi-delta.up{background:rgba(0,0,0,.15);color:rgba(0,0,0,.8);}
.kpi-delta.dn{background:rgba(255,107,107,.1);color:var(--red);}
.kpi-delta.flat{background:rgba(255,255,255,.09);color:rgba(255,255,255,.5);}

/* Grids */
.row{margin-bottom:10px;}
.mid-grid{display:grid;grid-template-columns:3fr 1.4fr;gap:12px;margin-bottom:10px;}
.bottom-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:12px;}
@media(max-width:1100px){.kpi-row{grid-template-columns:1fr 1fr;}}
@media(max-width:900px){.mid-grid{grid-template-columns:1fr;}.bottom-grid{grid-template-columns:1fr;}}

/* Section card */
.section-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;overflow:hidden;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin:-22px -24px 18px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.06);}
.section-title{font-size:13px;font-weight:700;}
.section-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:100px;padding:3px 10px;white-space:nowrap;}
.section-label.green{background:rgba(200,255,0,.1);color:var(--g);border-color:rgba(200,255,0,.2);}

/* Funnel tabs */
.funnel-tabs{display:flex;gap:4px;}
.funnel-tab{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;color:var(--sub);font-size:11px;font-weight:700;padding:5px 14px;cursor:pointer;transition:all .15s;font-family:inherit;letter-spacing:.02em;}
.funnel-tab:hover:not(.active){background:rgba(255,255,255,.08);}
.funnel-tab.active{background:var(--g);color:#000;border-color:transparent;}

/* Funnel */
.funnel-item{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
.funnel-item:last-child{margin-bottom:0;}
.funnel-stage{font-size:12px;font-weight:600;color:var(--sub);width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.funnel-track{flex:1;height:14px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;}
.funnel-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.funnel-count{font-size:12px;font-weight:800;width:20px;text-align:right;flex-shrink:0;}
.funnel-dropped{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:9px 13px;border-radius:8px;border:1px dashed rgba(255,255,255,.08);}
.funnel-dropped-lbl{font-size:11px;font-weight:700;color:var(--sub);}
.funnel-dropped-tags{display:flex;gap:6px;flex-wrap:wrap;}
.drop-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--sub);}
.drop-tag span{color:rgba(255,255,255,.5);margin-left:4px;}

/* Sources */
.sources-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.src-row{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;}
.src-row-top{display:flex;align-items:center;gap:8px;}
.src-icon{width:28px;height:28px;border-radius:8px;object-fit:contain;background:rgba(255,255,255,.06);padding:4px;flex-shrink:0;}
.src-name{font-size:12px;font-weight:600;color:var(--sub);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.src-count{font-size:22px;font-weight:900;letter-spacing:-1px;line-height:1;}
.src-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;background:rgba(200,255,0,.12);color:var(--g);white-space:nowrap;align-self:flex-start;}
.src-pill.zero{background:rgba(255,255,255,.06);color:var(--muted);}

/* Rep Leaderboard */
.reps-container{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);overflow:hidden;}
.reps-header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;}
.reps-title{font-size:13px;font-weight:700;}
.reps-badge{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:100px;padding:3px 10px;}
.rep-row{display:grid;grid-template-columns:28px 40px 1fr 60px;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;}
.rep-row:last-child{border-bottom:none;}
.rep-row:hover{background:rgba(255,255,255,.02);}
.rep-rank-num{font-size:12px;font-weight:900;color:rgba(255,255,255,.18);text-align:center;font-variant-numeric:tabular-nums;}
.rep-rank-num.top{color:var(--g);}
.rep-av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.08);}
.rep-row:first-of-type .rep-av{border-color:rgba(200,255,0,.4);box-shadow:0 0 10px rgba(200,255,0,.15);}
.rep-mid{min-width:0;}
.rep-name-txt{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-sub{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:8px;}
.rep-prog-track{height:4px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden;}
.rep-prog-fill{height:100%;border-radius:100px;transition:width .7s cubic-bezier(.4,0,.2,1);}
.pf-1{background:var(--g);}
.rep-stat-block{text-align:right;}
.rep-stat-won{font-size:20px;font-weight:900;letter-spacing:-1px;line-height:1;display:block;}
.rep-stat-won.c1{color:var(--g);}
.rep-stat-rate{font-size:10px;font-weight:600;color:var(--muted);display:block;margin-top:3px;}
.rep-stat-mini{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(255,255,255,.04);}
.rep-stat-mini-cell{padding:13px 20px;border-right:1px solid rgba(255,255,255,.04);}
.rep-stat-mini-cell:last-child{border-right:none;}
.rep-stat-mini-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.rep-stat-mini-val{font-size:18px;font-weight:900;letter-spacing:-1px;}

/* Chart */
.chart-hdr{display:flex;align-items:center;justify-content:space-between;margin:-22px -24px 18px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.06);}
.chart-title{font-size:13px;font-weight:700;}
.chart-badge{font-size:10px;font-weight:700;padding:2px 10px;border-radius:5px;background:rgba(200,255,0,.1);color:var(--g);border:1px solid rgba(200,255,0,.2);}
.chart-wrap{position:relative;width:100%;height:140px;}
.chart-tip{display:none;position:absolute;pointer-events:none;background:#2a2a2a;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;z-index:10;}

/* Misc */
.empty-state{text-align:center;padding:24px 0;font-size:12px;color:rgba(255,255,255,.2);font-weight:600;}
.loading{display:flex;align-items:center;justify-content:center;min-height:300px;flex-direction:column;gap:10px;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.06);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
.loading-text{font-size:11px;color:rgba(255,255,255,.25);font-weight:600;}
.footer{text-align:center;padding:22px 0 4px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.1);}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <span class="wgt-title">Sales Pipeline</span>
    <span class="wgt-org">OPXIO</span>
    <div class="mn-pill">
      <button class="mn-btn" onclick="mnPrev()">&#8249;</button>
      <span class="mn-lbl" id="mn-lbl"></span>
      <button class="mn-btn" id="mn-next" onclick="mnNext()" disabled>&#8250;</button>
    </div>
  </div>

</div>

<div id="main">
  <div class="loading"><div class="spinner"></div><div class="loading-text">Loading</div></div>
</div>

<div class="footer">Widgets by Opxio.io</div>

<script>
var _tok = new URLSearchParams(location.search).get('token') || '';
var _now  = new Date();
var filterMonth = null;
var _navTimer = null;
var _lastData = null;
var _funnelTab = 'leads';

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function prevMonthParams(fm){
  var y=fm?fm.year:_now.getFullYear(), m=fm?fm.month:_now.getMonth();
  m--; if(m<0){m=11;y--;} return {month:m,year:y};
}
var _UP_SVG="<svg width=\"12\" height=\"9\" viewBox=\"0 0 12 9\" fill=\"none\" style=\"display:inline-block;vertical-align:middle;margin-right:3px;\"><polyline points=\"0,8 4,4 7,6 12,1\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";
var _DN_SVG="<svg width=\"12\" height=\"9\" viewBox=\"0 0 12 9\" fill=\"none\" style=\"display:inline-block;vertical-align:middle;margin-right:3px;\"><polyline points=\"0,1 4,5 7,3 12,8\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";
var _FL_SVG="<svg width=\"12\" height=\"9\" viewBox=\"0 0 12 9\" fill=\"none\" style=\"display:inline-block;vertical-align:middle;margin-right:3px;\"><line x1=\"0\" y1=\"4.5\" x2=\"12\" y2=\"4.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/></svg>";
function deltaHtml(curr,prev,lowerIsBetter){
  if(prev==null||prev===0) return '';
  var pct=Math.round(((curr-prev)/prev)*100);
  if(pct===0) return '<span class="kpi-delta flat">'+_FL_SVG+'0%</span>';
  var up=pct>0;
  var good=lowerIsBetter?!up:up;
  var cls=good?'up':'dn';
  return '<span class="kpi-delta '+cls+'">'+(up?_UP_SVG:_DN_SVG)+Math.abs(pct)+'%</span>';
}
function fmtRM(n){ if(!n) return '—'; if(n>=1000000) return 'RM '+(n/1000000).toFixed(1)+'M'; if(n>=1000) return 'RM '+(n/1000).toFixed(0)+'K'; return 'RM '+n; }
function fmtMonthLbl(fm){
  var d = fm ? new Date(fm.year,fm.month,1) : new Date();
  return d.toLocaleString('default',{month:'short',year:'numeric'});
}
function updateMonthNav(){
  document.getElementById('mn-lbl').textContent = fmtMonthLbl(filterMonth);
  var isCur = !filterMonth||(filterMonth.year===_now.getFullYear()&&filterMonth.month===_now.getMonth());
  document.getElementById('mn-next').disabled = isCur;
}
function mnPrev(){
  if(!filterMonth) filterMonth={year:_now.getFullYear(),month:_now.getMonth()};
  filterMonth.month--;
  if(filterMonth.month<0){filterMonth.month=11;filterMonth.year--;}
  updateMonthNav(); clearTimeout(_navTimer); _navTimer=setTimeout(load,300); load();
}
function mnNext(){
  if(!filterMonth) return;
  filterMonth.month++;
  if(filterMonth.month>11){filterMonth.month=0;filterMonth.year++;}
  if(filterMonth.year>_now.getFullYear()||(filterMonth.year===_now.getFullYear()&&filterMonth.month>=_now.getMonth())) filterMonth=null;
  updateMonthNav(); clearTimeout(_navTimer); _navTimer=setTimeout(load,300); load();
}

var LEAD_FILLS = [
  'rgba(255,255,255,.32)','rgba(255,255,255,.28)','rgba(255,255,255,.25)',
  'rgba(255,255,255,.22)','rgba(255,255,255,.18)','rgba(255,255,255,.14)','var(--g)',
];
var DEAL_FILLS = [
  'rgba(255,255,255,.30)','rgba(255,255,255,.25)','rgba(255,255,255,.20)',
  'rgba(255,255,255,.15)','var(--g)',
];
var SRC_ICONS = {
  'LinkedIn':          'https://widgets.opxio.io/icons/social/linkedin.png',
  'Referral':          'https://widgets.opxio.io/icons/social/referral.png',
  'WhatsApp':          'https://widgets.opxio.io/icons/social/social.png',
  'Threads':           'https://widgets.opxio.io/icons/social/threads.png',
  'Instagram':         'https://widgets.opxio.io/icons/social/instagram.png',
  'TikTok':            'https://widgets.opxio.io/icons/social/tiktok.png',
  'Cold Outreach':     'https://widgets.opxio.io/icons/social/other-sources.png',
  'Website / Organic': 'https://widgets.opxio.io/icons/social/other-sources.png',
  'Ads':               'https://widgets.opxio.io/icons/social/other-sources.png',
  'Notion Marketplace':'https://widgets.opxio.io/icons/social/other-sources.png',
};

function switchFunnelTab(tab){
  _funnelTab = tab;
  var tabs = document.querySelectorAll('.funnel-tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].id==='tab-'+tab);
  if(_lastData) updateFunnelDisplay(_lastData);
}

function updateFunnelDisplay(d){
  var body = document.getElementById('funnel-body');
  var badge = document.getElementById('funnel-badge');
  if(!body) return;
  if(_funnelTab==='deals'){
    var top = (d.dealFunnel&&d.dealFunnel[0]) ? d.dealFunnel[0].count : 1;
    body.innerHTML = renderFunnel(d.dealFunnel||[], DEAL_FILLS, top);
    if(badge){badge.textContent=(d.kpi&&d.kpi.openDeals||0)+' open deals';badge.className='section-label';}
  } else {
    var top = (d.leadFunnel&&d.leadFunnel[0]) ? d.leadFunnel[0].count : 1;
    var dropped = (d.dropped&&d.dropped.unqualified)||0;
    var droppedHtml = dropped>0
      ? '<div class="funnel-dropped"><span class="funnel-dropped-lbl">Dropped this period</span><div class="funnel-dropped-tags"><span class="drop-tag">Unqualified<span>'+dropped+'</span></span></div></div>'
      : '';
    body.innerHTML = renderFunnel(d.leadFunnel||[], LEAD_FILLS, top) + droppedHtml;
    if(badge){badge.textContent=(d.kpi&&d.kpi.openLeads||0)+' open leads';badge.className='section-label green';}
  }
}

function renderFunnel(items, fills, topCount){
  if(!items||!items.length) return '<div class="empty-state">No data yet</div>';
  var max=Math.max.apply(null,items.map(function(i){return i.count;}).concat([1]));
  var total=topCount||max;
  return items.map(function(item,idx){
    var w=item.count>0?Math.max(Math.round((item.count/max)*100),3):0;
    var fill=fills[idx]||fills[fills.length-1];
    return '<div class="funnel-item">'
      +'<span class="funnel-stage">'+esc(item.stage)+'</span>'
      +'<div class="funnel-track"><div class="funnel-fill" style="width:'+w+'%;background:'+fill+';"></div></div>'
      +'<span class="funnel-count">'+item.count+'</span>'
      +'</div>';
  }).join('');
}

function renderSources(obj){
  if(!obj||!Object.keys(obj).length) return '<div class="empty-state">No source data yet</div>';
  var entries=Object.entries(obj).sort(function(a,b){return b[1].leads-a[1].leads;}).slice(0,9);
  return entries.map(function(e){
    var name=e[0],leads=e[1].leads,closed=e[1].closed;
    var rate=leads>0?Math.round((closed/leads)*100):0;
    var icon=SRC_ICONS[name]||SRC_ICONS['Cold Outreach'];
    var pClass=closed===0?'src-pill zero':'src-pill';
    return '<div class="src-row">'
      +'<div class="src-row-top"><img class="src-icon" src="'+icon+'" onerror="this.style.display=\'none\'" />'
      +'<span class="src-name">'+esc(name)+'</span></div>'
      +'<span class="src-count">'+leads+'</span>'
      +'<span class="'+pClass+'">'+closed+' closed · '+rate+'%</span>'
      +'</div>';
  }).join('');
}

function renderReps(kpi){
  var won=kpi.closedWonMTD||0;
  var rate=kpi.convRate||0;
  var newL=kpi.newLeadsMTD||0;
  var wonCls=won>0?' c1':'';
  return '<div class="rep-row">'
    +'<div class="rep-rank-num top">01</div>'
    +'<img class="rep-av" src="https://api.dicebear.com/9.x/notionists/svg?seed=KaiOpxio&backgroundColor=d1fae5" alt="K" onerror="this.style.background=\'rgba(200,255,0,.12)\'" />'
    +'<div class="rep-mid">'
    +'<div class="rep-name-txt">Kai</div>'
    +'<div class="rep-sub">'+newL+' leads this month · Founder</div>'
    +'<div class="rep-prog-track"><div class="rep-prog-fill pf-1" style="width:100%"></div></div>'
    +'</div>'
    +'<div class="rep-stat-block"><span class="rep-stat-won'+wonCls+'">'+won+'</span><span class="rep-stat-rate">'+rate+'% close rate</span></div>'
    +'</div>'
    +'<div class="rep-stat-mini">'
    +'<div class="rep-stat-mini-cell"><div class="rep-stat-mini-lbl">Pipeline Value</div><div class="rep-stat-mini-val" style="color:var(--blue);font-size:16px;">'+fmtRM(kpi.pipelineValue||0)+'</div></div>'
    +'<div class="rep-stat-mini-cell"><div class="rep-stat-mini-lbl">Open Deals</div><div class="rep-stat-mini-val">'+(kpi.openDeals||0)+'</div></div>'
    +'</div>';
}

var _chartData=null, _chartTotal=0, _chartRO=null;

function drawChart(trend, totalLeads){
  var wrap=document.getElementById('cwrap');
  var svg=document.getElementById('csvg');
  var tip=document.getElementById('ctip');
  var badge=document.getElementById('cbadge');
  if(!wrap||!svg||!trend||!trend.length) return;
  if(badge) badge.textContent=totalLeads+' leads total';
  var ns='http://www.w3.org/2000/svg';
  var W=wrap.offsetWidth||400, H=140;
  svg.setAttribute('width',W); svg.setAttribute('height',H); svg.innerHTML='';
  var AC='#C8FF00';
  var ACA=function(a){return 'rgba(200,255,0,'+a+')';};
  var PAD={t:14,r:16,b:44,l:44};
  var cW=W-PAD.l-PAD.r, cH=H-PAD.t-PAD.b;
  var rawMax=Math.max.apply(null,trend.map(function(d){return d.count;}).concat([1]));
  // Round up to a nice number so Y axis ticks are meaningful integers
  var niceMax=rawMax<=4?4:rawMax<=8?8:rawMax<=10?10:Math.ceil(rawMax/5)*5;
  var maxV=niceMax;
  var xP=function(i){return PAD.l+(i/(trend.length-1||1))*cW;};
  var yP=function(v){return PAD.t+cH-(v/maxV)*cH;};
  var dim='rgba(255,255,255,.35)';
  var seenY=[];
  for(var gi=0;gi<=4;gi++){
    var gy=PAD.t+(gi/4)*cH;
    var gl=document.createElementNS(ns,'line');
    gl.setAttribute('x1',PAD.l); gl.setAttribute('x2',W-PAD.r);
    gl.setAttribute('y1',gy); gl.setAttribute('y2',gy);
    gl.setAttribute('stroke','rgba(255,255,255,.04)'); gl.setAttribute('stroke-dasharray','3,5');
    svg.appendChild(gl);
    if(gi<4){
      var yVal=Math.round(maxV-(gi/4)*maxV);
      if(seenY.indexOf(yVal)===-1){
        seenY.push(yVal);
        var gt=document.createElementNS(ns,'text');
        gt.setAttribute('x',PAD.l-5); gt.setAttribute('y',gy+4);
        gt.setAttribute('text-anchor','end'); gt.setAttribute('fill',dim);
        gt.setAttribute('font-size','12'); gt.setAttribute('font-family','Satoshi,-apple-system,sans-serif');
        gt.textContent=yVal;
        svg.appendChild(gt);
      }
    }
  }
  trend.forEach(function(d,i){
    var isCur=i===trend.length-1;
    var xt=document.createElementNS(ns,'text');
    xt.setAttribute('x',xP(i)); xt.setAttribute('y',H-PAD.b+20);
    xt.setAttribute('text-anchor','middle');
    xt.setAttribute('fill',isCur?AC:dim);
    xt.setAttribute('font-size','12'); xt.setAttribute('font-weight',isCur?'700':'500');
    xt.setAttribute('font-family','Satoshi,-apple-system,sans-serif');
    xt.textContent=d.label; svg.appendChild(xt);
  });
  var pts=trend.map(function(d,i){return [xP(i),yP(d.count)];});
  function smooth(p){
    var dd='M '+p[0][0]+' '+p[0][1];
    for(var si=1;si<p.length;si++){
      var x1=p[si-1][0],y1=p[si-1][1],x2=p[si][0],y2=p[si][1],cx=(x1+x2)/2;
      dd+=' C '+cx+' '+y1+' '+cx+' '+y2+' '+x2+' '+y2;
    }
    return dd;
  }
  var pathD=smooth(pts);
  var last=pts[pts.length-1], first=pts[0];
  var defs=document.createElementNS(ns,'defs');
  var grad=document.createElementNS(ns,'linearGradient');
  grad.setAttribute('id','lgF'); grad.setAttribute('x1','0'); grad.setAttribute('y1','0');
  grad.setAttribute('x2','0'); grad.setAttribute('y2','1');
  [[0,'0.18'],[100,'0.01']].forEach(function(sg){
    var s=document.createElementNS(ns,'stop');
    s.setAttribute('offset',sg[0]+'%'); s.setAttribute('stop-color',AC); s.setAttribute('stop-opacity',sg[1]);
    grad.appendChild(s);
  });
  defs.appendChild(grad); svg.insertBefore(defs,svg.firstChild);
  var area=document.createElementNS(ns,'path');
  area.setAttribute('d',pathD+' L '+last[0]+' '+(H-PAD.b)+' L '+first[0]+' '+(H-PAD.b)+' Z');
  area.setAttribute('fill','url(#lgF)'); svg.appendChild(area);
  var line=document.createElementNS(ns,'path');
  line.setAttribute('d',pathD); line.setAttribute('fill','none');
  line.setAttribute('stroke',AC); line.setAttribute('stroke-width','2');
  line.setAttribute('stroke-linecap','round'); svg.appendChild(line);
  var hL=document.createElementNS(ns,'line');
  hL.setAttribute('stroke',ACA(0.2)); hL.setAttribute('stroke-width','1');
  hL.setAttribute('y1',PAD.t); hL.setAttribute('y2',H-PAD.b);
  hL.style.opacity='0'; svg.appendChild(hL);
  trend.forEach(function(d,i){
    var isCur=i===trend.length-1;
    var dot=document.createElementNS(ns,'circle');
    dot.setAttribute('cx',xP(i)); dot.setAttribute('cy',yP(d.count));
    dot.setAttribute('r',isCur?'5':'3.5');
    dot.setAttribute('fill',isCur?AC:'#222');
    dot.setAttribute('stroke',AC); dot.setAttribute('stroke-width','2');
    if(isCur) dot.setAttribute('filter','drop-shadow(0 0 6px '+ACA(0.7)+')');
    svg.appendChild(dot);
  });
  wrap.onmousemove=function(e){
    var rect=wrap.getBoundingClientRect(),mx=e.clientX-rect.left;
    var bi=null,bd=Infinity;
    trend.forEach(function(d,i){var dist=Math.abs(xP(i)-mx);if(dist<bd){bd=dist;bi=i;}});
    if(bi===null||bd>60){tip.style.display='none';hL.style.opacity='0';return;}
    var px=xP(bi);
    hL.setAttribute('x1',px); hL.setAttribute('x2',px); hL.style.opacity='1';
    tip.style.display='block';
    tip.style.left=Math.min(mx+14,rect.width-110)+'px';
    tip.style.top=(e.clientY-rect.top-40)+'px';
    tip.innerHTML='<span style="color:rgba(255,255,255,.4);font-size:9px;">'+esc(trend[bi].label)+'</span>&nbsp;&nbsp;'+trend[bi].count+' leads';
  };
  wrap.onmouseleave=function(){tip.style.display='none';hL.style.opacity='0';};
}

function render(d,prev){
  _lastData = d;
  var pk=prev&&prev.kpi||null;
  var kpi=d.kpi||{};
  var monLabel=fmtMonthLbl(filterMonth);
  var cwCol=(kpi.closedWonMTD||0)>0?'var(--g)':'rgba(255,255,255,.2)';
  var crCol=kpi.convRate>=30?'var(--g)':kpi.convRate>0?'var(--amber)':'rgba(255,255,255,.2)';
  var pvSize=(kpi.pipelineValue||0)>=100000?'28px':'38px';

  var kpiRow='<div class="kpi-row row">'
    +'<div class="kpi-card hero"><div class="kpi-label">New Leads — '+esc(monLabel)+'</div><div class="kpi-val">'+(kpi.newLeadsMTD||0)+'</div><div class="kpi-sub">Leads this month</div>'+deltaHtml(kpi.newLeadsMTD||0,pk&&pk.newLeadsMTD,false)+'</div>'
    +'<div class="kpi-card"><div class="kpi-label">Closed Won</div><div class="kpi-val" style="color:'+cwCol+';font-size:34px;">'+(kpi.closedWonMTD||0)+'</div><div class="kpi-sub">Deals won</div>'+deltaHtml(kpi.closedWonMTD||0,pk&&pk.closedWonMTD,false)+'</div>'
    +'<div class="kpi-card"><div class="kpi-label">Conversion Rate</div><div class="kpi-val" style="color:'+crCol+';font-size:34px;">'+(kpi.convRate||0)+'%</div><div class="kpi-sub">Leads → Converted</div>'+deltaHtml(kpi.convRate||0,pk&&pk.convRate,false)+'</div>'
    +'<div class="kpi-card"><div class="kpi-label">Pipeline Value</div><div class="kpi-val" style="color:var(--blue);font-size:'+pvSize+';">'+fmtRM(kpi.pipelineValue)+'</div><div class="kpi-sub">'+(kpi.openDeals||0)+' open deals</div>'+deltaHtml(kpi.pipelineValue||0,pk&&pk.pipelineValue,false)+'</div>'
    +'</div>';

  var midGrid='<div class="mid-grid row">'
    +'<div class="section-card">'
    +'<div class="section-header">'
      +'<span class="section-title">Pipeline Funnel</span>'
      +'<div style="display:flex;align-items:center;gap:8px;">'
        +'<div class="funnel-tabs">'
          +'<button class="funnel-tab active" id="tab-leads" onclick="switchFunnelTab(\'leads\')">Leads</button>'
          +'<button class="funnel-tab" id="tab-deals" onclick="switchFunnelTab(\'deals\')">Deals</button>'
        +'</div>'
        +'<span class="section-label green" id="funnel-badge">'+(kpi.openLeads||0)+' open leads</span>'
      +'</div>'
    +'</div>'
    +'<div id="funnel-body"></div>'
    +'</div>'
    +'<div class="reps-container">'
      +'<div class="reps-header"><span class="reps-title">Sales Performance</span><span class="reps-badge">'+esc(monLabel)+'</span></div>'
      +renderReps(kpi)
    +'</div>'
    +'</div>';

  var bottomGrid='<div class="bottom-grid row">'
    +'<div class="section-card">'
      +'<div class="chart-hdr"><span class="chart-title">Leads Incoming by Month</span><span class="chart-badge" id="cbadge">loading…</span></div>'
      +'<div class="chart-wrap" id="cwrap"><svg id="csvg" style="display:block;overflow:visible;position:absolute;top:0;left:0;width:100%;height:100%;"></svg><div class="chart-tip" id="ctip"></div></div>'
    +'</div>'
    +'<div class="section-card">'
      +'<div class="section-header"><span class="section-title">Lead Sources</span><span class="section-label">'+esc(monLabel)+'</span></div>'
      +'<div class="sources-grid">'+renderSources(d.sourceBreakdown)+'</div>'
    +'</div>'
    +'</div>';

  document.getElementById('main').innerHTML=kpiRow+midGrid+bottomGrid;
  updateFunnelDisplay(d);

  _chartData=d.monthlyTrend||[];
  _chartTotal=(d.totals&&d.totals.leads)||0;
  if(_chartRO) _chartRO.disconnect();
  var cwrap=document.getElementById('cwrap');
  if(cwrap){
    drawChart(_chartData,_chartTotal);
    _chartRO=new ResizeObserver(function(){drawChart(_chartData,_chartTotal);});
    _chartRO.observe(cwrap);
  }
}

var _loadCtrl=null, _abortedByNav=false;
var _monthCache=new Map();
var CURRENT_TTL=6*60*1000, PAST_TTL=30*60*1000;
function monthKey(fm){return fm?fm.year+'-'+fm.month:'current';}

function load(forceNetwork){
  if(_loadCtrl){_abortedByNav=true;_loadCtrl.abort();}
  _abortedByNav=false; forceNetwork=!!forceNetwork;
  var ck=monthKey(filterMonth);
  var cached=_monthCache.get(ck);
  var ttl=!filterMonth?CURRENT_TTL:PAST_TTL;
  if(!forceNetwork&&cached&&(Date.now()-cached.ts)<ttl){render(cached.data,cached.prev||null);return;}
  _loadCtrl=new AbortController();
  var sig=_loadCtrl.signal;
  var timer=setTimeout(function(){_abortedByNav=false;_loadCtrl.abort();},25000);
  var params=new URLSearchParams();
  if(_tok) params.set('token',_tok);
  if(filterMonth){params.set('month',filterMonth.month);params.set('year',filterMonth.year);}
  var pm=prevMonthParams(filterMonth);
  var prevParams=new URLSearchParams();
  if(_tok) prevParams.set('token',_tok);
  prevParams.set('month',pm.month); prevParams.set('year',pm.year);
  Promise.all([
    fetch('https://api.opxio.io/api/clients/opxio/sales-pipeline?'+params.toString(),{signal:sig}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
    fetch('https://api.opxio.io/api/clients/opxio/sales-pipeline?'+prevParams.toString(),{signal:sig}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ])
    .then(function(res){var data=res[0],prev=res[1];_monthCache.set(ck,{data:data,prev:prev,ts:Date.now()});render(data,prev);})
    .catch(function(e){
      if(e.name==='AbortError'){
        if(_abortedByNav) return;
        document.getElementById('main').innerHTML='<div class="loading"><div style="color:var(--red);font-size:12px;font-weight:700;">Timed out — <a href="" style="color:var(--g);" onclick="location.reload();return false;">Reload</a></div></div>';
        return;
      }
      document.getElementById('main').innerHTML='<div class="loading"><div style="color:var(--red);font-size:12px;font-weight:700;">Failed — '+esc(e.message)+'</div></div>';
    })
    .finally(function(){clearTimeout(timer);});
}

updateMonthNav();
load();
setInterval(function(){_monthCache.delete('current');load(true);},6*60*1000);
</script>
