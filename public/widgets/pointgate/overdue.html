<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pointgate — Overdue Payments</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:20px 20px 40px;background:#191919;color:#fff;overflow-y:auto;}
:root{
  --g:#AAFF00;--gm:rgba(170,255,0,.09);--gb:rgba(170,255,0,.2);
  --red:#FF5757;--amber:#FBBF24;--orange:#FB923C;--blue:#60A5FA;--muted:rgba(255,255,255,.3);
}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:999px;}
.card{background:#222;border:1px solid rgba(255,255,255,.07);border-radius:14px;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:4px;}
.h-title{font-size:21px;font-weight:900;letter-spacing:-.04em;}
.h-right{display:flex;align-items:center;gap:8px;}
.ts{font-size:10px;color:rgba(255,255,255,.18);}
.icon-btn{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Summary bar */
.summary-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px;}
@media(max-width:800px){.summary-bar{grid-template-columns:repeat(3,1fr);}}
.sum-card{background:#222;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;}
.sum-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.sum-val{font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1;}
.sum-sub{font-size:10px;margin-top:3px;opacity:.5;}

.t-critical .sum-label{color:#FF5757;} .t-critical .sum-val{color:#FF5757;}
.t-severe   .sum-label{color:#FB923C;} .t-severe   .sum-val{color:#FB923C;}
.t-urgent   .sum-label{color:#FBBF24;} .t-urgent   .sum-val{color:#FBBF24;}
.t-warning  .sum-label{color:#FDE68A;} .t-warning  .sum-val{color:#FDE68A;}
.t-notice   .sum-label{color:#60A5FA;} .t-notice   .sum-val{color:#60A5FA;}
.t-recent   .sum-label{color:rgba(255,255,255,.4);} .t-recent .sum-val{color:rgba(255,255,255,.4);}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.3);}
.pill{font-size:11px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);cursor:pointer;transition:all .13s;user-select:none;}
.pill:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.75);}
.pill.active{background:var(--gm);border-color:var(--gb);color:var(--g);}

/* Secret input */
.secret-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.secret-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);flex-shrink:0;}
.secret-input{background:#1e1e1e;border:1px solid rgba(255,255,255,.09);border-radius:8px;color:rgba(255,255,255,.6);font-family:inherit;font-size:12px;padding:5px 10px;outline:none;width:180px;transition:border-color .13s;}
.secret-input:focus{border-color:rgba(170,255,0,.35);}
.secret-hint{font-size:10px;color:rgba(255,255,255,.2);}

/* Table sections */
.section{margin-bottom:14px;}
.section-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);}
.section-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.section-count{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);}
.section-total{font-size:11px;font-weight:700;margin-left:auto;}

.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.28);padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;}
.tbl th.r{text-align:right;}
.tbl td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
.tbl td.r{text-align:right;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(255,255,255,.02);}

.lot{font-weight:700;font-size:12.5px;}
.tname{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.monthbadge{font-size:10.5px;color:rgba(255,255,255,.5);}
.rm{font-variant-numeric:tabular-nums;}
.bal-neg{color:#FF5757;}

/* Days overdue pill */
.days-chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;}
.days-critical{background:rgba(255,87,87,.15);color:#FF5757;border:1px solid rgba(255,87,87,.25);}
.days-severe  {background:rgba(251,146,60,.12);color:#FB923C;border:1px solid rgba(251,146,60,.2);}
.days-urgent  {background:rgba(251,191,36,.12);color:#FBBF24;border:1px solid rgba(251,191,36,.2);}
.days-warning {background:rgba(253,230,138,.1);color:#FDE68A;border:1px solid rgba(253,230,138,.18);}
.days-notice  {background:rgba(96,165,250,.1);color:#60A5FA;border:1px solid rgba(96,165,250,.18);}
.days-recent  {background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1);}

/* Notice sent */
.notice-col{display:flex;flex-direction:column;gap:3px;}
.notice-tag{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:4px;}
.n14-sent{background:rgba(74,222,128,.1);color:#4ADE80;}
.n21-sent{background:rgba(251,191,36,.1);color:#FBBF24;}
.n-none{color:rgba(255,255,255,.2);font-size:10px;}

/* Send buttons */
.send-col{display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.btn-send{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:7px;border:1px solid rgba(74,222,128,.25);background:rgba(74,222,128,.07);color:#4ADE80;cursor:pointer;transition:all .13s;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.btn-send:hover{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.4);}
.btn-send:disabled{opacity:.3;pointer-events:none;cursor:default;}
.btn-send.sending{opacity:.5;pointer-events:none;}
.btn-send.urgent-send{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07);color:#FBBF24;}
.btn-send.urgent-send:hover{background:rgba(251,191,36,.14);}
.btn-send.critical-send{border-color:rgba(255,87,87,.3);background:rgba(255,87,87,.07);color:#FF5757;}
.btn-send.critical-send:hover{background:rgba(255,87,87,.14);}
.no-phone{font-size:10px;color:rgba(255,255,255,.2);font-style:italic;}
.send-ok{font-size:10px;color:#4ADE80;display:flex;align-items:center;gap:4px;}

/* Empty / error */
.empty{padding:32px;text-align:center;color:rgba(255,255,255,.25);font-size:13px;}
.err-banner{padding:10px 14px;background:rgba(255,87,87,.1);border:1px solid rgba(255,87,87,.2);border-radius:10px;color:#FF5757;font-size:12px;margin-bottom:12px;display:none;}
@keyframes shimmer{0%{opacity:.4}50%{opacity:.8}100%{opacity:.4}}
.skel{background:rgba(255,255,255,.06);border-radius:6px;animation:shimmer 1.4s ease-in-out infinite;display:inline-block;}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="eyebrow">Pointgate Properties</div>
    <div class="h-title">Overdue Payments</div>
  </div>
  <div class="h-right">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" id="btn-refresh" onclick="load(true)" title="Refresh">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5M13.5 2.5v3h-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<div class="err-banner" id="err-banner"></div>

<!-- Summary -->
<div class="summary-bar">
  <div class="sum-card t-critical"><div class="sum-label">Critical</div><div class="sum-val" id="s-critical">—</div><div class="sum-sub">60+ days</div></div>
  <div class="sum-card t-severe">  <div class="sum-label">Severe</div>  <div class="sum-val" id="s-severe">—</div>  <div class="sum-sub">30–59 days</div></div>
  <div class="sum-card t-urgent">  <div class="sum-label">Urgent</div>  <div class="sum-val" id="s-urgent">—</div>  <div class="sum-sub">21–29 days</div></div>
  <div class="sum-card t-warning"> <div class="sum-label">Warning</div> <div class="sum-val" id="s-warning">—</div> <div class="sum-sub">14–20 days</div></div>
  <div class="sum-card t-notice">  <div class="sum-label">Notice</div>  <div class="sum-val" id="s-notice">—</div>  <div class="sum-sub">7–13 days</div></div>
  <div class="sum-card t-recent">  <div class="sum-label">Recent</div>  <div class="sum-val" id="s-recent">—</div>  <div class="sum-sub">1–6 days</div></div>
</div>

<!-- Filter + WhatsApp secret -->
<div class="filters">
  <span class="filter-label">Show</span>
  <div class="pill active" data-tier="" onclick="setTier(this)">All</div>
  <div class="pill" data-tier="critical" onclick="setTier(this)">Critical</div>
  <div class="pill" data-tier="severe"   onclick="setTier(this)">Severe</div>
  <div class="pill" data-tier="urgent"   onclick="setTier(this)">Urgent</div>
  <div class="pill" data-tier="warning"  onclick="setTier(this)">Warning</div>
  <div class="pill" data-tier="notice"   onclick="setTier(this)">Notice</div>
  <div class="pill" data-tier="recent"   onclick="setTier(this)">Recent</div>
</div>
<div class="secret-row">
  <span class="secret-label">WA Secret</span>
  <input class="secret-input" id="wa-secret" type="password" placeholder="Enter notify secret" autocomplete="off"/>
  <span class="secret-hint">Required to send WhatsApp notices</span>
</div>

<!-- Sections container -->
<div id="sections-wrap"></div>

<script>
const API      = 'https://api.opxio.io/api/clients/pointgate/overdue'
const SEND_API = 'https://api.opxio.io/api/clients/pointgate/overdue/send'
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']

const TIERS = [
  { key: 'critical', label: 'Critical',  sub:'60+ days',   dotColor:'#FF5757', chipClass:'days-critical' },
  { key: 'severe',   label: 'Severe',    sub:'30–59 days', dotColor:'#FB923C', chipClass:'days-severe'   },
  { key: 'urgent',   label: 'Urgent',    sub:'21–29 days', dotColor:'#FBBF24', chipClass:'days-urgent'   },
  { key: 'warning',  label: 'Warning',   sub:'14–20 days', dotColor:'#FDE68A', chipClass:'days-warning'  },
  { key: 'notice',   label: 'Notice',    sub:'7–13 days',  dotColor:'#60A5FA', chipClass:'days-notice'   },
  { key: 'recent',   label: 'Recent',    sub:'1–6 days',   dotColor:'rgba(255,255,255,.3)', chipClass:'days-recent' },
]

let _rows = []
let _filterTier = ''
let _sendState = {}   // pageId → 'sending' | 'sent14' | 'sent21' | 'error'

const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
const fmRM = n => n==null?'—':'RM '+Number(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})
const fmDate = s => { if(!s)return '—'; const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-MY',{day:'2-digit',month:'short'}) }
const today = new Date().toISOString().slice(0,10)

function setTier(el) {
  document.querySelectorAll('[data-tier]').forEach(e=>e.classList.remove('active'))
  el.classList.add('active')
  _filterTier = el.dataset.tier
  render(_rows)
}

function chipClass(tier) {
  return TIERS.find(t=>t.key===tier)?.chipClass || 'days-recent'
}

function sendBtnLabel(row) {
  const state = _sendState[row.id]
  if (state === 'sending') return null // handled inline
  if (state === 'sent14' || state === 'sent21') return 'sent'
  if (!row.phone) return 'nophone'

  // Determine what to show
  const sentToday14 = row.sent14 === today
  const sentToday21 = row.sent21 === today

  if (row.daysOver >= 21) {
    // Two options: 14d (if not sent today) and 21d (if not sent today)
    return { show21: !sentToday21, show14: !sentToday14 && !row.sent14 }
  } else if (row.daysOver >= 14) {
    return { show14: !sentToday14 }
  } else {
    // < 14 days — allow manual send as "reminder"
    return { show14: !sentToday14 }
  }
}

function renderSendBtns(row) {
  const state = _sendState[row.id]
  if (state === 'sending') return `<span style="font-size:10px;color:rgba(255,255,255,.3)">Sending…</span>`

  if (!row.phone) return `<span class="no-phone">No phone</span>`

  const sentToday14 = row.sent14 === today || state === 'sent14'
  const sentToday21 = row.sent21 === today || state === 'sent21'

  let btns = ''
  if (row.daysOver >= 21 && !sentToday21) {
    const cls = row.daysOver >= 60 ? 'critical-send' : row.daysOver >= 30 ? 'urgent-send' : 'urgent-send'
    btns += `<button class="btn-send ${cls}" onclick="sendNotice('${esc(row.id)}','21d')">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 11.5A10 10 0 0 1 8 2a10 10 0 0 1 6 9.5" stroke-linecap="round"/><path d="M5.5 14.5h5M8 11v3" stroke-linecap="round"/></svg>
      Final Notice
    </button>`
  } else if (sentToday21) {
    btns += `<span class="send-ok">✓ Final sent today</span>`
  }

  if (!sentToday14 && !row.sent14) {
    btns += `<button class="btn-send" onclick="sendNotice('${esc(row.id)}','14d')">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 11.5A10 10 0 0 1 8 2a10 10 0 0 1 6 9.5" stroke-linecap="round"/><path d="M5.5 14.5h5M8 11v3" stroke-linecap="round"/></svg>
      1st Reminder
    </button>`
  } else if (sentToday14) {
    btns += `<span class="send-ok">✓ Reminder sent today</span>`
  } else if (row.sent14 && !sentToday14) {
    btns += `<span style="font-size:10px;color:rgba(255,255,255,.25)">Reminded ${fmDate(row.sent14)}</span>`
  }

  return `<div class="send-col">${btns || '<span class="no-phone">—</span>'}</div>`
}

function renderNotices(row) {
  const parts = []
  if (row.sent21) parts.push(`<span class="notice-tag n21-sent">Final ${fmDate(row.sent21)}</span>`)
  if (row.sent14) parts.push(`<span class="notice-tag n14-sent">1st ${fmDate(row.sent14)}</span>`)
  if (!parts.length) parts.push(`<span class="n-none">None sent</span>`)
  return `<div class="notice-col">${parts.join('')}</div>`
}

function render(rows) {
  const wrap = document.getElementById('sections-wrap')
  const filtered = _filterTier ? rows.filter(r=>r.tier===_filterTier) : rows

  if (!filtered.length) {
    wrap.innerHTML = `<div class="empty">No overdue payments${_filterTier?' in this tier':''}. 🎉</div>`
    return
  }

  const tiersToShow = _filterTier
    ? TIERS.filter(t=>t.key===_filterTier)
    : TIERS

  let html = ''
  for (const t of tiersToShow) {
    const tierRows = filtered.filter(r=>r.tier===t.key)
    if (!tierRows.length) continue

    const totalBal = tierRows.reduce((s,r)=>s+r.balance,0)
    html += `
    <div class="card section" id="section-${t.key}">
      <div class="section-hdr">
        <div class="section-dot" style="background:${t.dotColor}"></div>
        <span class="section-title" style="color:${t.dotColor}">${t.label}</span>
        <span class="section-count">${tierRows.length} unit${tierRows.length>1?'s':''}</span>
        <span style="font-size:10px;color:rgba(255,255,255,.3)">${t.sub}</span>
        <span class="section-total" style="color:${t.dotColor}">${fmRM(totalBal)}</span>
      </div>
      <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>
          <th>Lot / Tenant</th>
          <th>Month</th>
          <th class="r">Balance</th>
          <th>Days Overdue</th>
          <th>Notices Sent</th>
          <th>Send Notice</th>
        </tr></thead>
        <tbody>
          ${tierRows.map(r=>`
          <tr id="tr-${esc(r.id)}">
            <td>
              <div class="lot">${esc(r.lot)}</div>
              <div class="tname">${esc(r.tenant||'—')}</div>
            </td>
            <td><span class="monthbadge">${esc(r.monthLabel)}</span></td>
            <td class="r"><span class="rm bal-neg">${fmRM(r.balance)}</span></td>
            <td><span class="days-chip ${chipClass(r.tier)}">${r.daysOver}d</span></td>
            <td id="notices-${esc(r.id)}">${renderNotices(r)}</td>
            <td id="sendbtn-${esc(r.id)}">${renderSendBtns(r)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>`
  }

  wrap.innerHTML = html
}

async function sendNotice(pageId, template) {
  const secret = document.getElementById('wa-secret').value.trim()
  if (!secret) { alert('Enter the WhatsApp notify secret first'); return }

  _sendState[pageId] = 'sending'
  const sendCell = document.getElementById(`sendbtn-${pageId}`)
  if (sendCell) sendCell.innerHTML = `<span style="font-size:10px;color:rgba(255,255,255,.3)">Sending…</span>`

  try {
    const r = await fetch(SEND_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-notify-secret': secret },
      body: JSON.stringify({ pageId, forceTemplate: template }),
    })
    const data = await r.json()
    if (!r.ok) throw new Error(data.error || `Error ${r.status}`)

    // Update local row
    const row = _rows.find(x=>x.id===pageId)
    if (row) {
      if (template === '21d') { row.sent21 = today; _sendState[pageId] = 'sent21' }
      else                    { row.sent14 = today; _sendState[pageId] = 'sent14' }
    }

    // Refresh both cells
    if (sendCell) sendCell.innerHTML = renderSendBtns(row||{id:pageId,daysOver:0,phone:'',sent14:null,sent21:null})
    const noticeCell = document.getElementById(`notices-${pageId}`)
    if (noticeCell && row) noticeCell.innerHTML = renderNotices(row)

  } catch (e) {
    _sendState[pageId] = 'error'
    if (sendCell) sendCell.innerHTML = `<span style="font-size:10px;color:#FF5757">${esc(e.message)}</span>`
  }
}

async function load(force=false) {
  const btn = document.getElementById('btn-refresh'); btn.classList.add('spinning')
  document.getElementById('err-banner').style.display='none'
  document.getElementById('sections-wrap').innerHTML = `<div class="empty"><span class="skel" style="width:200px;height:16px"></span></div>`

  const url = force ? `${API}?_t=${Date.now()}` : API
  try {
    const r = await fetch(url)
    if (!r.ok) throw new Error(`API error ${r.status}`)
    const data = await r.json()
    _rows = data.rows || []

    // Summary
    const s = data.summary || {}
    document.getElementById('s-critical').textContent = s.critical ?? 0
    document.getElementById('s-severe').textContent   = s.severe   ?? 0
    document.getElementById('s-urgent').textContent   = s.urgent   ?? 0
    document.getElementById('s-warning').textContent  = s.warning  ?? 0
    document.getElementById('s-notice').textContent   = s.notice   ?? 0
    document.getElementById('s-recent').textContent   = s.recent   ?? 0

    render(_rows)

    const ts = new Date(data.ts)
    document.getElementById('ts').textContent = 'Updated '+ts.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'})
  } catch(e) {
    const b = document.getElementById('err-banner'); b.textContent = 'Failed to load: '+e.message; b.style.display='block'
    document.getElementById('sections-wrap').innerHTML=''
  } finally {
    btn.classList.remove('spinning')
  }
}

load()
</script>
</body>
</html>
