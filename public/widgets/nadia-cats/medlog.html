<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Medication Log · Cat Health HQ</title>
<link rel="preconnect" href="https://api.fontshare.com"/>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#191919;--card:#222222;--card2:#2a2a2a;--g:#C8FF00;--text:#fff;--muted:#888;--border:#333;--red:#ff4d4d;--yellow:#ffd166;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Satoshi',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px 40px}
h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}

/* date nav */
.date-nav{display:flex;align-items:center;gap:10px;margin:20px 0 24px}
.date-nav button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.date-nav button:hover{background:var(--card2)}
.date-nav button.today-btn{background:var(--g);color:#000;border-color:var(--g)}
.date-nav button.today-btn:hover{opacity:.9}
.date-label{font-size:15px;font-weight:600;flex:1;text-align:center}
.date-label span{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}

/* summary bar */
.summary{display:flex;gap:10px;margin-bottom:24px}
.sum-card{flex:1;background:var(--card);border-radius:var(--radius);padding:14px 16px;text-align:center}
.sum-card .num{font-size:26px;font-weight:700;line-height:1}
.sum-card .lbl{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.sum-card.all-done .num{color:var(--g)}

/* cat cards */
.cat-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:14px;border:2px solid transparent;transition:border-color .2s}
.cat-card.done{border-color:var(--g);}
.cat-card.milestone-42{border-color:var(--yellow)}
.cat-card.milestone-84{border-color:var(--g);background:#1e2a12}
.cat-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cat-avatar{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cat-name{font-size:17px;font-weight:700}
.cat-meta{font-size:12px;color:var(--muted);margin-top:2px}
.milestone-badge{margin-left:auto;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.milestone-badge.m42{background:#3d3200;color:var(--yellow)}
.milestone-badge.m84{background:#1e3a00;color:var(--g)}

/* progress bar */
.progress-wrap{margin-bottom:18px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.progress-bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--g);transition:width .4s}

/* check button */
.check-btn{width:100%;padding:16px;border-radius:12px;border:none;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:-.2px}
.check-btn.not-given{background:var(--card2);color:var(--muted);border:2px dashed var(--border)}
.check-btn.not-given:hover{border-color:var(--g);color:var(--text)}
.check-btn.given{background:var(--g);color:#000}
.check-btn.given:hover{opacity:.88}
.check-btn.loading{opacity:.5;pointer-events:none}
.check-icon{font-size:20px}
.given-time{font-size:11px;font-weight:400;opacity:.7;margin-left:4px}

/* empty state */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty span{font-size:40px;display:block;margin-bottom:12px}

/* spinner */
.spinner{display:flex;justify-content:center;padding:60px}
.spinner::after{content:'';width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.err{background:#2a1111;border:1px solid #5c2020;border-radius:10px;padding:14px;color:#ff8080;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>

<h1>💊 Medication Log</h1>
<p class="sub" id="sub">Daily GS treatment checklist</p>

<div class="date-nav">
  <button onclick="changeDate(-1)">◀</button>
  <div class="date-label" id="dateLabel">—</div>
  <button onclick="changeDate(1)">▶</button>
  <button class="today-btn" onclick="goToday()">Today</button>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="sum-card" id="sumGiven"><div class="num">—</div><div class="lbl">Given</div></div>
  <div class="sum-card" id="sumPending"><div class="num">—</div><div class="lbl">Pending</div></div>
  <div class="sum-card" id="sumTotal"><div class="num">—</div><div class="lbl">Total Today</div></div>
</div>

<div id="content"><div class="spinner"></div></div>

<script>
const API = 'https://api.opxio.io/api/clients/nadia-cats/medlog'
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

const CAT_EMOJI = { Oyen:'🐱', Yumie:'🐈', Bobby:'🐾' }

let currentDate = todayStr()
let data = null

function todayStr() {
  return new Date().toISOString().slice(0,10)
}

function formatDateLabel(d) {
  const date = new Date(d + 'T00:00:00')
  const today = todayStr()
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10)
  const tomorrow  = new Date(Date.now() + 86400000).toISOString().slice(0,10)
  const main = date.toLocaleDateString('en-MY', { weekday:'long', day:'numeric', month:'long' })
  let tag = ''
  if (d === today)     tag = 'today'
  if (d === yesterday) tag = 'yesterday'
  if (d === tomorrow)  tag = 'tomorrow'
  return { main, tag }
}

function changeDate(dir) {
  const d = new Date(currentDate + 'T00:00:00')
  d.setDate(d.getDate() + dir)
  currentDate = d.toISOString().slice(0,10)
  load()
}

function goToday() {
  currentDate = todayStr()
  load()
}

async function load() {
  const { main, tag } = formatDateLabel(currentDate)
  document.getElementById('dateLabel').innerHTML = esc(main) + (tag ? ` <span>${esc(tag)}</span>` : '')
  document.getElementById('content').innerHTML = '<div class="spinner"></div>'
  document.getElementById('summary').style.display = 'none'

  try {
    const r = await fetch(`${API}?date=${currentDate}`)
    if (!r.ok) throw new Error(`API ${r.status}`)
    data = await r.json()
    render()
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="err">Failed to load: ${esc(e.message)}</div>`
  }
}

function render() {
  const cats = Object.keys(data.byCat)
  if (!cats.length) {
    document.getElementById('content').innerHTML =
      `<div class="empty"><span>🗓️</span>No medication entries for this date</div>`
    return
  }

  const totalEntries = data.entries.length
  const givenCount   = data.entries.filter(e => e.given).length
  const pending      = totalEntries - givenCount

  // Summary bar
  const sg = document.getElementById('sumGiven')
  const sp = document.getElementById('sumPending')
  const st = document.getElementById('sumTotal')
  sg.querySelector('.num').textContent = givenCount
  sp.querySelector('.num').textContent = pending
  st.querySelector('.num').textContent = totalEntries
  const sumEl = document.getElementById('summary')
  sumEl.style.display = 'flex'
  if (pending === 0) sg.classList.add('all-done'); else sg.classList.remove('all-done')

  let html = ''
  for (const catName of cats) {
    const entries = data.byCat[catName]
    const entry   = entries[0] // one entry per cat per day
    const given   = entry.given
    const day     = entry.dayNum || 1
    const ms      = entry.milestone || 'Regular'
    const pct     = Math.round((day / 84) * 100)
    const emoji   = CAT_EMOJI[catName] || '🐾'

    let msClass = ''
    let msBadge = ''
    if (ms === 'Day 42 Check ⚠️') {
      msClass = 'milestone-42'
      msBadge = `<span class="milestone-badge m42">⚠️ Day 42 Vet Check</span>`
    } else if (ms === 'Day 84 Final 🎉') {
      msClass = 'milestone-84'
      msBadge = `<span class="milestone-badge m84">🎉 Day 84 Final!</span>`
    }

    const btnClass   = given ? 'given' : 'not-given'
    const btnIcon    = given ? '✅' : '○'
    const btnLabel   = given ? 'Given Today' : 'Mark as Given'

    html += `
    <div class="cat-card ${given ? 'done' : ''} ${msClass}" id="card-${esc(entry.id)}">
      <div class="cat-header">
        <div class="cat-avatar">${emoji}</div>
        <div>
          <div class="cat-name">${esc(catName)}</div>
          <div class="cat-meta">GS Treatment · Day ${day} of 84</div>
        </div>
        ${msBadge}
      </div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Progress</span>
          <span>${pct}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <button class="check-btn ${btnClass}" id="btn-${esc(entry.id)}"
        onclick="toggle('${esc(entry.id)}', ${!given})">
        <span class="check-icon">${btnIcon}</span>
        ${esc(btnLabel)}
      </button>
    </div>`
  }

  document.getElementById('content').innerHTML = html
}

async function toggle(pageId, newGiven) {
  const btn  = document.getElementById(`btn-${pageId}`)
  const card = document.getElementById(`card-${pageId}`)
  if (!btn) return

  btn.classList.add('loading')

  try {
    const r = await fetch(`${API}/${pageId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ given: newGiven })
    })
    if (!r.ok) throw new Error(`API ${r.status}`)

    // Update local data
    const entry = data.entries.find(e => e.id === pageId)
    if (entry) entry.given = newGiven

    // Update byCat
    for (const cat of Object.values(data.byCat)) {
      const e = cat.find(e => e.id === pageId)
      if (e) e.given = newGiven
    }

    render()
  } catch(e) {
    btn.classList.remove('loading')
    alert('Failed to update: ' + e.message)
  }
}

// Init
load()
</script>
</body>
</html>
