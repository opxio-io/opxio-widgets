<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Block direct browser access — must be embedded in a Notion iframe
if (window.self === window.top) {
  window.stop();
  document.open();
  document.write('<html><head><style>*{margin:0;padding:0}html,body{height:100%;background:#191919;}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:sans-serif;}</style></head><body><div style="color:#555;font-size:13px;letter-spacing:.5px;">RESTRICTED ACCESS</div><div style="color:#333;font-size:12px;">This widget is for Notion only.</div></body></html>');
  document.close();
}
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — Revenue Forecast</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;padding:16px 16px 28px;background:#191919;color:#fff;overflow-y:auto;min-height:100%;}
:root{--g:#AAFF00;--gm:rgba(170,255,0,.10);--gb:rgba(170,255,0,.18);--lost:#FF6B35;--lostm:rgba(255,107,53,.10);}

/* ── LAYOUT ── */
.card{background:#222;border:1px solid rgba(255,255,255,.06);border-radius:14px;transition:border-color .2s;}
.card:hover{border-color:rgba(170,255,0,.10);}

/* ── HEADER ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.topbar-left{display:flex;flex-direction:column;gap:2px;}
.eyebrow{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.22);}
.h-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.03em;}
.topbar-right{display:flex;align-items:center;gap:7px;}
.ts{font-size:9px;font-weight:500;color:rgba(255,255,255,.18);}
.btn{background:#252525;border:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.4);font-family:'Satoshi',sans-serif;font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:7px;cursor:pointer;transition:all .2s;}
.btn:hover{border-color:var(--gb);color:var(--g);}
.btn.spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── KPI CARDS ── */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
@media(max-width:700px){.grid-4{grid-template-columns:repeat(2,1fr);}}
.kpi{padding:16px 18px 14px;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(170,255,0,.03),transparent);pointer-events:none;}
.kpi-dot{position:absolute;top:13px;right:13px;width:6px;height:6px;border-radius:50%;background:var(--g);opacity:.55;}
.kpi-dot.red{background:#FF6B6B;opacity:.7;}
.kpi-dot.orange{background:var(--lost);opacity:.7;}
.kpi-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4);margin-bottom:9px;display:block;}
.kpi-val{font-size:26px;font-weight:900;letter-spacing:-1.2px;line-height:1;color:var(--g);}
.kpi-val.neutral{color:#fff;}
.kpi-val.orange{color:var(--lost);}
.kpi-sub{font-size:10px;font-weight:500;color:rgba(255,255,255,.2);margin-top:7px;}
.kpi-sub strong{color:rgba(255,255,255,.45);font-weight:700;}
.kpi-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:7px;background:var(--gm);color:var(--g);border:1px solid var(--gb);}
.kpi-badge.red{background:rgba(255,107,107,.10);color:#FF6B6B;border-color:rgba(255,107,107,.2);}

/* ── MID ROW ── */
.mid-row{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;margin-bottom:8px;}
@media(max-width:680px){.mid-row{grid-template-columns:1fr;}}

/* ── PANEL ── */
.panel{padding:16px 18px;}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);}
.panel-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--gm);color:var(--g);border:1px solid var(--gb);}

/* ── PIPELINE FUNNEL ── */
.funnel-list{display:flex;flex-direction:column;gap:10px;}
.funnel-row{display:flex;flex-direction:column;gap:4px;}
.funnel-meta{display:flex;align-items:center;justify-content:space-between;}
.funnel-stage{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.8);}
.funnel-amt{font-size:11.5px;font-weight:700;color:var(--g);}
.funnel-bar-track{height:5px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;}
.funnel-bar-fill{height:100%;border-radius:999px;background:var(--g);transition:width .6s cubic-bezier(.4,0,.2,1);}
.funnel-bar-fill.dim{background:rgba(170,255,0,.45);}
.funnel-bar-fill.dimmer{background:rgba(170,255,0,.25);}
.funnel-count{font-size:9.5px;font-weight:500;color:rgba(255,255,255,.25);}
.funnel-won{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);}
.won-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;}
.won-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.45);}
.won-count{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);}

/* ── TREND CHART ── */
.trend-wrap{height:190px;position:relative;}

/* ── BOTTOM ROW ── */
.bottom-row{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;}
@media(max-width:680px){.bottom-row{grid-template-columns:1fr;}}

/* ── WIN RATE PANEL ── */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.metric-cell{padding:14px 16px;}
.metric-lbl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.35);margin-bottom:8px;}
.metric-val{font-size:22px;font-weight:900;letter-spacing:-1px;color:var(--g);}
.metric-sub{font-size:9.5px;font-weight:500;color:rgba(255,255,255,.2);margin-top:5px;}

/* ── DEALS LIST ── */
.deals-hdr{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:0 0 7px;border-bottom:1px solid rgba(255,255,255,.06);}
.deals-hdr span{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.22);}
.deals-hdr span:last-child{text-align:right;}
.deal-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center;}
.deal-row:last-child{border-bottom:none;}
.deal-name{font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.deal-pkg{font-size:9.5px;font-weight:500;color:rgba(255,255,255,.3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.deal-stage-pill{font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;}
.stage-proposal{background:rgba(170,255,0,.08);color:rgba(170,255,0,.55);border:1px solid rgba(170,255,0,.13);}
.stage-sent{background:rgba(96,165,250,.07);color:rgba(96,165,250,.6);border:1px solid rgba(96,165,250,.13);}
.stage-negotiation{background:rgba(251,191,36,.07);color:rgba(251,191,36,.7);border:1px solid rgba(251,191,36,.13);}
.deal-value{font-size:12.5px;font-weight:700;color:var(--g);white-space:nowrap;text-align:right;}

/* ── EMPTY / LOADING ── */
.empty{padding:24px;text-align:center;color:rgba(255,255,255,.2);font-size:12px;}
.skeleton{background:rgba(255,255,255,.05);border-radius:8px;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>

<!-- ── HEADER ─────────────────────────────────────────────────────────────── -->
<div class="topbar">
  <div class="topbar-left">
    <span class="eyebrow">Opxio Internal</span>
    <h1 class="h-title">Revenue Forecast</h1>
  </div>
  <div class="topbar-right">
    <span class="ts" id="ts"></span>
    <button class="btn" id="refreshBtn" onclick="load()">↻ Refresh</button>
  </div>
</div>

<!-- ── KPI CARDS ───────────────────────────────────────────────────────────── -->
<div class="grid-4">
  <div class="card kpi">
    <div class="kpi-dot"></div>
    <span class="kpi-lbl">Pipeline Value</span>
    <div class="kpi-val" id="kpi-pipeline">—</div>
    <div class="kpi-sub" id="kpi-pipeline-sub"></div>
  </div>
  <div class="card kpi">
    <div class="kpi-dot"></div>
    <span class="kpi-lbl">Revenue Collected MTD</span>
    <div class="kpi-val" id="kpi-revenue">—</div>
    <div class="kpi-sub" id="kpi-revenue-sub"></div>
  </div>
  <div class="card kpi">
    <div class="kpi-dot orange" id="kpi-outstanding-dot"></div>
    <span class="kpi-lbl">Outstanding</span>
    <div class="kpi-val orange" id="kpi-outstanding">—</div>
    <div class="kpi-sub" id="kpi-outstanding-sub"></div>
  </div>
  <div class="card kpi">
    <div class="kpi-dot" id="kpi-conv-dot"></div>
    <span class="kpi-lbl">Lead → Deal Conv. Rate</span>
    <div class="kpi-val neutral" id="kpi-conv">—</div>
    <div class="kpi-sub" id="kpi-conv-sub"></div>
  </div>
</div>

<!-- ── MID ROW ────────────────────────────────────────────────────────────── -->
<div class="mid-row">

  <!-- Pipeline Funnel -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">Deal Pipeline</span>
      <span class="panel-badge" id="badge-pipeline">—</span>
    </div>
    <div class="funnel-list" id="funnel-list"></div>
    <div class="funnel-won" id="funnel-won"></div>
  </div>

  <!-- Revenue Trend -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">Revenue Collected — 6 Months</span>
    </div>
    <div class="trend-wrap">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

</div>

<!-- ── BOTTOM ROW ──────────────────────────────────────────────────────────── -->
<div class="bottom-row">

  <!-- Win Rate + Avg Deal -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">Deal Performance</span>
    </div>
    <div class="metric-grid">
      <div class="card metric-cell">
        <div class="metric-lbl">Win Rate</div>
        <div class="metric-val" id="m-winrate">—</div>
        <div class="metric-sub" id="m-winrate-sub"></div>
      </div>
      <div class="card metric-cell">
        <div class="metric-lbl">Avg Deal Value</div>
        <div class="metric-val" id="m-avgdeal">—</div>
        <div class="metric-sub" id="m-avgdeal-sub"></div>
      </div>
      <div class="card metric-cell">
        <div class="metric-lbl">Won This Month</div>
        <div class="metric-val" id="m-won">—</div>
        <div class="metric-sub" id="m-won-sub"></div>
      </div>
      <div class="card metric-cell">
        <div class="metric-lbl">Leads This Month</div>
        <div class="metric-val" id="m-leads">—</div>
        <div class="metric-sub" id="m-leads-sub"></div>
      </div>
    </div>
  </div>

  <!-- Pipeline Deals -->
  <div class="card panel">
    <div class="panel-hdr">
      <span class="panel-title">Active Pipeline</span>
      <span class="panel-badge" id="badge-deals">—</span>
    </div>
    <div id="deals-list"></div>
  </div>

</div>

<script>
const BASE = location.hostname === 'localhost'
  ? 'http://localhost:3000/api/data/forecast'
  : 'https://api.opxio.io/api/data/forecast'

const params = new URLSearchParams(location.search)
const TOKEN  = params.get('token') || ''

let trendChart = null

function fmt(n) {
  if (!n && n !== 0) return '—'
  if (n >= 1000000) return 'RM ' + (n / 1000000).toFixed(1) + 'M'
  if (n >= 1000)    return 'RM ' + (n / 1000).toFixed(1) + 'K'
  return 'RM ' + n.toLocaleString()
}

function stagePillClass(stage) {
  if (stage === 'Proposal')       return 'stage-proposal'
  if (stage === 'Proposal Sent')  return 'stage-sent'
  if (stage === 'Negotiation')    return 'stage-negotiation'
  return 'stage-proposal'
}

async function load() {
  const btn = document.getElementById('refreshBtn')
  btn.classList.add('spin')

  try {
    const r = await fetch(`${BASE}?token=${TOKEN}`)
    if (!r.ok) throw new Error(`${r.status}`)
    const d = await r.json()
    render(d)
  } catch (e) {
    console.error(e)
    document.getElementById('kpi-pipeline').textContent = 'Error'
  } finally {
    btn.classList.remove('spin')
    document.getElementById('ts').textContent =
      'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  }
}

function render(d) {
  // ── KPI Cards ────────────────────────────────────────────────────────
  const totalActivePipeline = (d.pipelineStages || []).reduce((s, x) => s + x.count, 0)
  document.getElementById('kpi-pipeline').textContent = fmt(d.pipelineValue)
  document.getElementById('kpi-pipeline-sub').innerHTML =
    `<strong>${totalActivePipeline}</strong> active deal${totalActivePipeline !== 1 ? 's' : ''} in pipeline`

  document.getElementById('kpi-revenue').textContent = fmt(d.revenueCollectedMTD)
  document.getElementById('kpi-revenue-sub').innerHTML =
    `<strong>${d.monthLabel}</strong>`

  document.getElementById('kpi-outstanding').textContent = fmt(d.outstanding)
  const overdueEl = document.getElementById('kpi-outstanding-sub')
  if (d.overdueCount > 0) {
    overdueEl.innerHTML = `<strong style="color:#FF6B6B">${d.overdueCount} overdue</strong>`
  } else {
    overdueEl.innerHTML = 'No overdue invoices'
  }

  const convEl  = document.getElementById('kpi-conv')
  const convDot = document.getElementById('kpi-conv-dot')
  if (d.convRate !== null) {
    convEl.textContent = d.convRate + '%'
    if (d.convRate >= 50) {
      convEl.style.color = 'var(--g)'
      convDot.style.background = '#AAFF00'
    } else if (d.convRate >= 25) {
      convEl.style.color = 'rgba(251,191,36,.9)'
      convDot.style.background = 'rgba(251,191,36,.9)'
    } else {
      convEl.style.color = 'var(--lost)'
      convDot.className = 'kpi-dot orange'
    }
  } else {
    convEl.textContent = '—'
  }
  document.getElementById('kpi-conv-sub').innerHTML =
    `<strong>${d.leadsConverted}</strong> of <strong>${d.leadsThisMonth}</strong> leads this month`

  // ── Pipeline Funnel ───────────────────────────────────────────────────
  const stages   = d.pipelineStages || []
  const maxValue = Math.max(...stages.map(s => s.value), 1)
  const totalPipeCount = stages.reduce((s, x) => s + x.count, 0)

  document.getElementById('badge-pipeline').textContent =
    fmt(d.pipelineValue)

  const barFills   = ['', 'dim', 'dimmer']
  const funnelEl   = document.getElementById('funnel-list')
  funnelEl.innerHTML = stages.map((s, i) => {
    const pct = Math.max(Math.round((s.value / maxValue) * 100), s.count > 0 ? 4 : 0)
    return `
      <div class="funnel-row">
        <div class="funnel-meta">
          <span class="funnel-stage">${s.stage}</span>
          <span class="funnel-amt">${fmt(s.value)}</span>
        </div>
        <div class="funnel-bar-track">
          <div class="funnel-bar-fill ${barFills[i] || 'dimmer'}" style="width:${pct}%"></div>
        </div>
        <span class="funnel-count">${s.count} deal${s.count !== 1 ? 's' : ''}</span>
      </div>`
  }).join('')

  const wonEl = document.getElementById('funnel-won')
  const wonStages = d.wonStages || []
  wonEl.innerHTML = wonStages.map(s => `
    <div class="won-row">
      <span class="won-label">${s.stage}</span>
      <span class="won-count">${s.count} deal${s.count !== 1 ? 's' : ''}</span>
    </div>`).join('') + `
    <div class="won-row">
      <span class="won-label" style="color:rgba(255,107,107,.5)">Closed Lost</span>
      <span class="won-count" style="color:rgba(255,107,107,.4)">${d.lostCount || 0}</span>
    </div>`

  // ── Revenue Trend Chart ───────────────────────────────────────────────
  const trendData = d.monthlyRevenue || []
  const labels    = trendData.map(x => x.m)
  const values    = trendData.map(x => x.v)

  if (trendChart) { trendChart.destroy(); trendChart = null }
  const ctx = document.getElementById('trendChart').getContext('2d')
  trendChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: values.map((v, i) =>
          i === values.length - 1 ? 'rgba(170,255,0,.85)' : 'rgba(170,255,0,.22)'),
        borderColor: values.map((v, i) =>
          i === values.length - 1 ? '#AAFF00' : 'rgba(170,255,0,.4)'),
        borderWidth: 1,
        borderRadius: 5,
        borderSkipped: false,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#2A2A2A',
          titleColor: 'rgba(255,255,255,.5)',
          bodyColor: '#AAFF00',
          borderColor: 'rgba(255,255,255,.08)',
          borderWidth: 1,
          padding: 10,
          callbacks: {
            label: ctx => fmt(ctx.raw),
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          border: { display: false },
          ticks: { color: 'rgba(255,255,255,.3)', font: { family: 'Satoshi', size: 10, weight: '700' } },
        },
        y: {
          grid: { color: 'rgba(255,255,255,.04)', drawBorder: false },
          border: { display: false },
          ticks: {
            color: 'rgba(255,255,255,.25)',
            font: { family: 'Satoshi', size: 10 },
            callback: v => v >= 1000 ? 'RM ' + (v / 1000).toFixed(0) + 'K' : 'RM ' + v,
            maxTicksLimit: 4,
          },
        },
      },
    },
  })

  // ── Performance Metrics ───────────────────────────────────────────────
  document.getElementById('m-winrate').textContent = d.winRate !== null ? d.winRate + '%' : '—'
  document.getElementById('m-winrate-sub').innerHTML =
    `<strong>${d.wonStages?.reduce((s, x) => s + x.count, 0) || 0}</strong> won · <strong>${d.lostCount || 0}</strong> lost`

  document.getElementById('m-avgdeal').textContent = d.avgDeal ? fmt(d.avgDeal) : '—'
  document.getElementById('m-avgdeal-sub').textContent = 'across all deals'

  document.getElementById('m-won').textContent = d.wonThisMonth || '0'
  document.getElementById('m-won-sub').innerHTML =
    d.wonThisMonthVal ? fmt(d.wonThisMonthVal) + ' value' : 'this month'

  document.getElementById('m-leads').textContent = d.leadsThisMonth || '0'
  document.getElementById('m-leads-sub').textContent = 'new this month'

  // ── Active Pipeline Deals ─────────────────────────────────────────────
  const deals = d.pipelineDeals || []
  document.getElementById('badge-deals').textContent = deals.length + ' deal' + (deals.length !== 1 ? 's' : '')

  const dealsEl = document.getElementById('deals-list')
  if (!deals.length) {
    dealsEl.innerHTML = '<div class="empty">No active deals in pipeline</div>'
    return
  }

  dealsEl.innerHTML = `
    <div class="deals-hdr">
      <span>Deal</span>
      <span>Stage</span>
      <span>Value</span>
    </div>
    ${deals.map(deal => `
      <div class="deal-row">
        <div>
          <div class="deal-name">${deal.name}</div>
          ${deal.pkg ? `<div class="deal-pkg">${deal.pkg}</div>` : ''}
        </div>
        <span class="deal-stage-pill ${stagePillClass(deal.stage)}">${deal.stage}</span>
        <span class="deal-value">${fmt(deal.value)}</span>
      </div>`).join('')}`
}

// ── Init ────────────────────────────────────────────────────────────────────
load()
</script>
</body>
</html>
