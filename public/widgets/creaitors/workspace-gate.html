<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Workspace</title>
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Satoshi', sans-serif;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    .gate {
      text-align: center;
      max-width: 380px;
      width: 100%;
      padding: 2rem 1.5rem;
    }

    .lock-icon {
      margin-bottom: 0.75rem;
    }

    .lock-icon svg {
      width: 28px;
      height: 28px;
      stroke: #AAFF00;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gate .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .gate .subtitle {
      font-size: 0.82rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    /* Shared input styles */
    .field {
      margin-bottom: 0.75rem;
    }

    .field select,
    .field input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #141414;
      border: 1px solid #222;
      border-radius: 10px;
      color: #fff;
      font-family: 'Satoshi', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .field select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23555' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      padding-right: 2.5rem;
    }

    .field select option {
      background: #141414;
      color: #fff;
    }

    .field input::placeholder {
      color: #555;
    }

    .field select:focus,
    .field input:focus {
      border-color: #AAFF00;
    }

    .btn {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #AAFF00;
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      font-family: 'Satoshi', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.25rem;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .msg {
      font-size: 0.82rem;
      margin-top: 0.75rem;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .msg.error { color: #ff4444; }
    .msg.success { color: #AAFF00; }
    .msg.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="gate">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <circle cx="12" cy="16.5" r="1.5"/>
      </svg>
    </div>
    <p class="title">Team Workspace</p>
    <p class="subtitle">Select your name and enter your password</p>

    <form id="gateForm">
      <div class="field">
        <select id="staffSelect">
          <option value="" disabled selected>Choose your name</option>
        </select>
      </div>
      <div class="field">
        <input type="password" id="passInput" placeholder="Enter your password" autocomplete="off" />
      </div>
      <button type="submit" class="btn" id="enterBtn" disabled>Enter Workspace</button>
    </form>
    <p class="msg" id="msgEl"></p>
  </div>

  <script>
    // -------------------------------------------------------
    // CREAITORS — TEAM WORKSPACE GATE
    // -------------------------------------------------------
    // Each entry: { name, page (Notion URL), pw (password) }
    //
    // To add/remove staff or change passwords, edit this array.
    // Department is display-only grouping.
    // -------------------------------------------------------

    const STAFF = [
      // Content Creators
      { name: 'Maisarah',       dept: 'Content Creator',    page: 'https://www.notion.so/502736ebbe34829aada981e516950457', pw: 'maisarah2026' },
      { name: 'Firdaus',        dept: 'Content Creator',    page: 'https://www.notion.so/e0c736ebbe3483b685990149c8c57a64', pw: 'firdaus2026' },
      { name: 'Sufyan Habib',   dept: 'Content Creator',    page: 'https://www.notion.so/27a736ebbe3482eeb662814a0a7f9c93', pw: 'sufyan2026' },

      // Video Editor / Videographer
      { name: 'Hendra Gumilar', dept: 'Videographer',       page: 'https://www.notion.so/4b3736ebbe3482839a75b01c0f12d9587', pw: 'hendra2026' },
      { name: 'Richard',        dept: 'Videographer',       page: 'https://www.notion.so/0ff736ebbe3483409bdaf81d516956d7b', pw: 'richard2026' },
      { name: 'Rifki Purnama',  dept: 'Videographer',       page: 'https://www.notion.so/bd3736ebbe3482bd9b4781b0689119ea', pw: 'rifki2026' },

      // KOL Marketing
      { name: 'Aina Zahara',    dept: 'KOL Marketing',      page: 'https://www.notion.so/401736ebbe34822cb60a0115a5a4722d', pw: 'aina2026' },
    ];

    // Populate dropdown with optgroups by department
    const select = document.getElementById('staffSelect');
    const depts = {};
    STAFF.forEach((s, i) => {
      if (!depts[s.dept]) depts[s.dept] = [];
      depts[s.dept].push({ ...s, index: i });
    });

    Object.entries(depts).forEach(([dept, members]) => {
      const group = document.createElement('optgroup');
      group.label = dept;
      members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.index;
        opt.textContent = m.name;
        group.appendChild(opt);
      });
      select.appendChild(group);
    });

    // Enable button only when both fields filled
    const passInput = document.getElementById('passInput');
    const enterBtn = document.getElementById('enterBtn');

    function checkReady() {
      enterBtn.disabled = !(select.value && passInput.value);
    }
    select.addEventListener('change', checkReady);
    passInput.addEventListener('input', checkReady);

    // Form submit
    document.getElementById('gateForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const msgEl = document.getElementById('msgEl');
      const idx = parseInt(select.value);
      const staff = STAFF[idx];

      if (!staff) return;

      if (passInput.value === staff.pw) {
        msgEl.className = 'msg success visible';
        msgEl.textContent = 'Access granted. Opening workspace...';
        setTimeout(() => {
          window.open(staff.page, '_blank');
          try { window.top.location.href = staff.page; } catch(e) {}
        }, 400);
      } else {
        msgEl.className = 'msg error visible';
        msgEl.textContent = 'Wrong password. Try again.';
        passInput.value = '';
        passInput.focus();
        checkReady();
        setTimeout(() => msgEl.classList.remove('visible'), 2500);
      }
    });
  </script>
</body>
</html>
