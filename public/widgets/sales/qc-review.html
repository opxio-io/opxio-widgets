<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (window.self === window.top) {
  window.stop(); document.open();
  document.write('<html><head><style>*{margin:0;padding:0}html,body{height:100%;background:#191919;}body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-family:sans-serif;}</style></head><body><div style="color:#555;font-size:13px;letter-spacing:.5px;">RESTRICTED ACCESS</div><div style="color:#333;font-size:12px;">This widget is for Notion only.</div></body></html>');
  document.close();
}
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Opxio — QC Review</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#191919; --card:#222222;
  --border:rgba(255,255,255,0.07);
  --g:#C8FF00; --amber:#FBBF24; --red:#FF6B6B; --blue:#60A5FA; --purple:#A78BFA; --orange:#FB923C;
  --muted:rgba(255,255,255,0.38); --sub:rgba(255,255,255,0.55);
  --r:18px;
}
html,body{width:100%;}
body{background:var(--bg);font-family:'Satoshi',sans-serif;color:#fff;padding:18px 20px 28px;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:999px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ─── Login screen ─────────────────────────────────────────────── */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:20px;animation:fadeIn .25s ease;}
.login-logo{font-size:22px;font-weight:900;letter-spacing:-0.5px;color:#fff;}
.login-logo span{color:var(--g);}
.login-sub{font-size:13px;color:var(--muted);text-align:center;max-width:280px;line-height:1.5;}
.login-btn{display:inline-flex;align-items:center;gap:10px;background:var(--g);color:#111;font-family:'Satoshi',sans-serif;font-size:13px;font-weight:800;padding:11px 22px;border-radius:100px;border:none;cursor:pointer;text-decoration:none;transition:opacity .15s;letter-spacing:-.1px;}
.login-btn:hover{opacity:.88;}
.login-btn svg{width:16px;height:16px;flex-shrink:0;}
.login-err{font-size:12px;color:var(--red);background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.15);border-radius:10px;padding:10px 14px;text-align:center;max-width:320px;}

/* ─── Top bar ──────────────────────────────────────────────────── */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.top-bar-left{display:flex;align-items:center;gap:10px;}
.wgt-title{font-size:17px;font-weight:900;letter-spacing:-0.4px;color:#fff;}
.reviewer-chip{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--g);background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.18);border-radius:100px;padding:3px 10px;display:flex;align-items:center;gap:5px;}
.reviewer-chip svg{width:9px;height:9px;}
.logout-btn{font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:100px;padding:4px 12px;cursor:pointer;transition:color .15s;}
.logout-btn:hover{color:#fff;}

/* ─── Pills ────────────────────────────────────────────────────── */
.pills-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:100px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .15s;user-select:none;}
.pill:hover{background:rgba(255,255,255,.07);}
.pill.active{border-color:currentColor;}
.pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.pill.p-pending{color:#FBBF24;}.pill.p-pending.active{background:rgba(251,191,36,.08);}
.pill.p-revision{color:var(--orange);}.pill.p-revision.active{background:rgba(251,146,60,.08);}
.pill.p-approved{color:var(--g);}.pill.p-approved.active{background:rgba(200,255,0,.08);}
.pill.p-rejected{color:var(--red);}.pill.p-rejected.active{background:rgba(255,107,107,.08);}
.pill.p-all{color:#fff;}.pill.p-all.active{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);}
.pill-dot.pending{background:#FBBF24;}
.pill-dot.revision{background:var(--orange);}
.pill-dot.approved{background:var(--g);}
.pill-dot.rejected{background:var(--red);}
.pill-dot.all{background:rgba(255,255,255,.3);}
.pill-count{font-size:12px;font-weight:900;}

/* ─── Cards ────────────────────────────────────────────────────── */
.cards{display:flex;flex-direction:column;gap:10px;}
.qc-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:14px;padding:16px 18px;animation:fadeIn .2s ease;display:flex;flex-direction:column;gap:10px;}
.qc-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.qc-card-left{display:flex;flex-direction:column;gap:4px;min-width:0;}
.qc-card-name{font-size:13px;font-weight:900;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qc-card-entity{font-size:11px;font-weight:600;color:var(--sub);}
.qc-card-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;}
.badge-quote{background:rgba(96,165,250,.12);color:var(--blue);}
.badge-proposal{background:rgba(167,139,250,.12);color:var(--purple);}
.badge-round{background:rgba(255,255,255,.07);color:var(--muted);}
.badge-pending{background:rgba(251,191,36,.12);color:#FBBF24;}
.badge-revision{background:rgba(251,146,60,.12);color:var(--orange);}
.badge-approved{background:rgba(200,255,0,.12);color:var(--g);}
.badge-rejected{background:rgba(255,107,107,.12);color:var(--red);}
.qc-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.qc-card-meta-left{display:flex;align-items:center;gap:8px;}
.qc-meta-item{font-size:11px;font-weight:600;color:var(--muted);}
.qc-meta-item span{color:var(--sub);}
.qc-amount{font-size:13px;font-weight:900;color:#fff;}
.notion-link{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;transition:color .15s;}
.notion-link:hover{color:#fff;}
.notion-link svg{width:12px;height:12px;}
.qc-reviewer{font-size:11px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:100px;padding:4px 12px;}
.qc-reviewer-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);margin-right:6px;}
.qc-notes{font-size:12px;color:var(--sub);font-style:italic;border-left:2px solid rgba(255,255,255,.08);padding-left:10px;}
.empty-state{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
.loader{display:flex;align-items:center;justify-content:center;padding:40px 0;}
.loader-spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.08);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;}
</style>
</head>
<body>

<div id="root"></div>

<script>
const BASE  = 'https://api.opxio.io/api/clients/opxio'
const TOKEN = new URLSearchParams(location.search).get('token') || ''

// ── Session management (in-memory only) ────────────────────────────────────
let SESSION  = new URLSearchParams(location.search).get('session') || ''
let REVIEWER = new URLSearchParams(location.search).get('reviewer') || ''
let AUTH_ERR = new URLSearchParams(location.search).get('auth_error') || ''

// Strip auth params from URL without reload (clean up address bar in Notion)
if (SESSION || AUTH_ERR) {
  try {
    const u = new URL(location.href)
    u.searchParams.delete('session')
    u.searchParams.delete('reviewer')
    u.searchParams.delete('auth_error')
    history.replaceState({}, '', u.toString())
  } catch (_) {}
}

let allItems    = []
let activeFilter = 'Pending Review'

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
function fmtAmt(amount, currency) {
  if (!amount) return '—'
  return (currency || 'MYR').toUpperCase() + ' ' +
    Number(amount).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
}
function fmtDate(iso) {
  if (!iso) return '—'
  return new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
}
function statusBadgeCls(s) {
  const m = { 'Pending Review':'badge-pending','Revision Requested':'badge-revision','Approved':'badge-approved','Rejected':'badge-rejected' }
  return m[s] || 'badge-pending'
}

// ── Login screen ────────────────────────────────────────────────────────────
function showLogin() {
  const errHtml = AUTH_ERR
    ? `<div class="login-err">${esc(AUTH_ERR)}</div>`
    : ''
  document.getElementById('root').innerHTML = `
    <div class="login-wrap">
      <div class="login-logo">Opxio <span>QC</span></div>
      <div class="login-sub">Sign in with your Notion account to review quotations and proposals.</div>
      ${errHtml}
      <a class="login-btn" href="${BASE}/auth/start?token=${encodeURIComponent(TOKEN)}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v2H8V8zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
        Login with Notion
      </a>
    </div>`
}

// ── Main widget ─────────────────────────────────────────────────────────────
function renderTopBar() {
  const reviewerHtml = REVIEWER
    ? `<div class="reviewer-chip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        ${esc(REVIEWER)}
       </div>`
    : ''
  return `
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="wgt-title">QC Review</div>
        ${reviewerHtml}
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="logout-btn" onclick="logout()">Sign out</span>
      </div>
    </div>`
}

function renderPills(items) {
  const counts = { 'Pending Review': 0, 'Revision Requested': 0, 'Approved': 0, 'Rejected': 0 }
  items.forEach(i => { if (counts[i.reviewStatus] !== undefined) counts[i.reviewStatus]++ })
  const total = items.length
  const defs = [
    { key: 'Pending Review',     cls: 'p-pending',  dot: 'pending',  label: 'Pending' },
    { key: 'Revision Requested', cls: 'p-revision', dot: 'revision', label: 'Revision' },
    { key: 'Approved',           cls: 'p-approved', dot: 'approved', label: 'Approved' },
    { key: 'Rejected',           cls: 'p-rejected', dot: 'rejected', label: 'Rejected' },
    { key: 'all',                cls: 'p-all',       dot: 'all',      label: 'All' },
  ]
  return defs.map(d => {
    const count  = d.key === 'all' ? total : (counts[d.key] || 0)
    const active = activeFilter === d.key ? ' active' : ''
    return `<div class="pill ${d.cls}${active}" onclick="setFilter('${d.key}')">
      <span class="pill-dot ${d.dot}"></span>
      <span>${d.label}</span>
      <span class="pill-count">${count}</span>
    </div>`
  }).join('')
}

function renderCards(items) {
  const filtered = activeFilter === 'all'
    ? items
    : items.filter(i => i.reviewStatus === activeFilter)

  if (!filtered.length) return '<div class="empty-state">No items in this view</div>'

  return '<div class="cards">' + filtered.map(item => {
    const typeBadge  = item.type === 'Quotation' ? 'badge-quote' : 'badge-proposal'
    const typeLabel  = item.type === 'Quotation' ? 'Quote' : 'Proposal'
    const statusCls  = statusBadgeCls(item.reviewStatus)

    const reviewerHtml = item.reviewedBy
      ? `<div class="qc-reviewer"><span class="qc-reviewer-dot"></span>${esc(item.reviewedBy)} · ${fmtDate(item.reviewedAt)}</div>`
      : ''
    const notesHtml = item.reviewerNotes
      ? `<div class="qc-notes">"${esc(item.reviewerNotes)}"</div>`
      : ''

    return `<div class="qc-card">
      <div class="qc-card-top">
        <div class="qc-card-left">
          <div class="qc-card-name">${esc(item.name)}</div>
          <div class="qc-card-entity">${esc(item.entityName || '—')}</div>
        </div>
        <div class="qc-card-right">
          <span class="badge ${typeBadge}">${typeLabel}</span>
          <span class="badge badge-round">R${item.qcRound || 1}</span>
          <span class="badge ${statusCls}">${esc(item.reviewStatus || 'Pending Review')}</span>
        </div>
      </div>
      <div class="qc-card-meta">
        <div class="qc-card-meta-left">
          <span class="qc-amount">${fmtAmt(item.amount, item.currency)}</span>
          ${item.quoteType ? `<span class="qc-meta-item">${esc(item.quoteType)}</span>` : ''}
          <span class="qc-meta-item">Submitted <span>${fmtDate(item.submittedAt)}</span></span>
        </div>
        <a class="notion-link" href="${esc(item.url || '#')}" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h8v2H8V8zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
          Open in Notion
        </a>
      </div>
      ${reviewerHtml}
      ${notesHtml}
    </div>`
  }).join('') + '</div>'
}

function renderWidget() {
  document.getElementById('root').innerHTML = `
    ${renderTopBar()}
    <div id="pillsRow" class="pills-row"></div>
    <div id="cardsWrap"></div>`
}

function setFilter(key) {
  activeFilter = key
  document.getElementById('pillsRow').innerHTML = renderPills(allItems)
  document.getElementById('cardsWrap').innerHTML = renderCards(allItems)
}

function logout() {
  SESSION  = ''
  REVIEWER = ''
  allItems = []
  showLogin()
}

async function load() {
  renderWidget()
  document.getElementById('cardsWrap').innerHTML = '<div class="loader"><div class="loader-spin"></div></div>'

  try {
    const params = new URLSearchParams({ status: 'all' })
    if (SESSION) params.set('session', SESSION)
    else if (TOKEN) params.set('token', TOKEN)

    const r = await fetch(`${BASE}/qc-review?${params}`)
    const d = await r.json()

    if (r.status === 401 || r.status === 403) {
      SESSION = ''
      showLogin()
      return
    }
    if (!r.ok) throw new Error(d.error || 'Failed to load')

    allItems = d.items || []
    if (d.reviewer && !REVIEWER) REVIEWER = d.reviewer

    // Re-render top bar with reviewer name if just discovered
    document.getElementById('root').querySelector('.top-bar').outerHTML = renderTopBar()

    document.getElementById('pillsRow').innerHTML = renderPills(allItems)
    document.getElementById('cardsWrap').innerHTML = renderCards(allItems)
  } catch (e) {
    document.getElementById('cardsWrap').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`
  }
}

// ── Entry point ─────────────────────────────────────────────────────────────
if (SESSION) {
  load()
} else {
  showLogin()
}
</script>
</body>
</html>
