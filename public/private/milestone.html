<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Journey Tracker</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Satoshi',-apple-system,sans-serif;background:#0A0A0A;color:#fff;padding:22px 20px 48px;overflow-y:auto;}

:root{
  --g:#AAFF00;--gm:rgba(170,255,0,.08);--gb:rgba(170,255,0,.2);--gg:rgba(170,255,0,.06);
  --rose:#FF3E8F;--rosem:rgba(255,62,143,.08);--roseb:rgba(255,62,143,.18);
  --gold:#FFB800;--goldm:rgba(255,184,0,.07);--goldb:rgba(255,184,0,.2);
  --red:#FF4040;--redm:rgba(255,64,64,.08);
  --blue:#5BC4FF;--bluem:rgba(91,196,255,.08);
  --card:#131313;--card2:#191919;--border:rgba(255,255,255,.055);
}

/* ── Header ──────────────────────────────────── */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;}
.hdr h1{font-size:19px;font-weight:900;letter-spacing:-.04em;color:#fff;}
.hdr-sub{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.22);margin-top:3px;letter-spacing:.03em;}
.hdr-r{display:flex;align-items:center;gap:6px;}
.ts{font-size:9px;color:rgba(255,255,255,.13);font-weight:500;}
.icon-btn{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.icon-btn:hover{background:var(--gm);border-color:var(--gb);color:var(--g);}
.icon-btn svg{width:13px;height:13px;}
.icon-btn.spinning svg{animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Stat cards — flat, no border color ──────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}}
.sc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 13px 11px;}
.sc-lbl{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.22);margin-bottom:8px;}
.sc-val{font-size:26px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:#fff;}
.sc-val.sm{font-size:20px;}
.sc-sub{font-size:9px;font-weight:500;color:rgba(255,255,255,.18);margin-top:4px;}

/* ── XP progress bar ─────────────────────────── */
.xp-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 18px 15px;margin-bottom:18px;}
.xp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.xp-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:rgba(255,255,255,.2);}
.xp-pct{font-size:13px;font-weight:900;letter-spacing:-.04em;color:var(--g);}
.xp-track{height:10px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;position:relative;}
.xp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#7ACC00,#AAFF00);width:0%;transition:width 1.1s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(170,255,0,.25);}
.xp-ends{display:flex;justify-content:space-between;margin-top:8px;}
.xp-end{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.18);}
.xp-end.now{color:var(--g);}

/* ── Section divider ─────────────────────────── */
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 9px;}
.sec span{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:rgba(255,255,255,.2);}
.sec::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.04);}

/* ── Stage / Milestone card ──────────────────── */
.stage{border-radius:13px;overflow:hidden;margin-bottom:9px;border:1px solid var(--border);}
.stage.st-upcoming{background:var(--card);}
.stage.st-active{background:#0d1208;border-color:rgba(170,255,0,.18);box-shadow:0 0 0 1px rgba(170,255,0,.06) inset;}
.stage.st-achieved{background:#080d12;border-color:rgba(91,196,255,.14);}
.stage.st-claimed{background:#0d0810;border-color:rgba(255,62,143,.1);}

/* Stage top bar */
.stage-top{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 0;}
.stage-num{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.2);}
.stage-status{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.stage-status.upcoming{background:rgba(255,255,255,.05);color:rgba(255,255,255,.28);}
.stage-status.active{background:var(--gm);color:var(--g);border:1px solid var(--gb);}
.stage-status.achieved{background:var(--bluem);color:var(--blue);border:1px solid rgba(91,196,255,.15);}
.stage-status.claimed{background:var(--rosem);color:var(--rose);border:1px solid var(--roseb);}
.stage-status .pulse{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.st-active .pulse{animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

/* Stage weight + timer */
.stage-body{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 15px 10px;}
.stage-weight{font-size:52px;font-weight:900;letter-spacing:-3px;line-height:1;color:#fff;}
.stage-weight span{font-size:15px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:0;margin-left:1px;}
.stage-meta{text-align:right;}
.stage-dl{font-size:9px;font-weight:600;color:rgba(255,255,255,.28);margin-bottom:3px;}
.stage-cd{font-size:13px;font-weight:900;letter-spacing:-.03em;}
.stage-cd.ok{color:var(--g);}
.stage-cd.urgent{color:var(--red);}
.stage-cd.done{color:var(--blue);}
.stage-cd.past{color:rgba(255,255,255,.2);}

/* Stage mini progress bar */
.stage-xp{margin:0 15px 11px;height:4px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;}
.stage-xp-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#7ACC00,#AAFF00);transition:width 1.3s ease;box-shadow:0 0 8px rgba(170,255,0,.3);}

/* ── Rewards section ─────────────────────────── */
.rewards{border-top:1px solid rgba(255,255,255,.04);padding:12px 15px 15px;background:rgba(0,0,0,.25);}
.rwd-section-lbl{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.22);margin-bottom:8px;}
.rwd-section-lbl.bonus{color:var(--gold);}
.rwd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:7px;margin-bottom:7px;}

/* Individual reward card */
.rwd{border-radius:9px;padding:11px 11px 10px;border:1px solid var(--border);transition:border-color .2s;position:relative;overflow:hidden;}
.rwd.locked{background:#111;filter:grayscale(.5);}
.rwd.unlocked{background:#0e1409;border-color:rgba(170,255,0,.15);}
.rwd.claimed{background:#0d0810;border-color:rgba(255,62,143,.12);}
.rwd.bonus-rwd{background:#0f0e08;border-color:rgba(255,184,0,.14);}

/* Locked blur treatment */
.rwd.locked .rwd-dish{filter:blur(4px);user-select:none;}
.rwd.locked .rwd-loc{filter:blur(3px);user-select:none;}
.rwd.locked::after{content:'LOCKED';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.15);background:rgba(0,0,0,.1);}

.rwd-cat{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.22);margin-bottom:7px;}
.rwd-cat.main-meal{color:#FF7040;}
.rwd-cat.dessert{color:var(--rose);}
.rwd-cat.drinks{color:var(--blue);}
.rwd-cat.fine-dining{color:var(--gold);}
.rwd-cat.snack{color:#FFD232;}

.rwd-dish{font-size:13px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1.25;margin-bottom:4px;}
.rwd-loc{font-size:9px;color:rgba(255,255,255,.25);margin-bottom:6px;}
.rwd-tag{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.rwd-tag.locked{color:rgba(255,255,255,.15);}
.rwd-tag.unlocked{color:var(--g);}
.rwd-tag.claimed{color:var(--rose);}

/* Bonus card (full-width strip) */
.bonus-strip{margin-top:9px;background:#0f0e08;border:1px solid var(--goldb);border-radius:9px;padding:11px 13px;}
.bonus-strip.unlocked{border-color:rgba(255,184,0,.4);background:#161200;}
.bonus-strip-head{font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin-bottom:4px;}
.bonus-strip-tgt{font-size:9px;font-weight:600;color:rgba(255,255,255,.25);margin-bottom:3px;}
.bonus-strip-txt{font-size:13px;font-weight:700;color:#fff;}
.bonus-strip-lock{font-size:8.5px;font-weight:700;color:rgba(255,184,0,.3);margin-top:5px;letter-spacing:.02em;}

/* ── Weight log ──────────────────────────────── */
.log-list{display:flex;flex-direction:column;gap:5px;}
.log-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 13px;}
.log-date{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.27);min-width:80px;}
.log-w{font-size:15px;font-weight:900;letter-spacing:-.03em;color:var(--g);}
.log-bmi{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.2);margin-left:auto;}
.log-note{font-size:9px;color:rgba(255,255,255,.17);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Error / empty ───────────────────────────── */
.err{background:rgba(255,50,50,.06);border:1px solid rgba(255,50,50,.12);border-radius:9px;padding:11px 13px;font-size:10px;color:rgba(255,100,100,.65);margin-bottom:12px;}
.empty{font-size:10px;color:rgba(255,255,255,.14);font-style:italic;padding:2px 0;}

footer{display:block;text-align:center;padding:22px 0 0;font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.05);}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:99px;}
</style>
</head><body>

<div class="hdr">
  <div>
    <h1>Weight Loss Journey</h1>
    <div class="hdr-sub" id="sub">Loading…</div>
  </div>
  <div class="hdr-r">
    <span class="ts" id="ts"></span>
    <button class="icon-btn" onclick="doRefresh()" id="rb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
</div>

<div id="err-wrap"></div>

<div class="stats">
  <div class="sc"><div class="sc-lbl">Current Weight</div><div class="sc-val" id="s-cw">—</div><div class="sc-sub">kg</div></div>
  <div class="sc"><div class="sc-lbl">Total Lost</div><div class="sc-val" id="s-lost">—</div><div class="sc-sub">kg from 125</div></div>
  <div class="sc"><div class="sc-lbl">BMI</div><div class="sc-val sm" id="s-bmi">—</div><div class="sc-sub" id="s-bmi-lbl">—</div></div>
  <div class="sc"><div class="sc-lbl">To Next Target</div><div class="sc-val sm" id="s-next">—</div><div class="sc-sub" id="s-next-lbl">kg to go</div></div>
</div>

<div class="xp-card" id="xp-card" style="display:none">
  <div class="xp-head">
    <span class="xp-label">Overall Progress</span>
    <span class="xp-pct" id="xp-pct">0%</span>
  </div>
  <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
  <div class="xp-ends">
    <span class="xp-end">125 kg</span>
    <span class="xp-end now" id="xp-now"></span>
    <span class="xp-end" id="xp-goal"></span>
  </div>
</div>

<div class="sec"><span>Stages</span></div>
<div id="stages-wrap"></div>

<div class="sec" id="log-sec" style="display:none"><span>Weight Log</span></div>
<div class="log-list" id="log-list"></div>

<footer>Opxio.io</footer>

<script>
const _tok = new URLSearchParams(location.search).get('token') || '';
function apiUrl() { return '/api/private/milestone' + (_tok ? '?token=' + encodeURIComponent(_tok) : ''); }

const CAT_CSS = {'Main Meal':'main-meal','Dessert':'dessert','Drinks':'drinks','Fine Dining':'fine-dining','Snack':'snack'};
const START = 125;

function bmiLabel(v) {
  if (!v) return '';
  if (v < 18.5) return 'Underweight';
  if (v < 25)   return 'Healthy Range';
  if (v < 30)   return 'Overweight';
  return 'Obese';
}

function daysLeft(ds) {
  if (!ds) return null;
  const n = new Date(); n.setHours(0,0,0,0);
  const d = new Date(ds); d.setHours(0,0,0,0);
  return Math.round((d - n) / 86400000);
}

function cdHtml(days, status) {
  if (status === 'Achieved' || status === 'Claimed')
    return '<div class="stage-cd done">Completed</div>';
  if (days === null) return '';
  if (days < 0)   return `<div class="stage-cd urgent">${Math.abs(days)}d overdue</div>`;
  if (days === 0) return '<div class="stage-cd urgent">Due today</div>';
  if (days <= 7)  return `<div class="stage-cd urgent">${days}d left</div>`;
  return `<div class="stage-cd ok">${days} days left</div>`;
}

function stageXp(current, target) {
  if (!current || !target) return '';
  const pct = Math.min(100, Math.max(0, (START - current) / (START - target) * 100));
  return `<div class="stage-xp"><div class="stage-xp-fill" style="width:${pct.toFixed(1)}%"></div></div>`;
}

function rwdCardHtml(r) {
  const statusCls = (r.status || 'locked').toLowerCase();
  const catCls    = CAT_CSS[r.category] || '';
  const catLbl    = r.category || '';
  const isBonus   = r.type === 'Bonus Reward';
  return `
  <div class="rwd ${statusCls}${isBonus ? ' bonus-rwd' : ''}">
    ${catLbl ? `<div class="rwd-cat ${catCls}">${catLbl}</div>` : ''}
    <div class="rwd-dish">${r.dish || 'Reward TBA'}</div>
    ${r.location ? `<div class="rwd-loc">${r.location}</div>` : ''}
    <div class="rwd-tag ${statusCls}">${statusCls === 'locked' ? 'Locked' : statusCls === 'unlocked' ? 'Unlocked' : 'Claimed'}</div>
  </div>`;
}

function bonusHtml(m) {
  if (!m.bonusTarget) return '';
  const unlocked = m.bonusAchieved;
  return `
  <div class="bonus-strip${unlocked?' unlocked':''}">
    <div class="bonus-strip-head">Bonus Reward${unlocked ? (m.bonusClaimed ? ' — Claimed' : ' — Unlocked!') : ''}</div>
    <div class="bonus-strip-tgt">Reach ${m.bonusTarget} kg</div>
    <div class="bonus-strip-txt">${m.bonusReward || 'TBA'}</div>
    ${!unlocked ? `<div class="bonus-strip-lock">${m.bonusTarget} kg to unlock</div>` : ''}
  </div>`;
}

function stageHtml(m, idx, cw) {
  const stKey   = (m.status || 'upcoming').toLowerCase();
  const days    = daysLeft(m.deadline);
  const dateStr = m.deadline
    ? new Date(m.deadline).toLocaleDateString('en-MY', {day:'numeric', month:'short', year:'numeric'})
    : 'No deadline';

  const mainRwds  = m.rewards.filter(r => r.type !== 'Bonus Reward');
  const hasLegacy = !mainRwds.length && m.foodReward;

  return `
  <div class="stage st-${stKey}">
    <div class="stage-top">
      <span class="stage-num">Stage ${idx + 1}</span>
      <span class="stage-status ${stKey}">
        <span class="pulse"></span>${m.status}
      </span>
    </div>
    <div class="stage-body">
      <div class="stage-weight">${m.targetWeight ?? '—'}<span>kg</span></div>
      <div class="stage-meta">
        <div class="stage-dl">${dateStr}</div>
        ${cdHtml(days, m.status)}
      </div>
    </div>
    ${stageXp(cw, m.targetWeight)}
    <div class="rewards">
      <div class="rwd-section-lbl">Reward</div>
      ${mainRwds.length
        ? `<div class="rwd-grid">${mainRwds.map(rwdCardHtml).join('')}</div>`
        : hasLegacy
          ? `<div class="rwd-grid">${rwdCardHtml({dish:m.foodReward, location:m.rewardLocation, category:null, type:'Main Reward', status: m.status==='Claimed'?'Claimed':m.status==='Achieved'?'Unlocked':'Locked'})}</div>`
          : `<div class="empty">No reward added yet</div>`
      }
      ${bonusHtml(m)}
    </div>
  </div>`;
}

async function loadData() {
  try {
    const res = await fetch(apiUrl());
    const d   = await res.json();

    if (d.error) {
      document.getElementById('err-wrap').innerHTML =
        `<div class="err">Could not load data: ${d.error}</div>`;
      return;
    }
    document.getElementById('err-wrap').innerHTML = '';

    const cw = d.currentWeight;
    document.getElementById('sub').textContent = `Started at ${d.startWeight} kg · ${d.startDate}`;
    document.getElementById('s-cw').textContent   = cw ?? '—';
    document.getElementById('s-lost').textContent = d.lostTotal ?? '—';
    document.getElementById('s-bmi').textContent  = d.currentBMI ?? '—';
    document.getElementById('s-bmi-lbl').textContent = bmiLabel(d.currentBMI);

    const pending = (d.milestones || []).filter(m => m.status === 'Active' || m.status === 'Upcoming');
    const next = pending[0];
    if (next && cw) {
      const diff = +(cw - next.targetWeight).toFixed(2);
      document.getElementById('s-next').textContent    = diff > 0 ? diff : 'Done';
      document.getElementById('s-next-lbl').textContent = diff > 0 ? `kg to ${next.targetWeight}` : 'Target hit!';
    }

    if (d.journeyProgress !== null && cw) {
      document.getElementById('xp-card').style.display = '';
      const pct = Math.min(Math.max(d.journeyProgress, 0), 100);
      document.getElementById('xp-pct').textContent = pct.toFixed(1) + '%';
      setTimeout(() => { document.getElementById('xp-fill').style.width = pct + '%'; }, 80);
      document.getElementById('xp-now').textContent  = cw + ' kg (now)';
      document.getElementById('xp-goal').textContent = (d.lowestTarget ?? '—') + ' kg';
    }

    const ms = d.milestones || [];
    document.getElementById('stages-wrap').innerHTML = ms.length
      ? ms.map((m, i) => stageHtml(m, i, cw)).join('')
      : '<div class="empty">No stages set yet.</div>';

    const logs = (d.logs || []).slice(0, 5);
    if (logs.length) {
      document.getElementById('log-sec').style.display = '';
      document.getElementById('log-list').innerHTML = logs.map(l => {
        const ds = l.date
          ? new Date(l.date).toLocaleDateString('en-MY', {day:'numeric', month:'short', year:'numeric'})
          : '—';
        return `<div class="log-row">
          <span class="log-date">${ds}</span>
          <span class="log-w">${l.weight ?? '—'} kg</span>
          ${l.bmi ? `<span class="log-bmi">BMI ${l.bmi}</span>` : ''}
          ${l.notes ? `<span class="log-note">${l.notes}</span>` : ''}
        </div>`;
      }).join('');
    }

    document.getElementById('ts').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('err-wrap').innerHTML = `<div class="err">Load failed: ${e.message}</div>`;
  }
}

function doRefresh() {
  const b = document.getElementById('rb');
  if (b) b.classList.add('spinning');
  loadData().finally(() => { const b2 = document.getElementById('rb'); if(b2) b2.classList.remove('spinning'); });
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body></html>
